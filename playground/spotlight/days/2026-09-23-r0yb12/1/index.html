<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shader Surfaces — UI Spotlight Day 124</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{ --bucket:#38bdf8; --ink:#e8edf7; --ink2:#95a0b8; --line:rgba(255,255,255,.1) }
  html,body{height:100%}
  body{
    margin:0;background:#06070d;color:var(--ink);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100dvh;
    padding:76px 20px 90px;
  }
  .back-link{
    position:fixed;top:16px;left:16px;z-index:20;text-decoration:none;color:var(--ink);
    background:rgba(20,24,34,.62);border:1px solid var(--line);backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);padding:9px 15px;border-radius:999px;font-size:13px;
    transition:background .2s ease,transform .2s ease;
  }
  .back-link:hover{background:rgba(40,46,60,.8);transform:translateX(-2px)}
  header{max-width:1080px;margin:0 auto 26px;text-align:center}
  h1{margin:0 0 8px;font-size:clamp(24px,5vw,38px);letter-spacing:-.03em;font-weight:660}
  h1 em{font-style:normal;color:var(--bucket)}
  header p{margin:0;color:var(--ink2);font-size:14px;max-width:56ch;margin-inline:auto}
  .grid{max-width:1080px;margin:0 auto;display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
  .card{
    position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);
    aspect-ratio:4/5;min-height:300px;isolation:isolate;background:#0b0e16;
    transition:transform .4s cubic-bezier(.22,1,.36,1),border-color .3s ease;
  }
  .card:hover{transform:translateY(-4px);border-color:rgba(56,189,248,.42)}
  .card canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .card .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,7,13,0) 38%,rgba(6,7,13,.86) 100%)}
  .card .meta{position:absolute;left:18px;right:18px;bottom:16px;z-index:2}
  .card .meta b{display:block;font-size:17px;letter-spacing:-.01em}
  .card .meta span{font-size:12.5px;color:var(--ink2)}
  .card .tagline{
    position:absolute;top:14px;left:14px;z-index:2;font-size:10.5px;letter-spacing:.14em;
    text-transform:uppercase;color:#cfe8ff;background:rgba(10,14,22,.5);border:1px solid var(--line);
    padding:4px 9px;border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  .panel{
    position:fixed;top:14px;right:14px;z-index:20;width:214px;padding:13px 14px;border-radius:16px;
    background:rgba(16,20,30,.66);border:1px solid var(--line);backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);box-shadow:0 18px 40px rgba(0,0,0,.4);
  }
  .panel h2{margin:0 0 10px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:650}
  .panel label{display:block;font-size:11.5px;color:var(--ink2);margin:9px 0 3px;display:flex;justify-content:space-between}
  .panel label b{color:var(--ink);font-weight:600}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent}
  input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:rgba(255,255,255,.16)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--bucket);margin-top:-5px}
  input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:rgba(255,255,255,.16)}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:var(--bucket)}
  footer{margin:34px auto 0;text-align:center;color:#616c85;font-size:11.5px;max-width:1080px}
  footer a{color:#7f8aa3}
  @media (max-width:860px){ .panel{display:none} body{padding-top:68px} }
</style>
</head>
<body>
<a href="../" class="back-link">← All 5 drops</a>

<header>
  <h1>Shader <em>Surfaces</em></h1>
  <p>UI panels whose background is a live fragment shader instead of a static gradient — the 2026 house style of shader-backed component libraries. Three presets, one program, pointer-reactive flow.</p>
</header>

<div class="grid" id="grid"></div>

<aside class="panel">
  <h2>Uniforms</h2>
  <label>Speed <b id="vSpeed">1.00</b></label>
  <input type="range" id="speed" min="0" max="2.5" step="0.01" value="1">
  <label>Scale <b id="vScale">2.6</b></label>
  <input type="range" id="scale" min="0.6" max="6" step="0.1" value="2.6">
  <label>Warp <b id="vWarp">0.60</b></label>
  <input type="range" id="warp" min="0" max="1.6" step="0.02" value="0.6">
  <label>Grain <b id="vGrain">0.06</b></label>
  <input type="range" id="grain" min="0" max="0.2" step="0.005" value="0.06">
</aside>

<footer>
  Inspired by <a href="https://github.com/MengTo/threeui" target="_blank" rel="noopener">MengTo/threeui</a> · UI Spotlight Day 124 · Drop #1
</footer>

<script>
(() => {
"use strict";
const PRESETS = [
  { name:"Aurora",       note:"cool ribbons, slow drift", a:[0.07,0.55,0.95], b:[0.25,0.95,0.72], c:[0.55,0.32,0.95], bias:0.12 },
  { name:"Liquid Metal", note:"specular folds, high warp", a:[0.62,0.68,0.80], b:[0.10,0.13,0.20], c:[0.95,0.86,0.62], bias:0.02 },
  { name:"Plasma Drift", note:"hot core, soft falloff",    a:[0.98,0.35,0.42], b:[0.98,0.72,0.25], c:[0.36,0.10,0.55], bias:0.20 }
];

const VERT = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
const FRAG = `
precision highp float;
uniform vec2 uRes; uniform float uT, uScale, uWarp, uGrain, uBias, uHover;
uniform vec2 uM; uniform vec3 uA, uB, uC;

vec2 hash(vec2 p){ p = vec2(dot(p,vec2(127.1,311.7)), dot(p,vec2(269.5,183.3))); return -1.+2.*fract(sin(p)*43758.5453123); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*(3.-2.*f);
  return mix(mix(dot(hash(i+vec2(0,0)), f-vec2(0,0)), dot(hash(i+vec2(1,0)), f-vec2(1,0)), u.x),
             mix(dot(hash(i+vec2(0,1)), f-vec2(0,1)), dot(hash(i+vec2(1,1)), f-vec2(1,1)), u.x), u.y);
}
float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<5;i++){ v += a*noise(p); p *= 2.02; a *= .5; } return v; }

void main(){
  vec2 uv = (gl_FragCoord.xy - .5*uRes) / min(uRes.x, uRes.y);
  vec2 m = (uM - .5) * 1.4;
  uv += m * 0.16 * uHover;
  vec2 q = uv * uScale;
  float t = uT * .22;
  vec2 warp = vec2(fbm(q + vec2(0., t)), fbm(q + vec2(5.2, -t*1.3)));
  vec2 r = q + uWarp * warp * 2.0;
  float f = fbm(r + vec2(t*.7, -t*.4));
  float g = fbm(r * 1.7 - vec2(t*.5, t*.2));
  float band = smoothstep(-.15, .65, f + uBias);
  vec3 col = mix(uB, uA, band);
  col = mix(col, uC, smoothstep(.15, .95, g + f*.5));
  float spec = pow(max(0., 1. - abs(f - .1)*3.4), 6.);
  col += spec * .28;
  float vign = smoothstep(1.25, .25, length(uv));
  col *= .55 + .55*vign;
  float n = fract(sin(dot(gl_FragCoord.xy + uT, vec2(12.9898,78.233))) * 43758.5453);
  col += (n - .5) * uGrain;
  gl_FragColor = vec4(clamp(col, 0., 1.), 1.);
}`;

const ctl = { speed:1, scale:2.6, warp:.6, grain:.06 };
const surfaces = [];
const grid = document.getElementById("grid");

function compile(gl, type, src){
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src); gl.compileShader(sh);
  if(!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) return null;
  return sh;
}

function makeSurface(card, preset){
  const cv = document.createElement("canvas");
  card.prepend(cv);
  const gl = cv.getContext("webgl", { antialias:false, alpha:false, powerPreference:"low-power" });
  if(!gl){
    cv.remove();
    card.style.background = "linear-gradient(140deg," +
      rgb(preset.a) + "," + rgb(preset.c) + " 55%," + rgb(preset.b) + ")";
    card.style.backgroundSize = "220% 220%";
    card.animate([{ backgroundPosition:"0% 50%" },{ backgroundPosition:"100% 50%" },{ backgroundPosition:"0% 50%" }],
      { duration:14000, iterations:Infinity });
    return null;
  }
  const prog = gl.createProgram();
  const vs = compile(gl, gl.VERTEX_SHADER, VERT), fs = compile(gl, gl.FRAGMENT_SHADER, FRAG);
  if(!vs || !fs) return null;
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) return null;
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = {};
  ["uRes","uT","uScale","uWarp","uGrain","uBias","uHover","uM","uA","uB","uC"].forEach((n) => U[n] = gl.getUniformLocation(prog, n));
  gl.uniform3fv(U.uA, preset.a); gl.uniform3fv(U.uB, preset.b); gl.uniform3fv(U.uC, preset.c);
  gl.uniform1f(U.uBias, preset.bias);
  const s = { cv, gl, U, card, mouse:[.5,.5], hover:0, target:0, dpr:1 };
  const resize = () => {
    const r = card.getBoundingClientRect();
    s.dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(r.width*s.dpr));
    cv.height = Math.max(1, Math.round(r.height*s.dpr));
    gl.viewport(0, 0, cv.width, cv.height);
    gl.uniform2f(U.uRes, cv.width, cv.height);
  };
  resize();
  new ResizeObserver(resize).observe(card);
  card.addEventListener("pointermove", (e) => {
    const r = card.getBoundingClientRect();
    s.mouse = [(e.clientX-r.left)/r.width, 1-(e.clientY-r.top)/r.height];
    s.target = 1;
  });
  card.addEventListener("pointerleave", () => { s.target = 0; });
  return s;
}
const rgb = (c) => "rgb(" + c.map((v) => Math.round(v*255)).join(",") + ")";

PRESETS.forEach((p, i) => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = '<span class="tagline">Preset 0' + (i+1) + '</span>' +
    '<div class="veil"></div><div class="meta"><b>' + p.name + "</b><span>" + p.note + "</span></div>";
  grid.appendChild(card);
  const s = makeSurface(card, p);
  if(s) surfaces.push(s);
});

let t0 = performance.now(), clock = 0, raf = 0;
function frame(now){
  const dt = Math.min(64, now - t0); t0 = now;
  clock += dt * 0.001 * ctl.speed;
  for(const s of surfaces){
    s.hover += (s.target - s.hover) * 0.08;
    const gl = s.gl;
    gl.uniform1f(s.U.uT, clock);
    gl.uniform1f(s.U.uScale, ctl.scale);
    gl.uniform1f(s.U.uWarp, ctl.warp);
    gl.uniform1f(s.U.uGrain, ctl.grain);
    gl.uniform1f(s.U.uHover, s.hover);
    gl.uniform2f(s.U.uM, s.mouse[0], s.mouse[1]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  raf = requestAnimationFrame(frame);
}
raf = requestAnimationFrame(frame);
document.addEventListener("visibilitychange", () => {
  if(document.hidden){ cancelAnimationFrame(raf); raf = 0; }
  else if(!raf){ t0 = performance.now(); raf = requestAnimationFrame(frame); }
});

[["speed","vSpeed",2],["scale","vScale",1],["warp","vWarp",2],["grain","vGrain",3]].forEach(([id, out, dp]) => {
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener("input", () => {
    ctl[id] = +el.value;
    document.getElementById(out).textContent = (+el.value).toFixed(dp);
  });
});
})();
</script>
</body>
</html>
