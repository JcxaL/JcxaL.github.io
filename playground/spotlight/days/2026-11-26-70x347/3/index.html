<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Illuminated Initials — UI Spotlight Day 169 · Drop 3</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#ffeaea;--dim:#c89a9a;--accent:#f87171;--line:rgba(248,113,113,.22)}
  body{background:#120606;color:var(--ink);font:400 14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;padding:76px 18px 96px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .back-link,.panel,.credit{background:rgba(26,10,10,.72);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .back-link{position:fixed;top:14px;left:14px;z-index:40;padding:8px 14px;border-radius:999px;color:var(--ink);text-decoration:none;font-size:13px;font-weight:550}
  .back-link:hover{border-color:var(--accent);color:var(--accent)}
  .panel{position:fixed;top:14px;right:14px;z-index:40;width:228px;border-radius:14px;padding:12px}
  .panel h2{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--dim);margin-bottom:9px}
  .panel label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin:9px 0 3px}
  .panel label b{color:var(--ink);font-variant-numeric:tabular-nums}
  .panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent}
  .panel input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:rgba(248,113,113,.35)}
  .panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-5px;border-radius:50%;background:#fff0f0;border:2px solid var(--accent)}
  .panel input[type=range]::-moz-range-track{height:3px;background:rgba(248,113,113,.35)}
  .panel input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#fff0f0;border:2px solid var(--accent)}
  .panel input[type=text]{width:100%;margin-top:4px;padding:7px 9px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font:inherit;font-size:13px;letter-spacing:.3em;text-transform:uppercase}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
  .panel button{padding:8px 6px;border-radius:9px;border:1px solid var(--line);background:rgba(248,113,113,.12);color:var(--ink);font:inherit;font-size:11.5px;font-weight:550;cursor:pointer}
  .panel button:hover{background:rgba(248,113,113,.25)}
  .panel button[aria-pressed="true"]{background:rgba(248,113,113,.3);border-color:var(--accent)}
  .credit{position:fixed;left:14px;bottom:14px;z-index:40;padding:6px 12px;border-radius:999px;font-size:11px;color:var(--dim)}
  h1{font:600 13px/1 system-ui;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:22px;text-align:center}
  #grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;width:min(100%,960px)}
  figure{position:relative;cursor:pointer;border-radius:12px;overflow:hidden;box-shadow:0 22px 50px -26px #000;transition:transform .25s cubic-bezier(.2,.9,.25,1)}
  figure:hover{transform:translateY(-4px)}
  figure canvas{width:100%;display:block;aspect-ratio:1}
  figcaption{position:absolute;left:0;right:0;bottom:0;padding:6px 9px;font:10.5px/1 ui-monospace,Menlo,monospace;color:#f3d9c7;background:linear-gradient(transparent,rgba(26,10,10,.85));letter-spacing:.05em}
  @media(min-width:901px){body{padding-right:272px}}
  @media(max-width:900px){#grid{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{position:static;width:min(100%,460px);margin:0 auto 18px}body{padding-top:62px}.credit{right:14px;text-align:center}}
</style>
</head>
<body>
<a href="../" class="back-link">← All 5 drops</a>
<div class="panel">
  <h2>Illuminator</h2>
  <label>Letters</label>
  <input type="text" id="letters" value="ABCD" maxlength="4" spellcheck="false">
  <label>Ornament density <b id="vDen">1.00</b></label>
  <input type="range" id="den" min="0.3" max="2" step="0.05" value="1">
  <label>Ink saturation <b id="vSat">0.85</b></label>
  <input type="range" id="sat" min="0.1" max="1" step="0.05" value="0.85">
  <label>Growth <b id="vGro">1.30 s</b></label>
  <input type="range" id="gro" min="0" max="3" step="0.1" value="1.3">
  <div class="row">
    <button class="sty" data-v="botanical" aria-pressed="true">Botanical</button>
    <button class="sty" data-v="gothic">Gothic</button>
    <button class="sty" data-v="deco">Deco</button>
    <button class="sty" data-v="knot">Knot</button>
  </div>
  <div class="row">
    <button id="btnWander">Wander</button>
    <button id="btnNear">More like this</button>
  </div>
</div>

<h1>Four initials, drawn in the browser — never the same twice</h1>
<div id="grid"></div>
<div class="credit">Inspired by azlen/initialis · UI Spotlight Day 169 · Drop #3</div>

<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i);};
var S=512, style='botanical', density=1, sat=.85, growMs=1300;
var cells=[];

function rng(seed){var a=seed>>>0;return function(){a|=0;a=a+0x9E3779B9|0;var t=Math.imul(a^a>>>16,0x21f0aaad);t=Math.imul(t^t>>>15,0x735a2d97);return((t^t>>>15)>>>0)/4294967296;};}
function pick(r,arr){return arr[(r()*arr.length)|0];}
/* paper + ink palettes, in the spirit of two- and three-colour printing */
var PAPER=['#f3e7d2','#efe4d6','#f6ecda','#eadfc8'];
var INKS=[['#8c1b1b','#1d3f74','#b98a2c'],['#7a1340','#2d5c3a','#c08a2a'],['#1f3a6b','#9a2222','#d9b24c'],['#3c2a6b','#136b5e','#c47f1e'],['#6b1f1f','#2f4858','#a8803a']];
function mixSat(hex,s){
  var n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255,l=(r*.299+g*.587+b*.114);
  return 'rgb('+Math.round(l+(r-l)*s)+','+Math.round(l+(g-l)*s)+','+Math.round(l+(b-l)*s)+')';
}
var grain=(function(){
  var c=document.createElement('canvas');c.width=c.height=140;var g=c.getContext('2d'),d=g.createImageData(140,140);
  for(var i=0;i<d.data.length;i+=4){var v=200+Math.random()*55;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=Math.random()*34;}
  g.putImageData(d,0,0);return c;
})();

function Cell(el,letter,seed){
  this.el=el;this.cv=el.querySelector('canvas');this.cap=el.querySelector('figcaption');
  this.cx=this.cv.getContext('2d');this.letter=letter;this.seed=seed;this.t0=performance.now();
  this.cv.width=this.cv.height=S;
  this.plan();
}
Cell.prototype.plan=function(){
  var r=rng(this.seed);
  this.paper=pick(r,PAPER);
  this.inks=pick(r,INKS).slice();
  this.frame=pick(r,['band','arch','double','lozenge']);
  this.off=[(r()*2-1)*2.4,(r()*2-1)*2.4];           /* ink misregistration */
  this.vines=[];
  var branches=Math.round((5+r()*4)*density);
  for(var i=0;i<branches;i++){
    var side=i%4,len=.26+r()*.3;
    this.vines.push({side:side,at:.12+r()*.76,len:len,curl:(r()*2-1)*1.5,leaves:3+((r()*5)|0),seed:(r()*1e9)|0,ink:(r()*2)|0});
  }
  this.corner=pick(r,['leaf','dot','fan','spiral']);
  this.name=this.frame+'·'+this.corner+'·'+(this.seed%9973).toString(36);
  this.t0=performance.now();
};
Cell.prototype.draw=function(p){
  var g=this.cx,r=rng(this.seed),m=S*.085;
  g.setTransform(1,0,0,1,0,0);
  g.fillStyle=this.paper;g.fillRect(0,0,S,S);
  var inks=this.inks.map(function(h){return mixSat(h,sat);});

  /* ---- frame ---- */
  g.save();g.translate(this.off[0]*.4,this.off[1]*.4);
  g.strokeStyle=inks[1];g.lineWidth=S*.016;
  if(this.frame==='arch'){
    g.beginPath();g.moveTo(m,S-m);g.lineTo(m,S*.42);
    g.quadraticCurveTo(S/2,m*.2,S-m,S*.42);g.lineTo(S-m,S-m);g.closePath();g.stroke();
  } else if(this.frame==='lozenge'){
    g.beginPath();g.moveTo(S/2,m);g.lineTo(S-m,S/2);g.lineTo(S/2,S-m);g.lineTo(m,S/2);g.closePath();g.stroke();
  } else {
    g.strokeRect(m,m,S-2*m,S-2*m);
    if(this.frame==='double'){g.lineWidth=S*.006;g.strokeRect(m*1.55,m*1.55,S-3.1*m,S-3.1*m);}
  }
  g.restore();

  /* ---- growing ornament ---- */
  var self=this;
  this.vines.forEach(function(v,idx){
    var vp=Math.min(1,Math.max(0,(p-idx*0.045)/0.55));
    if(vp<=0)return;
    var vr=rng(v.seed),x0,y0,dx,dy;
    if(v.side===0){x0=m;y0=m+(S-2*m)*v.at;dx=1;dy=0;}
    else if(v.side===1){x0=S-m;y0=m+(S-2*m)*v.at;dx=-1;dy=0;}
    else if(v.side===2){x0=m+(S-2*m)*v.at;y0=m;dx=0;dy=1;}
    else{x0=m+(S-2*m)*v.at;y0=S-m;dx=0;dy=-1;}
    var L=(S-2*m)*v.len*vp;
    var cx1=x0+dx*L*.5-dy*L*v.curl*.4, cy1=y0+dy*L*.5-dx*L*v.curl*.4;
    var ex=x0+dx*L+(-dy)*L*v.curl*.5, ey=y0+dy*L+(-dx)*L*v.curl*.5;
    g.strokeStyle=inks[v.ink];g.lineCap='round';
    g.lineWidth=S*.011*(1-vp*.35);
    g.beginPath();g.moveTo(x0,y0);g.quadraticCurveTo(cx1,cy1,ex,ey);g.stroke();
    /* leaves / florets along the stem */
    for(var k=1;k<=v.leaves;k++){
      var t=k/(v.leaves+1); if(t>vp)continue;
      var px=(1-t)*(1-t)*x0+2*(1-t)*t*cx1+t*t*ex,
          py=(1-t)*(1-t)*y0+2*(1-t)*t*cy1+t*t*ey,
          ang=Math.atan2(ey-y0,ex-x0)+(k%2?1:-1)*(.8+vr()*.5),
          ln=S*(.028+vr()*.03)*density;
      g.save();g.translate(px,py);g.rotate(ang);
      if(style==='botanical'){
        g.fillStyle=inks[(v.ink+1)%3];
        g.beginPath();g.ellipse(ln*.6,0,ln,ln*.42,0,0,6.3);g.fill();
      } else if(style==='gothic'){
        g.strokeStyle=inks[(v.ink+1)%3];g.lineWidth=S*.008;
        g.beginPath();g.moveTo(0,0);g.lineTo(ln*1.15,-ln*.5);g.lineTo(ln*1.5,0);g.stroke();
      } else if(style==='deco'){
        g.fillStyle=inks[(v.ink+2)%3];
        g.fillRect(0,-ln*.16,ln*1.3,ln*.32);
      } else {
        g.strokeStyle=inks[(v.ink+2)%3];g.lineWidth=S*.009;
        g.beginPath();g.arc(ln*.7,0,ln*.55,0,4.4);g.stroke();
      }
      g.restore();
    }
  });

  /* ---- corner flourishes ---- */
  var cp=Math.min(1,Math.max(0,(p-.25)/.45));
  if(cp>0){
    g.strokeStyle=inks[2];g.lineWidth=S*.01;g.fillStyle=inks[2];
    for(var q=0;q<4;q++){
      var sx=q%2?S-m:m, sy=q<2?m:S-m, fx=q%2?-1:1, fy=q<2?1:-1, u=S*.07*cp*density;
      g.save();g.translate(sx,sy);g.scale(fx,fy);
      if(this.corner==='leaf'){g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(u,u*.25,u*.5,u);g.stroke();}
      else if(this.corner==='dot'){for(var d2=1;d2<=3;d2++){g.beginPath();g.arc(u*.35*d2,u*.35*d2,S*.0075,0,6.3);g.fill();}}
      else if(this.corner==='fan'){for(var f=0;f<4;f++){g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(f*.38)*u*1.1,Math.sin(f*.38)*u*1.1);g.stroke();}}
      else{g.beginPath();for(var a2=0;a2<22;a2++){var rr=u*a2/22,th=a2*.5;g.lineTo(Math.cos(th)*rr,Math.sin(th)*rr);}g.stroke();}
      g.restore();
    }
  }

  /* ---- the letter, printed in two inks with a misregistered shadow ---- */
  var lp=Math.min(1,Math.max(0,(p-.4)/.5));
  if(lp>0){
    g.save();
    g.globalAlpha=lp;
    g.textAlign='center';g.textBaseline='middle';
    g.font='700 '+Math.round(S*.56)+'px "Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif';
    g.fillStyle=inks[1];
    g.fillText(this.letter,S/2+this.off[0],S*.53+this.off[1]);
    g.fillStyle=inks[0];
    g.fillText(this.letter,S/2,S*.53);
    g.lineWidth=S*.004;g.strokeStyle=this.paper;g.strokeText(this.letter,S/2,S*.53);
    g.restore();
  }

  /* ---- paper grain, last ---- */
  g.globalAlpha=.5;
  for(var gx=0;gx<S;gx+=140)for(var gy=0;gy<S;gy+=140) g.drawImage(grain,gx,gy);
  g.globalAlpha=1;
  this.cap.textContent=this.letter+' · '+this.name;
};

function build(){
  var host=$('grid'),txt=($('letters').value||'ABCD').toUpperCase().replace(/\s/g,'')||'ABCD';
  host.innerHTML='';cells=[];
  for(var i=0;i<4;i++){
    var f=document.createElement('figure');
    f.innerHTML='<canvas></canvas><figcaption></figcaption>';
    host.appendChild(f);
    var c=new Cell(f,txt[i%txt.length],(Math.random()*1e9)|0);
    cells.push(c);
    (function(c){ f.addEventListener('click',function(){ c.seed=(c.seed+1+((Math.random()*400)|0))>>>0; c.plan(); }); })(c);
  }
}
function loop(){
  var now=performance.now();
  cells.forEach(function(c){
    var p=growMs<=0?1:Math.min(1,(now-c.t0)/growMs);
    if(p<1||c._last!==1){ c.draw(p); c._last=p; }
  });
  requestAnimationFrame(loop);
}
$('letters').addEventListener('input',build);
$('den').addEventListener('input',function(){density=+this.value;$('vDen').textContent=density.toFixed(2);cells.forEach(function(c){c.plan();});});
$('sat').addEventListener('input',function(){sat=+this.value;$('vSat').textContent=sat.toFixed(2);cells.forEach(function(c){c._last=0;});});
$('gro').addEventListener('input',function(){growMs=+this.value*1000;$('vGro').textContent=(+this.value).toFixed(2)+' s';cells.forEach(function(c){c.t0=performance.now();});});
Array.prototype.forEach.call(document.querySelectorAll('.sty'),function(b){
  b.addEventListener('click',function(){
    style=b.dataset.v;
    Array.prototype.forEach.call(document.querySelectorAll('.sty'),function(x){x.setAttribute('aria-pressed',x===b);});
    cells.forEach(function(c){c.t0=performance.now();});
  });
});
$('btnWander').addEventListener('click',function(){cells.forEach(function(c){c.seed=(Math.random()*1e9)|0;c.plan();});});
$('btnNear').addEventListener('click',function(){cells.forEach(function(c){c.seed=(c.seed+7+((Math.random()*40)|0))>>>0;c.plan();});});
build();loop();
window.__drop={cells:function(){return cells.length;},seeds:function(){return cells.map(function(c){return c.seed;});},
  pixels:function(){var d=cells[0].cx.getImageData(0,0,S,S).data,n=0;for(var i=0;i<d.length;i+=4*53)if(d[i]+d[i+1]+d[i+2]<560)n++;return n;}};
})();
</script>
</body>
</html>
