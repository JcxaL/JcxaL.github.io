<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scroll Film — UI Spotlight Day 169 · Drop 1</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#e6f4ff;--dim:#8ba6c4;--accent:#38bdf8;--line:rgba(130,190,255,.18)}
  html{scroll-behavior:auto}
  body{background:#030711;color:var(--ink);font:400 15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .back-link,.panel,.credit{background:rgba(10,18,32,.66);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .back-link{position:fixed;top:14px;left:14px;z-index:40;padding:8px 14px;border-radius:999px;color:var(--ink);text-decoration:none;font-size:13px;font-weight:550}
  .back-link:hover{border-color:var(--accent);color:var(--accent)}
  .panel{position:fixed;top:14px;right:14px;z-index:40;width:216px;border-radius:14px;padding:12px}
  .panel h2{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
  .panel label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin:9px 0 3px}
  .panel label b{color:var(--ink);font-variant-numeric:tabular-nums}
  .panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent}
  .panel input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:rgba(56,189,248,.35)}
  .panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-5px;border-radius:50%;background:#eaf6ff;border:2px solid var(--accent)}
  .panel input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:rgba(56,189,248,.35)}
  .panel input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#eaf6ff;border:2px solid var(--accent)}
  .panel button{width:100%;margin-top:10px;padding:7px;border-radius:9px;border:1px solid var(--line);background:rgba(56,189,248,.12);color:var(--ink);font:inherit;font-size:11.5px;cursor:pointer}
  .panel button[aria-pressed="true"]{background:rgba(56,189,248,.3);border-color:var(--accent)}
  .credit{position:fixed;left:14px;bottom:14px;z-index:40;padding:6px 12px;border-radius:999px;font-size:11px;color:var(--dim)}
  @media(max-width:760px){.panel{display:none}.credit{font-size:10px;right:14px;text-align:center}}

  /* ---------- the film ---------- */
  #track{height:600vh}
  #stage{position:fixed;inset:0;overflow:hidden}
  .beat{position:absolute;inset:0;opacity:0;pointer-events:none}
  .layer{position:absolute;inset:-12% -6%;will-change:transform}
  .sky{background:radial-gradient(120% 90% at 50% 86%,#1b3b6f 0%,#0a1630 46%,#03070f 100%)}
  .stars{background-image:radial-gradient(1.6px 1.6px at 18% 22%,#cfe6ff,transparent),radial-gradient(1.4px 1.4px at 72% 14%,#9fd0ff,transparent),radial-gradient(1.8px 1.8px at 44% 36%,#fff,transparent),radial-gradient(1.2px 1.2px at 88% 44%,#bcd9ff,transparent),radial-gradient(1.5px 1.5px at 30% 58%,#e8f4ff,transparent),radial-gradient(1.3px 1.3px at 60% 68%,#a8ccff,transparent)}
  .orb{position:absolute;left:50%;top:58%;width:34vmin;height:34vmin;margin:-17vmin 0 0 -17vmin;border-radius:50%;
       background:radial-gradient(circle at 36% 32%,#9fe8ff,#2b86d8 42%,#123a74 72%,#06142c 100%);
       box-shadow:0 0 90px 10px rgba(56,189,248,.35)}
  .ridge{position:absolute;left:-10%;right:-10%;top:auto;bottom:0;height:62%}
  .ridge svg{width:100%;height:100%;display:block}
  .beat h3{position:absolute;left:0;right:0;top:12%;text-align:center;font-size:clamp(26px,6.4vw,64px);font-weight:700;letter-spacing:-.03em}
  .beat p{position:absolute;left:0;right:0;top:calc(12% + clamp(44px,8.8vw,88px));text-align:center;color:var(--dim);font-size:13.5px;letter-spacing:.04em}
  #route svg{position:absolute;inset:0;width:100%;height:100%}
  #route path{fill:none;stroke-linecap:round;stroke-linejoin:round}
  .pin{fill:#38bdf8}
  #filmCv{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:min(74vmin,560px);height:min(74vmin,560px)}
  #hud{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;display:flex;gap:7px;align-items:center}
  #hud .seg{width:56px;height:4px;border-radius:3px;background:rgba(130,190,255,.2);overflow:hidden}
  #hud .seg i{display:block;height:100%;width:0;background:var(--accent)}
  #marks{position:fixed;inset:0;z-index:35;pointer-events:none;display:none}
  #marks.on{display:block}
  #marks b{position:absolute;left:0;right:0;height:1px;background:rgba(56,189,248,.5);font:10px/1 ui-monospace,Menlo,monospace;color:#7fd3ff}
  #marks b span{position:absolute;right:8px;top:-12px}
</style>
</head>
<body>
<a href="../" class="back-link">← All 5 drops</a>

<div class="panel">
  <h2>Scroll film</h2>
  <label>Film length <b id="vLen">6.0×</b></label>
  <input type="range" id="len" min="3" max="12" step="0.5" value="6">
  <label>Parallax depth <b id="vDep">1.00</b></label>
  <input type="range" id="dep" min="0" max="2.2" step="0.05" value="1">
  <label>Beat ease <b id="vEase">0.55</b></label>
  <input type="range" id="ease" min="0" max="1" step="0.05" value="0.55">
  <label>Film frames <b id="vFr">48</b></label>
  <input type="range" id="fr" min="12" max="96" step="4" value="48">
  <button id="btnMarks" aria-pressed="false">Checkpoints 0·25·50·75·100</button>
  <button id="btnTop">Rewind to frame 0</button>
</div>

<div id="stage">
  <section class="beat" id="b1">
    <div class="layer sky"></div>
    <div class="layer stars" data-d="0.12"></div>
    <div class="orb" data-d="0.3"></div>
    <div class="layer ridge" data-d="0.55"><svg viewBox="0 0 1200 420" preserveAspectRatio="none"><path d="M0 300 L150 210 L280 280 L430 170 L580 260 L720 190 L880 265 L1030 200 L1200 290 L1200 420 L0 420Z" fill="#0d2246"/></svg></div>
    <div class="layer ridge" data-d="0.85" style="height:46%"><svg viewBox="0 0 1200 420" preserveAspectRatio="none"><path d="M0 330 L170 250 L320 320 L470 240 L640 320 L800 250 L960 330 L1120 260 L1200 320 L1200 420 L0 420Z" fill="#071530"/></svg></div>
    <div class="layer ridge" data-d="1.25" style="height:30%"><svg viewBox="0 0 1200 420" preserveAspectRatio="none"><path d="M0 360 L200 300 L380 360 L560 295 L760 365 L940 300 L1140 360 L1200 340 L1200 420 L0 420Z" fill="#020814"/></svg></div>
    <h3>Six layers part</h3><p>BEAT 1 · LAYERED PARALLAX</p>
  </section>

  <section class="beat" id="b2">
    <div class="layer sky" style="background:radial-gradient(110% 80% at 30% 20%,#13263f,#030711 70%)"></div>
    <div id="route">
      <svg viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet">
        <path id="ghost" d="M90 540 C 250 540 210 360 340 350 C 470 340 470 180 620 190 C 760 199 790 300 910 150" stroke="rgba(130,190,255,.14)" stroke-width="3"/>
        <path id="draw"  d="M90 540 C 250 540 210 360 340 350 C 470 340 470 180 620 190 C 760 199 790 300 910 150" stroke="#38bdf8" stroke-width="4"/>
        <circle id="head" class="pin" cx="90" cy="540" r="7"/>
      </svg>
    </div>
    <h3>The route draws itself</h3><p>BEAT 2 · SELF-DRAWING PATH</p>
  </section>

  <section class="beat" id="b3">
    <div class="layer sky" style="background:radial-gradient(90% 70% at 50% 50%,#0d1b33,#020510 72%)"></div>
    <canvas id="filmCv" width="620" height="620"></canvas>
    <h3>Scrubbed frame by frame</h3><p>BEAT 3 · FRAME SEQUENCE</p>
  </section>
</div>

<div id="marks"></div>
<div id="hud"><div class="seg"><i id="s1"></i></div><div class="seg"><i id="s2"></i></div><div class="seg"><i id="s3"></i></div></div>
<div class="credit">Inspired by scrolltide/ai-studio-skill · UI Spotlight Day 169 · Drop #1</div>
<div id="track"></div>

<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i);};
var clamp=function(v,a,b){return v<a?a:v>b?b:v;};
var cfg={len:6,dep:1,ease:.55,frames:48};

/* ---- beat 3: build the frame sequence once, like a scroll film's image strip ---- */
var cv=$('filmCv'),cx=cv.getContext('2d'),strip=[];
function buildStrip(n){
  strip=[];
  for(var f=0;f<n;f++){
    var c=document.createElement('canvas');c.width=c.height=310;
    var g=c.getContext('2d'),t=f/n;
    g.translate(155,155);
    g.rotate(t*Math.PI*2);
    for(var r=0;r<7;r++){
      var rad=26+r*17,ph=t*Math.PI*2+r*.55;
      g.beginPath();
      for(var a=0;a<=64;a++){
        var th=a/64*Math.PI*2,
            rr=rad+Math.sin(th*5+ph)*(5+r*1.6)*Math.sin(t*Math.PI*2+r);
        var x=Math.cos(th)*rr,y=Math.sin(th)*rr;
        a?g.lineTo(x,y):g.moveTo(x,y);
      }
      g.closePath();
      g.strokeStyle='hsla('+(196+r*8)+',92%,'+(62-r*3)+'%,'+(.9-r*.08)+')';
      g.lineWidth=1.7;g.stroke();
    }
    strip.push(c);
  }
}
function drawFrame(p){
  var i=clamp(Math.round(p*(strip.length-1)),0,strip.length-1);
  cx.clearRect(0,0,cv.width,cv.height);
  cx.save();cx.scale(2,2);
  cx.globalAlpha=.25;cx.drawImage(strip[(i+strip.length-2)%strip.length],0,0);
  cx.globalAlpha=1;cx.drawImage(strip[i],0,0);
  cx.restore();
  cx.fillStyle='rgba(130,190,255,.55)';
  cx.font='500 18px ui-monospace,Menlo,monospace';
  cx.fillText(('000'+(i+1)).slice(-3)+' / '+strip.length,24,cv.height-24);
}

/* ---- beat 2: self-drawing path ---- */
var dp=$('draw'),head=$('head'),L=dp.getTotalLength();
dp.style.strokeDasharray=L;dp.style.strokeDashoffset=L;

/* ---- scroll mapping ---- */
var beats=[$('b1'),$('b2'),$('b3')],segs=[$('s1'),$('s2'),$('s3')];
function easeInOut(t){ return cfg.ease===0?t:t<.5?Math.pow(2*t,1+cfg.ease*2)/2:1-Math.pow(2-2*t,1+cfg.ease*2)/2; }
function update(){
  var max=document.documentElement.scrollHeight-innerHeight;
  var p=max>0?clamp(scrollY/max,0,1):0;
  var n=beats.length,raw=p*n;
  for(var i=0;i<n;i++){
    var local=clamp(raw-i,0,1),
        vis=clamp(1-Math.abs(raw-i-.5)*1.72,0,1);
    beats[i].style.opacity=Math.pow(vis,.72);
    segs[i].style.width=(local*100)+'%';
    var e=easeInOut(local);
    if(i===0){
      var ls=beats[0].querySelectorAll('[data-d]');
      for(var k=0;k<ls.length;k++){
        var d=+ls[k].getAttribute('data-d')*cfg.dep;
        ls[k].style.transform='translate3d(0,'+(-e*110*d)+'px,0) scale('+(1+e*.09*d)+')';
      }
      beats[0].querySelector('.orb').style.transform='translate3d(0,'+(e*120-60)+'px,0) scale('+(.72+e*.5)+')';
    } else if(i===1){
      dp.style.strokeDashoffset=L*(1-e);
      var pt=dp.getPointAtLength(L*e);
      head.setAttribute('cx',pt.x);head.setAttribute('cy',pt.y);
      head.setAttribute('r',6+Math.sin(e*18)*1.6);
    } else {
      if(vis>0.01) drawFrame(e);
    }
  }
}
var tick=false;
addEventListener('scroll',function(){ if(!tick){tick=true;requestAnimationFrame(function(){update();tick=false;});} },{passive:true});
addEventListener('resize',update);

/* ---- controls ---- */
function setLen(v){ cfg.len=v;$('track').style.height=(v*100)+'vh';$('vLen').textContent=v.toFixed(1)+'×';update(); }
$('len').addEventListener('input',function(){setLen(+this.value);});
$('dep').addEventListener('input',function(){cfg.dep=+this.value;$('vDep').textContent=cfg.dep.toFixed(2);update();});
$('ease').addEventListener('input',function(){cfg.ease=+this.value;$('vEase').textContent=cfg.ease.toFixed(2);update();});
$('fr').addEventListener('input',function(){cfg.frames=+this.value;$('vFr').textContent=cfg.frames;buildStrip(cfg.frames);update();});
$('btnMarks').addEventListener('click',function(){
  var on=this.getAttribute('aria-pressed')!=='true';
  this.setAttribute('aria-pressed',on);$('marks').classList.toggle('on',on);
});
$('btnTop').addEventListener('click',function(){scrollTo({top:0,behavior:'smooth'});});
(function(){
  var m=$('marks'),html='';
  [0,25,50,75,100].forEach(function(v){ html+='<b style="top:'+v+'%"><span>'+v+'%</span></b>'; });
  m.innerHTML=html;
})();

buildStrip(cfg.frames);setLen(6);update();
window.__drop={progress:function(){var max=document.documentElement.scrollHeight-innerHeight;return max?scrollY/max:0;},
  frames:function(){return strip.length;},dash:function(){return +dp.style.strokeDashoffset;}};
})();
</script>
</body>
</html>
