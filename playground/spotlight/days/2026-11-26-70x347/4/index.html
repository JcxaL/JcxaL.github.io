<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Slide to Unlock, With Depth — UI Spotlight Day 169 · Drop 4</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#fff6e6;--dim:#c9ab77;--accent:#fbbf24;--line:rgba(251,191,36,.22)}
  body{background:#0d0a04;color:var(--ink);font:400 14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;padding:76px 18px 96px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .back-link,.panel,.credit{background:rgba(24,18,6,.72);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .back-link{position:fixed;top:14px;left:14px;z-index:40;padding:8px 14px;border-radius:999px;color:var(--ink);text-decoration:none;font-size:13px;font-weight:550}
  .back-link:hover{border-color:var(--accent);color:var(--accent)}
  .panel{position:fixed;top:14px;right:14px;z-index:40;width:224px;border-radius:14px;padding:12px}
  .panel h2{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--dim);margin-bottom:9px}
  .panel label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin:9px 0 3px}
  .panel label b{color:var(--ink);font-variant-numeric:tabular-nums}
  .panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent}
  .panel input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:rgba(251,191,36,.35)}
  .panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-5px;border-radius:50%;background:#fff6e6;border:2px solid var(--accent)}
  .panel input[type=range]::-moz-range-track{height:3px;background:rgba(251,191,36,.35)}
  .panel input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#fff6e6;border:2px solid var(--accent)}
  .panel button{width:100%;margin-top:8px;padding:8px;border-radius:9px;border:1px solid var(--line);background:rgba(251,191,36,.12);color:var(--ink);font:inherit;font-size:11.5px;font-weight:550;cursor:pointer}
  .panel button[aria-pressed="true"]{background:rgba(251,191,36,.3);border-color:var(--accent)}
  .credit{position:fixed;left:14px;bottom:14px;z-index:40;padding:6px 12px;border-radius:999px;font-size:11px;color:var(--dim)}
  h1{font:600 13px/1 system-ui;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:22px;text-align:center}
  #decks{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}

  .lock{position:relative;width:258px;height:520px;border-radius:38px;overflow:hidden;background:#05070d;
        box-shadow:0 30px 70px -30px #000, 0 0 0 1px rgba(255,255,255,.07);touch-action:none;user-select:none;cursor:grab}
  .lock:active{cursor:grabbing}
  .lyr{position:absolute;inset:-9%;will-change:transform;background-size:cover;background-position:center}
  .lock .day{opacity:0;transition:opacity .5s ease}
  .lock.open .day{opacity:1}
  .clock{position:absolute;left:0;right:0;top:78px;text-align:center;z-index:5;pointer-events:none;will-change:transform}
  .clock .t{font-size:62px;font-weight:250;letter-spacing:-.03em;line-height:1;text-shadow:0 4px 24px rgba(0,0,0,.45)}
  .clock .d{font-size:12.5px;letter-spacing:.09em;opacity:.82;margin-top:4px}
  .subject{z-index:6}
  .glass{position:absolute;left:14px;right:14px;top:188px;z-index:7;border-radius:18px;padding:11px 13px;
         background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
         font-size:12px;display:flex;gap:9px;align-items:center;will-change:transform}
  .glass i{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.3);flex:none}
  .slide{position:absolute;left:16px;right:16px;bottom:22px;height:56px;z-index:8;border-radius:28px;
         background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);overflow:hidden;
         backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .slide .hint{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;letter-spacing:.07em;
               color:rgba(255,255,255,.78);-webkit-mask-image:linear-gradient(100deg,rgba(0,0,0,.25) 30%,#000 50%,rgba(0,0,0,.25) 70%);
               mask-image:linear-gradient(100deg,rgba(0,0,0,.25) 30%,#000 50%,rgba(0,0,0,.25) 70%);
               -webkit-mask-size:280% 100%;mask-size:280% 100%;animation:sheen 2.6s linear infinite}
  @keyframes sheen{to{-webkit-mask-position:-280% 0;mask-position:-280% 0}}
  .knob{position:absolute;top:4px;left:4px;width:48px;height:48px;border-radius:24px;background:#fff;
        display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.35);will-change:transform,width,border-radius}
  .knob svg{width:20px;height:20px;fill:#1a1206}
  .lock.open .hint{opacity:0;transition:opacity .2s}
  .knob .op{display:none}
  .lock.open .knob .sh{display:none}
  .lock.open .knob .op{display:block}
  .tag{position:absolute;left:14px;top:14px;z-index:9;font:10px/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;
       padding:5px 8px;border-radius:7px;background:rgba(0,0,0,.35);color:rgba(255,255,255,.72)}
  @media(max-width:900px){.panel{position:static;width:min(100%,460px);margin:0 auto 18px}body{padding-top:62px}.credit{right:14px;text-align:center}}
  @media(prefers-reduced-motion:reduce){.hint{animation:none}}
</style>
</head>
<body>
<a href="../" class="back-link">← All 5 drops</a>
<div class="panel">
  <h2>Depth &amp; unlock</h2>
  <label>Depth <b id="vDep">1.00</b></label>
  <input type="range" id="dep" min="0" max="2.4" step="0.05" value="1">
  <label>Spring stiffness <b id="vK">180</b></label>
  <input type="range" id="k" min="40" max="420" step="10" value="180">
  <label>Damping <b id="vC">22</b></label>
  <input type="range" id="c" min="6" max="46" step="1" value="22">
  <label>Unlock threshold <b id="vT">0.68</b></label>
  <input type="range" id="thr" min="0.3" max="0.95" step="0.01" value="0.68">
  <button id="btnGyro" aria-pressed="false">Tilt source: pointer</button>
  <button id="btnReset">Re-lock all three</button>
</div>

<h1>Drag the knob · the subject stands in front of the clock</h1>
<div id="decks"></div>
<div class="credit">Inspired by Kianuni/Camlo · UI Spotlight Day 169 · Drop #4</div>

<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i);};
var depth=1,K=180,C=22,THR=.68,gyro=false;

var SCENES=[
  {tag:'DUSK → DAY',time:'09:41',date:'Thursday 26 November',
   night:['linear-gradient(180deg,#1b2a52 0%,#45346b 46%,#8a4a63 78%,#c06a4e 100%)','#16203f','#0d1428'],
   day:  ['linear-gradient(180deg,#8fd0ff 0%,#cfe9ff 52%,#ffe7bd 100%)','#5f93c9','#2e4f78'],
   peaks:[[0,330,140,250,300,320,460,230,620,330],[0,372,160,300,320,368,470,296,620,372]], figure:'peak',
   note:'Sunrise in 2 h 14 m'},
  {tag:'PINES',time:'06:12',date:'Friday 27 November',
   night:['linear-gradient(180deg,#07131c 0%,#0d2b33 55%,#1d4a46 100%)','#09222a','#04131a'],
   day:  ['linear-gradient(180deg,#a7e8d8 0%,#dff6ef 55%,#fff3cf 100%)','#3f8f7c','#1c5044'],
   peaks:[[0,352,90,268,180,344,270,262,370,340,470,264,620,346],[0,384,120,318,260,382,400,312,540,380,620,350]], figure:'trees',
   note:'Frost warning · 2°'},
  {tag:'HARBOUR',time:'21:08',date:'Saturday 28 November',
   night:['linear-gradient(180deg,#140d2b 0%,#2b1a4d 50%,#5b2a52 100%)','#1b1136','#0c0720'],
   day:  ['linear-gradient(180deg,#ffd9a8 0%,#ff9e7a 50%,#c2607c 100%)','#8c4a62','#50273f'],
   peaks:[[0,344,120,316,240,348,360,312,480,350,620,320],[0,380,150,356,300,384,450,352,620,382]], figure:'city',
   note:'3 notifications'}
];
function polyPath(pts){
  var d='M'+pts[0]+' '+pts[1];
  for(var i=2;i<pts.length;i+=2) d+=' L'+pts[i]+' '+pts[i+1];
  return d+' L620 460 L0 460Z';
}
function figurePath(kind){
  if(kind==='peak') return '<path d="M206 430 L310 142 L414 430Z" fill="#070a12"/><path d="M280 230 L310 172 L340 230 L310 212Z" fill="#dfe9ff" opacity=".88"/>';
  if(kind==='trees') return '<g fill="#050d10"><path d="M246 430 L292 156 L338 430Z"/><path d="M186 430 L222 232 L258 430Z"/><path d="M332 430 L370 206 L408 430Z"/></g>';
  return '<g fill="#07050f"><rect x="224" y="214" width="44" height="216"/><rect x="276" y="158" width="40" height="272"/><rect x="324" y="238" width="54" height="192"/><rect x="292" y="118" width="8" height="42"/></g>';
}
var decks=[];
SCENES.forEach(function(sc,i){
  var el=document.createElement('div');
  el.className='lock';
  el.innerHTML=
    '<div class="tag">'+sc.tag+'</div>'+
    '<div class="lyr" data-d="0.18" style="background:'+sc.night[0]+'"></div>'+
    '<div class="lyr day" data-d="0.18" style="background:'+sc.day[0]+'"></div>'+
    '<div class="lyr" data-d="0.5"><svg viewBox="0 0 620 460" preserveAspectRatio="xMidYMax slice" style="width:100%;height:100%"><path d="'+polyPath(sc.peaks[0])+'" fill="'+sc.night[1]+'"/></svg></div>'+
    '<div class="lyr day" data-d="0.5"><svg viewBox="0 0 620 460" preserveAspectRatio="xMidYMax slice" style="width:100%;height:100%"><path d="'+polyPath(sc.peaks[0])+'" fill="'+sc.day[1]+'"/></svg></div>'+
    '<div class="clock"><div class="t">'+sc.time+'</div><div class="d">'+sc.date+'</div></div>'+
    '<div class="lyr subject" data-d="1.15"><svg viewBox="0 0 620 460" preserveAspectRatio="xMidYMax slice" style="width:100%;height:100%"><path d="'+polyPath(sc.peaks[1])+'" fill="'+sc.night[2]+'"/>'+figurePath(sc.figure)+'</svg></div>'+
    '<div class="glass" data-d="0.72"><i></i><div><b>'+sc.note+'</b><br><span style="opacity:.72">Tap to open</span></div></div>'+
    '<div class="slide"><div class="hint">slide to unlock</div>'+
      '<div class="knob">'+
        '<svg class="sh" viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2H9V7a3 3 0 1 1 6 0h2a5 5 0 0 0-5-5z"/></svg>'+
        '<svg class="op" viewBox="0 0 24 24"><path d="M17 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-4V7a3 3 0 1 1 6 0h2a5 5 0 0 0-5-5z"/></svg>'+
      '</div>'+
    '</div>';
  $('decks').appendChild(el);
  decks.push({el:el,lyrs:el.querySelectorAll('[data-d]'),clock:el.querySelector('.clock'),
    slide:el.querySelector('.slide'),knob:el.querySelector('.knob'),
    x:0,v:0,target:0,drag:false,open:false,px:0,py:0,tx:0,ty:0});
});

/* ---- pointer parallax ---- */
decks.forEach(function(d){
  d.el.addEventListener('pointermove',function(e){
    if(gyro||d.drag)return;
    var r=d.el.getBoundingClientRect();
    d.tx=((e.clientX-r.left)/r.width-.5)*2;
    d.ty=((e.clientY-r.top)/r.height-.5)*2;
  });
  d.el.addEventListener('pointerleave',function(){ if(!gyro){d.tx=0;d.ty=0;} });
  /* ---- drag to unlock, with rubber band past the rail ---- */
  d.knob.addEventListener('pointerdown',function(e){
    e.preventDefault();d.knob.setPointerCapture(e.pointerId);
    d.drag=true;d.grab=e.clientX-d.x;d.v=0;
  });
  d.knob.addEventListener('pointermove',function(e){
    if(!d.drag)return;
    var rail=d.slide.clientWidth-56,raw=e.clientX-d.grab;
    if(raw<0) raw*=.28;
    if(raw>rail) raw=rail+(raw-rail)*.22;
    d.x=raw;
  });
  function release(e){
    if(!d.drag)return;
    d.drag=false;
    var rail=d.slide.clientWidth-56,p=d.x/rail;
    if(p>=THR){ d.open=true;d.target=rail;d.el.classList.add('open'); if(navigator.vibrate)navigator.vibrate(12); }
    else { d.target=0; }
  }
  d.knob.addEventListener('pointerup',release);
  d.knob.addEventListener('pointercancel',release);
  d.el.addEventListener('dblclick',function(){ d.open=false;d.target=0;d.el.classList.remove('open'); });
});

/* ---- gyro ---- */
$('btnGyro').addEventListener('click',function(){
  var self=this;
  function enable(){
    gyro=true;self.setAttribute('aria-pressed','true');self.textContent='Tilt source: gyroscope';
    addEventListener('deviceorientation',function(e){
      var gx=Math.max(-1,Math.min(1,(e.gamma||0)/26)),gy=Math.max(-1,Math.min(1,((e.beta||0)-40)/26));
      decks.forEach(function(d){ d.tx=gx;d.ty=gy; });
    });
  }
  if(gyro){gyro=false;self.setAttribute('aria-pressed','false');self.textContent='Tilt source: pointer';decks.forEach(function(d){d.tx=0;d.ty=0;});return;}
  if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){
    DeviceOrientationEvent.requestPermission().then(function(r){ if(r==='granted')enable(); else {self.textContent='Tilt: permission denied';} },function(){});
  } else enable();
});
$('dep').addEventListener('input',function(){depth=+this.value;$('vDep').textContent=depth.toFixed(2);});
$('k').addEventListener('input',function(){K=+this.value;$('vK').textContent=K;});
$('c').addEventListener('input',function(){C=+this.value;$('vC').textContent=C;});
$('thr').addEventListener('input',function(){THR=+this.value;$('vT').textContent=THR.toFixed(2);});
$('btnReset').addEventListener('click',function(){decks.forEach(function(d){d.open=false;d.target=0;d.el.classList.remove('open');});});

/* ---- spring + parallax loop ---- */
var last=performance.now();
function loop(now){
  var dt=Math.min(.032,(now-last)/1000);last=now;
  decks.forEach(function(d){
    if(!d.drag){
      var a=-K*(d.x-d.target)-C*d.v;
      d.v+=a*dt;d.x+=d.v*dt;
      if(Math.abs(d.x-d.target)<.3&&Math.abs(d.v)<.6){d.x=d.target;d.v=0;}
    }
    var rail=Math.max(1,d.slide.clientWidth-56),p=Math.max(0,Math.min(1.1,d.x/rail));
    d.knob.style.transform='translateX('+d.x.toFixed(2)+'px)';
    d.knob.style.width=(48+Math.min(1,p)*10*(d.open?1:.4))+'px';
    d.knob.style.borderRadius=(24-Math.min(1,p)*(d.open?10:3))+'px';
    d.slide.style.background='rgba(255,255,255,'+(0.14+p*0.12).toFixed(3)+')';
    d.px+=(d.tx-d.px)*.12;d.py+=(d.ty-d.py)*.12;
    for(var i=0;i<d.lyrs.length;i++){
      var L=d.lyrs[i],dd=+L.getAttribute('data-d')*depth;
      L.style.transform='translate3d('+(-d.px*13*dd).toFixed(2)+'px,'+(-d.py*9*dd).toFixed(2)+'px,0) scale('+(1+.012*dd)+')';
    }
    d.clock.style.transform='translate3d('+(-d.px*7).toFixed(2)+'px,'+(-d.py*5).toFixed(2)+'px,0) scale('+(1-p*.03)+')';
  });
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__drop={decks:decks.length,state:function(){return decks.map(function(d){return {x:+d.x.toFixed(1),open:d.open};});},
  unlock:function(i){var d=decks[i];d.open=true;d.target=d.slide.clientWidth-56;d.el.classList.add('open');},
  setTilt:function(x,y){decks.forEach(function(d){d.tx=x;d.ty=y;});}};
})();
</script>
</body>
</html>
