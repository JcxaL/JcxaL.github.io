<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Volumetric Light Rays — UI Spotlight</title>
<style>
  :root{ --bg0:#020204; --ink:#f2f2fa; --ink-dim:#9aa1c4; --accent:#fbbf24; }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;background:var(--bg0);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .back-link{position:fixed;top:14px;left:14px;z-index:60;text-decoration:none;color:var(--ink);font-size:13px;font-weight:600;padding:9px 14px;border-radius:999px;background:rgba(20,20,32,0.6);border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(12px);}
  .back-link:hover{background:rgba(40,40,60,0.75);}
  header{padding:90px 22px 26px;text-align:center;}
  header h1{margin:0 0 8px;font-size:clamp(22px,4vw,32px);}
  header p{margin:0;color:var(--ink-dim);font-size:14px;}

  #row{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;padding:0 22px 80px;}
  .panel{position:relative;width:300px;height:360px;border-radius:20px;overflow:hidden;background:#0a0a10;border:1px solid rgba(255,255,255,0.08);box-shadow:0 20px 60px rgba(0,0,0,0.5);}
  .panel canvas{position:absolute;inset:0;width:100%;height:100%;}
  .panel .label{position:absolute;left:16px;bottom:14px;z-index:3;font-size:13px;font-weight:700;color:rgba(255,255,255,0.9);text-shadow:0 2px 10px rgba(0,0,0,0.6);}
  .panel .tag{position:absolute;right:14px;top:12px;z-index:3;font-size:10.5px;color:rgba(255,255,255,0.65);background:rgba(0,0,0,0.4);padding:3px 8px;border-radius:999px;}

  #panelCtl{position:fixed;top:14px;right:14px;z-index:60;background:rgba(14,17,32,0.72);border:1px solid rgba(255,255,255,0.09);border-radius:14px;padding:12px 14px;backdrop-filter:blur(14px);font-size:12px;width:190px;}
  #panelCtl h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:0.7px;color:var(--ink-dim);}
  #panelCtl .row2{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  #panelCtl label{width:60px;flex:0 0 auto;color:var(--ink-dim);}
  #panelCtl input[type=range]{flex:1;accent-color:var(--accent);}
  @media (max-width:760px){ #panelCtl{display:none;} .panel{width:88vw;height:280px;} }

  footer.credit{padding:6px 20px 26px;text-align:center;font-size:10.5px;color:rgba(255,255,255,0.35);}
</style>
</head>
<body>
<a href="../" class="back-link">← All 5 drops</a>
<header>
  <h1>Volumetric Light Rays</h1>
  <p>Hover a panel — the beams bend and brighten toward your cursor like real light through dust.</p>
</header>

<div id="panelCtl">
  <h4>Tune</h4>
  <div class="row2"><label>Rays</label><input type="range" id="pCount" min="6" max="30" step="1" value="16"></div>
  <div class="row2"><label>Spread</label><input type="range" id="pSpread" min="10" max="70" step="1" value="34"></div>
  <div class="row2"><label>Glow</label><input type="range" id="pGlow" min="0.2" max="1.4" step="0.05" value="0.75"></div>
</div>

<div id="row"></div>
<footer class="credit">Inspired by Magic UI's "Light Rays" component · UI Spotlight Day 84 · Drop #4</footer>

<script>
(function(){
"use strict";

var CONFIGS = [
  { label:"Amber", tag:"idle sweep", hue:38 },
  { label:"Cyan", tag:"hover to bend", hue:190 },
  { label:"Violet", tag:"hover to bend", hue:265 }
];
var params = { count: 16, spread: 34, glow: 0.75 };

document.getElementById("pCount").addEventListener("input", function(e){ params.count = parseInt(e.target.value,10); });
document.getElementById("pSpread").addEventListener("input", function(e){ params.spread = parseFloat(e.target.value); });
document.getElementById("pGlow").addEventListener("input", function(e){ params.glow = parseFloat(e.target.value); });

var row = document.getElementById("row");

function makePanel(cfg, idx){
  var wrap = document.createElement("div");
  wrap.className = "panel";
  var canvas = document.createElement("canvas");
  wrap.appendChild(canvas);
  var label = document.createElement("div"); label.className="label"; label.textContent = cfg.label;
  var tag = document.createElement("div"); tag.className="tag"; tag.textContent = cfg.tag;
  wrap.appendChild(label); wrap.appendChild(tag);
  row.appendChild(wrap);

  var ctx = canvas.getContext("2d");
  var W=0, H=0, dpr=1;
  function resize(){
    dpr = Math.min(window.devicePixelRatio||1, 2);
    W = Math.round(wrap.clientWidth*dpr); H = Math.round(wrap.clientHeight*dpr);
    canvas.width = W; canvas.height = H;
  }
  resize();
  window.addEventListener("resize", resize);

  var hover = { active:false, x:0.5 };
  wrap.addEventListener("pointermove", function(e){
    var r = wrap.getBoundingClientRect();
    hover.active = true;
    hover.x = (e.clientX - r.left) / r.width;
  });
  wrap.addEventListener("pointerleave", function(){ hover.active = false; });

  function draw(t){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = "#08080d";
    ctx.fillRect(0,0,W,H);

    var srcX = W * (hover.active ? (0.5 + (hover.x-0.5)*0.6) : (0.5 + Math.sin(t*0.00025 + idx)*0.18));
    var srcY = -H*0.12;
    var intensity = params.glow * (hover.active ? 1.6 : 1.0);
    var spreadDeg = params.spread * (hover.active ? 0.7 : 1.0);
    var count = params.count;

    ctx.globalCompositeOperation = "lighter";
    for(var i=0;i<count;i++){
      var f = (i/(count-1)) - 0.5;
      var baseAngle = 90 + f*spreadDeg;
      var flicker = 0.55 + 0.45*Math.sin(t*0.0018 + i*1.7 + idx*3.1);
      var bendTowardCursor = hover.active ? (hover.x-0.5) * 14 * Math.sin(f*Math.PI) : 0;
      var ang = (baseAngle + bendTowardCursor) * Math.PI/180;
      var len = H*1.4;
      var ex = srcX + Math.cos(ang)*len;
      var ey = srcY + Math.sin(ang)*len;
      var grad = ctx.createLinearGradient(srcX,srcY,ex,ey);
      var alpha = intensity * flicker * 0.16;
      grad.addColorStop(0, "hsla("+cfg.hue+",90%,65%,"+alpha+")");
      grad.addColorStop(1, "hsla("+cfg.hue+",90%,60%,0)");
      var width = (W/count) * 1.8;
      ctx.beginPath();
      ctx.strokeStyle = grad;
      ctx.lineWidth = width;
      ctx.moveTo(srcX, srcY);
      ctx.lineTo(ex, ey);
      ctx.stroke();
    }

    var coreGrad = ctx.createRadialGradient(srcX,srcY,0,srcX,srcY,H*0.22);
    coreGrad.addColorStop(0, "hsla("+cfg.hue+",95%,80%,"+(0.5*intensity)+")");
    coreGrad.addColorStop(1, "hsla("+cfg.hue+",95%,80%,0)");
    ctx.fillStyle = coreGrad;
    ctx.beginPath(); ctx.arc(srcX, srcY, H*0.22, 0, Math.PI*2); ctx.fill();
    ctx.globalCompositeOperation = "source-over";
  }

  return { draw: draw };
}

var panels = CONFIGS.map(makePanel);

function frame(t){
  panels.forEach(function(p){ p.draw(t); });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
