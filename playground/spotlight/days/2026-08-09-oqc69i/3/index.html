<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Liquid Metal Type — UI Spotlight</title>
<style>
  :root{ --bg0:#050507; --ink:#f2f2fa; --ink-dim:#9aa1c4; --accent:#c084fc; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 20%,#141420,#050507 70%);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;}
  .back-link{position:fixed;top:14px;left:14px;z-index:60;text-decoration:none;color:var(--ink);font-size:13px;font-weight:600;padding:9px 14px;border-radius:999px;background:rgba(20,20,32,0.6);border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(12px);}
  .back-link:hover{background:rgba(40,40,60,0.75);}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;}
  canvas.line{display:block;max-width:92vw;}
  #hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);font-size:12px;color:var(--ink-dim);z-index:10;animation:hf 5s ease forwards;pointer-events:none;}
  @keyframes hf{0%{opacity:1;}70%{opacity:1;}100%{opacity:0;}}

  #panel{position:fixed;top:14px;right:14px;z-index:60;background:rgba(14,17,32,0.72);border:1px solid rgba(255,255,255,0.09);border-radius:14px;padding:12px 14px;backdrop-filter:blur(14px);font-size:12px;width:190px;}
  #panel h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:0.7px;color:var(--ink-dim);}
  #panel .row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  #panel label{width:60px;flex:0 0 auto;color:var(--ink-dim);}
  #panel input[type=range]{flex:1;accent-color:var(--accent);}
  @media (max-width:760px){ #panel{display:none;} }

  footer.credit{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);font-size:10.5px;color:rgba(255,255,255,0.35);z-index:10;text-align:center;pointer-events:none;}
</style>
</head>
<body>
<a href="../" class="back-link">← All 5 drops</a>
<div id="panel">
  <h4>Tune</h4>
  <div class="row"><label>Ripple</label><input type="range" id="pRipple" min="0" max="18" step="0.5" value="7"></div>
  <div class="row"><label>Speed</label><input type="range" id="pSpeed" min="0.2" max="3" step="0.1" value="1.1"></div>
  <div class="row"><label>Shine</label><input type="range" id="pShine" min="0.1" max="1" step="0.05" value="0.55"></div>
  <div class="row"><label>Tint</label><input type="range" id="pTint" min="0" max="360" step="1" value="265"></div>
</div>
<div id="wrap"></div>
<div id="hint">Move your cursor across the type · try the sliders</div>
<footer class="credit">Inspired by RareUI's "Liquid Metal" shader component · UI Spotlight Day 84 · Drop #3</footer>

<script>
(function(){
"use strict";

var WORDS = ["LIQUID", "METAL", "TYPE"];
var wrap = document.getElementById("wrap");
var params = { ripple: 7, speed: 1.1, shine: 0.55, tint: 265 };

document.getElementById("pRipple").addEventListener("input", function(e){ params.ripple = parseFloat(e.target.value); });
document.getElementById("pSpeed").addEventListener("input", function(e){ params.speed = parseFloat(e.target.value); });
document.getElementById("pShine").addEventListener("input", function(e){ params.shine = parseFloat(e.target.value); });
document.getElementById("pTint").addEventListener("input", function(e){ params.tint = parseFloat(e.target.value); });

var mouse = { x: 0.5, nx: 0.5 };
window.addEventListener("pointermove", function(e){ mouse.nx = e.clientX / window.innerWidth; }, {passive:true});
window.addEventListener("touchmove", function(e){ if(e.touches[0]) mouse.nx = e.touches[0].clientX/window.innerWidth; }, {passive:true});

function hslCss(h, s, l, a){ return "hsla("+h+","+s+"%,"+l+"%,"+a+")"; }

function makeLine(word, phase){
  var textCanvas = document.createElement("canvas");
  var tctx = textCanvas.getContext("2d");
  var view = document.createElement("canvas");
  view.className = "line";
  var vctx = view.getContext("2d");

  var fontSize = 0, W = 0, H = 0, dpr = 1;

  function layout(){
    dpr = Math.min(window.devicePixelRatio||1, 2);
    var cssW = Math.min(window.innerWidth*0.86, 760);
    fontSize = Math.max(46, Math.min(120, cssW / (word.length*0.62)));
    W = Math.round(cssW*dpr);
    H = Math.round(fontSize*1.5*dpr);
    [textCanvas, view].forEach(function(c){ c.width = W; c.height = H; });
    view.style.width = (W/dpr)+"px"; view.style.height = (H/dpr)+"px";
    tctx.setTransform(1,0,0,1,0,0);
    tctx.clearRect(0,0,W,H);
    tctx.font = "800 " + (fontSize*dpr) + "px system-ui,-apple-system,'Segoe UI',sans-serif";
    tctx.textAlign = "center";
    tctx.textBaseline = "middle";
    tctx.fillStyle = "#fff";
    tctx.fillText(word, W/2, H/2);
  }
  layout();
  window.addEventListener("resize", layout);

  function render(t){
    vctx.setTransform(1,0,0,1,0,0);
    vctx.clearRect(0,0,W,H);
    var stripH = Math.max(1, Math.round(2*dpr));
    var amp = params.ripple*dpr;
    var speed = params.speed;
    var cursorPull = (mouse.nx - 0.5) * 40 * dpr;
    for(var y=0; y<H; y+=stripH){
      var wobble = Math.sin(y*0.045 + t*0.0022*speed + phase) * amp;
      var dx = wobble + cursorPull*0.15*Math.sin(y*0.01+phase);
      vctx.drawImage(textCanvas, 0, y, W, stripH, dx, y, W, stripH);
    }
    var hue = params.tint;
    var grad = vctx.createLinearGradient(0,0,W,0);
    var sweep = (Math.sin(t*0.0006*speed + phase) + 1) / 2;
    grad.addColorStop(Math.max(0,sweep-0.35), hslCss(hue, 30, 12, 1));
    grad.addColorStop(Math.max(0,sweep-0.12), hslCss(hue, 40, 55, 1));
    grad.addColorStop(sweep, hslCss(hue+20, 60, 92, 1));
    grad.addColorStop(Math.min(1,sweep+0.12), hslCss(hue, 40, 45, 1));
    grad.addColorStop(Math.min(1,sweep+0.4), hslCss(hue, 25, 10, 1));
    vctx.globalCompositeOperation = "source-atop";
    vctx.fillStyle = grad;
    vctx.fillRect(0,0,W,H);

    var shineX = ((t*0.09*speed + phase*220) % (W*2.4)) - W*0.7;
    var shineGrad = vctx.createLinearGradient(shineX-40*dpr,0,shineX+40*dpr,H);
    shineGrad.addColorStop(0, "rgba(255,255,255,0)");
    shineGrad.addColorStop(0.5, "rgba(255,255,255,"+params.shine+")");
    shineGrad.addColorStop(1, "rgba(255,255,255,0)");
    vctx.globalCompositeOperation = "lighter";
    vctx.fillStyle = shineGrad;
    vctx.fillRect(0,0,W,H);
    vctx.globalCompositeOperation = "source-over";
  }
  return { el: view, render: render };
}

var lines = WORDS.map(function(w, i){ return makeLine(w, i*1.7); });
lines.forEach(function(l){ wrap.appendChild(l.el); });

function frame(t){
  lines.forEach(function(l){ l.render(t); });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
