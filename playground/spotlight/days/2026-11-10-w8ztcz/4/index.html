<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Drop 4 — Pull the Cord</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#fdf3e2;--dim:#9c8a6e;--amber:#fbbf24}
body{background:#07070b;color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;overflow-x:hidden;-webkit-text-size-adjust:100%}
.back-link{position:fixed;top:14px;left:14px;z-index:40;text-decoration:none;color:var(--ink);font-size:12.5px;font-weight:600;
  background:rgba(18,15,10,.72);border:1px solid rgba(255,255,255,.14);border-radius:99px;padding:8px 14px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:border-color .2s,transform .2s}
.back-link:hover{border-color:var(--amber);transform:translateX(-2px)}
.panel{position:fixed;top:14px;right:14px;z-index:40;width:206px;padding:13px 14px;
  background:rgba(18,15,10,.72);border:1px solid rgba(255,255,255,.12);border-radius:14px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 50px -24px #000}
.panel h4{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);margin-bottom:10px;font-weight:700}
.panel label{display:block;font-size:11px;color:var(--dim);margin:0 0 9px}
.panel label b{color:var(--ink);float:right;font-variant-numeric:tabular-nums}
.panel input[type=range]{width:100%;accent-color:var(--amber);margin-top:3px}
header{padding:70px 20px 6px;text-align:center}
header h1{font-size:clamp(21px,4.4vw,34px);font-weight:800;letter-spacing:-.5px}
header p{color:var(--dim);font-size:13px;max-width:640px;margin:8px auto 0}
main{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:1120px;margin:14px auto 90px;padding:0 16px}
.lamp{
  position:relative;border:1px solid rgba(255,255,255,.08);border-radius:18px;overflow:hidden;
  background:#08080d;min-height:400px;isolation:isolate;
}
.lamp svg{position:absolute;inset:0;width:100%;height:100%;z-index:3;touch-action:none;cursor:grab}
.lamp svg:active{cursor:grabbing}
.beam{position:absolute;left:50%;top:0;width:120%;height:100%;transform:translateX(-50%);z-index:1;
  pointer-events:none;mix-blend-mode:screen;opacity:var(--lit,0);transition:opacity .45s ease}
.room{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:9px;
  padding:16px;z-index:2;pointer-events:none}
.room .ttl{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim);font-weight:700}
.field{border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:9px 11px;background:rgba(255,255,255,.02);
  font-size:12.5px;color:#2b2b33;transition:color .5s ease,border-color .5s ease,background .5s ease,transform .5s ease;
  transform:translateY(8px)}
.lamp.on .field{color:#fff2d6;border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.06);transform:translateY(0)}
.lamp.on .ttl{color:#f3d9a4}
.state{position:absolute;top:14px;left:16px;z-index:4;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;
  color:#4a4a57;font-weight:700;transition:color .4s}
.lamp.on .state{color:var(--amber)}
.preset{position:absolute;top:14px;right:16px;z-index:4;font-size:10.5px;color:#4a4a57;font-variant-numeric:tabular-nums}
footer{position:fixed;left:0;right:0;bottom:0;text-align:center;font-size:11px;color:#55657d;padding:9px;
  background:linear-gradient(180deg,transparent,#07070b 60%);z-index:35}
footer a{color:#9c8a6e}
@media (max-width:900px){
  main{grid-template-columns:1fr;max-width:420px}
  .lamp{min-height:330px}
  .panel{width:auto;left:14px;right:14px;top:auto;bottom:40px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .panel h4{display:none}
  .panel label{flex:1 1 110px;margin:0}
  header{padding-top:62px}
}
@media (prefers-reduced-motion:reduce){.field,.beam{transition:none}}

@media (min-width:901px){main{padding-right:252px}}
</style>
</head>
<body>
<a href="../" class="back-link">← All 5 drops</a>
<div class="panel">
  <h4>Cord physics</h4>
  <label>Stiffness <b id="vK">170</b><input id="k" type="range" min="40" max="420" value="170"></label>
  <label>Damping <b id="vD">11</b><input id="d" type="range" min="2" max="30" value="11"></label>
  <label>Pull to switch <b id="vT">58px</b><input id="t" type="range" min="20" max="140" value="58"></label>
  <label>Click sound <b id="vS">on</b><input id="s" type="range" min="0" max="1" step="1" value="1"></label>
</div>
<header>
  <h1>Nothing happens until you pull</h1>
  <p>The cord follows your finger, springs back with overshoot, and only throws the switch past the threshold. Three cords, three spring presets — same code, different constants.</p>
</header>
<main id="lamps"></main>
<footer>Inspired by <a href="https://github.com/Chr5tt/Lamp-Login" target="_blank" rel="noopener">Chr5tt/Lamp-Login</a> · UI Spotlight Day 153 · Drop #4</footer>
<script>
(function(){
"use strict";
var K=170, DMP=11, THRESH=58, SOUND=true, audio=null;

var PRESETS=[
  {name:"Taut",  k:1.45, d:1.25, len:118, hue:"#fbbf24", title:"Workshop", rows:["Rail 04 · online","Torque 118 Nm","Next service 12 d"]},
  {name:"Soft",  k:0.72, d:0.80, len:150, hue:"#ffd56b", title:"Reading room", rows:["Chapter 7","Marginalia saved","Lamp dims at 23:00"]},
  {name:"Bouncy",k:1.15, d:0.46, len:132, hue:"#ffe9a8", title:"Darkroom", rows:["Tray B at 20°C","Timer 90 s","Do not open door"]}
];

function click(freq){
  if(!SOUND)return;
  try{
    if(!audio) audio=new (window.AudioContext||window.webkitAudioContext)();
    if(audio.state==="suspended") audio.resume();
    var t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter();
    o.type="square"; o.frequency.setValueAtTime(freq,t);
    o.frequency.exponentialRampToValueAtTime(freq*0.45,t+0.035);
    f.type="bandpass"; f.frequency.value=freq*1.6; f.Q.value=2.2;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.14,t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.08);
    o.connect(f); f.connect(g); g.connect(audio.destination);
    o.start(t); o.stop(t+0.1);
  }catch(e){}
}

function makeLamp(cfg,i){
  var host=document.createElement("div");
  host.className="lamp";
  host.innerHTML=
    '<div class="beam"></div>'+
    '<div class="state">off</div><div class="preset">'+cfg.name+' spring</div>'+
    '<div class="room"><div class="ttl">'+cfg.title+'</div>'+
    cfg.rows.map(function(r){return '<div class="field">'+r+'</div>';}).join("")+'</div>'+
    '<svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMin slice">'+
      '<defs><radialGradient id="glow'+i+'"><stop offset="0" stop-color="'+cfg.hue+'" stop-opacity=".95"/>'+
      '<stop offset="1" stop-color="'+cfg.hue+'" stop-opacity="0"/></radialGradient></defs>'+
      '<g class="rig">'+
        '<line class="stem" x1="150" y1="0" x2="150" y2="54" stroke="#3a3a45" stroke-width="3"/>'+
        '<path class="shade" d="M150 54 L196 118 L104 118 Z" fill="#23232c" stroke="#3f3f4b" stroke-width="2" stroke-linejoin="round"/>'+
        '<circle class="bulb" cx="150" cy="118" r="9" fill="#2a2a33"/>'+
        '<circle class="halo" cx="150" cy="118" r="60" fill="url(#glow'+i+')" opacity="0"/>'+
      '</g>'+
      '<path class="cord" fill="none" stroke="#c9a227" stroke-width="2.2" stroke-linecap="round"/>'+
      '<g class="knobg"><circle class="knob" r="9" fill="#e8c35a" stroke="#8a6c14" stroke-width="1.6"/>'+
      '<circle class="knobhi" r="3" fill="#fff3c4" opacity=".75"/></g>'+
    '</svg>';
  var svg=host.querySelector("svg"),
      cord=host.querySelector(".cord"), knobg=host.querySelector(".knobg"),
      rig=host.querySelector(".rig"), halo=host.querySelector(".halo"),
      bulb=host.querySelector(".bulb"), beam=host.querySelector(".beam"),
      state=host.querySelector(".state");
  var anchorX=178, anchorY=112, rest=cfg.len,
      y=0, v=0, drag=false, on=false, swing=0, swingV=0, pid=null;

  beam.style.background="radial-gradient(60% 72% at 50% 8%,"+cfg.hue+"55,transparent 70%)";

  function toLocal(e){
    var r=svg.getBoundingClientRect();
    return {x:(e.clientX-r.left)/r.width*300, y:(e.clientY-r.top)/r.height*(400*r.height/r.height)};
  }
  function localY(e){
    var r=svg.getBoundingClientRect(), scale=r.width/300;
    return (e.clientY-r.top)/scale;
  }
  function knobY(){ return anchorY+rest+y; }

  function hit(e){
    var r=svg.getBoundingClientRect(), scale=r.width/300,
        px=(e.clientX-r.left)/scale, py=(e.clientY-r.top)/scale,
        dx=px-anchorX, dy=py-knobY();
    return Math.abs(dx)<34 && Math.abs(dy)<34;
  }
  svg.addEventListener("pointerdown",function(e){
    if(!hit(e))return;
    drag=true; v=0; pid=e.pointerId;
    svg.setPointerCapture&&svg.setPointerCapture(pid);
    e.preventDefault();
  });
  svg.addEventListener("pointermove",function(e){
    if(!drag)return;
    y=Math.max(-14,Math.min(190,localY(e)-anchorY-rest));
    e.preventDefault();
  });
  function release(){
    if(!drag)return;
    drag=false;
    if(y>THRESH){
      on=!on;
      host.classList.toggle("on",on);
      state.textContent=on?"on":"off";
      beam.style.setProperty("--lit",on?1:0);
      halo.setAttribute("opacity",on?"1":"0");
      bulb.setAttribute("fill",on?cfg.hue:"#2a2a33");
      swingV+=on?2.6:-2.2;
      click(on?880:560);
    }
    v-=y*0.08;
  }
  svg.addEventListener("pointerup",release);
  svg.addEventListener("pointercancel",release);

  function frame(dt){
    var kk=K*cfg.k, dd=DMP*cfg.d, ky;
    if(!drag){
      v+=(-kk*y-dd*v)*dt;
      y+=v*dt;
      if(Math.abs(y)<0.05&&Math.abs(v)<0.05){y=0;v=0;}
    }
    swingV+=(-28*swing-6.4*swingV)*dt;
    swing+=swingV*dt;
    ky=knobY();
    cord.setAttribute("d","M"+anchorX+" "+anchorY+" Q"+(anchorX+2.5+swing*3)+" "+(anchorY+(ky-anchorY)*0.55+Math.max(0,y)*0.12)+" "+anchorX+" "+ky);
    knobg.setAttribute("transform","translate("+anchorX+","+ky+")");
    rig.setAttribute("transform","rotate("+(swing*1.5).toFixed(2)+" 150 0)");
    if(on) halo.setAttribute("r",(60+Math.sin(performance.now()/420)*3).toFixed(1));
  }
  document.getElementById("lamps").appendChild(host);
  return frame;
}

var frames=PRESETS.map(makeLamp), last=performance.now();
(function loop(now){
  var dt=Math.min(0.033,(now-last)/1000); last=now;
  for(var i=0;i<frames.length;i++) frames[i](dt);
  requestAnimationFrame(loop);
})(last);

function bind(id,set,fmt){
  var el=document.getElementById(id), out=document.getElementById("v"+id.toUpperCase());
  function go(){ set(+el.value); out.textContent=fmt(el.value); }
  el.addEventListener("input",go); go();
}
bind("k",function(v){K=v;},function(v){return v;});
bind("d",function(v){DMP=v;},function(v){return v;});
bind("t",function(v){THRESH=v;},function(v){return v+"px";});
bind("s",function(v){SOUND=!!v;},function(v){return +v?"on":"off";});
})();
</script>
</body>
</html>
