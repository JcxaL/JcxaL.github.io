<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cluster Assembly — Drop 1</title>
<style>
  :root{ --accent:#38bdf8; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#050810;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  .back-link{position:fixed; top:12px; left:12px; z-index:10; background:rgba(20,20,30,0.6); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.12); color:#eef; text-decoration:none; font-size:12px; font-weight:600;
    padding:8px 14px; border-radius:999px;}
  .panel{position:fixed; top:12px; right:12px; z-index:10; background:rgba(18,16,28,0.7); backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.1); border-radius:14px; padding:12px; width:170px; color:#eef; font-size:11px;}
  .panel h3{margin:0 0 8px; font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:#9ad;}
  .panel button{display:block; width:100%; margin-bottom:6px; padding:7px; border-radius:8px; border:1px solid rgba(255,255,255,0.12);
    background:rgba(255,255,255,0.05); color:#eef; font-size:11px; cursor:pointer;}
  .panel button.active{background:var(--accent); color:#031018; border-color:var(--accent);}
  .panel label{display:block; margin:8px 0 3px; color:#9ad;}
  .panel input[type=range]{width:100%;}
  footer{position:fixed; bottom:8px; left:0; right:0; text-align:center; font-size:10px; color:rgba(255,255,255,0.35);}
  @media (max-width:640px){ .panel{display:none;} }
</style>
</head>
<body>
<a href="../" class="back-link">← All 5 drops</a>
<canvas id="c"></canvas>
<div class="panel">
  <h3>Formation</h3>
  <button data-f="sphere" class="active">Sphere</button>
  <button data-f="torus">Torus</button>
  <button data-f="grid">Grid</button>
  <button data-f="scatter">Scatter</button>
  <label>Node count <span id="nVal">220</span></label>
  <input type="range" id="nSlider" min="60" max="400" step="20" value="220">
  <label>Link distance</label>
  <input type="range" id="linkSlider" min="0" max="120" step="10" value="70">
</div>
<footer>Inspired by "Creating an Interactive 3D Cluster" · Codrops · UI Spotlight Day 101 · Drop #1</footer>
<script>
(function(){
"use strict";
var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var dpr = Math.max(1, Math.min(2, window.devicePixelRatio||1));
var W,H;
function resize(){
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W*dpr; canvas.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize", resize);
resize();

var N = 220, linkDist = 70, formation = "sphere";
var nodes = [];
var mouse = {x:-9999, y:-9999, active:false};

function rand(a,b){ return a+Math.random()*(b-a); }

function makeNodes(){
  nodes = [];
  for(var i=0;i<N;i++){
    nodes.push({
      x: rand(0,W), y: rand(0,H),
      vx:0, vy:0,
      tx:0, ty:0, tz:0,
      seed: Math.random()*Math.PI*2
    });
  }
  assignTargets();
}

function assignTargets(){
  var cx=W/2, cy=H/2, R=Math.min(W,H)*0.32;
  for(var i=0;i<nodes.length;i++){
    var n = nodes[i];
    if(formation === "sphere"){
      var phi = Math.acos(1-2*(i+0.5)/nodes.length);
      var theta = Math.PI*(1+Math.sqrt(5))*i;
      n.tx = cx + R*Math.sin(phi)*Math.cos(theta);
      n.ty = cy + R*Math.sin(phi)*Math.sin(theta)*0.62;
      n.tz = Math.cos(phi);
    } else if(formation === "torus"){
      var u = (i/nodes.length)*Math.PI*2*7;
      var v = (i/nodes.length)*Math.PI*2;
      var r1=R*0.85, r2=R*0.32;
      n.tx = cx + (r1+r2*Math.cos(v))*Math.cos(u)*0.9;
      n.ty = cy + (r1+r2*Math.cos(v))*Math.sin(u)*0.45;
      n.tz = Math.sin(v);
    } else if(formation === "grid"){
      var cols = Math.ceil(Math.sqrt(nodes.length*(W/H)));
      var rows = Math.ceil(nodes.length/cols);
      var col = i%cols, row = Math.floor(i/cols);
      var gw = R*2.1, gh = R*1.5;
      n.tx = cx - gw/2 + (col/(cols-1||1))*gw;
      n.ty = cy - gh/2 + (row/(rows-1||1))*gh;
      n.tz = 0;
    } else {
      n.tx = rand(cx-R*1.3, cx+R*1.3);
      n.ty = rand(cy-R*1.3, cy+R*1.3);
      n.tz = rand(-1,1);
    }
  }
}

makeNodes();

document.querySelectorAll(".panel button[data-f]").forEach(function(b){
  b.addEventListener("click", function(){
    document.querySelectorAll(".panel button[data-f]").forEach(function(x){ x.classList.remove("active"); });
    b.classList.add("active");
    formation = b.dataset.f;
    assignTargets();
  });
});
document.getElementById("nSlider").addEventListener("input", function(e){
  N = parseInt(e.target.value,10);
  document.getElementById("nVal").textContent = N;
  makeNodes();
});
document.getElementById("linkSlider").addEventListener("input", function(e){ linkDist = parseInt(e.target.value,10); });

function pointerMove(x,y){ mouse.x=x; mouse.y=y; mouse.active=true; }
canvas.addEventListener("pointermove", function(e){ pointerMove(e.clientX,e.clientY); });
canvas.addEventListener("pointerleave", function(){ mouse.active=false; });
canvas.addEventListener("pointerdown", function(e){
  var rect = canvas.getBoundingClientRect();
  var mx = e.clientX-rect.left, my = e.clientY-rect.top;
  // ripple: nudge nearby nodes outward
  nodes.forEach(function(n){
    var dx=n.x-mx, dy=n.y-my, d=Math.hypot(dx,dy);
    if(d<160 && d>0.01){ var f=(160-d)/160*14; n.vx += dx/d*f; n.vy += dy/d*f; }
  });
});

function step(dt, t){
  for(var i=0;i<nodes.length;i++){
    var n = nodes[i];
    var scale = 1 + n.tz*0.18;
    var goalX = n.tx + Math.sin(t*0.6+n.seed)*4;
    var goalY = n.ty + Math.cos(t*0.5+n.seed)*4;
    n.vx += (goalX-n.x)*0.045;
    n.vy += (goalY-n.y)*0.045;
    if(mouse.active){
      var dx=n.x-mouse.x, dy=n.y-mouse.y, d=Math.hypot(dx,dy);
      if(d<110 && d>0.01){ var f=(110-d)/110*3.2; n.vx += dx/d*f; n.vy += dy/d*f; }
    }
    n.vx *= 0.86; n.vy *= 0.86;
    n.x += n.vx; n.y += n.vy;
    n._scale = scale;
  }
}

function render(){
  ctx.clearRect(0,0,W,H);
  var bg = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.7);
  bg.addColorStop(0,"#0d1424"); bg.addColorStop(1,"#050810");
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  ctx.lineWidth=1;
  for(var i=0;i<nodes.length;i++){
    for(var j=i+1;j<nodes.length;j++){
      var a=nodes[i], b=nodes[j];
      var dx=a.x-b.x, dy=a.y-b.y, d=Math.hypot(dx,dy);
      if(d<linkDist){
        ctx.strokeStyle = "rgba(56,189,248,"+((1-d/linkDist)*0.22)+")";
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      }
    }
  }
  for(var k=0;k<nodes.length;k++){
    var n = nodes[k];
    var r = 1.6*n._scale + 0.6;
    ctx.beginPath();
    ctx.fillStyle = n.tz>0 ? "rgba(129,231,255,0.95)" : "rgba(56,189,248,0.55)";
    ctx.arc(n.x,n.y,r,0,Math.PI*2);
    ctx.fill();
  }
}

var last=null;
function loop(ts){
  if(last===null) last=ts;
  var dt = Math.min(0.05,(ts-last)/1000);
  last=ts;
  step(dt, ts/1000);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
