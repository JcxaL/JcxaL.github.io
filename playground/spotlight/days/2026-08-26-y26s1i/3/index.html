<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bounded Reveal — Drop 3</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0; min-height:100%; background:#08070c; color:#f2f0f8; font-family:system-ui,-apple-system,sans-serif; overflow-x:hidden;}
  .back-link{position:fixed; top:12px; left:12px; z-index:10; background:rgba(20,20,30,0.6); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.12); color:#fff; text-decoration:none; font-size:12px; font-weight:600;
    padding:8px 14px; border-radius:999px;}
  .panel{position:fixed; top:12px; right:12px; z-index:10; background:rgba(18,16,28,0.7); backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.1); border-radius:14px; padding:12px; width:180px; font-size:11px;}
  .panel h3{margin:0 0 8px; font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:#f0a; opacity:.8;}
  .panel button{display:block; width:100%; margin-bottom:6px; padding:8px; border-radius:8px; border:1px solid rgba(255,255,255,0.12);
    background:rgba(255,255,255,0.05); color:#fff; font-size:11px; cursor:pointer;}
  .panel button.replay{background:linear-gradient(135deg,#f87171,#a78bfa); border:none; font-weight:700;}
  @media (max-width:640px){ .panel{display:none;} }

  main{max-width:900px; margin:0 auto; padding:110px 24px 80px;}
  .block{margin-bottom:64px;}
  .label{font-size:11px; text-transform:uppercase; letter-spacing:.12em; opacity:.45; margin-bottom:14px;}
  h2{font-size:clamp(30px,6vw,58px); line-height:1.08; margin:0; font-weight:800;}

  /* the bounding mask: overflow hidden per word keeps every character inside its own footprint */
  .word{ display:inline-block; overflow:hidden; vertical-align:top; margin-right:0.28em; }
  .word > span{ display:inline-block; will-change:transform,filter,opacity; }

  .rise .word > span{ transform:translateY(115%); transition:transform 0.62s cubic-bezier(.16,1,.3,1); }
  .rise.play .word > span{ transform:translateY(0); }

  .blur .word > span{ opacity:0; filter:blur(10px); transform:translateY(20%); transition:opacity .5s ease, filter .5s ease, transform .5s ease; }
  .blur.play .word > span{ opacity:1; filter:blur(0); transform:translateY(0); }

  .stagger .char{ display:inline-block; overflow:hidden; }
  .stagger .char > span{ display:inline-block; transform:translateY(100%) rotate(6deg); transition:transform .5s cubic-bezier(.2,1,.3,1); }
  .stagger.play .char > span{ transform:translateY(0) rotate(0deg); }

  footer{text-align:center; font-size:10px; opacity:.4; padding:0 0 24px;}
</style>
</head>
<body>
<a href="../" class="back-link">← All 5 drops</a>
<div class="panel">
  <h3>Controls</h3>
  <label style="display:block;margin-bottom:4px;opacity:.7;">Stagger speed</label>
  <input type="range" id="speedSlider" min="20" max="120" value="55" style="width:100%;margin-bottom:10px;">
  <button class="replay" id="replayBtn">↻ Replay all</button>
</div>

<main>
  <div class="block">
    <div class="label">01 — Masked rise</div>
    <h2 class="rise" id="h1"><span class="word"><span>Every</span></span> <span class="word"><span>character</span></span> <span class="word"><span>stays</span></span> <span class="word"><span>inside</span></span> <span class="word"><span>its</span></span> <span class="word"><span>own</span></span> <span class="word"><span>box.</span></span></h2>
  </div>
  <div class="block">
    <div class="label">02 — Masked blur-in</div>
    <h2 class="blur" id="h2"><span class="word"><span>Nothing</span></span> <span class="word"><span>ever</span></span> <span class="word"><span>travels</span></span> <span class="word"><span>outside</span></span> <span class="word"><span>the</span></span> <span class="word"><span>finished</span></span> <span class="word"><span>footprint.</span></span></h2>
  </div>
  <div class="block">
    <div class="label">03 — Masked letter stagger (hover a word to replay)</div>
    <h2 class="stagger" id="h3"></h2>
  </div>
</main>
<footer>Inspired by titlecard (opensverige) · UI Spotlight Day 101 · Drop #3</footer>
<script>
(function(){
  "use strict";
  var speedMs = 55;
  var h1 = document.getElementById("h1"), h2 = document.getElementById("h2"), h3 = document.getElementById("h3");

  var text3 = "Bounded by design.";
  text3.split(" ").forEach(function(word, wi){
    var wordSpan = document.createElement("span");
    wordSpan.className = "word";
    wordSpan.style.marginRight = "0.28em";
    word.split("").forEach(function(ch){
      var charBox = document.createElement("span");
      charBox.className = "char";
      var inner = document.createElement("span");
      inner.textContent = ch;
      charBox.appendChild(inner);
      wordSpan.appendChild(charBox);
    });
    h3.appendChild(wordSpan);
    h3.addEventListener("pointerenter", function watch(e){}, {once:false});
  });

  function playOne(el){
    el.classList.remove("play");
    // force reflow so the transition restarts even if it's already mid-way
    void el.offsetWidth;
    el.classList.add("play");
  }

  function staggerChars(el){
    var chars = el.querySelectorAll(".char > span");
    chars.forEach(function(c, i){
      c.style.transitionDelay = (i*speedMs)+"ms";
    });
    playOne(el);
  }

  function playAll(){
    setTimeout(function(){ playOne(h1); }, 0);
    setTimeout(function(){ playOne(h2); }, 250);
    setTimeout(function(){ staggerChars(h3); }, 500);
  }

  document.getElementById("speedSlider").addEventListener("input", function(e){ speedMs = parseInt(e.target.value,10); });
  document.getElementById("replayBtn").addEventListener("click", playAll);

  // replay the letter-stagger headline on hover, per-word feel via full replay (kept simple + robust)
  h3.addEventListener("pointerenter", function(){ staggerChars(h3); });

  window.addEventListener("load", function(){ requestAnimationFrame(playAll); });
  // in case load already fired before this script ran (rare), kick off anyway
  if(document.readyState === "complete"){ requestAnimationFrame(playAll); }
})();
</script>
</body>
</html>
