<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elastic Drag Slider — UI Spotlight</title>
<style>
  :root{ --bg:#0b0710; --ink:#f4eeff; --ink-dim:#9186ac; --accent:#fbbf24; --accent2:#f472b6; --border:#2c2140; }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:radial-gradient(ellipse at 50% 0%, #211636 0%, var(--bg) 55%), var(--bg);
    color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    min-height:100vh; overscroll-behavior:none;
  }
  .back-link{
    position:fixed; top:14px; left:14px; z-index:50;
    background:rgba(18,12,30,.7); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--border); color:var(--ink); text-decoration:none;
    padding:9px 16px; border-radius:999px; font-size:.82rem; font-weight:600;
  }
  .debug{
    position:fixed; top:14px; right:14px; z-index:50; width:220px;
    background:rgba(18,12,30,.75); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--border); border-radius:14px; padding:14px; font-size:.72rem; color:var(--ink-dim);
  }
  .debug h4{margin:0 0 10px; color:var(--accent); font-size:.78rem;}
  .debug label{display:block; margin-bottom:10px;}
  .debug .row{display:flex; justify-content:space-between; margin-bottom:3px;}
  .debug input[type=range]{width:100%; accent-color:var(--accent);}
  @media (max-width:640px){ .debug{display:none;} }

  main{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:56px; padding:100px 24px;}
  h1{font-size:clamp(1.4rem,4.5vw,2.2rem); text-align:center; max-width:22ch;}
  h1 span{color:var(--accent);}
  .demos{display:flex; gap:60px; flex-wrap:wrap; justify-content:center; align-items:flex-end;}

  .slider-wrap{display:flex; flex-direction:column; align-items:center; gap:10px; width:260px;}
  .slider-wrap .label-row{display:flex; justify-content:space-between; width:100%; font-size:.78rem; color:var(--ink-dim);}
  .slider-wrap .value{color:var(--accent); font-weight:800; font-size:1.1rem;}

  .slider-track{
    position:relative; width:100%; height:10px; border-radius:6px; background:#1c1530;
    border:1px solid var(--border); touch-action:none; cursor:pointer;
  }
  .slider-fill{ position:absolute; top:0; left:0; height:100%; border-radius:6px; background:linear-gradient(90deg,var(--accent),var(--accent2)); }
  .slider-thumb{
    position:absolute; top:50%; width:26px; height:26px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,var(--accent)); transform:translate(-50%,-50%);
    box-shadow:0 3px 10px rgba(0,0,0,.5); border:2px solid #fff5da; cursor:grab;
  }
  .slider-wrap.dragging .slider-thumb{ cursor:grabbing; box-shadow:0 0 0 8px rgba(251,191,36,.18), 0 3px 10px rgba(0,0,0,.5); }

  .notch{ position:absolute; top:50%; width:2px; height:14px; background:var(--border); transform:translate(-50%,-50%); border-radius:1px; }

  .vertical-wrap{ height:220px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .vertical-wrap .slider-track{ width:10px; height:100%; }
  .vertical-wrap .slider-fill{ width:100%; height:0; top:auto; bottom:0; left:0; }
  .vertical-wrap .slider-thumb{ left:50%; top:auto; bottom:0; transform:translate(-50%,50%); }

  footer{ text-align:center; padding:0 16px 60px; color:var(--ink-dim); font-size:.72rem; }
  footer a{ color:var(--accent); }
</style>
</head>
<body>
  <a href="../" class="back-link">← All 5 drops</a>

  <div class="debug">
    <h4>Spring Tuner</h4>
    <label>
      <div class="row"><span>Max overflow</span><span id="overflowVal">60px</span></div>
      <input type="range" id="overflowSlider" min="10" max="120" value="60">
    </label>
    <label>
      <div class="row"><span>Stiffness</span><span id="stiffVal">180</span></div>
      <input type="range" id="stiffSlider" min="40" max="400" value="180">
    </label>
    <label>
      <div class="row"><span>Damping</span><span id="dampVal">14</span></div>
      <input type="range" id="dampSlider" min="4" max="40" value="14">
    </label>
  </div>

  <main>
    <h1>Drag past the edge — it <span>resists</span>, then snaps back with a spring.</h1>

    <div class="demos">
      <div class="slider-wrap" id="s1">
        <div class="label-row"><span>Brightness</span><span class="value">50</span></div>
        <div class="slider-track"><div class="slider-fill"></div><div class="slider-thumb"></div></div>
      </div>

      <div class="slider-wrap" id="s2">
        <div class="label-row"><span>Quality (stepped, magnetic)</span><span class="value">3</span></div>
        <div class="slider-track"><div class="slider-fill"></div><div class="slider-thumb"></div></div>
      </div>

      <div class="vertical-wrap" id="s3">
        <div class="label-row" style="width:80px;"><span>Vol</span><span class="value">70</span></div>
        <div class="slider-track"><div class="slider-fill"></div><div class="slider-thumb"></div></div>
      </div>
    </div>
  </main>

  <footer>Inspired by React Bits (DavidHDev) — Elastic Slider · UI Spotlight Day 92 · Drop #4</footer>

<script>
(function(){
  "use strict";
  const CFG = { maxOverflow: 60, stiffness: 180, damping: 14 };

  function decay(x, max){
    const sign = x < 0 ? -1 : 1;
    return sign * max * (1 - Math.exp(-Math.abs(x)/max));
  }

  class ElasticSlider{
    constructor(wrapEl, opts){
      this.wrap = wrapEl;
      this.track = wrapEl.querySelector('.slider-track');
      this.fill = wrapEl.querySelector('.slider-fill');
      this.thumb = wrapEl.querySelector('.slider-thumb');
      this.valueEl = wrapEl.querySelector('.value');
      this.min = opts.min; this.max = opts.max; this.step = opts.step || null;
      this.vertical = !!opts.vertical;
      this.value = opts.initial;
      this.overflow = 0; this.overflowVel = 0;
      this.raf = null;
      this.pointerId = null;

      if(opts.notches){
        for(let i=0;i<=opts.notches;i++){
          const n = document.createElement('div');
          n.className = 'notch';
          if(this.vertical){ n.style.bottom = (i/opts.notches*100)+'%'; n.style.left='50%'; }
          else { n.style.left = (i/opts.notches*100)+'%'; }
          this.track.appendChild(n);
        }
      }

      this.track.addEventListener('pointerdown', this.onDown.bind(this));
      this.render();
    }
    fracFromEvent(e){
      const rect = this.track.getBoundingClientRect();
      if(this.vertical){
        return (rect.bottom - e.clientY) / rect.height;
      }
      return (e.clientX - rect.left) / rect.width;
    }
    onDown(e){
      cancelAnimationFrame(this.raf);
      this.pointerId = e.pointerId;
      this.wrap.classList.add('dragging');
      this.onMove(e);
      window.addEventListener('pointermove', this._moveHandler = this.onMove.bind(this));
      window.addEventListener('pointerup', this._upHandler = this.onUp.bind(this));
    }
    onMove(e){
      const rawFrac = this.fracFromEvent(e);
      const clampedFrac = Math.max(0, Math.min(1, rawFrac));
      let value = this.min + clampedFrac * (this.max - this.min);
      if(this.step){ value = Math.round(value/this.step) * this.step; }
      this.value = value;

      const overflowFrac = rawFrac < 0 ? rawFrac : (rawFrac > 1 ? rawFrac - 1 : 0);
      const rect = this.track.getBoundingClientRect();
      const trackSize = this.vertical ? rect.height : rect.width;
      const rawOverflowPx = overflowFrac * trackSize;
      this.overflow = decay(rawOverflowPx, CFG.maxOverflow);
      this.render();
    }
    onUp(){
      this.wrap.classList.remove('dragging');
      window.removeEventListener('pointermove', this._moveHandler);
      window.removeEventListener('pointerup', this._upHandler);
      this.springToZero();
    }
    springToZero(){
      const step = ()=>{
        const stiffness = CFG.stiffness/1000, damping = CFG.damping/100;
        const force = (0 - this.overflow) * stiffness - this.overflowVel * damping;
        this.overflowVel += force;
        this.overflow += this.overflowVel;
        this.render();
        if(Math.abs(this.overflow) > 0.15 || Math.abs(this.overflowVel) > 0.15){
          this.raf = requestAnimationFrame(step);
        } else {
          this.overflow = 0; this.overflowVel = 0; this.render();
        }
      };
      this.raf = requestAnimationFrame(step);
    }
    render(){
      const frac = (this.value - this.min) / (this.max - this.min);
      if(this.vertical){
        this.fill.style.height = (frac*100)+'%';
        this.thumb.style.bottom = 'calc(' + (frac*100) + '% + ' + this.overflow + 'px)';
      } else {
        this.fill.style.width = (frac*100)+'%';
        this.thumb.style.left = 'calc(' + (frac*100) + '% + ' + this.overflow + 'px)';
      }
      this.valueEl.textContent = this.step ? Math.round(this.value) : Math.round(this.value);
    }
  }

  const s1 = new ElasticSlider(document.getElementById('s1'), {min:0,max:100,initial:50,vertical:false});
  const s2 = new ElasticSlider(document.getElementById('s2'), {min:1,max:5,step:1,initial:3,vertical:false,notches:4});
  const s3 = new ElasticSlider(document.getElementById('s3'), {min:0,max:100,initial:70,vertical:true});

  const overflowSlider = document.getElementById('overflowSlider');
  const stiffSlider = document.getElementById('stiffSlider');
  const dampSlider = document.getElementById('dampSlider');
  overflowSlider.addEventListener('input', ()=>{ CFG.maxOverflow = +overflowSlider.value; document.getElementById('overflowVal').textContent = CFG.maxOverflow+'px'; });
  stiffSlider.addEventListener('input', ()=>{ CFG.stiffness = +stiffSlider.value; document.getElementById('stiffVal').textContent = CFG.stiffness; });
  dampSlider.addEventListener('input', ()=>{ CFG.damping = +dampSlider.value; document.getElementById('dampVal').textContent = CFG.damping; });
})();
</script>
</body>
</html>
