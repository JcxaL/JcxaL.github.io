<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bones That Bend the Drawing — UI Spotlight</title>
<style>
  :root{ --bg:#070a14; --ink:#e8ecff; --dim:#8b9ac4; --accent:#38bdf8; --line:rgba(140,170,255,.16); }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:radial-gradient(1100px 700px at 20% -10%, #132045, var(--bg) 60%);
    color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  canvas{display:block; width:100%; height:100%; touch-action:none}
  .back-link{
    position:fixed; top:16px; left:16px; z-index:9; display:inline-flex; align-items:center; gap:7px;
    padding:9px 15px; border-radius:999px; border:1px solid var(--line); color:var(--ink);
    background:rgba(12,18,38,.6); backdrop-filter:blur(12px); text-decoration:none;
    font:600 12.5px/1 system-ui; transition:.18s;
  }
  .back-link:hover{border-color:var(--accent); color:var(--accent)}
  .panel{
    position:fixed; top:16px; right:16px; z-index:9; width:216px; padding:13px 14px 15px;
    border:1px solid var(--line); border-radius:16px; background:rgba(12,18,38,.62);
    backdrop-filter:blur(14px); box-shadow:0 18px 40px rgba(0,0,0,.45);
  }
  .panel h2{margin:0 0 10px; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim)}
  .row{display:flex; align-items:center; gap:8px; margin-top:9px}
  .row label{font-size:11.5px; color:var(--dim); min-width:62px}
  .row output{font:600 11.5px/1 ui-monospace,Menlo,monospace; min-width:34px; text-align:right}
  input[type=range]{-webkit-appearance:none; appearance:none; flex:1; height:20px; background:transparent}
  input[type=range]::-webkit-slider-runnable-track{height:3px; border-radius:3px; background:var(--line)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:13px; height:13px; margin-top:-5px; border-radius:50%; background:var(--accent)}
  input[type=range]::-moz-range-track{height:3px; border-radius:3px; background:var(--line)}
  input[type=range]::-moz-range-thumb{width:12px; height:12px; border:0; border-radius:50%; background:var(--accent)}
  .tgl{display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--ink); margin-top:10px; cursor:pointer}
  .tgl input{appearance:none; width:34px; height:19px; border-radius:999px; background:var(--line); position:relative; cursor:pointer; transition:.2s}
  .tgl input::after{content:""; position:absolute; top:2.5px; left:3px; width:14px; height:14px; border-radius:50%; background:var(--dim); transition:.2s}
  .tgl input:checked{background:rgba(56,189,248,.35)}
  .tgl input:checked::after{transform:translateX(14px); background:var(--accent)}
  .hint{
    position:fixed; left:16px; bottom:52px; z-index:9; font-size:12px; color:var(--dim);
    background:rgba(12,18,38,.55); border:1px solid var(--line); padding:8px 13px; border-radius:999px;
    backdrop-filter:blur(10px);
  }
  footer{
    position:fixed; left:0; right:0; bottom:0; z-index:9; padding:11px 16px; text-align:center;
    font-size:11px; color:var(--dim); background:linear-gradient(transparent, rgba(5,8,18,.85));
  }
  footer a{color:var(--dim)}
  @media (max-width:720px){ .panel{display:none} .hint{bottom:46px; font-size:11px} }
</style>
</head>
<body>
<a href="../" class="back-link">← All 5 drops</a>
<canvas id="c"></canvas>
<div class="panel">
  <h2>Rig controls</h2>
  <div class="row"><label for="fall">Falloff</label><input id="fall" type="range" min="1" max="6" step="0.2" value="2.6"><output id="ofall">2.6</output></div>
  <div class="row"><label for="amp">Sway</label><input id="amp" type="range" min="0" max="40" step="1" value="22"><output id="oamp">22</output></div>
  <div class="row"><label for="spd">Speed</label><input id="spd" type="range" min="0" max="3" step="0.1" value="1.1"><output id="ospd">1.1</output></div>
  <label class="tgl"><input type="checkbox" id="bones" checked> Show skeleton</label>
  <label class="tgl"><input type="checkbox" id="weights"> Show weights</label>
</div>
<div class="hint">Drag any creature — the mesh follows its bones</div>
<footer>Inspired by <a href="https://github.com/jaisurya-dev-art/rigby2d" target="_blank" rel="noopener">jaisurya-dev-art/rigby2d</a> · UI Spotlight Day 164 · Drop #1</footer>
<script>
(function(){
  'use strict';
  var cv=document.getElementById('c'), x=cv.getContext('2d'), W=0, H=0, dpr=1;
  var P={ fall:2.6, amp:22, spd:1.1, bones:true, weights:false };

  /* --- tiny 2D transform: {x,y,a} --- */
  function tApply(t,p){ var c=Math.cos(t.a), s=Math.sin(t.a); return [t.x+p[0]*c-p[1]*s, t.y+p[0]*s+p[1]*c]; }
  function tUnapply(t,p){ var dx=p[0]-t.x, dy=p[1]-t.y, c=Math.cos(-t.a), s=Math.sin(-t.a); return [dx*c-dy*s, dx*s+dy*c]; }

  /* --- a rig: a chain of joints + an outline mesh bound to them --- */
  function Rig(cfg){
    this.base={ x:cfg.x, y:cfg.y };
    this.dir=cfg.dir; this.n=cfg.n; this.len=cfg.len;
    this.thick=cfg.thick; this.hue=cfg.hue; this.phase=cfg.phase; this.swim=cfg.swim;
    this.curl=cfg.curl||0;
    this.angles=new Float64Array(this.n);
    this.rest=this.fk(new Float64Array(this.n));
    /* resample the rest spine so the silhouette is smooth, not one point per joint */
    this.verts=[]; this.weights=[];
    var K=(this.n-1)*4, total=(this.n-1)*this.len;
    var ux=Math.cos(this.dir), uy=Math.sin(this.dir), nx=-uy, ny=ux;
    var self=this;
    var at=function(t){ return [self.base.x+ux*total*t, self.base.y+uy*total*t]; };
    var i, t, p, off;
    for (i=0;i<=K;i++){
      t=i/K; p=at(t); off=this.thick(t);
      this.verts.push([p[0]+nx*off, p[1]+ny*off]);
    }
    for (i=K;i>=0;i--){
      t=i/K; p=at(t); off=this.thick(t);
      this.verts.push([p[0]-nx*off, p[1]-ny*off]);
    }
    this.bind();
    this.grab=0; this.target=null;
  }
  Rig.prototype.fk=function(angles){
    var out=[], a=this.dir, px=this.base.x, py=this.base.y;
    for (var i=0;i<this.n;i++){
      a += angles[i];
      out.push({ x:px, y:py, a:a });
      px += Math.cos(a)*this.len; py += Math.sin(a)*this.len;
    }
    return out;
  };
  Rig.prototype.bind=function(){
    this.weights=[];
    for (var v=0; v<this.verts.length; v++){
      var p=this.verts[v], w=[], sum=0, j;
      for (j=0;j<this.n;j++){
        var t=this.rest[j], d=Math.hypot(p[0]-t.x, p[1]-t.y);
        var k=1/Math.pow(d+6, P.fall);
        w.push(k); sum+=k;
      }
      for (j=0;j<this.n;j++) w[j]/=sum;
      this.weights.push(w);
    }
  };
  Rig.prototype.skin=function(world){
    var out=[], v, j, p, w, sx, sy, local;
    for (v=0; v<this.verts.length; v++){
      p=this.verts[v]; w=this.weights[v]; sx=0; sy=0;
      for (j=0;j<this.n;j++){
        if (w[j]<0.004) continue;
        local=tUnapply(this.rest[j], p);
        var q=tApply(world[j], local);
        sx+=q[0]*w[j]; sy+=q[1]*w[j];
      }
      out.push([sx,sy]);
    }
    return out;
  };
  Rig.prototype.ik=function(target, world){
    /* cyclic coordinate descent toward the pointer, clamped per joint */
    var it, j, tip, toTip, toTar, ang, lim=0.55;
    for (it=0; it<6; it++){
      world=this.fk(this.angles);
      for (j=this.n-1;j>=1;j--){
        world=this.fk(this.angles);
        tip=world[this.n-1];
        var piv=world[j];
        toTip=Math.atan2(tip.y-piv.y, tip.x-piv.x);
        toTar=Math.atan2(target[1]-piv.y, target[0]-piv.x);
        ang=toTar-toTip;
        while (ang>Math.PI) ang-=6.28318;
        while (ang<-Math.PI) ang+=6.28318;
        this.angles[j]=Math.max(-lim, Math.min(lim, this.angles[j]+ang*0.4));
      }
    }
  };
  Rig.prototype.step=function(time){
    var j;
    if (this.target){
      this.grab=Math.min(1, this.grab+0.12);
      this.ik(this.target);
    } else {
      this.grab=Math.max(0, this.grab-0.03);
      for (j=1;j<this.n;j++){
        var wave=this.curl + Math.sin(time*P.spd + j*this.swim + this.phase) * (P.amp/300) * (j/this.n+0.35);
        this.angles[j]=this.angles[j]*this.grab + wave*(1-this.grab);
      }
    }
    return this.fk(this.angles);
  };
  Rig.prototype.draw=function(world){
    var pts=this.skin(world), i, g;
    x.save();
    g=x.createLinearGradient(world[0].x, world[0].y, world[this.n-1].x, world[this.n-1].y);
    g.addColorStop(0, 'hsla('+this.hue+',85%,62%,.95)');
    g.addColorStop(1, 'hsla('+((this.hue+54)%360)+',90%,58%,.75)');
    x.fillStyle=g;
    x.shadowColor='hsla('+this.hue+',90%,60%,.5)'; x.shadowBlur=26;
    x.beginPath();
    x.moveTo(pts[0][0], pts[0][1]);
    for (i=1;i<pts.length;i++){
      var a=pts[i-1], b=pts[i];
      x.quadraticCurveTo(a[0], a[1], (a[0]+b[0])/2, (a[1]+b[1])/2);
    }
    x.closePath(); x.fill();
    x.shadowBlur=0;
    x.strokeStyle='rgba(8,14,30,.55)'; x.lineWidth=1.6; x.stroke();
    x.restore();
    if (P.weights){
      for (i=0;i<pts.length;i++){
        var w=this.weights[i], best=0, bj=0;
        for (var j=0;j<this.n;j++) if (w[j]>best){ best=w[j]; bj=j; }
        x.fillStyle='hsla('+(bj/this.n*300)+',95%,65%,'+(0.35+best*0.6)+')';
        x.beginPath(); x.arc(pts[i][0], pts[i][1], 3.2, 0, 6.2832); x.fill();
      }
    }
    if (P.bones){
      x.save();
      x.strokeStyle='rgba(255,255,255,.72)'; x.lineWidth=2; x.lineCap='round';
      x.beginPath();
      for (i=0;i<this.n;i++){
        if (i===0) x.moveTo(world[i].x, world[i].y); else x.lineTo(world[i].x, world[i].y);
      }
      x.stroke();
      for (i=0;i<this.n;i++){
        x.fillStyle = i===0 ? '#fbbf24' : '#0b1226';
        x.strokeStyle='rgba(255,255,255,.85)'; x.lineWidth=1.6;
        x.beginPath(); x.arc(world[i].x, world[i].y, i===0?5:3.6, 0, 6.2832); x.fill(); x.stroke();
      }
      x.restore();
    }
  };

  var rigs=[];
  function build(){
    var span=Math.max(150, Math.min(Math.min(W,H)*0.46, W*0.26));
    rigs=[
      /* a tapering body anchored at the sea floor */
      new Rig({ x:W*0.20, y:H*0.86, dir:-Math.PI/2, n:9, len:span/8,
                thick:function(t){ return span*0.135*(1-t*0.72)+3; }, hue:190, phase:0, swim:0.72, curl:0.035 }),
      /* a leaf of kelp, fat in the middle, hanging from the top */
      new Rig({ x:W*0.50, y:H*0.12, dir:Math.PI/2.05, n:12, len:span/11,
                thick:function(t){ return span*0.045+span*0.075*Math.sin(t*3.14159); }, hue:276, phase:1.7, swim:0.52, curl:-0.05 }),
      /* a tentacle that curls */
      new Rig({ x:W*0.80, y:H*0.84, dir:-Math.PI/2.25, n:8, len:span/7,
                thick:function(t){ return span*0.15*(1-t*0.9)+2.5; }, hue:142, phase:3.1, swim:0.98, curl:-0.1 })
    ];
  }
  function resize(){
    dpr=Math.min(2, window.devicePixelRatio||1);
    W=window.innerWidth; H=window.innerHeight;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    x.setTransform(dpr,0,0,dpr,0,0);
    build();
  }
  window.addEventListener('resize', resize);

  var dragging=null;
  function pick(px,py){
    var best=null, bd=1e9;
    for (var i=0;i<rigs.length;i++){
      var w=rigs[i].fk(rigs[i].angles), tip=w[rigs[i].n-1];
      var d=Math.hypot(tip.x-px, tip.y-py);
      if (d<bd){ bd=d; best=rigs[i]; }
    }
    return bd < Math.min(W,H)*0.42 ? best : null;
  }
  cv.addEventListener('pointerdown', function(e){
    dragging=pick(e.clientX, e.clientY);
    if (dragging){ dragging.target=[e.clientX, e.clientY]; cv.setPointerCapture(e.pointerId); }
  });
  cv.addEventListener('pointermove', function(e){
    if (dragging) dragging.target=[e.clientX, e.clientY];
  });
  function release(){ if (dragging){ dragging.target=null; dragging=null; } }
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);

  function bindAll(){ for (var i=0;i<rigs.length;i++) rigs[i].bind(); }
  function slider(id, out, key, after){
    var el=document.getElementById(id), o=document.getElementById(out);
    el.addEventListener('input', function(){ P[key]=+el.value; o.textContent=el.value; if (after) after(); });
  }
  slider('fall','ofall','fall', bindAll);
  slider('amp','oamp','amp');
  slider('spd','ospd','spd');
  document.getElementById('bones').addEventListener('change', function(){ P.bones=this.checked; });
  document.getElementById('weights').addEventListener('change', function(){ P.weights=this.checked; });

  resize();
  var t0=performance.now();
  (function frame(){
    var time=(performance.now()-t0)/1000;
    x.clearRect(0,0,W,H);
    for (var i=0;i<rigs.length;i++){
      var world=rigs[i].step(time);
      rigs[i].draw(world);
    }
    requestAnimationFrame(frame);
  })();
})();
</script>
</body>
</html>
