<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Text Fixes Its Own Punctuation — UI Spotlight</title>
<style>
  :root{ --bg:#0d0708; --ink:#fdeeee; --dim:#b08d93; --accent:#f87171; --line:rgba(248,113,113,.2); }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:radial-gradient(900px 640px at 10% -10%, #2a1114, var(--bg) 62%);
    color:var(--ink); font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden;
  }
  .back-link{
    position:fixed; top:16px; left:16px; z-index:9; display:inline-flex; align-items:center; gap:7px;
    padding:9px 15px; border-radius:999px; border:1px solid var(--line); color:var(--ink);
    background:rgba(24,10,12,.62); backdrop-filter:blur(12px); text-decoration:none; font:600 12.5px/1 system-ui;
  }
  .back-link:hover{border-color:var(--accent); color:var(--accent)}
  .wrap{height:100%; display:grid; grid-template-columns:minmax(0,1fr) 300px}
  .cols{display:grid; grid-template-rows:auto minmax(0,1fr); padding:72px 22px 48px; min-width:0; overflow:hidden}
  .samples{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:14px}
  .samples button{
    border:1px solid var(--line); background:transparent; color:var(--dim); cursor:pointer;
    font:600 11.5px/1 system-ui; padding:8px 12px; border-radius:9px; transition:.16s;
  }
  .samples button[aria-pressed="true"]{background:rgba(248,113,113,.18); border-color:var(--accent); color:var(--ink)}
  .pair{display:grid; grid-template-columns:1fr 1fr; gap:16px; min-height:0}
  .pane{
    border:1px solid var(--line); border-radius:16px; background:rgba(26,12,14,.5);
    display:grid; grid-template-rows:auto minmax(0,1fr); overflow:hidden;
  }
  .pane h2{
    margin:0; padding:10px 14px; font-size:10px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--dim); border-bottom:1px solid var(--line); display:flex; justify-content:space-between;
  }
  .pane h2 em{font-style:normal; color:var(--accent); letter-spacing:0; text-transform:none; font-size:11px}
  textarea, .out{
    margin:0; padding:18px 20px; overflow:auto; border:0; background:transparent; color:var(--ink);
    font:17px/1.72 ui-serif,Georgia,"Times New Roman",serif; resize:none; outline:none;
  }
  textarea{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13.5px; line-height:1.8; color:#e8c9cc}
  .out mark{
    background:rgba(248,113,113,.22); color:#ffe4e6; border-radius:3px; padding:.02em .08em;
    box-shadow:0 0 0 1px rgba(248,113,113,.35);
  }
  .out .nb{background:rgba(250,204,21,.16); border-radius:3px; box-shadow:0 0 0 1px rgba(250,204,21,.3)}
  .panel{
    border-left:1px solid var(--line); background:rgba(18,8,10,.72); backdrop-filter:blur(14px);
    padding:16px 15px 26px; overflow-y:auto;
  }
  .panel h3{margin:0 0 10px; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim)}
  .tgl{display:flex; align-items:center; gap:9px; font-size:12.5px; margin-bottom:9px; cursor:pointer}
  .tgl input{appearance:none; width:34px; height:19px; border-radius:999px; background:var(--line); position:relative; cursor:pointer; transition:.2s; flex:0 0 auto}
  .tgl input::after{content:""; position:absolute; top:2.5px; left:3px; width:14px; height:14px; border-radius:50%; background:var(--dim); transition:.2s}
  .tgl input:checked{background:rgba(248,113,113,.4)}
  .tgl input:checked::after{transform:translateX(14px); background:var(--accent)}
  .tgl span small{display:block; color:var(--dim); font-size:10.5px; line-height:1.4}
  .seg{display:grid; grid-template-columns:repeat(4,1fr); gap:5px; margin-bottom:14px}
  .seg button{
    border:1px solid var(--line); background:transparent; color:var(--dim); cursor:pointer;
    font:600 11px/1 system-ui; padding:8px 2px; border-radius:8px;
  }
  .seg button[aria-pressed="true"]{background:rgba(248,113,113,.2); border-color:var(--accent); color:var(--ink)}
  .count{
    margin-top:12px; padding:10px 12px; border:1px solid var(--line); border-radius:11px;
    font:600 12px/1.4 system-ui; color:var(--dim);
  }
  .count b{color:var(--accent); font-size:17px}
  footer{
    position:fixed; left:0; bottom:0; width:calc(100% - 300px); padding:10px 16px; text-align:center;
    font-size:11px; color:var(--dim); background:linear-gradient(transparent, rgba(10,5,6,.92));
  }
  footer a{color:var(--dim)}
  @media (max-width:900px){
    .wrap{grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1fr) auto}
    .pair{grid-template-columns:1fr}
    .pane:first-child{display:none}
    .panel{border-left:0; border-top:1px solid var(--line); max-height:46vh}
    .cols{padding:64px 13px 12px}
    footer{display:none}
  }
</style>
</head>
<body>
<a href="../" class="back-link">← All 5 drops</a>
<div class="wrap">
  <div class="cols">
    <div class="samples" id="samples">
      <button data-i="0" aria-pressed="true">Review</button>
      <button data-i="1" aria-pressed="false">Spec sheet</button>
      <button data-i="2" aria-pressed="false">Recipe</button>
    </div>
    <div class="pair">
      <div class="pane">
        <h2><span>What you type</span><em>plain ASCII</em></h2>
        <textarea id="src" spellcheck="false"></textarea>
      </div>
      <div class="pane">
        <h2><span>What it sets</span><em id="locName">American</em></h2>
        <div class="out" id="out"></div>
      </div>
    </div>
  </div>
  <aside class="panel">
    <h3>Locale</h3>
    <div class="seg" id="loc">
      <button data-loc="us" aria-pressed="true">US</button>
      <button data-loc="uk" aria-pressed="false">UK</button>
      <button data-loc="de" aria-pressed="false">DE</button>
      <button data-loc="fr" aria-pressed="false">FR</button>
    </div>
    <h3>Passes</h3>
    <div id="passes"></div>
    <div class="count"><b id="n">0</b> glyphs replaced<br><span id="nb2">0</span> non-breaking spaces inserted</div>
  </aside>
</div>
<footer>Inspired by <a href="https://github.com/AlexanderMattTurner/punctilio" target="_blank" rel="noopener">AlexanderMattTurner/punctilio</a> · UI Spotlight Day 164 · Drop #3</footer>
<script>
(function(){
  'use strict';
  var $=function(s){ return document.querySelector(s); };
  var NB=' ';

  var SAMPLES=[
    'The Mornington "Mk II" is 5\'10" of slab aluminium and it weighs 4.2 kg -- about 1/2 a bag of flour.\nIt costs $1,400 (c) 2026, ships 12-18 weeks, and the 2nd batch is already gone...\nDr. Albers says the tolerance is +/- 0.2 mm, which is <= the thickness of a human hair.\nHer verdict: "it\'s the 1st desk lamp I\'ve wanted to own".',
    'Display: 13.6" OLED, 120 Hz, 1600 x 1000 px\nBattery: 72 Wh -- 18 hrs mixed use (tested 20 C, 50 % brightness)\nWeight: 1.24 kg +/- 30 g\nPorts: 2x USB-C, 1x HDMI 2.1, 3.5 mm jack\nWarranty: 3 yrs (c) Nollan Industries (tm)\nThe 3rd revision fixed the hinge -> no more creak.',
    'Preheat to 220 C. Toast 1/4 cup of hazelnuts -- 6-8 min, no longer.\nWhisk 3/4 cup of cream with the zest of 1/2 a lemon...\n"Fold, don\'t stir," my grandmother said. She was right.\nRest 20 min; the 2nd rise is where the flavour is. Serves 4-6.'
  ];

  var LOC={
    us:{ name:'American', dq:['“','”'], sq:['‘','’'], space:'' },
    uk:{ name:'British',  dq:['‘','’'], sq:['“','”'], space:'' },
    de:{ name:'German',   dq:['„','“'], sq:['‚','‘'], space:'' },
    fr:{ name:'French',   dq:['«','»'], sq:['‹','›'], space:NB }
  };

  /* ---- ordered passes, each one seeing the previous one's output ---- */
  var PASSES=[
    { id:'ellipsis', label:'Ellipses', help:'... becomes a single glyph',
      run:function(t){ return t.replace(/\.\.\./g,'…'); } },
    { id:'primes', label:'Primes', help:'5\'10" is feet and inches, not a quote',
      run:function(t){
        return t.replace(/(\d)\s*'/g,'$1′').replace(/(\d)\s*"/g,'$1″');
      } },
    { id:'dashes', label:'Dashes', help:'-- to em, number ranges to en',
      run:function(t){
        return t.replace(/--/g,'—').replace(/(\d)\s*-\s*(\d)/g,'$1–$2');
      } },
    { id:'quotes', label:'Smart quotes', help:'locale-aware, balance tracked',
      run:function(t,L){
        var open=true;
        t=t.replace(/"/g, function(){ open=!open; return open ? L.dq[1]+'' : L.dq[0]; });
        if (L.space){
          t=t.replace(new RegExp('\\'+L.dq[0]+'\\s*','g'), L.dq[0]+NB)
             .replace(new RegExp('\\s*\\'+L.dq[1],'g'), NB+L.dq[1]);
        }
        t=t.replace(/(\w)'(\w)/g,'$1’$2');
        var sOpen=true;
        t=t.replace(/'/g, function(){ sOpen=!sOpen; return sOpen ? L.sq[1] : L.sq[0]; });
        return t;
      } },
    { id:'symbols', label:'Symbols', help:'!= <= >= (c) (tm) -> 5x5',
      run:function(t){
        return t.replace(/!=/g,'≠').replace(/<=/g,'≤').replace(/>=/g,'≥')
                .replace(/\+\/-/g,'±').replace(/->/g,'→')
                .replace(/\(c\)/gi,'©').replace(/\(r\)/gi,'®').replace(/\(tm\)/gi,'™')
                .replace(/(\d)\s*x\s*(\d)/g,'$1×$2');
      } },
    { id:'fractions', label:'Fractions', help:'1/2 1/4 3/4 1/3 2/3',
      run:function(t){
        var map={'1/2':'½','1/4':'¼','3/4':'¾','1/3':'⅓','2/3':'⅔','1/8':'⅛'};
        return t.replace(/\b([123])\/([2348])\b/g, function(m){ return map[m]||m; });
      } },
    { id:'ordinals', label:'Ordinals', help:'1st 2nd 3rd raised',
      run:function(t){
        var sup={st:'ˢᵗ', nd:'ⁿᵈ', rd:'ʳᵈ', th:'ᵗʰ'};
        return t.replace(/\b(\d+)(st|nd|rd|th)\b/g, function(m,d,s){ return d+sup[s]; });
      } },
    { id:'degrees', label:'Degrees', help:'20 C becomes 20 °C',
      run:function(t){ return t.replace(/(\d)\s*(C|F)\b/g,'$1'+NB+'°$2'); } },
    { id:'nbsp', label:'Non-breaking', help:'units, honorifics, and no widows',
      run:function(t){
        t=t.replace(/\b(Mr|Mrs|Ms|Dr|Prof|No|Fig|St)\.\s+/g,'$1.'+NB);
        t=t.replace(/(\d)\s+(kg|g|mm|cm|m|km|Hz|Wh|px|%|min|hrs|hr|yrs|s)\b/g,'$1'+NB+'$2');
        return t.split('\n').map(function(line){
          var i=line.lastIndexOf(' ');
          if (i>0 && line.length-i < 14) return line.slice(0,i)+NB+line.slice(i+1);
          return line;
        }).join('\n');
      } }
  ];

  var on={}, loc='us', sample=0;
  PASSES.forEach(function(p){ on[p.id]=true; });

  function typeset(src){
    var t=src, L=LOC[loc];
    for (var i=0;i<PASSES.length;i++) if (on[PASSES[i].id]) t=PASSES[i].run(t,L);
    return t;
  }

  function esc(s){
    return s.replace(/[&<>]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]; })
            .replace(/\n/g,'<br>');
  }

  /* character-level LCS so every inserted glyph can be highlighted */
  function diffMark(a,b){
    var n=a.length, m=b.length;
    if (n*m > 900000) return { html:esc(b), changed:0 };
    var dp=new Uint16Array((n+1)*(m+1)), i, j;
    for (i=n-1;i>=0;i--){
      for (j=m-1;j>=0;j--){
        dp[i*(m+1)+j] = (a[i]===b[j])
          ? dp[(i+1)*(m+1)+j+1]+1
          : Math.max(dp[(i+1)*(m+1)+j], dp[i*(m+1)+j+1]);
      }
    }
    var out='', run='', changed=0;
    i=0; j=0;
    function flush(){
      if (!run) return;
      changed+=run.length;
      out+='<mark>'+esc(run)+'</mark>';
      run='';
    }
    while (i<n && j<m){
      if (a[i]===b[j]){ flush(); out+=esc(b[j]); i++; j++; }
      else if (dp[(i+1)*(m+1)+j] >= dp[i*(m+1)+j+1]) i++;
      else { run+=b[j]; j++; }
    }
    run+=b.slice(j); flush();
    return { html:out, changed:changed };
  }

  function render(){
    var src=$('#src').value, out=typeset(src);
    var d=diffMark(src,out);
    var html=d.html.replace(/ /g,'<span class="nb"> </span>');
    $('#out').innerHTML=html;
    $('#n').textContent=d.changed;
    $('#nb2').textContent=(out.match(/ /g)||[]).length;
    $('#locName').textContent=LOC[loc].name;
  }

  var box=$('#passes');
  PASSES.forEach(function(p){
    var l=document.createElement('label');
    l.className='tgl';
    l.innerHTML='<input type="checkbox" checked data-id="'+p.id+'"><span>'+p.label+'<small>'+p.help+'</small></span>';
    box.appendChild(l);
  });
  box.addEventListener('change', function(e){
    var el=e.target; if (!el.dataset.id) return;
    on[el.dataset.id]=el.checked; render();
  });
  $('#loc').addEventListener('click', function(e){
    var b=e.target.closest('button'); if (!b) return;
    loc=b.dataset.loc;
    var btns=this.children;
    for (var i=0;i<btns.length;i++) btns[i].setAttribute('aria-pressed', String(btns[i]===b));
    render();
  });
  $('#samples').addEventListener('click', function(e){
    var b=e.target.closest('button'); if (!b) return;
    sample=+b.dataset.i;
    var btns=this.children;
    for (var i=0;i<btns.length;i++) btns[i].setAttribute('aria-pressed', String(btns[i]===b));
    $('#src').value=SAMPLES[sample];
    render();
  });
  $('#src').addEventListener('input', render);

  $('#src').value=SAMPLES[0];
  render();
  window.__drop3={ typeset:typeset, render:render, passes:PASSES };
})();
</script>
</body>
</html>
