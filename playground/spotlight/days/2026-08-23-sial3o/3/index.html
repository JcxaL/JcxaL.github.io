<title>Text Reveal Trio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{ --bg:#0c0708; --line:#331f22; --text:#f7eaec; --dim:#a98a90; --accent:#f87171; }
  *{box-sizing:border-box;}
  html,body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;}
  body{ background: radial-gradient(900px 500px at 85% 0%, #26131a 0%, transparent 55%), var(--bg); }

  .back-link{
    position:fixed; top:14px; left:14px; z-index:40; text-decoration:none; color:var(--text);
    font-size:.78rem; padding:8px 14px; border-radius:20px; background:#1a0f11cc; border:1px solid var(--line);
    backdrop-filter:blur(8px);
  }
  .panel{
    position:fixed; top:14px; right:14px; z-index:40; width:200px; background:#1a0f11ee; border:1px solid var(--line);
    border-radius:14px; padding:12px 14px; font-size:.72rem; backdrop-filter:blur(10px);
  }
  .panel h4{margin:0 0 8px; font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; color:var(--dim);}
  .panel label{display:block; margin-top:8px; color:var(--dim);}
  .panel .row{display:flex; justify-content:space-between; color:var(--text);}
  .panel input[type=range]{width:100%; accent-color:var(--accent);}

  main{max-width:760px; margin:0 auto; padding:90px 24px 60px;}
  .eyebrow{font-size:.72rem; text-transform:uppercase; letter-spacing:.14em; color:var(--accent); margin-bottom:6px;}
  h1{font-size:clamp(1.6rem,4vw,2.2rem); margin:0 0 40px; font-weight:800;}

  .demo{ margin-bottom:56px; padding-bottom:44px; border-bottom:1px solid var(--line); }
  .demo:last-child{ border-bottom:none; }
  .demo-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
  .demo-head h2{ margin:0; font-size:.95rem; color:var(--dim); font-weight:600; letter-spacing:.02em; text-transform:uppercase; }
  .replay{
    border:1px solid var(--line); background:#1a0f11; color:var(--text); border-radius:20px; padding:7px 14px;
    font-size:.74rem; cursor:pointer;
  }
  .replay:active{ transform:scale(.96); }

  .headline{ font-size:clamp(1.7rem,5.2vw,3rem); font-weight:800; line-height:1.15; letter-spacing:-.01em; }

  /* build */
  .char{ display:inline-block; opacity:0; transform:translateY(.5em) rotate(4deg); filter:blur(6px);
    transition:opacity .5s ease, transform .5s cubic-bezier(.2,.9,.2,1.3), filter .5s ease; }
  .char.in{ opacity:1; transform:translateY(0) rotate(0); filter:blur(0); }

  /* swell */
  .word{ display:inline-block; opacity:0; transform:scale(.6); transition:opacity .45s ease, transform .5s cubic-bezier(.34,1.56,.64,1); margin-right:.28em; }
  .word.in{ opacity:1; transform:scale(1); }

  /* highlight sweep */
  .hl-wrap{ position:relative; display:inline-block; }
  .hl-base{ color:#4a3438; }
  .hl-fill{
    position:absolute; inset:0; color:var(--accent); overflow:hidden; width:0%;
    transition:width 1.4s cubic-bezier(.16,.9,.2,1); white-space:nowrap;
  }

  footer{text-align:center; padding:26px; font-size:.68rem; color:var(--dim);}
  footer a{color:var(--accent); text-decoration:none;}
</style>

<a href="../" class="back-link">← All 5 drops</a>

<div class="panel">
  <h4>Tune the effect</h4>
  <label>Stagger <span class="row"><span></span><b id="staggerVal">28ms</b></span></label>
  <input type="range" id="staggerSlider" min="6" max="80" value="28">
  <label>Speed multiplier <span class="row"><span></span><b id="speedVal">1.0×</b></span></label>
  <input type="range" id="speedSlider" min="50" max="200" value="100">
</div>

<main>
  <div class="eyebrow">Drop #3 · Typography</div>
  <h1>Three ways to reveal a headline</h1>

  <div class="demo">
    <div class="demo-head"><h2>Build — per-character</h2><button class="replay" data-target="build">↻ Replay</button></div>
    <div class="headline" id="build" data-text="Every letter arrives on its own."></div>
  </div>

  <div class="demo">
    <div class="demo-head"><h2>Swell — per-word bounce</h2><button class="replay" data-target="swell">↻ Replay</button></div>
    <div class="headline" id="swell" data-text="Words land with a soft overshoot."></div>
  </div>

  <div class="demo">
    <div class="demo-head"><h2>Highlight — sweeping wipe</h2><button class="replay" data-target="highlight">↻ Replay</button></div>
    <div class="headline hl-wrap" id="highlight" data-text="Color sweeps across like a spotlight.">
      <span class="hl-base"></span><span class="hl-fill"></span>
    </div>
  </div>
</main>

<footer>Inspired by <a href="https://github.com/snapcndev/snapcn" target="_blank" rel="noopener">snapcn — text-build / text-swell / text-highlight</a> · UI Spotlight Day 98 · Drop #3</footer>

<script>
(function(){
  "use strict";
  var staggerSlider = document.getElementById('staggerSlider');
  var speedSlider = document.getElementById('speedSlider');
  var staggerVal = document.getElementById('staggerVal');
  var speedVal = document.getElementById('speedVal');
  var stagger = parseInt(staggerSlider.value, 10);
  var speed = parseInt(speedSlider.value, 10) / 100;

  staggerSlider.addEventListener('input', function(){ stagger = parseInt(this.value, 10); staggerVal.textContent = stagger + 'ms'; });
  speedSlider.addEventListener('input', function(){ speed = parseInt(this.value, 10) / 100; speedVal.textContent = speed.toFixed(1) + '×'; });

  function buildChars(el){
    var text = el.getAttribute('data-text');
    el.innerHTML = '';
    text.split('').forEach(function(ch){
      var span = document.createElement('span');
      span.className = 'char';
      span.textContent = ch === ' ' ? ' ' : ch;
      el.appendChild(span);
    });
  }
  function playBuild(el){
    buildChars(el);
    var spans = el.querySelectorAll('.char');
    spans.forEach(function(s, i){
      s.style.transitionDuration = (500 / speed) + 'ms';
      setTimeout(function(){ s.classList.add('in'); }, i * stagger / speed);
    });
  }

  function buildWords(el){
    var text = el.getAttribute('data-text');
    el.innerHTML = '';
    text.split(' ').forEach(function(w){
      var span = document.createElement('span');
      span.className = 'word';
      span.textContent = w;
      el.appendChild(span);
    });
  }
  function playSwell(el){
    buildWords(el);
    var spans = el.querySelectorAll('.word');
    spans.forEach(function(s, i){
      s.style.transitionDuration = (500 / speed) + 'ms';
      setTimeout(function(){ s.classList.add('in'); }, i * (stagger * 4) / speed);
    });
  }

  function buildHighlight(el){
    var text = el.getAttribute('data-text');
    var base = el.querySelector('.hl-base');
    var fill = el.querySelector('.hl-fill');
    base.textContent = text;
    fill.textContent = text;
    fill.style.width = '0%';
  }
  function playHighlight(el){
    buildHighlight(el);
    var fill = el.querySelector('.hl-fill');
    fill.style.transitionDuration = (1400 / speed) + 'ms';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ fill.style.width = '100%'; });
    });
  }

  var demos = {
    build: { el: document.getElementById('build'), play: playBuild },
    swell: { el: document.getElementById('swell'), play: playSwell },
    highlight: { el: document.getElementById('highlight'), play: playHighlight }
  };

  Object.keys(demos).forEach(function(key){ demos[key].play(demos[key].el); });

  Array.prototype.forEach.call(document.querySelectorAll('.replay'), function(btn){
    btn.addEventListener('click', function(){
      var key = btn.getAttribute('data-target');
      demos[key].play(demos[key].el);
    });
  });

  // replay when scrolled into view again
  if ('IntersectionObserver' in window){
    var seen = {};
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        var id = entry.target.id;
        if (entry.isIntersecting && seen[id]){ demos[id].play(demos[id].el); }
        seen[id] = true;
      });
    }, { threshold: 0.6 });
    Object.keys(demos).forEach(function(key){ io.observe(demos[key].el); });
  }
})();
</script>
