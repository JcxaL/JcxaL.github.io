<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Meteor Shower — Animation Spotlight</title>
<style>
  :root{ --amber:#38bdf8; }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%; background:#04060d; overflow:hidden; font-family:system-ui,-apple-system,sans-serif;}
  #stage{position:fixed; inset:0;}
  canvas{position:absolute; inset:0; width:100%; height:100%;}
  .back-link{
    position:fixed; top:14px; left:14px; z-index:20; text-decoration:none; color:#eaf1ff;
    background:rgba(20,26,42,0.7); backdrop-filter:blur(10px); border:1px solid rgba(120,160,255,0.22);
    padding:8px 14px; border-radius:999px; font-size:12.5px; font-weight:600;
  }
  .back-link:hover{background:rgba(40,52,80,0.85);}
  #panel{
    position:fixed; top:14px; right:14px; z-index:20; background:rgba(20,26,42,0.72); backdrop-filter:blur(12px);
    border:1px solid rgba(120,160,255,0.22); border-radius:14px; padding:14px 16px; color:#eaf1ff; width:200px;
    font-size:12px;
  }
  #panel h3{margin:0 0 10px; font-size:12px; letter-spacing:0.4px; color:#9db3e0; text-transform:uppercase;}
  #panel label{display:flex; justify-content:space-between; margin:8px 0 3px;}
  #panel input[type=range]{width:100%; accent-color:var(--amber);}
  #hero{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; z-index:10; pointer-events:none;
  }
  #hero h1{
    font-size:clamp(28px,7vw,64px); margin:0; color:#fff; letter-spacing:-1px;
    text-shadow:0 0 30px rgba(56,189,248,0.5);
  }
  #hero p{color:#9db3e0; margin-top:10px; font-size:14px;}
  footer{
    position:fixed; bottom:10px; left:50%; transform:translateX(-50%); z-index:20; color:#5c6b8c;
    font-size:10.5px; text-align:center;
  }
  footer a{color:#7dd3fc;}
  @media(max-width:640px){ #panel{display:none;} }
</style>
</head>
<body>
<a href="../" class="back-link">← All 5 drops</a>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="hero">
    <h1>Meteor Shower</h1>
    <p>Move your cursor — meteors trail toward it. Tap to burst a shower.</p>
  </div>
</div>
<div id="panel">
  <h3>Tune</h3>
  <label>Rate <span id="rateVal">6</span></label>
  <input type="range" id="rate" min="1" max="20" value="6">
  <label>Speed <span id="speedVal">7</span></label>
  <input type="range" id="speed" min="2" max="16" value="7">
  <label>Tail length <span id="tailVal">14</span></label>
  <input type="range" id="tail" min="4" max="30" value="14">
</div>
<footer>Inspired by ui.aceternity.com "Meteor Effect" &amp; "Shooting Stars" · UI Spotlight Day 71 · Drop #1</footer>
<script>
(function(){
  "use strict";
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio||1, 2);
  var W=0,H=0;
  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  var stars = [];
  for (var i=0;i<140;i++){
    stars.push({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.4+0.2, tw:Math.random()*Math.PI*2});
  }

  var meteors = [];
  var rate = 6, speed = 7, tailLen = 14;
  document.getElementById('rate').addEventListener('input', function(e){ rate=+e.target.value; document.getElementById('rateVal').textContent=rate; });
  document.getElementById('speed').addEventListener('input', function(e){ speed=+e.target.value; document.getElementById('speedVal').textContent=speed; });
  document.getElementById('tail').addEventListener('input', function(e){ tailLen=+e.target.value; document.getElementById('tailVal').textContent=tailLen; });

  var mouse = {x: W*0.7, y: H*0.3, active:false};
  window.addEventListener('pointermove', function(e){ mouse.x=e.clientX; mouse.y=e.clientY; mouse.active=true; });

  function spawnMeteor(burstX, burstY){
    var fromEdge = Math.random() < 0.5;
    var sx, sy;
    if (burstX !== undefined){ sx = burstX + (Math.random()-0.5)*60; sy = burstY + (Math.random()-0.5)*60; }
    else { sx = Math.random()*W*1.3 - W*0.15; sy = -20 - Math.random()*80; }
    var targetX = mouse.active && Math.random()<0.6 ? mouse.x : sx + (Math.random()*300-60);
    var targetY = mouse.active && Math.random()<0.6 ? mouse.y : H + 60;
    var ang = Math.atan2(targetY-sy, targetX-sx);
    meteors.push({
      x:sx, y:sy,
      vx: Math.cos(ang)*(speed+Math.random()*2),
      vy: Math.sin(ang)*(speed+Math.random()*2),
      trail: [], life: 1, hue: 195 + Math.random()*40
    });
  }

  canvas.addEventListener('pointerdown', function(e){
    for (var i=0;i<14;i++) spawnMeteor(e.clientX, e.clientY);
  });

  var spawnAccum = 0;
  function step(dt){
    ctx.clearRect(0,0,W,H);
    // starfield
    for (var i=0;i<stars.length;i++){
      var s = stars[i];
      s.tw += 0.02;
      var a = 0.4 + Math.sin(s.tw)*0.3;
      ctx.fillStyle = 'rgba(200,220,255,'+Math.max(0,a)+')';
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
    }

    spawnAccum += dt * (rate/60);
    while (spawnAccum >= 1){ spawnMeteor(); spawnAccum -= 1; }

    for (var m=meteors.length-1;m>=0;m--){
      var t = meteors[m];
      t.x += t.vx; t.y += t.vy;
      t.trail.push([t.x,t.y]);
      if (t.trail.length > tailLen) t.trail.shift();
      if (t.x < -100 || t.x > W+100 || t.y > H+100){
        meteors.splice(m,1); continue;
      }
      for (var k=0;k<t.trail.length;k++){
        var p = t.trail[k];
        var alpha = (k/t.trail.length) * 0.9;
        var r = 2.6 * (k/t.trail.length);
        var grad = ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],r*3);
        grad.addColorStop(0, 'hsla('+t.hue+',95%,75%,'+alpha+')');
        grad.addColorStop(1, 'hsla('+t.hue+',95%,75%,0)');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(p[0],p[1],r*3,0,Math.PI*2); ctx.fill();
      }
      var head = t.trail[t.trail.length-1];
      if (head){
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(head[0],head[1],2.2,0,Math.PI*2); ctx.fill();
      }
    }
  }

  var last = performance.now();
  function loop(now){
    var dt = Math.min(40, now-last); last = now;
    step(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
