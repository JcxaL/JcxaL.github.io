<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Glass, Taken Apart — UI Spotlight Day 155</title>
<meta name="description" content="Three floating glass surfaces with every layer on a switch: lift, rim refraction with dispersion, tint, rim light — and ink that reads the wallpaper behind it and flips itself.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#eaf2ff;--dim:#9fb3cd;--acc:#34d399}
html,body{height:100%}
body{background:#05070d;color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overflow:hidden;-webkit-text-size-adjust:100%}
#wall{position:fixed;inset:0;width:100%;height:100%;display:block}
.surf{position:fixed;z-index:3;border-radius:22px;overflow:hidden;cursor:grab;touch-action:none;
  display:flex;align-items:center;gap:12px;padding:0 16px;user-select:none;
  transition:box-shadow .2s}
.surf.shadow{box-shadow:0 22px 50px -18px rgba(0,0,0,.62),0 6px 16px -8px rgba(0,0,0,.5)}
.surf:active{cursor:grabbing}
.surf canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.surf .c{position:relative;display:flex;align-items:center;gap:12px;width:100%;pointer-events:none}
#s1{left:60px;top:120px;width:380px;height:62px}
#s2{left:60px;top:220px;width:300px;height:132px;padding:16px;align-items:flex-start}
#s3{left:60px;top:390px;width:330px;height:66px;justify-content:center}
.ic{width:26px;height:26px;border-radius:8px;flex:0 0 auto;
  background:linear-gradient(145deg,rgba(255,255,255,.5),rgba(255,255,255,.12));
  border:1px solid rgba(255,255,255,.3)}
.q{font-size:14.5px;font-weight:600;opacity:.92}
.kbd{margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.6px;padding:3px 7px;border-radius:7px;
  border:1px solid currentColor;opacity:.55}
#s2 .c{flex-direction:column;align-items:flex-start;gap:4px}
.t1{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;opacity:.6;font-weight:700}
.t2{font-size:19px;font-weight:800;letter-spacing:-.4px}
.t3{font-size:12px;opacity:.72}
.bar{margin-top:10px;width:100%;height:4px;border-radius:99px;background:rgba(255,255,255,.26);position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;width:38%;border-radius:99px;background:currentColor;opacity:.85}
.dock{display:flex;gap:12px}
.dock b{width:34px;height:34px;border-radius:11px;display:block;
  background:linear-gradient(150deg,rgba(255,255,255,.55),rgba(255,255,255,.14));
  border:1px solid rgba(255,255,255,.3)}
.back-link{position:fixed;left:14px;top:14px;z-index:9;display:inline-flex;align-items:center;gap:6px;
  font-size:12.5px;font-weight:600;text-decoration:none;color:#e9eff8;padding:8px 13px;border-radius:999px;
  background:rgba(10,15,24,.7);border:1px solid #243246;backdrop-filter:blur(10px);transition:border-color .18s,transform .18s}
.back-link:hover{border-color:var(--acc);transform:translateX(-2px)}
.panel{position:fixed;right:14px;top:14px;z-index:9;width:232px;padding:13px;border-radius:16px;color:#e9eff8;
  background:rgba(8,13,21,.8);border:1px solid #233349;backdrop-filter:blur(14px);box-shadow:0 20px 50px -26px #000;
  max-height:calc(100dvh - 28px);overflow:auto}
.panel h2{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);margin:0 0 9px;font-weight:700}
.panel h2+h2{margin-top:12px}
.lay{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#c6d6ea;padding:5px 7px;border-radius:9px;
  border:1px solid #1d2a3c;background:#0b1522;margin-bottom:5px;cursor:pointer}
.lay input{accent-color:var(--acc);cursor:pointer}
.lay span{flex:1 1 auto}
.lay em{font-style:normal;font-size:9.5px;color:#5f7490}
.sl{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim);margin-bottom:7px}
.sl input{flex:1 1 0;min-width:0;accent-color:var(--acc)}
.sl b{color:#e9eff8;min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.rowb{display:flex;gap:5px;margin-bottom:9px;flex-wrap:wrap}
.rowb button{flex:1 1 0;font:inherit;font-size:11px;font-weight:700;color:var(--dim);background:#0e1724;
  border:1px solid #1f2b3d;border-radius:8px;padding:6px 4px;cursor:pointer;transition:.15s;white-space:nowrap}
.rowb button.on{color:#02160f;background:linear-gradient(180deg,#6ee7b7,#34d399);border-color:#6ee7b7}
.go{width:100%;font:inherit;font-size:12px;font-weight:700;color:#02160f;cursor:pointer;
  background:linear-gradient(180deg,#6ee7b7,#34d399);border:1px solid #6ee7b7;border-radius:9px;padding:8px}
.code{margin-top:9px;font:500 10px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#8fb6a8;
  background:#081219;border:1px solid #16303a;border-radius:9px;padding:8px;white-space:pre-wrap;word-break:break-all;max-height:122px;overflow:auto}
footer{position:fixed;left:0;right:0;bottom:0;z-index:9;text-align:center;font-size:10.5px;color:#7d8ea3;
  padding:9px;background:linear-gradient(180deg,transparent,rgba(5,7,13,.8))}
footer a{color:#9ab0c6}
@media (max-width:760px){
  .panel{right:6px;top:auto;bottom:34px;width:188px;padding:10px;max-height:62dvh}
  .back-link{left:8px;top:8px}
  #s1{left:14px;top:92px;width:min(330px,72vw)}
  #s2{left:14px;top:176px;width:min(260px,62vw)}
  #s3{left:14px;top:330px;width:min(270px,66vw)}
}
</style>
</head>
<body>
<a href="../" class="back-link">← All 5 drops</a>
<canvas id="wall"></canvas>

<div class="surf shadow" id="s1"><canvas></canvas><div class="c">
  <i class="ic"></i><span class="q">search anything</span><span class="kbd">⌘K</span></div></div>

<div class="surf shadow" id="s2"><canvas></canvas><div class="c">
  <span class="t1">now playing</span><span class="t2">Pale Blue Hour</span><span class="t3">Mara Linden · Shorelines</span>
  <span class="bar"><i></i></span></div></div>

<div class="surf shadow" id="s3"><canvas></canvas><div class="c" style="justify-content:center">
  <span class="dock"><b></b><b></b><b></b><b></b></span></div></div>

<div class="panel">
  <h2>Material layers</h2>
  <label class="lay"><input type="checkbox" id="L0" checked><span>shadow</span><em>box-shadow</em></label>
  <label class="lay"><input type="checkbox" id="L1" checked><span>blur &amp; lift</span><em>backdrop</em></label>
  <label class="lay"><input type="checkbox" id="L2" checked><span>rim refraction</span><em>lens</em></label>
  <label class="lay"><input type="checkbox" id="L3" checked><span>dispersion</span><em>R≠B</em></label>
  <label class="lay"><input type="checkbox" id="L4" checked><span>tint</span><em>rgba</em></label>
  <label class="lay"><input type="checkbox" id="L5" checked><span>rim light</span><em>gradient</em></label>
  <h2>Tuning</h2>
  <label class="sl">blur <input id="pB" type="range" min="0" max="18" step="1" value="7"><b id="vB">7px</b></label>
  <label class="sl">rim <input id="pR" type="range" min="0" max="40" step="1" value="22"><b id="vR">22px</b></label>
  <label class="sl">bend <input id="pS" type="range" min="0" max="30" step="1" value="14"><b id="vS">14%</b></label>
  <label class="sl">tint <input id="pT" type="range" min="0" max="60" step="1" value="18"><b id="vT">.18</b></label>
  <h2>Ink</h2>
  <div class="rowb" id="ink"><button data-i="auto" class="on">auto</button><button data-i="light">light</button><button data-i="dark">dark</button></div>
  <h2>Wallpaper</h2>
  <div class="rowb" id="wp"><button data-w="0" class="on">dawn</button><button data-w="1">aurora</button><button data-w="2">paper</button><button data-w="3">ink</button></div>
  <button class="go" id="copy">Copy the CSS</button>
  <div class="code" id="css"></div>
</div>
<footer>Inspired by <a href="https://github.com/kubai087/glasswork" target="_blank" rel="noopener">kubai087/glasswork</a> · UI Spotlight Day 155 · Drop #2</footer>
<script>
(function(){
"use strict";
var wall = document.getElementById("wall"), wg = wall.getContext("2d");
var blur = document.createElement("canvas"), bg = blur.getContext("2d");
var W = 0, H = 0, dpr = 1, wp = 0, t0 = performance.now();
var P = { blur:7, rim:22, bend:14, tint:18, ink:"auto" };
var L = [true, true, true, true, true, true];
var surfs = [].slice.call(document.querySelectorAll(".surf")).map(function(el){
  return { el: el, cv: el.querySelector("canvas"), g: el.querySelector("canvas").getContext("2d"), dark: false };
});

/* ── wallpapers ───────────────────────────────────────────────── */
function paintWall(now){
  var t = (now - t0) / 1000;
  wg.setTransform(1, 0, 0, 1, 0, 0);
  wg.clearRect(0, 0, wall.width, wall.height);
  wg.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (wp === 0){
    var g = wg.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, "#ff9a6b"); g.addColorStop(.38, "#e05f8f"); g.addColorStop(.72, "#6442b8"); g.addColorStop(1, "#15224f");
    wg.fillStyle = g; wg.fillRect(0, 0, W, H);
    blobs(t, ["rgba(255,214,150,.55)", "rgba(120,80,220,.45)", "rgba(255,120,160,.4)"]);
  } else if (wp === 1){
    wg.fillStyle = "#040a14"; wg.fillRect(0, 0, W, H);
    blobs(t, ["rgba(52,211,153,.55)", "rgba(56,189,248,.45)", "rgba(167,139,250,.42)"], 1.6);
  } else if (wp === 2){
    var g2 = wg.createLinearGradient(0, 0, 0, H);
    g2.addColorStop(0, "#f6f2ea"); g2.addColorStop(1, "#ded5c6");
    wg.fillStyle = g2; wg.fillRect(0, 0, W, H);
    blobs(t, ["rgba(255,255,255,.75)", "rgba(203,188,164,.5)", "rgba(240,230,210,.6)"], .8);
  } else {
    wg.fillStyle = "#070910"; wg.fillRect(0, 0, W, H);
    wg.strokeStyle = "rgba(120,150,200,.16)"; wg.lineWidth = 1;
    for (var i = 0; i < 26; i++){
      wg.beginPath();
      for (var x = 0; x <= W; x += 18){
        var y = i * (H / 24) + Math.sin(x / 150 + t * .5 + i * .4) * 14;
        x === 0 ? wg.moveTo(x, y) : wg.lineTo(x, y);
      }
      wg.stroke();
    }
    blobs(t, ["rgba(56,189,248,.22)", "rgba(167,139,250,.2)", "rgba(52,211,153,.16)"], 1.2);
  }
  // blurred copy used as the backdrop source
  bg.setTransform(1, 0, 0, 1, 0, 0);
  bg.clearRect(0, 0, blur.width, blur.height);
  bg.filter = "blur(" + (P.blur * .5) + "px) saturate(1.7) brightness(1.08)";
  bg.drawImage(wall, 0, 0, blur.width, blur.height);
  bg.filter = "none";
}
function blobs(t, cols, amp){
  amp = amp || 1;
  cols.forEach(function(c, i){
    var x = W * (.3 + .3 * Math.sin(t * (.17 + i * .07) + i * 2.1)) + i * W * .14;
    var y = H * (.42 + .32 * Math.cos(t * (.13 + i * .05) + i * 1.3));
    var r = Math.max(W, H) * (.3 + .09 * Math.sin(t * .2 + i)) * amp;
    var g = wg.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, c); g.addColorStop(1, "rgba(0,0,0,0)");
    wg.fillStyle = g; wg.fillRect(0, 0, W, H);
  });
}
/* ── the glass material, layer by layer ───────────────────────── */
function rr(g, x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function paintSurface(s){
  var r = s.el.getBoundingClientRect(), g = s.g, cw = r.width, ch = r.height, rad = 22;
  if (s.cv.width !== Math.round(cw * dpr) || s.cv.height !== Math.round(ch * dpr)){
    s.cv.width = Math.round(cw * dpr); s.cv.height = Math.round(ch * dpr);
  }
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, cw, ch);
  g.save();
  rr(g, 0, 0, cw, ch, rad); g.clip();

  var sx = r.left, sy = r.top;                       // where to sample the wallpaper
  var src = L[1] ? blur : wall;                      // "blur & lift" off → sample the sharp wallpaper
  var k = L[1] ? (blur.width / (W * dpr)) : 1;       // blurred copy is half-size
  function drawBack(scale, dx, dy, alpha, comp){
    g.save();
    if (comp) g.globalCompositeOperation = comp;
    g.globalAlpha = alpha;
    var w2 = cw * scale, h2 = ch * scale;
    g.drawImage(src,
      (sx - (w2 - cw) / 2 + dx) * dpr * k, (sy - (h2 - ch) / 2 + dy) * dpr * k,
      w2 * dpr * k, h2 * dpr * k,
      0, 0, cw, ch);
    g.restore();
  }
  drawBack(1, 0, 0, 1);                              // 1 · the lifted backdrop

  if (L[2] && P.bend > 0){                           // 2 · rim refraction: a ring that samples wider
    var bend = 1 + P.bend / 100;
    g.save();
    g.beginPath();
    rr(g, 0, 0, cw, ch, rad);
    rr(g, P.rim, P.rim, Math.max(2, cw - P.rim * 2), Math.max(2, ch - P.rim * 2), Math.max(2, rad - P.rim));
    g.clip("evenodd");
    if (L[3]){                                       // 3 · dispersion: red bends further than blue
      g.globalCompositeOperation = "source-over";
      drawBack(bend * 1.012, 0, 0, 1);
      g.globalCompositeOperation = "lighter";
      g.filter = "saturate(2.2) hue-rotate(-8deg)";
      drawBack(bend * 1.03, -1.1, 0, .16);
      g.filter = "saturate(2.2) hue-rotate(10deg)";
      drawBack(bend * .995, 1.1, 0, .16);
      g.filter = "none";
    } else {
      drawBack(bend, 0, 0, 1);
    }
    g.restore();
    // the inner edge of the lens reads as thickness
    g.save();
    rr(g, .5, .5, cw - 1, ch - 1, rad); g.clip();
    var lg = g.createLinearGradient(0, 0, 0, ch);
    lg.addColorStop(0, "rgba(255,255,255,.1)"); lg.addColorStop(.5, "rgba(255,255,255,0)");
    lg.addColorStop(1, "rgba(255,255,255,.07)");
    g.fillStyle = lg; g.fillRect(0, 0, cw, ch);
    g.restore();
  }
  var lum = sample(sx, sy, cw, ch);
  s.dark = P.ink === "auto" ? lum < .5 : P.ink === "dark";
  if (L[4]){                                         // 4 · tint, denser over busy wallpaper
    g.fillStyle = (s.dark ? "rgba(8,14,24," : "rgba(255,255,255,") + (P.tint / 100).toFixed(3) + ")";
    g.fillRect(0, 0, cw, ch);
  }
  if (L[5]){                                         // 5 · rim light top-left and bottom-right
    g.lineWidth = 1.4;
    var a = g.createLinearGradient(0, 0, cw * .6, ch);
    a.addColorStop(0, "rgba(255,255,255,.85)"); a.addColorStop(.35, "rgba(255,255,255,.08)");
    a.addColorStop(.75, "rgba(255,255,255,.05)"); a.addColorStop(1, "rgba(255,255,255,.5)");
    g.strokeStyle = a;
    rr(g, .9, .9, cw - 1.8, ch - 1.8, rad - .9); g.stroke();
    g.lineWidth = 3;
    g.strokeStyle = "rgba(255,255,255,.07)";
    rr(g, 2.5, 2.5, cw - 5, ch - 5, rad - 2.5); g.stroke();
  }
  g.restore();
  s.el.classList.toggle("shadow", L[0]);
  s.el.style.color = s.dark ? "#eef5ff" : "#101722";
}
var probe = document.createElement("canvas"), pg = probe.getContext("2d", { willReadFrequently:true });
probe.width = 5; probe.height = 3;
function sample(x, y, w, h){                         // 15 points of the wallpaper behind the surface
  pg.clearRect(0, 0, 5, 3);
  pg.drawImage(wall, x * dpr, y * dpr, Math.max(1, w * dpr), Math.max(1, h * dpr), 0, 0, 5, 3);
  var d = pg.getImageData(0, 0, 5, 3).data, sum = 0;
  for (var i = 0; i < d.length; i += 4) sum += (.2126 * d[i] + .7152 * d[i+1] + .0722 * d[i+2]) / 255;
  return sum / 15;
}
/* ── drag ─────────────────────────────────────────────────────── */
surfs.forEach(function(s){
  var d = null;
  s.el.addEventListener("pointerdown", function(e){
    var r = s.el.getBoundingClientRect();
    d = { dx: e.clientX - r.left, dy: e.clientY - r.top };
    s.el.setPointerCapture(e.pointerId);
    s.el.style.zIndex = 4;
  });
  s.el.addEventListener("pointermove", function(e){
    if (!d) return;
    var w = s.el.offsetWidth, h = s.el.offsetHeight;
    s.el.style.left = Math.max(4, Math.min(W - w - 4, e.clientX - d.dx)) + "px";
    s.el.style.top  = Math.max(4, Math.min(H - h - 4, e.clientY - d.dy)) + "px";
  });
  ["pointerup", "pointercancel"].forEach(function(ev){
    s.el.addEventListener(ev, function(){ d = null; s.el.style.zIndex = 3; });
  });
});
/* ── controls ─────────────────────────────────────────────────── */
for (var i = 0; i < 6; i++) (function(i){
  document.getElementById("L" + i).addEventListener("change", function(e){ L[i] = e.target.checked; writeCSS(); });
})(i);
function slider(id, key, fmt){
  var el = document.getElementById(id), out = document.getElementById("v" + id.slice(1));
  el.addEventListener("input", function(){ P[key] = +el.value; out.textContent = fmt(P[key]); writeCSS(); });
}
slider("pB", "blur", function(v){ return v + "px"; });
slider("pR", "rim",  function(v){ return v + "px"; });
slider("pS", "bend", function(v){ return v + "%"; });
slider("pT", "tint", function(v){ return "." + String(v).padStart(2, "0"); });
document.getElementById("ink").addEventListener("click", function(e){
  var b = e.target.closest("button"); if (!b) return;
  P.ink = b.dataset.i;
  this.querySelectorAll("button").forEach(function(x){ x.classList.toggle("on", x === b); });
  writeCSS();
});
document.getElementById("wp").addEventListener("click", function(e){
  var b = e.target.closest("button"); if (!b) return;
  wp = +b.dataset.w;
  this.querySelectorAll("button").forEach(function(x){ x.classList.toggle("on", x === b); });
});
function writeCSS(){
  var dark = surfs[0] && surfs[0].dark;
  var css =
".glass {\n" +
"  background: " + (dark ? "rgba(8,14,24," : "rgba(255,255,255,") + (L[4] ? (P.tint / 100).toFixed(2) : "0") + ");\n" +
"  backdrop-filter: blur(" + (L[1] ? P.blur : 0) + "px) saturate(170%) brightness(" + (dark ? "88%" : "108%") + ")" +
   (L[2] ? " var(--glass-lens,/* rim lens */)" : "") + ";\n" +
"  box-shadow: " + (L[0] ? "0 22px 50px -18px rgba(0,0,0,.62)" : "none") +
   (L[5] ? ",\n    inset 0 1px 0 rgba(255,255,255,.85),\n    inset 0 -1px 0 rgba(255,255,255,.5)" : "") + ";\n" +
"  color: " + (dark ? "#eef5ff" : "#101722") + ";\n}\n" +
"/* --glass-lens: url(#rim) — " + P.rim + "px rim, " + P.bend + "% bend" + (L[3] ? ", dispersed" : "") + " */";
  document.getElementById("css").textContent = css;
  return css;
}
document.getElementById("copy").addEventListener("click", function(){
  var css = writeCSS(), b = this;
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(css).catch(function(){});
  b.textContent = "Copied ✓";
  setTimeout(function(){ b.textContent = "Copy the CSS"; }, 1400);
});
/* ── loop ─────────────────────────────────────────────────────── */
function resize(){
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  wall.width = Math.round(W * dpr); wall.height = Math.round(H * dpr);
  wall.style.width = W + "px"; wall.style.height = H + "px";
  blur.width = Math.max(2, Math.round(W * dpr * .5)); blur.height = Math.max(2, Math.round(H * dpr * .5));
}
window.addEventListener("resize", resize);
function frame(now){
  paintWall(now);
  surfs.forEach(paintSurface);
  requestAnimationFrame(frame);
}
resize(); writeCSS(); requestAnimationFrame(frame);
window.__glass = { surfs: surfs, css: writeCSS, sample: sample };
})();
</script>
</body>
</html>
