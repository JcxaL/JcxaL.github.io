<title>Hands That Never Existed — UI Spotlight Day 155</title>
<meta name="description" content="Letters drawn as single-line skeletons, inked by a pen that thickens on the downstroke: three invented hands writing live, and a mistake that is struck through instead of erased.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07080c;--ink:#ece7df;--dim:#9a9287;--acc:#f87171}
html,body{min-height:100%}
body{background:
    radial-gradient(900px 600px at 10% -10%,#1b1512 0%,transparent 60%),
    radial-gradient(800px 520px at 100% 110%,#141019 0%,transparent 58%),var(--bg);
  color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100dvh;padding:70px 18px 64px;-webkit-text-size-adjust:100%}

.head{text-align:center;margin-bottom:4px}

  border-radius:10px;padding:9px 13px;cursor:pointer;transition:.15s;-webkit-tap-highlight-color:transparent}

<body>

<div class="wrap">
  <div class="head">
    <h1>Three hands that never existed</h1>
    <p>Every glyph is a single-line skeleton; the pen gives it body, thickening as it travels down the page.</p>
  </div>

  <div class="sheet" id="p0"><span class="tag">hand 01 · <b>Copperplate</b></span><canvas></canvas></div>
  <div class="sheet" id="p1"><span class="tag">hand 02 · <b>Schoolbook</b></span><canvas></canvas></div>
  <div class="sheet dark" id="p2"><span class="tag">hand 03 · <b>Scratch</b></span><canvas></canvas></div>

  <div class="bar">
    <input type="text" id="txt" value="the ink remembers every hesitation" maxlength="54">
    <button class="pri" id="write">Write it</button>
    <button id="mistake">Make a mistake</button>
  </div>
</div>
<div class="panel">
  <h2>The pen</h2>
  <label class="sl">speed <input id="sp" type="range" min="20" max="260" step="5" value="110"><b id="vsp">110</b></label>
  <label class="sl">nib <input id="nb" type="range" min="6" max="40" step="1" value="23"><b id="vnb">2.3</b></label>
  <label class="sl">slant <input id="sl" type="range" min="-5" max="35" step="1" value="14"><b id="vsl">14°</b></label>
  <label class="sl">wobble <input id="wb" type="range" min="0" max="30" step="1" value="10"><b id="vwb">.10</b></label>
  <label class="sl">flow <input id="fl" type="range" min="10" max="80" step="2" value="50"><b id="vfl">.50</b></label>
</div>
<footer>Inspired by <a href="https://github.com/rafaelcespedes/if-this-finds-you" target="_blank" rel="noopener">rafaelcespedes/if-this-finds-you</a> · UI Spotlight Day 155 · Drop #3</footer>
<script>
(function(){
"use strict";
var TAU = Math.PI * 2;
/* ── a single-line skeleton alphabet, built from arcs and lines ──

function arc(cx, cy, rx, ry, a0, a1, n){
  n = n || 14; var p = [];
  for (var i = 0; i <= n; i++){
    var a = a0 + (a1 - a0) * (i / n);
    p.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]);
  }
  return p;
}
function ln(x1, y1, x2, y2){ return [[x1, y1], [x2, y2]]; }
function cat(){ return [].concat.apply([], arguments); }   // join point lists into one stroke
var G = {
  " ": { w: 2.6, s: [] },
  a: { w: 5.2, s: [cat(arc(2.4, 2.5, 2.2, 2.5, .5, TAU + .3, 20)), ln(4.6, 5, 4.6, .7), arc(4.6, .7, 1, .9, -Math.PI/2, .2, 5)] },
  b: { w: 5.2, s: [ln(.7, 7.5, .7, 0), arc(2.8, 2.1, 2.1, 2.1, Math.PI, -Math.PI, 20)] },
  c: { w: 4.8, s: [arc(2.7, 2.5, 2.2, 2.5, -.5, Math.PI + .5, 18)] },
  d: { w: 5.2, s: [cat(arc(2.4, 2.5, 2.1, 2.5, 0, TAU, 20)), cat(ln(4.5, 7.5, 4.5, .8), arc(4.5, .8, 1, .8, -Math.PI/2, .2, 5))] },
  e: { w: 4.8, s: [cat(ln(.6, 2.6, 4.8, 2.9), arc(2.7, 2.5, 2.2, 2.5, .07, Math.PI + .55, 18))] },
  f: { w: 4.2, s: [cat(arc(3, 6.4, 1.7, 1.7, 0, Math.PI * .9, 10), ln(1.3, 6.4, 1.3, -2.2)), ln(.1, 5, 3.6, 5)] },
  g: { w: 5.2, s: [arc(2.4, 2.5, 2.1, 2.5, 0, TAU, 20), cat(ln(4.5, 5, 4.5, -1.1), arc(3, -1.1, 1.5, 1.4, 0, -Math.PI * .85, 10))] },
  h: { w: 5.2, s: [ln(.7, 7.5, .7, 0), cat(arc(2.7, 3, 2, 2, Math.PI, 0, 11), ln(4.7, 3, 4.7, 0))] },
  i: { w: 2.6, s: [ln(1.2, 5, 1.2, 0), ln(1.2, 6.6, 1.25, 6.9)] },
  j: { w: 2.8, s: [cat(ln(1.8, 5, 1.8, -1.1), arc(.7, -1.1, 1.1, 1.2, 0, -Math.PI * .9, 8)), ln(1.8, 6.6, 1.85, 6.9)] },
  k: { w: 5, s: [ln(.7, 7.5, .7, 0), ln(4.6, 5, .9, 1.9), ln(2, 3, 4.8, 0)] },
  l: { w: 2.4, s: [cat(ln(1, 7.5, 1, .8), arc(1, .8, .9, .8, -Math.PI/2, .2, 5))] },
  m: { w: 7.8, s: [ln(.7, 5, .7, 0), cat(arc(2.4, 3.2, 1.7, 1.8, Math.PI, 0, 10), ln(4.1, 3.2, 4.1, 0)),
                   cat(arc(5.8, 3.2, 1.7, 1.8, Math.PI, 0, 10), ln(7.5, 3.2, 7.5, 0))] },
  n: { w: 5.2, s: [ln(.7, 5, .7, 0), cat(arc(2.7, 3.1, 2, 1.9, Math.PI, 0, 11), ln(4.7, 3.1, 4.7, 0))] },
  o: { w: 5.2, s: [arc(2.6, 2.5, 2.2, 2.5, 0, TAU, 22)] },
  p: { w: 5.2, s: [ln(.7, 5, .7, -2.5), arc(2.8, 2.4, 2.1, 2.2, Math.PI, -Math.PI, 20)] },
  q: { w: 5.2, s: [arc(2.4, 2.5, 2.1, 2.5, 0, TAU, 20), ln(4.5, 5, 4.5, -2.5)] },
  r: { w: 4.2, s: [ln(.8, 5, .8, 0), arc(2.6, 3.2, 1.8, 1.8, Math.PI, Math.PI * .25, 9)] },
  s: { w: 4.4, s: [cat(arc(2.6, 3.7, 1.7, 1.4, -.3, Math.PI * 1.15, 12), arc(2, 1.3, 1.7, 1.4, Math.PI * .1, Math.PI * -.85, 12))] },
  t: { w: 3.8, s: [cat(ln(1.5, 7, 1.5, .8), arc(1.5, .8, 1.2, .8, -Math.PI/2, .25, 6)), ln(.1, 5, 3.3, 5)] },
  u: { w: 5.2, s: [cat(ln(.7, 5, .7, 1.9), arc(2.7, 1.9, 2, 1.9, Math.PI, TAU, 11)), ln(4.7, 5, 4.7, 0)] },
  v: { w: 4.8, s: [cat(ln(.4, 5, 2.4, 0), ln(2.4, 0, 4.4, 5))] },
  w: { w: 7.2, s: [cat(ln(.4, 5, 2, 0), ln(2, 0, 3.6, 4), ln(3.6, 4, 5.2, 0), ln(5.2, 0, 6.8, 5))] },
  x: { w: 4.8, s: [ln(.5, 5, 4.4, 0), ln(4.4, 5, .5, 0)] },
  y: { w: 5, s: [ln(.5, 5, 2.6, .2), cat(ln(4.7, 5, 2, -1.3), arc(.8, -1.3, 1.2, 1.2, 0, -Math.PI * .85, 8))] },
  z: { w: 4.6, s: [cat(ln(.5, 5, 4.3, 5), ln(4.3, 5, .6, 0), ln(.6, 0, 4.4, 0))] },
  ".": { w: 2.2, s: [ln(1, .15, 1.05, .35)] },
  ",": { w: 2.2, s: [ln(1, .4, .6, -1)] },
  "'": { w: 1.8, s: [ln(.9, 7.2, .7, 5.6)] },
  "!": { w: 2.4, s: [ln(1.1, 7.4, 1.1, 1.6), ln(1.1, .15, 1.15, .35)] },
  "?": { w: 4.4, s: [cat(arc(2.2, 6, 1.7, 1.5, Math.PI * .9, -.25, 12), ln(2.4, 4.5, 2.1, 1.7)), ln(2.1, .15, 2.15, .35)] },
  "-": { w: 3.6, s: [ln(.4, 2.6, 3.1, 2.6)] }
};
var HANDS = [
  { name:"Copperplate", slant:18, join:true,  wob:.5,  press:2.2, nib:1.05, sz:1,    ink:"#241a10", paper:"#f4efe4" },
  { name:"Schoolbook",  slant:0,  join:false, wob:.8,  press:.35, nib:1.3,  sz:1.04, ink:"#16233a", paper:"#f4efe4" },
  { name:"Scratch",     slant:26, join:true,  wob:1.8, press:1.3, nib:.8,   sz:.95,  ink:"#dfe5f0", paper:"#1a1b22" }
];
var P = { speed:110, nib:2.3, slant:14, wob:.12, flow:.5 };

function rng(seed){ var s = seed >>> 0 || 1;
  return function(){ s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 10000) / 10000 - .5; }; }

/* ── the writer: turns text into strokes, then inks them ───────── */
function Writer(sheet, hand, seed){
  this.cv = sheet.querySelector("canvas");
  this.g = this.cv.getContext("2d");
  this.hand = hand; this.seed = seed;
  this.strokes = []; this.si = 0; this.pi = 0; this.t = 0; this.acc = 0;
  this.done = true;
}
Writer.prototype.resize = function(){
  var r = this.cv.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1);
  this.cv.width = Math.round(r.width * d); this.cv.height = Math.round(r.height * d);
  this.g.setTransform(d, 0, 0, d, 0, 0);
  this.w = r.width; this.h = r.height;
  this.clear();
};
Writer.prototype.clear = function(){
  this.g.clearRect(0, 0, this.w, this.h);
  var rule = this.hand.paper === "#1a1b22" ? "rgba(255,255,255,.07)" : "rgba(40,30,20,.08)";
  this.g.strokeStyle = rule; this.g.lineWidth = 1;
  for (var y = 40; y < this.h; y += 34){
    this.g.beginPath(); this.g.moveTo(16, y + .5); this.g.lineTo(this.w - 16, y + .5); this.g.stroke();
  }
};
Writer.prototype.setText = function(txt, strike){
  var H = this.hand, rnd = rng(this.seed + txt.length * 7);
  var unit = Math.min(3.1, (this.w - 70) / Math.max(14, txt.length * 4.1));
  var scale = unit * H.sz;
  var x = 26, base = this.h * .62, strokes = [];
  var slant = Math.tan((P.slant * (H.slant / 14)) * Math.PI / 180);
  var self = this;
  function place(pts, jx, jy, wob){
    return pts.map(function(p, i){
      var wx = (rnd() * wob * 1.6), wy = (rnd() * wob * 1.6);
      var gx = p[0] + jx + wx, gy = p[1] + jy + wy;
      return [x + (gx + gy * slant) * scale, base - gy * scale];
    });
  }
  var words = [], wordStart = x;
  for (var i = 0; i < txt.length; i++){
    var ch = txt[i], up = ch !== ch.toLowerCase();
    var key = G[ch.toLowerCase()] ? ch.toLowerCase() : (G[ch] ? ch : null);
    var gl = key ? G[key] : null;
    if (!gl){ x += 2.6 * scale; continue; }
    var jy = rnd() * P.wob * H.wob * 2.4, jx = rnd() * P.wob * H.wob * 1.3;
    var upScale = up ? 1.45 : 1;
    gl.s.forEach(function(st){
      var pts = st.map(function(p){ return [p[0] * upScale, p[1] * upScale]; });
      strokes.push({ pts: place(pts, jx, jy, P.wob * H.wob), kind:"glyph" });
    });
    var adv = (gl.w * upScale + .9 + rnd() * .5) * scale;
    if (H.join && key !== " " && txt[i+1] && txt[i+1] !== " " && G[txt[i+1].toLowerCase()]){
      var x0 = x + (gl.w * upScale + .1) * scale, x1 = x + adv;
      strokes.push({ pts: [[x0, base - .3 * scale], [(x0 + x1) / 2, base + .55 * scale], [x1, base - .2 * scale]], kind:"join" });
    }
    if (ch === " "){ words.push([wordStart, x]); wordStart = x + adv; }
    x += adv;
    if (x > this.w - 30){ base += 34; x = 26; wordStart = x; }
  }
  words.push([wordStart, x]);
  if (strike && words.length > 1){
    var wsel = words[Math.max(0, words.length - 2)];
    var pts = [];
    for (var k = 0; k <= 12; k++){
      var f = k / 12;
      pts.push([wsel[0] + (wsel[1] - wsel[0]) * f, base - (2.2 + Math.sin(f * 7) * .5) * scale]);
    }
    strokes.push({ pts: pts, kind:"strike" });
  }
  this.strokes = strokes; this.si = 0; this.pi = 0; this.acc = 0; this.done = false;
  this.scale = scale;
};
Writer.prototype.update = function(dt){
  if (this.done) return;
  var g = this.g, H = this.hand;
  var budget = P.speed * dt * 10;          // pixels of path to ink this frame
  while (budget > 0 && !this.done){
    var st = this.strokes[this.si];
    if (!st){ this.done = true; break; }
    var a = st.pts[this.pi], b = st.pts[this.pi + 1];
    if (!b){ this.si++; this.pi = 0; continue; }
    var seg = Math.hypot(b[0] - a[0], b[1] - a[1]) || .001;
    var take = Math.min(seg - this.acc, budget);
    var f0 = this.acc / seg, f1 = (this.acc + take) / seg;
    var p0 = [a[0] + (b[0] - a[0]) * f0, a[1] + (b[1] - a[1]) * f0];
    var p1 = [a[0] + (b[0] - a[0]) * f1, a[1] + (b[1] - a[1]) * f1];
    // the nib: downstrokes carry more ink than upstrokes
    var down = Math.max(0, (p1[1] - p0[1]) / Math.max(.001, Math.hypot(p1[0] - p0[0], p1[1] - p0[1])));
    var wgt = P.nib * H.nib * (st.kind === "join" ? .45 : 1) * (1 + H.press * down * .9) * (st.kind === "strike" ? 1.3 : 1);
    g.strokeStyle = st.kind === "strike" ? (H.paper === "#1a1b22" ? "#f87171" : "#9b2c3a") : H.ink;
    g.globalAlpha = P.flow * (st.kind === "join" ? .7 : 1);
    g.lineCap = "round"; g.lineJoin = "round"; g.lineWidth = Math.max(.35, wgt);
    g.beginPath(); g.moveTo(p0[0], p0[1]); g.lineTo(p1[0], p1[1]); g.stroke();
    g.globalAlpha = 1;
    budget -= take; this.acc += take;
    if (this.acc >= seg - .0001){ this.acc = 0; this.pi++; }
  }
};
/* ── wiring ───────────────────────────────────────────────────── */
var writers = HANDS.map(function(h, i){ return new Writer(document.getElementById("p" + i), h, 991 + i * 37); });
function sizeAll(){ writers.forEach(function(w){ w.resize(); }); }
function writeAll(strike){
  var txt = (document.getElementById("txt").value || "hello").toLowerCase().slice(0, 54);
  writers.forEach(function(w, i){
    w.clear();
    w.setText(strike && i === 1 ? txt.replace(/\s+\S+$/, " mistaek again") : txt, strike && i === 1);
  });
}
document.getElementById("write").addEventListener("click", function(){ writeAll(false); });
document.getElementById("mistake").addEventListener("click", function(){ writeAll(true); });
document.getElementById("txt").addEventListener("keydown", function(e){ if (e.key === "Enter") writeAll(false); });
function slider(id, key, out, f, g){
  var el = document.getElementById(id), o = document.getElementById(out);
  el.addEventListener("input", function(){ P[key] = f(+el.value); o.textContent = g(+el.value); });
}
slider("sp", "speed", "vsp", function(v){ return v; }, function(v){ return v; });
slider("nb", "nib", "vnb", function(v){ return v / 10; }, function(v){ return (v / 10).toFixed(1); });
slider("sl", "slant", "vsl", function(v){ return v; }, function(v){ return v + "°"; });
slider("wb", "wob", "vwb", function(v){ return v / 100; }, function(v){ return "." + String(v).padStart(2, "0"); });
slider("fl", "flow", "vfl", function(v){ return v / 100; }, function(v){ return "." + v; });
var last = 0;
function frame(now){
  var dt = Math.min(.05, (now - last) / 1000 || .016); last = now;
  writers.forEach(function(w){ w.update(dt); });
  requestAnimationFrame(frame);
}
window.addEventListener("resize", function(){ sizeAll(); writeAll(false); });
sizeAll(); writeAll(false); requestAnimationFrame(frame);
window.__hand = { writers: writers, writeAll: writeAll, glyphs: Object.keys(G).length };
})();
</script>
