<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Click, Answered — Drop #4</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#04060c;--ink:#eaf3ff;--dim:#93a7c4;--amber:#fbbf24;--line:#1c2838}
html,body{height:100%}
body{background:radial-gradient(1200px 780px at 50% -12%,#10263f 0%,transparent 62%),var(--bg);
  color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overflow:hidden;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#fx{position:fixed;inset:0;z-index:10;pointer-events:none;mix-blend-mode:screen}
.stage{position:relative;z-index:5;height:100%;height:100dvh;display:grid;place-content:center;
  gap:26px;padding:84px 20px 86px;text-align:center;touch-action:none}
.back-link{position:fixed;left:14px;top:14px;z-index:30;display:inline-flex;align-items:center;gap:6px;
  font-size:12.5px;font-weight:600;text-decoration:none;color:var(--ink);padding:8px 13px;border-radius:999px;
  background:rgba(10,16,26,.74);border:1px solid #273647;backdrop-filter:blur(10px);
  transition:border-color .18s,transform .18s}
.back-link:hover{border-color:var(--amber);transform:translateX(-2px)}
.panel{position:fixed;right:14px;top:14px;z-index:30;width:198px;padding:13px 14px;border-radius:14px;
  background:rgba(9,14,22,.8);border:1px solid #273647;backdrop-filter:blur(12px);
  box-shadow:0 18px 46px -22px #000}
.panel h4{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);margin-bottom:10px;font-weight:700}
.panel label{display:block;font-size:11px;color:var(--dim);margin:0 0 9px}
.panel label b{color:var(--ink);float:right;font-variant-numeric:tabular-nums}
.panel input[type=range]{width:100%;accent-color:var(--amber);margin-top:4px}
.panel .sw{display:flex;gap:6px;margin-top:2px}
.panel .sw button{flex:1;font:inherit;font-size:10.5px;font-weight:600;color:var(--ink);background:#141e2d;
  border:1px solid var(--line);border-radius:8px;padding:5px 2px;cursor:pointer}
.panel .sw button.on{border-color:var(--amber);background:#2a2010;color:#ffdf9c}
.swatches{display:flex;gap:6px;margin-top:4px}
.swatches i{flex:1;height:22px;border-radius:7px;cursor:pointer;border:2px solid transparent;display:block}
.swatches i.on{border-color:#fff8e6}
h1{font-size:clamp(25px,6vw,46px);font-weight:800;letter-spacing:-1px;line-height:1.05}
h1 em{font-style:normal;color:var(--amber)}
.sub{color:var(--dim);max-width:560px;margin:0 auto;font-size:13.5px}
.targets{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.targets button{font:inherit;font-size:13.5px;font-weight:700;color:#0d0a02;cursor:pointer;
  background:linear-gradient(180deg,#ffd979,#f0a81b);border:1px solid #ffe6ad;border-radius:14px;
  padding:13px 24px;box-shadow:0 14px 34px -16px #fbbf24cc;transition:transform .13s}
.targets button.ghost{background:rgba(14,21,33,.7);color:var(--ink);border-color:#2a3a4e;box-shadow:none}
.targets button:active{transform:scale(.96)}
.readout{font-size:11.5px;color:#64779a;font-variant-numeric:tabular-nums;min-height:1.4em}
footer{position:fixed;left:0;right:0;bottom:0;z-index:25;text-align:center;font-size:11px;color:#55657d;
  padding:9px;background:linear-gradient(180deg,transparent,#04060c 60%)}
footer a{color:#7d93b0}
@media (max-width:760px){
  .panel{right:10px;left:10px;top:auto;bottom:40px;width:auto;display:grid;
    grid-template-columns:1fr 1fr;gap:0 12px;padding:11px 12px}
  .panel h4{grid-column:1/-1;margin-bottom:6px}
  .panel .sw,.panel .swatches{grid-column:1/-1}
  .stage{padding:70px 16px 190px}
}
</style>
</head>
<body>
<a href="../" class="back-link">← All 5 drops</a>
<canvas id="fx"></canvas>

<div class="panel">
  <h4>Burst</h4>
  <label>scale <b id="vS">1.00×</b><input id="iS" type="range" min="50" max="200" step="5" value="100"></label>
  <label>bloom <b id="vB">1.70</b><input id="iB" type="range" min="0" max="320" step="10" value="170"></label>
  <label>time scale <b id="vT">1.00×</b><input id="iT" type="range" min="30" max="200" step="5" value="100"></label>
  <div class="sw" id="trailMode">
    <button data-tr="press" class="on">trail on press</button>
    <button data-tr="always">always</button>
  </div>
  <div class="swatches" id="sw">
    <i data-c="#4aa8ff" class="on" style="background:#4aa8ff"></i>
    <i data-c="#fbbf24" style="background:#fbbf24"></i>
    <i data-c="#ff6b9d" style="background:#ff6b9d"></i>
    <i data-c="#8affc1" style="background:#8affc1"></i>
  </div>
</div>

<div class="stage" id="stage">
  <h1>Every click gets an <em>answer</em></h1>
  <p class="sub">A dissolving ring, a hot core and a spray of fragments — then a trail that doesn't fade,
  it <em>shortens from the tail</em>. Click or drag anywhere on this page.</p>
  <div class="targets">
    <button id="b1">Press me</button>
    <button id="b2" class="ghost">Or me</button>
    <button id="b3" class="ghost">Burst ×5</button>
  </div>
  <p class="readout" id="readout">waiting for a pointer…</p>
</div>

<footer>Inspired by <a href="https://github.com/CialloKing/ba-click-fx" target="_blank" rel="noopener">CialloKing/ba-click-fx</a> · UI Spotlight Day 154 · Drop #4</footer>

<script>
'use strict';
const cv = document.getElementById('fx'), g = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
let SCALE = 1, BLOOM = 1.7, TSCALE = 1, COLOR = '#4aa8ff', TRAIL_ALWAYS = false;

function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

const hex2rgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const rgba = (c, a) => { const [r,gn,b] = hex2rgb(c); return 'rgba(' + r + ',' + gn + ',' + b + ',' + a + ')'; };

/* ---------- one burst --------------------------------------------------
   Three layers on one clock: a ring that expands while its stroke thins to
   nothing, a core disc that flashes and collapses, and fragments thrown on
   a jittered ring with their own rotation and size curves.               */
const bursts = [];
function boom(x, y){
  const S = SCALE*Math.max(0.55, Math.min(H, 900)/760);
  const frags = [];
  const n = 13 + ((Math.random()*5)|0);
  for (let i = 0; i < n; i++){
    const a = (i/n)*6.2832 + (Math.random() - .5)*0.5;
    const sp = (120 + Math.random()*260)*S;
    frags.push({ a, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      len: (7 + Math.random()*16)*S, w: (1.4 + Math.random()*2.4)*S,
      spin: (Math.random() - .5)*7, rot: a, drag: 2.1 + Math.random()*1.4,
      x: x + Math.cos(a)*6*S, y: y + Math.sin(a)*6*S, life: 0.52 + Math.random()*0.3 });
  }
  bursts.push({ x, y, t: 0, S, frags, c: COLOR });
  fired++;
  if (bursts.length > 26) bursts.splice(0, bursts.length - 26);
}
function drawBurst(b, dt){
  b.t += dt;
  const T = b.t, S = b.S;
  g.globalCompositeOperation = 'lighter';
  /* ring — expands fast, thins out, dissolves at 0.5s */
  if (T < 0.52){
    const p = T/0.52, e = 1 - Math.pow(1 - p, 2.6);
    const r = (10 + e*86)*S, a = (1 - p)*(1 - p)*0.95;
    g.strokeStyle = rgba(b.c, a*BLOOM*0.6);
    g.lineWidth = Math.max(0.4, (7.5*(1 - p) + 0.4)*S);
    g.beginPath(); g.arc(b.x, b.y, r, 0, 6.2832); g.stroke();
    g.strokeStyle = rgba('#ffffff', a*0.5);
    g.lineWidth = Math.max(0.3, (2.4*(1 - p))*S);
    g.beginPath(); g.arc(b.x, b.y, r, 0, 6.2832); g.stroke();
  }
  /* core — a flash that collapses */
  if (T < 0.3){
    const p = T/0.3, r = (20*(1 - p) + 2)*S, a = (1 - p)*(1 - p);
    const gd = g.createRadialGradient(b.x, b.y, 0, b.x, b.y, r*3);
    gd.addColorStop(0, rgba('#ffffff', a*0.95));
    gd.addColorStop(0.35, rgba(b.c, a*0.8*BLOOM*0.6));
    gd.addColorStop(1, rgba(b.c, 0));
    g.fillStyle = gd; g.beginPath(); g.arc(b.x, b.y, r*3, 0, 6.2832); g.fill();
  }
  /* fragments — slivers, not dots */
  for (const f of b.frags){
    if (T > f.life) continue;
    const p = T/f.life;
    f.x += f.vx*dt; f.y += f.vy*dt;
    f.vx -= f.vx*f.drag*dt; f.vy -= f.vy*f.drag*dt;
    f.vy += 190*S*dt;
    f.rot += f.spin*dt;
    const a = (1 - p)*(1 - p), size = (1 - p*0.65);
    g.save(); g.translate(f.x, f.y); g.rotate(f.rot);
    g.fillStyle = rgba(b.c, a*BLOOM*0.55);
    g.fillRect(-f.len*size/2, -f.w*size/2, f.len*size, f.w*size);
    g.fillStyle = rgba('#ffffff', a*0.45);
    g.fillRect(-f.len*size/4, -f.w*size/4, f.len*size/2, f.w*size/2);
    g.restore();
  }
  g.globalCompositeOperation = 'source-over';
  return T < 0.95;
}

/* ---------- the trail --------------------------------------------------
   Points carry a timestamp. Rather than fading the whole ribbon, we walk
   from the tail and drop points once they age out, so the stroke gets
   visibly shorter along its own path.                                    */
const trail = [];
const TRAIL_MS = 520;
let down = false, lastPt = null;
function pushTrail(x, y){
  const n = trail.length;
  if (n && Math.hypot(x - trail[n-1].x, y - trail[n-1].y) < 2.5) return;
  trail.push({ x, y, t: performance.now() });
  if (trail.length > 160) trail.shift();
}
function drawTrail(now){
  while (trail.length && now - trail[0].t > TRAIL_MS) trail.shift();
  if (trail.length < 2) return;
  g.globalCompositeOperation = 'lighter';
  g.lineCap = 'round'; g.lineJoin = 'round';
  for (let pass = 0; pass < 2; pass++){
    for (let i = 1; i < trail.length; i++){
      const p = i/trail.length;
      const age = 1 - (now - trail[i].t)/TRAIL_MS;
      const a = Math.max(0, age)*p*0.9;
      g.strokeStyle = pass ? rgba('#ffffff', a*0.55) : rgba(COLOR, a*BLOOM*0.5);
      g.lineWidth = (pass ? 2.2 : 7)*p*SCALE;
      g.beginPath(); g.moveTo(trail[i-1].x, trail[i-1].y); g.lineTo(trail[i].x, trail[i].y); g.stroke();
    }
  }
  g.globalCompositeOperation = 'source-over';
}

/* ---------- input ------------------------------------------------------ */
let fired = 0;
function pt(e){ return [e.clientX, e.clientY]; }
addEventListener('pointerdown', e => {
  down = true;
  const [x, y] = pt(e);
  boom(x, y);
  trail.length = 0; pushTrail(x, y);
});
addEventListener('pointermove', e => {
  const [x, y] = pt(e);
  lastPt = [x, y];
  if (down || TRAIL_ALWAYS) pushTrail(x, y);
}, { passive: true });
addEventListener('pointerup', () => { down = false; });
addEventListener('pointercancel', () => { down = false; });
document.getElementById('b3').addEventListener('click', e => {
  const r = e.currentTarget.getBoundingClientRect();
  for (let i = 0; i < 5; i++)
    setTimeout(() => boom(r.left + r.width/2 + (Math.random() - .5)*180,
      r.top + r.height/2 + (Math.random() - .5)*120), i*90);
});

/* ---------- loop ------------------------------------------------------- */
let prev = performance.now();
function frame(now){
  const dt = Math.min((now - prev)/1000, 1/24)*TSCALE; prev = now;
  g.clearRect(0, 0, W, H);
  drawTrail(now);
  for (let i = bursts.length - 1; i >= 0; i--) if (!drawBurst(bursts[i], dt)) bursts.splice(i, 1);
  let live = 0; for (const b of bursts) live += b.frags.length;
  document.getElementById('readout').textContent =
    fired + ' bursts fired · ' + bursts.length + ' alive · ' + live + ' fragments · ' +
    trail.length + ' trail points';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- panel ------------------------------------------------------ */
const $ = id => document.getElementById(id);
$('iS').oninput = e => { SCALE = e.target.value/100; $('vS').textContent = SCALE.toFixed(2) + '×'; };
$('iB').oninput = e => { BLOOM = e.target.value/100; $('vB').textContent = BLOOM.toFixed(2); };
$('iT').oninput = e => { TSCALE = e.target.value/100; $('vT').textContent = TSCALE.toFixed(2) + '×'; };
$('sw').addEventListener('click', e => {
  const i = e.target.closest('[data-c]'); if (!i) return;
  COLOR = i.dataset.c;
  [...e.currentTarget.children].forEach(x => x.classList.toggle('on', x === i));
});
$('trailMode').addEventListener('click', e => {
  const b = e.target.closest('[data-tr]'); if (!b) return;
  TRAIL_ALWAYS = b.dataset.tr === 'always';
  [...e.currentTarget.children].forEach(x => x.classList.toggle('on', x === b));
});
</script>
</body>
</html>
