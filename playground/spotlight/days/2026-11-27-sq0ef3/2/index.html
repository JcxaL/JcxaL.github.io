<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Write the Layout, Mount the Window · Drop 2</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:#07090d;color:#e7edf6;overflow:hidden;
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%
  }
  #scroller{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  #canvas{position:relative;width:100%;will-change:transform}
  .card{
    position:absolute;top:0;left:0;border-radius:14px;padding:12px 13px;overflow:hidden;
    background:linear-gradient(160deg,rgba(52,211,153,.14),rgba(12,18,26,.9));
    border:1px solid rgba(52,211,153,.24);
    box-shadow:0 10px 26px rgba(0,0,0,.35);
    contain:layout paint style;
  }
  .card .n{font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#34d399;letter-spacing:.08em}
  .card h3{margin:7px 0 5px;font-size:14px;font-weight:650;letter-spacing:-.01em}
  .card p{margin:0;font-size:12px;line-height:1.5;color:#9fb0c4}
  .card .bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:#34d399;opacity:.8}
  .card.alt{background:linear-gradient(160deg,rgba(56,189,248,.13),rgba(12,18,26,.9));border-color:rgba(56,189,248,.22)}
  .card.alt .n{color:#38bdf8} .card.alt .bar{background:#38bdf8}
  .card.warm{background:linear-gradient(160deg,rgba(251,191,36,.12),rgba(12,18,26,.9));border-color:rgba(251,191,36,.2)}
  .card.warm .n{color:#fbbf24} .card.warm .bar{background:#fbbf24}
  #spine{position:absolute;top:0;width:2px;background:rgba(52,211,153,.2);left:50%;margin-left:-1px;display:none}
  .back-link{
    position:fixed;top:14px;left:14px;z-index:20;display:inline-flex;align-items:center;gap:7px;
    padding:9px 15px;border-radius:999px;text-decoration:none;font-weight:600;font-size:13px;color:#e7edf6;
    background:rgba(16,22,30,.6);border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 26px rgba(0,0,0,.45);transition:.2s
  }
  .back-link:hover{transform:translateY(-1px);border-color:rgba(52,211,153,.5)}
  .panel{
    position:fixed;top:14px;right:14px;z-index:20;width:238px;padding:13px 14px 14px;border-radius:16px;
    background:rgba(13,18,25,.72);border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 12px 36px rgba(0,0,0,.5)
  }
  .panel h2{margin:0 0 10px;font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:#6b7c90;font-weight:700}
  .stat{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0;font-size:12px;color:#9fb0c4}
  .stat b{font:700 14px/1 ui-monospace,Menlo,monospace;color:#34d399}
  .stat b.hot{color:#f87171}
  .row{display:flex;align-items:center;gap:9px;margin:10px 0 2px}
  .row label{flex:0 0 58px;font-size:11.5px;color:#9fb0c4}
  .row output{flex:0 0 42px;text-align:right;font:600 11.5px/1 ui-monospace,Menlo,monospace;color:#34d399}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:20px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:rgba(255,255,255,.16)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5.5px;border-radius:50%;background:#34d399;border:2px solid #0d1219}
  input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:rgba(255,255,255,.16)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#34d399;border:2px solid #0d1219}
  .vbtn{
    width:100%;margin-top:11px;appearance:none;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);
    color:#e7edf6;border-radius:10px;padding:9px;font:600 12px/1 system-ui,sans-serif;cursor:pointer;transition:.15s
  }
  .vbtn[aria-pressed="true"]{background:#34d399;color:#06231a;border-color:transparent}
  .vbtn.danger[aria-pressed="false"]{background:rgba(248,113,113,.14);border-color:rgba(248,113,113,.4);color:#fca5a5}
  .switch{
    position:fixed;left:50%;transform:translateX(-50%);bottom:46px;z-index:20;display:flex;gap:4px;padding:4px;
    border-radius:999px;background:rgba(13,18,25,.76);border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 12px 36px rgba(0,0,0,.5)
  }
  .switch button{
    appearance:none;border:0;background:transparent;color:#9fb0c4;font:600 13px/1 system-ui,sans-serif;
    padding:10px 17px;border-radius:999px;cursor:pointer;transition:.18s
  }
  .switch button[aria-pressed="true"]{background:#34d399;color:#06231a}
  footer{
    position:fixed;left:0;right:0;bottom:0;z-index:19;padding:9px 16px;text-align:center;font-size:11.5px;
    color:#5c6a7d;background:linear-gradient(transparent,rgba(7,9,13,.92) 55%);pointer-events:none
  }
  footer a{color:#7f8fa3;pointer-events:auto}
  @media (max-width:760px){
    .panel{display:none}
    .switch{bottom:40px}
    .switch button{padding:9px 13px;font-size:12px}
  }
</style>
</head>
<body>
<a href="../" class="back-link">← All 5 drops</a>
<div id="scroller"><div id="canvas"><div id="spine"></div></div></div>

<div class="panel">
  <h2>Window</h2>
  <div class="stat"><span>Items in the list</span><b id="sTotal">2000</b></div>
  <div class="stat"><span>DOM nodes mounted</span><b id="sMounted">0</b></div>
  <div class="stat"><span>Frame</span><b id="sFps">—</b></div>
  <div class="row"><label for="rOver">Overscan</label><input id="rOver" type="range" min="0" max="800" step="50" value="200"><output id="oOver">200</output></div>
  <div class="row"><label for="rCount">Items</label><input id="rCount" type="range" min="200" max="6000" step="200" value="2000"><output id="oCount">2000</output></div>
  <button class="vbtn" id="bVirt" aria-pressed="true">Windowing on</button>
</div>

<div class="switch" role="group" aria-label="Layout">
  <button data-l="masonry" aria-pressed="true">Masonry</button>
  <button data-l="timeline" aria-pressed="false">Timeline</button>
  <button data-l="board" aria-pressed="false">Board</button>
</div>

<footer>Inspired by <a href="https://github.com/Dave861/LazyLayoutKit" target="_blank" rel="noopener">Dave861/LazyLayoutKit</a> · UI Spotlight Day 170 · Drop #2 — the layout is yours, the mounting is windowed</footer>

<script>
(function(){
"use strict";
var scroller=document.getElementById("scroller"),
    canvas=document.getElementById("canvas"),
    spine=document.getElementById("spine");

/* ------------------------------------------------------------ fake data */
function rnd(seed){ var s=seed; return function(){ s=(s*1664525+1013904223)%4294967296; return s/4294967296; }; }
var WORDS=["ledger","beacon","harbour","quarry","lantern","meridian","thicket","compass","ferry","almanac","kiln","drift","marsh","signal","atlas","orchard","cinder","bramble","parsec","tundra"];
var NOTES=["Measured once, mounted never.","Only what the window can see is built.","Frames are computed, nodes are borrowed.","The layout pass is pure arithmetic.","Scroll past it and it goes back in the pool.","Height known up front, so the bar never jumps."];
var items=[];
function makeItems(n){
  var r=rnd(97);
  items=new Array(n);
  for(var i=0;i<n;i++){
    items[i]={
      i:i,
      title:WORDS[Math.floor(r()*WORDS.length)]+" "+(1+Math.floor(r()*90)),
      note:NOTES[Math.floor(r()*NOTES.length)],
      size:0.6+r()*1.5,
      lane:Math.floor(r()*3),
      tone:Math.floor(r()*3)
    };
  }
}

/* -------------------------------------------------- the layout functions */
/* every layout is just: given a width, return a frame per item + a total height */
var LAYOUTS={
  masonry:function(W,items){
    var gap=14, min=210;
    var cols=Math.max(1,Math.floor((W+gap)/(min+gap)));
    var cw=(W-gap*(cols-1))/cols;
    var y=new Array(cols).fill(0), frames=new Array(items.length);
    for(var i=0;i<items.length;i++){
      var c=0; for(var k=1;k<cols;k++) if(y[k]<y[c]) c=k;
      var h=Math.round(96+items[i].size*86);
      frames[i]={x:c*(cw+gap), y:y[c], w:cw, h:h};
      y[c]+=h+gap;
    }
    return {frames:frames, height:Math.max.apply(null,y), spine:false};
  },
  timeline:function(W,items){
    var gap=18, cw=Math.min(330,(W-60)/2), mid=W/2, y=0;
    var frames=new Array(items.length);
    for(var i=0;i<items.length;i++){
      var left=i%2===0, h=Math.round(92+items[i].size*54);
      frames[i]={ x: left? mid-cw-26 : mid+26, y:y, w:cw, h:h };
      y += (left? 0 : h*0.52+gap);
      if(left) y += h*0.5;
    }
    var last=frames[frames.length-1];
    return {frames:frames, height:(last?last.y+last.h:0)+40, spine:true};
  },
  board:function(W,items){
    var gap=14, lanes=3;
    var lw=Math.min(340,(W-gap*(lanes+1))/lanes);
    var total=lw*lanes+gap*(lanes-1), x0=(W-total)/2;
    var y=new Array(lanes).fill(0), frames=new Array(items.length);
    for(var i=0;i<items.length;i++){
      var L=items[i].lane, h=Math.round(84+items[i].size*30);
      frames[i]={x:x0+L*(lw+gap), y:y[L], w:lw, h:h};
      y[L]+=h+gap;
    }
    return {frames:frames, height:Math.max.apply(null,y), spine:false};
  }
};

/* ------------------------------------------------- the windowing machine */
var state={layout:"masonry", frames:[], order:[], height:0, virt:true, overscan:200, maxH:0};
var mounted=new Map(), pool=[];

function node(){
  var el=pool.pop();
  if(el) return el;
  el=document.createElement("div");
  el.className="card";
  el.innerHTML='<span class="bar"></span><span class="n"></span><h3></h3><p></p>';
  return el;
}
function release(el){
  if(el.parentNode) el.parentNode.removeChild(el);
  if(pool.length<300) pool.push(el);
}
var TONE=["","alt","warm"];
function fill(el,it,f){
  el.className="card "+TONE[it.tone];
  el.children[1].textContent="#"+String(it.i).padStart(4,"0");
  el.children[2].textContent=it.title;
  el.children[3].textContent=it.note;
  el.style.transform="translate("+Math.round(f.x)+"px,"+Math.round(f.y)+"px)";
  el.style.width=Math.round(f.w)+"px";
  el.style.height=Math.round(f.h)+"px";
}

function relayout(){
  var W=canvas.clientWidth-28;
  var out=LAYOUTS[state.layout](W,items);
  state.frames=out.frames;
  state.height=out.height;
  canvas.style.height=Math.ceil(out.height)+"px";
  canvas.style.padding="0 14px";
  spine.style.display=out.spine?"block":"none";
  spine.style.height=Math.ceil(out.height)+"px";
  /* index sorted by y so the visible slice is a binary search, not a scan */
  var ord=new Array(state.frames.length);
  for(var i=0;i<ord.length;i++) ord[i]=i;
  ord.sort(function(a,b){ return state.frames[a].y-state.frames[b].y; });
  state.order=ord;
  var mh=0;
  for(i=0;i<state.frames.length;i++) if(state.frames[i].h>mh) mh=state.frames[i].h;
  state.maxH=mh;
  /* everything currently mounted has moved */
  mounted.forEach(function(el,idx){ fill(el,items[idx],state.frames[idx]); });
  update(true);
}

function firstVisible(top){
  var ord=state.order, F=state.frames, lo=0, hi=ord.length-1, ans=ord.length;
  while(lo<=hi){
    var mid=(lo+hi)>>1;
    if(F[ord[mid]].y>=top){ ans=mid; hi=mid-1; } else lo=mid+1;
  }
  return ans;
}

function update(force){
  var top=scroller.scrollTop, vh=scroller.clientHeight;
  var over=state.virt?state.overscan:1e9;
  var from=top-over, to=top+vh+over;
  var want=new Set();
  if(state.virt){
    var start=firstVisible(from-state.maxH);
    for(var k=start;k<state.order.length;k++){
      var idx=state.order[k], f=state.frames[idx];
      if(f.y>to) break;
      if(f.y+f.h>=from) want.add(idx);
    }
  } else {
    for(var i=0;i<state.frames.length;i++) want.add(i);
  }
  /* unmount what fell out of the window */
  mounted.forEach(function(el,idx){
    if(!want.has(idx)){ release(el); mounted.delete(idx); }
  });
  /* mount what came in */
  var frag=null;
  want.forEach(function(idx){
    if(mounted.has(idx)){ if(force) fill(mounted.get(idx),items[idx],state.frames[idx]); return; }
    var el=node();
    fill(el,items[idx],state.frames[idx]);
    mounted.set(idx,el);
    if(!frag) frag=document.createDocumentFragment();
    frag.appendChild(el);
  });
  if(frag) canvas.appendChild(frag);
  document.getElementById("sMounted").textContent=String(mounted.size);
  document.getElementById("sMounted").className = mounted.size>400?"hot":"";
}

/* ----------------------------------------------------------- frame timing */
var ticking=false, frames=0, acc=0, lastT=performance.now();
function onScroll(){
  if(ticking) return;
  ticking=true;
  requestAnimationFrame(function(){ ticking=false; update(false); });
}
scroller.addEventListener("scroll",onScroll,{passive:true});
function fpsLoop(now){
  requestAnimationFrame(fpsLoop);
  var dt=now-lastT; lastT=now; acc+=dt; frames++;
  if(acc>=500){
    var fps=Math.round(frames*1000/acc);
    var el=document.getElementById("sFps");
    el.textContent=fps+" fps";
    el.className=fps<45?"hot":"";
    frames=0; acc=0;
  }
}
requestAnimationFrame(fpsLoop);

/* -------------------------------------------------------------- controls */
Array.prototype.forEach.call(document.querySelectorAll(".switch button"),function(b){
  b.addEventListener("click",function(){
    Array.prototype.forEach.call(document.querySelectorAll(".switch button"),function(o){
      o.setAttribute("aria-pressed",String(o===b));
    });
    state.layout=b.dataset.l;
    scroller.scrollTop=0;
    relayout();
  });
});
document.getElementById("rOver").addEventListener("input",function(){
  state.overscan=+this.value;
  document.getElementById("oOver").textContent=this.value;
  update(false);
});
document.getElementById("rCount").addEventListener("input",function(){
  document.getElementById("oCount").textContent=this.value;
});
document.getElementById("rCount").addEventListener("change",function(){
  makeItems(+this.value);
  document.getElementById("sTotal").textContent=this.value;
  mounted.forEach(function(el){ release(el); });
  mounted.clear();
  relayout();
});
document.getElementById("bVirt").addEventListener("click",function(){
  state.virt=!state.virt;
  this.setAttribute("aria-pressed",String(state.virt));
  this.textContent=state.virt?"Windowing on":"Windowing off — all mounted";
  this.classList.toggle("danger",!state.virt);
  update(true);
});
var rt=0;
addEventListener("resize",function(){ clearTimeout(rt); rt=setTimeout(relayout,120); });

makeItems(2000);
relayout();
})();
</script>
</body>
</html>
