<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Split Studio — UI Spotlight</title>
<style>
  :root{ --bg:#070a10; --panel:#10151fee; --border:#ffffff1c; --text:#eef1fb; --dim:#8b90ac; --accent:#34d399; }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0; font-family:system-ui,-apple-system,sans-serif; color:var(--text);
    background:radial-gradient(90% 60% at 50% 0%, #12301f 0%, var(--bg) 55%, #020306 100%);
    display:flex; flex-direction:column;
  }
  .back-link{
    position:fixed; top:14px; left:14px; z-index:30; text-decoration:none; color:var(--text);
    background:var(--panel); border:1px solid var(--border); padding:8px 14px; border-radius:999px;
    font-size:12.5px; font-weight:600; backdrop-filter:blur(10px);
  }
  .back-link:hover{ background:#182018; }

  header{ text-align:center; padding:70px 20px 20px; }
  header h1{ margin:0 0 8px; font-size:clamp(22px,4vw,32px); letter-spacing:-.01em; }
  header h1 span{ color:var(--accent); }
  header p{ color:var(--dim); max-width:560px; margin:0 auto; font-size:13.5px; line-height:1.6; }

  .toolbar{ display:flex; justify-content:center; gap:8px; padding:0 20px 16px; flex-wrap:wrap; }
  .toolbar button{
    background:var(--panel); border:1px solid var(--border); color:var(--text); border-radius:999px;
    padding:7px 14px; font-size:12px; font-weight:600; cursor:pointer;
  }
  .toolbar button.active{ background:var(--accent); color:#052018; border-color:transparent; }

  .group{ flex:1; display:flex; min-height:0; margin:0 20px 24px; border-radius:18px; overflow:hidden; border:1px solid var(--border); box-shadow:0 24px 60px #000a; }
  .group.vertical{ flex-direction:column; }
  .pane{
    background:linear-gradient(165deg,#131a26,#0a0e16); padding:20px; overflow:auto; position:relative;
    display:flex; align-items:center; justify-content:center; text-align:center; min-width:60px; min-height:60px;
  }
  .pane h3{ margin:0 0 6px; font-size:15px; }
  .pane p{ margin:0; color:var(--dim); font-size:12px; }
  .pane .pct{ position:absolute; top:10px; right:14px; font-size:11px; color:#5b6178; font-variant-numeric:tabular-nums; }

  .handle{
    background:#0d1119; position:relative; flex:0 0 8px; cursor:col-resize; touch-action:none;
  }
  .group.vertical .handle{ cursor:row-resize; }
  .handle::after{
    content:""; position:absolute; inset:0; margin:auto; width:3px; height:32px; border-radius:3px; background:#ffffff24;
  }
  .group.vertical .handle::after{ width:32px; height:3px; }
  .handle:hover::after, .handle.active::after{ background:var(--accent); }

  footer{ text-align:center; padding:6px 20px 60px; color:var(--dim); font-size:11.5px; }
</style>
</head>
<body>
<a href="../" class="back-link">← All 5 drops</a>

<header>
  <h1>Split <span>Studio</span></h1>
  <p>Drag any divider to resize its panes live. Sizes are computed in percentages and persist across a layout switch — the same mental model behind <code>react-resizable-panels</code>' panel groups.</p>
</header>

<div class="toolbar">
  <button data-preset="2h" class="active">2 panes · horizontal</button>
  <button data-preset="3h">3 panes · horizontal</button>
  <button data-preset="2v">2 panes · vertical</button>
</div>

<div class="group horizontal" id="group"></div>

<footer>Inspired by bvaughn/react-resizable-panels · UI Spotlight Day 87 · Drop #2</footer>

<script>
(function(){
  var group = document.getElementById('group');
  var buttons = Array.prototype.slice.call(document.querySelectorAll('.toolbar button'));

  var CONTENT = [
    { title: 'Explorer', body: 'File tree / navigation goes here.' },
    { title: 'Editor', body: 'Main content area — grows to fill remaining space.' },
    { title: 'Inspector', body: 'Props, details, or a preview panel.' }
  ];

  function build(preset){
    group.innerHTML = '';
    var vertical = preset === '2v';
    var count = preset === '3h' ? 3 : 2;
    group.className = 'group ' + (vertical ? 'vertical' : 'horizontal');

    var panes = [];
    var sizes = count === 3 ? [22, 56, 22] : [32, 68];

    for (var i = 0; i < count; i++){
      var pane = document.createElement('div');
      pane.className = 'pane';
      var c = CONTENT[i % CONTENT.length];
      pane.innerHTML = '<div><h3>' + c.title + '</h3><p>' + c.body + '</p></div><span class="pct"></span>';
      group.appendChild(pane);
      panes.push(pane);
      if (i < count - 1){
        var handle = document.createElement('div');
        handle.className = 'handle';
        handle.dataset.beforeIndex = String(i);
        group.appendChild(handle);
      }
    }
    applySizes(panes, sizes, vertical);
    wireHandles(panes, sizes, vertical);
  }

  function applySizes(panes, sizes, vertical){
    panes.forEach(function(pane, i){
      pane.style.flex = sizes[i] + ' 1 0';
      var pctEl = pane.querySelector('.pct');
      if (pctEl) pctEl.textContent = Math.round(sizes[i]) + '%';
    });
  }

  function wireHandles(panes, sizes, vertical){
    var handles = Array.prototype.slice.call(group.querySelectorAll('.handle'));
    handles.forEach(function(handle){
      var beforeIndex = parseInt(handle.dataset.beforeIndex, 10);
      var afterIndex = beforeIndex + 1;

      handle.addEventListener('pointerdown', function(e){
        e.preventDefault();
        handle.classList.add('active');
        handle.setPointerCapture(e.pointerId);
        var groupRect = group.getBoundingClientRect();
        var totalSize = sizes[beforeIndex] + sizes[afterIndex];
        var groupExtent = vertical ? groupRect.height : groupRect.width;

        function onMove(ev){
          var pos = vertical ? (ev.clientY - groupRect.top) : (ev.clientX - groupRect.left);
          // convert the pointer's pixel position into a split ratio within this pair of panes
          var pxBefore = pos;
          var pxTotalForPair = groupExtent * (totalSize / 100);
          var pxOffsetOfPairStart = 0;
          for (var k = 0; k < beforeIndex; k++) pxOffsetOfPairStart += groupExtent * (sizes[k] / 100);
          var localPx = Math.max(8, Math.min(pxTotalForPair - 8, pxBefore - pxOffsetOfPairStart));
          var localRatio = localPx / pxTotalForPair;
          sizes[beforeIndex] = totalSize * localRatio;
          sizes[afterIndex] = totalSize * (1 - localRatio);
          applySizes(panes, sizes, vertical);
        }
        function onUp(ev){
          handle.classList.remove('active');
          try { handle.releasePointerCapture(e.pointerId); } catch(err){}
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
        }
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
      });
    });
  }

  buttons.forEach(function(btn){
    btn.addEventListener('click', function(){
      buttons.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      build(btn.dataset.preset);
    });
  });

  build('2h');
})();
</script>
</body>
</html>
