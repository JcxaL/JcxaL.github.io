<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Quill — Handwriting Synthesizer</title>
<style>
  :root{
    --bg:#171310;
    --panel:rgba(30,25,20,0.62);
    --panel-border:rgba(255,240,220,0.14);
    --ink-default:#1c2b52;
    --accent:#e8a33d;
    --accent2:#c1502e;
    --text:#f4ecdf;
    --muted:#b8a894;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;}

  /* ---------- header ---------- */
  header{
    padding:10px 14px 4px;
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    z-index:5;
  }
  header h1{font-size:1.05rem;margin:0;font-weight:700;letter-spacing:.02em;}
  header h1 span{color:var(--accent);}
  header p{margin:0;font-size:.72rem;color:var(--muted);}

  /* ---------- canvas stage ---------- */
  #stage{
    flex:1;position:relative;min-height:0;
    padding:4px 10px 8px;
  }
  #paperWrap{
    position:relative;width:100%;height:100%;border-radius:14px;overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
  }
  canvas#paper{display:block;width:100%;height:100%;touch-action:pan-y;}

  /* ---------- floating glass toolbar ---------- */
  .glass{
    background:var(--panel);
    backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    border:1px solid var(--panel-border);
    border-radius:14px;
  }
  #toolbarToggle{
    position:absolute;top:10px;right:10px;z-index:20;
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:1.1rem;cursor:pointer;color:var(--text);
    user-select:none;
  }
  #toolbar{
    position:absolute;top:56px;right:10px;z-index:19;
    width:230px;max-height:calc(100% - 66px);overflow-y:auto;
    padding:12px;display:flex;flex-direction:column;gap:12px;
    transform:translateX(280px);opacity:0;pointer-events:none;
    transition:transform .28s cubic-bezier(.2,.9,.3,1),opacity .22s;
  }
  #toolbar.open{transform:translateX(0);opacity:1;pointer-events:auto;}
  .group{display:flex;flex-direction:column;gap:6px;}
  .group label{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between;}
  .row{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{
    flex:1;min-width:44px;padding:7px 4px;border-radius:9px;border:1px solid var(--panel-border);
    background:rgba(255,255,255,.04);color:var(--text);font-size:.68rem;cursor:pointer;text-align:center;
    transition:background .15s,border-color .15s;
  }
  .chip.active{background:var(--accent);color:#241704;border-color:var(--accent);font-weight:700;}
  input[type=range]{width:100%;accent-color:var(--accent);}
  input[type=color]{width:100%;height:28px;border:none;border-radius:8px;background:none;cursor:pointer;}
  .btnrow{display:flex;gap:6px;}
  button.action{
    flex:1;padding:8px 6px;border-radius:9px;border:1px solid var(--panel-border);
    background:rgba(255,255,255,.06);color:var(--text);font-size:.72rem;cursor:pointer;font-weight:600;
  }
  button.action:active{transform:scale(.96);}
  button.action.primary{background:var(--accent2);border-color:var(--accent2);color:#fff;}

  /* ---------- notes drawer ---------- */
  #notesToggle{
    position:absolute;top:10px;left:10px;z-index:20;
    padding:0 12px;height:38px;border-radius:19px;
    display:flex;align-items:center;gap:6px;font-size:.72rem;cursor:pointer;color:var(--text);
  }
  #notesDrawer{
    position:absolute;top:56px;left:10px;z-index:19;
    width:230px;max-height:calc(100% - 66px);overflow-y:auto;padding:10px;
    transform:translateX(-280px);opacity:0;pointer-events:none;
    transition:transform .28s cubic-bezier(.2,.9,.3,1),opacity .22s;
  }
  #notesDrawer.open{transform:translateX(0);opacity:1;pointer-events:auto;}
  .noteItem{
    display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:8px;
    background:rgba(255,255,255,.04);margin-bottom:6px;cursor:pointer;font-size:.72rem;
  }
  .noteItem:hover{background:rgba(255,255,255,.09);}
  .noteItem .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .noteItem .del{color:#e07;font-weight:700;cursor:pointer;padding:2px 5px;}
  #notesDrawer .empty{font-size:.7rem;color:var(--muted);padding:8px;}

  /* ---------- text input ---------- */
  #inputBar{
    padding:8px 10px 12px;display:flex;gap:8px;align-items:flex-end;z-index:5;
  }
  #textInput{
    flex:1;resize:none;border:1px solid var(--panel-border);border-radius:12px;
    background:rgba(255,255,255,.05);color:var(--text);font-size:.9rem;padding:10px 12px;
    font-family:system-ui,sans-serif;max-height:90px;min-height:44px;
  }
  #textInput:focus{outline:2px solid var(--accent);outline-offset:1px;}
  #toast{
    position:absolute;bottom:70px;left:50%;transform:translateX(-50%) translateY(10px);
    padding:8px 16px;border-radius:20px;font-size:.78rem;opacity:0;transition:opacity .25s,transform .25s;
    pointer-events:none;z-index:30;white-space:nowrap;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (max-width:520px){
    #toolbar{width:200px;}
    #notesDrawer{width:190px;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Quill <span>✒</span></h1>
    <p>Type below — watch it become handwriting. Pens, paper, and playback, all yours.</p>
  </header>

  <div id="stage">
    <div id="paperWrap" class="glass">
      <canvas id="paper"></canvas>
    </div>

    <div id="notesToggle" class="glass" title="Saved notes">🗂 <span id="notesCount">0</span></div>
    <div id="notesDrawer" class="glass">
      <div class="group"><label>Saved Notes</label></div>
      <div id="notesList"></div>
    </div>

    <div id="toolbarToggle" class="glass" title="Pen & paper settings">🖋</div>
    <div id="toolbar" class="glass">
      <div class="group">
        <label>Pen</label>
        <div class="row" id="penRow"></div>
      </div>
      <div class="group">
        <label>Paper</label>
        <div class="row" id="paperRow"></div>
      </div>
      <div class="group">
        <label>Ink color</label>
        <input type="color" id="inkColor" value="#1c2b52">
      </div>
      <div class="group">
        <label>Size <span id="sizeVal">30</span>px</label>
        <input type="range" id="sizeSlider" min="16" max="56" value="30">
      </div>
      <div class="group">
        <label>Slant <span id="slantVal">6</span>°</label>
        <input type="range" id="slantSlider" min="-15" max="20" value="6">
      </div>
      <div class="group">
        <label>Jitter <span id="jitterVal">40</span>%</label>
        <input type="range" id="jitterSlider" min="0" max="100" value="40">
      </div>
      <div class="group">
        <label>Baseline wobble <span id="wobbleVal">35</span>%</label>
        <input type="range" id="wobbleSlider" min="0" max="100" value="35">
      </div>
      <div class="group">
        <label>Letter spacing <span id="spaceVal">0</span>px</label>
        <input type="range" id="spaceSlider" min="-4" max="10" value="0">
      </div>
      <div class="group">
        <div class="btnrow">
          <button class="action" id="reseedBtn">🎲 Reroll</button>
          <button class="action" id="replayBtn">▶ Replay</button>
        </div>
      </div>
      <div class="group">
        <div class="btnrow">
          <button class="action" id="saveBtn">💾 Save</button>
          <button class="action" id="shareBtn">🔗 Share</button>
        </div>
        <button class="action primary" id="exportBtn">⬇ Export PNG</button>
      </div>
    </div>

    <div id="toast" class="glass"></div>
  </div>

  <div id="inputBar">
    <textarea id="textInput" placeholder="Start typing… your words become ink." autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- seeded RNG (mulberry32) ---------------- */
  function mulberry32(a){
    return function(){
      a|=0; a=(a+0x6D2B79F5)|0;
      var t=Math.imul(a^(a>>>15),1|a);
      t=(t+Math.imul(t^(t>>>7),61|t))^t;
      return ((t^(t>>>14))>>>0)/4294967296;
    };
  }

  var STORAGE_KEY='quill_notes_v1';
  var LAST_KEY='quill_last_v1';

  var PENS = {
    ballpoint:{ label:'Ballpoint', widthMul:1,   alpha:0.92, blur:0,  bleed:0,   grain:0,    defaultColor:'#1c2b52', composite:'source-over' },
    fountain: { label:'Fountain',  widthMul:1.15,alpha:0.85, blur:0.4,bleed:1.6, grain:0,    defaultColor:'#0d2f4f', composite:'source-over' },
    marker:   { label:'Marker',    widthMul:1.6, alpha:0.55, blur:0.6,bleed:0.6, grain:0,    defaultColor:'#c1502e', composite:'multiply' },
    pencil:   { label:'Pencil',    widthMul:0.95,alpha:0.72, blur:0,  bleed:0,   grain:1,    defaultColor:'#4a4a4a', composite:'source-over' },
    chalk:    { label:'Chalk',     widthMul:1.3, alpha:0.88, blur:0.3,bleed:0,   grain:1.4,  defaultColor:'#f4ecdf', composite:'source-over' }
  };
  var PEN_ORDER=['ballpoint','fountain','marker','pencil','chalk'];

  var PAPERS = {
    blank:{ label:'Blank', bg:'#f6f1e6', lines:false, grid:false, aged:false },
    ruled:{ label:'Ruled', bg:'#f6f1e6', lines:true,  grid:false, aged:false },
    grid: { label:'Grid',  bg:'#f4f6f1', lines:false, grid:true,  aged:false },
    aged: { label:'Aged',  bg:'#e6d5ad', lines:true,  grid:false, aged:true }
  };
  var PAPER_ORDER=['blank','ruled','grid','aged'];

  var state = {
    pen:'ballpoint',
    paper:'ruled',
    color:'#1c2b52',
    size:30,
    slant:6,
    jitter:40,
    wobble:35,
    spacing:0,
    seed: (Date.now() % 1000000) || 1,
    text: "Dear reader,\n\nHandwriting hasn't left the building — it just learned to render at 60fps."
  };

  var canvas = document.getElementById('paper');
  var ctx = canvas.getContext('2d');
  var paperWrap = document.getElementById('paperWrap');
  var textInput = document.getElementById('textInput');
  var toast = document.getElementById('toast');
  var dpr = Math.max(1, Math.min(2, window.devicePixelRatio||1));

  var writeProgress = 1; // 1 = fully written; used by Replay animation
  var replayRAF = null;

  function resize(){
    var r = paperWrap.getBoundingClientRect();
    canvas.width = Math.max(1, Math.round(r.width*dpr));
    canvas.height = Math.max(1, Math.round(r.height*dpr));
    canvas.style.width = r.width+'px';
    canvas.style.height = r.height+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    render();
  }
  window.addEventListener('resize', resize);
  if (window.ResizeObserver){
    new ResizeObserver(resize).observe(paperWrap);
  }

  /* ---------------- layout: word-wrap the text into lines ---------------- */
  function wrapLines(text, maxWidth, fontSize){
    ctx.font = (fontSize)+'px cursive, "Segoe Script", "Bradley Hand", system-ui';
    var paragraphs = text.split('\n');
    var lines = [];
    paragraphs.forEach(function(p){
      if (p.length===0){ lines.push(''); return; }
      var words = p.split(' ');
      var cur = '';
      for (var i=0;i<words.length;i++){
        var test = cur ? (cur+' '+words[i]) : words[i];
        if (ctx.measureText(test).width > maxWidth && cur){
          lines.push(cur);
          cur = words[i];
        } else {
          cur = test;
        }
      }
      lines.push(cur);
    });
    return lines;
  }

  /* ---------------- core render ---------------- */
  function render(){
    var w = canvas.width/dpr, h = canvas.height/dpr;
    var paper = PAPERS[state.paper];
    var pen = PENS[state.pen];

    // paper background
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = paper.bg;
    ctx.fillRect(0,0,w,h);

    if (paper.aged){
      var rngA = mulberry32(state.seed^0xA5A5);
      ctx.save();
      ctx.globalAlpha = 0.12;
      for (var s=0;s<26;s++){
        ctx.fillStyle = '#00000010';
        var rx=rngA()*w, ry=rngA()*h, rr=20+rngA()*70;
        var grad = ctx.createRadialGradient(rx,ry,0,rx,ry,rr);
        grad.addColorStop(0,'rgba(90,60,20,0.35)');
        grad.addColorStop(1,'rgba(90,60,20,0)');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(rx,ry,rr,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }

    var lineHeight = state.size*1.55;
    var marginX = Math.max(24, w*0.06);
    var marginTop = lineHeight*0.9;

    if (paper.lines){
      ctx.strokeStyle = 'rgba(60,80,140,0.18)';
      ctx.lineWidth = 1;
      for (var y=marginTop; y<h-8; y+=lineHeight){
        ctx.beginPath(); ctx.moveTo(0,y+lineHeight*0.62); ctx.lineTo(w,y+lineHeight*0.62); ctx.stroke();
      }
      ctx.strokeStyle='rgba(190,60,60,0.28)';
      ctx.beginPath(); ctx.moveTo(marginX*0.5,0); ctx.lineTo(marginX*0.5,h); ctx.stroke();
    }
    if (paper.grid){
      ctx.strokeStyle = 'rgba(60,120,80,0.16)';
      ctx.lineWidth = 1;
      var step = lineHeight*0.5;
      for (var gx=0; gx<w; gx+=step){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,h); ctx.stroke(); }
      for (var gy=0; gy<h; gy+=step){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(w,gy); ctx.stroke(); }
    }

    var lines = wrapLines(state.text, w - marginX*1.6, state.size);
    var rng = mulberry32(state.seed);

    ctx.font = state.size+'px cursive, "Segoe Script", "Bradley Hand", system-ui';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = state.color;
    ctx.globalCompositeOperation = pen.composite;

    var totalChars = 0;
    for (var li=0; li<lines.length; li++) totalChars += lines[li].length;
    var charsSoFar = 0;
    var slantRad = state.slant*Math.PI/180;
    var jitterAmt = (state.jitter/100)*3.2;
    var wobbleAmt = (state.wobble/100)*7;

    for (var l=0; l<lines.length; l++){
      var lineY = marginTop + l*lineHeight;
      if (lineY > h+lineHeight) break;
      var line = lines[l];
      var x = marginX;
      for (var ci=0; ci<line.length; ci++){
        var ch = line[ci];
        var reveal = totalChars>0 ? (charsSoFar/totalChars) : 1;
        charsSoFar++;
        if (reveal > writeProgress) continue;

        var w0 = ctx.measureText(ch).width;
        if (ch===' '){ x += w0 + state.spacing + 2; continue; }

        var jx = (rng()-0.5)*jitterAmt*2;
        var jy = (rng()-0.5)*jitterAmt*2;
        var wob = Math.sin((x+l*40)*0.045)*wobbleAmt*0.3 + (rng()-0.5)*wobbleAmt*0.5;
        var rot = ((rng()-0.5)*0.10) + slantRad*0.12;
        var scaleV = 0.92 + rng()*0.16;
        var alphaV = pen.alpha * (0.82 + rng()*0.22);

        ctx.save();
        ctx.translate(x + jx, lineY + wob + jy);
        ctx.rotate(rot);
        ctx.scale(scaleV, scaleV);
        ctx.transform(1,0, Math.tan(slantRad*0.9), 1, 0,0);
        ctx.globalAlpha = Math.min(1, alphaV);

        if (pen.blur>0){ ctx.shadowColor = state.color; ctx.shadowBlur = pen.blur*3; }
        ctx.fillText(ch, 0, 0);
        if (pen.bleed>0){
          ctx.globalAlpha = alphaV*0.28;
          ctx.fillText(ch, pen.bleed*0.4, pen.bleed*0.3);
        }
        ctx.restore();

        if (pen.grain>0){
          ctx.save();
          ctx.globalAlpha = 0.5;
          ctx.globalCompositeOperation = 'source-over';
          ctx.fillStyle = state.color;
          var grainN = Math.floor(4*pen.grain);
          for (var gI=0; gI<grainN; gI++){
            var gx2 = x + rng()*w0;
            var gy2 = lineY + wob + (rng()-0.5)*state.size*0.5;
            if (rng() < 0.5){
              ctx.globalAlpha = rng()*0.35;
              ctx.fillRect(gx2, gy2, 1, 1);
            }
          }
          ctx.restore();
        }

        x += w0 + state.spacing;
      }
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }

  /* ---------------- replay animation ---------------- */
  function replay(){
    if (replayRAF) cancelAnimationFrame(replayRAF);
    writeProgress = 0;
    var start = null;
    var duration = Math.min(4200, 900 + state.text.length*18);
    function step(ts){
      if (start===null) start = ts;
      var t = (ts-start)/duration;
      writeProgress = Math.min(1, t);
      render();
      if (t < 1){ replayRAF = requestAnimationFrame(step); }
      else { replayRAF = null; }
    }
    replayRAF = requestAnimationFrame(step);
  }

  /* ---------------- UI wiring ---------------- */
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toast.classList.remove('show'); }, 1600);
  }

  function buildChips(container, order, dict, key){
    container.innerHTML='';
    order.forEach(function(id){
      var b = document.createElement('div');
      b.className = 'chip'+(state[key]===id?' active':'');
      b.textContent = dict[id].label;
      b.addEventListener('click', function(){
        state[key]=id;
        if (key==='pen' && !userPickedColor){ state.color = dict[id].defaultColor; inkColor.value = state.color; }
        buildChips(container, order, dict, key);
        render();
        persistLast();
      });
      container.appendChild(b);
    });
  }

  var userPickedColor = false;
  var penRow = document.getElementById('penRow');
  var paperRow = document.getElementById('paperRow');
  var inkColor = document.getElementById('inkColor');
  var sizeSlider = document.getElementById('sizeSlider');
  var slantSlider = document.getElementById('slantSlider');
  var jitterSlider = document.getElementById('jitterSlider');
  var wobbleSlider = document.getElementById('wobbleSlider');
  var spaceSlider = document.getElementById('spaceSlider');

  buildChips(penRow, PEN_ORDER, PENS, 'pen');
  buildChips(paperRow, PAPER_ORDER, PAPERS, 'paper');
  inkColor.value = state.color;

  inkColor.addEventListener('input', function(){ userPickedColor=true; state.color=inkColor.value; render(); persistLast(); });
  sizeSlider.addEventListener('input', function(){ state.size=+sizeSlider.value; document.getElementById('sizeVal').textContent=state.size; render(); persistLast(); });
  slantSlider.addEventListener('input', function(){ state.slant=+slantSlider.value; document.getElementById('slantVal').textContent=state.slant; render(); persistLast(); });
  jitterSlider.addEventListener('input', function(){ state.jitter=+jitterSlider.value; document.getElementById('jitterVal').textContent=state.jitter; render(); persistLast(); });
  wobbleSlider.addEventListener('input', function(){ state.wobble=+wobbleSlider.value; document.getElementById('wobbleVal').textContent=state.wobble; render(); persistLast(); });
  spaceSlider.addEventListener('input', function(){ state.spacing=+spaceSlider.value; document.getElementById('spaceVal').textContent=state.spacing; render(); persistLast(); });

  document.getElementById('reseedBtn').addEventListener('click', function(){
    state.seed = Math.floor(Math.random()*1000000)+1;
    render(); persistLast();
    showToast('New ink personality rolled');
  });
  document.getElementById('replayBtn').addEventListener('click', replay);

  document.getElementById('exportBtn').addEventListener('click', function(){
    writeProgress = 1;
    render();
    canvas.toBlob(function(blob){
      if (!blob){ showToast('Export failed'); return; }
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'quill-note.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      showToast('PNG downloaded');
    }, 'image/png');
  });

  document.getElementById('shareBtn').addEventListener('click', function(){
    var payload = {t:state.text, pe:state.pen, pa:state.paper, c:state.color, s:state.size, sl:state.slant, j:state.jitter, w:state.wobble, sp:state.spacing, se:state.seed};
    var encoded;
    try { encoded = btoa(encodeURIComponent(JSON.stringify(payload))); }
    catch(e){ showToast('Could not encode share link'); return; }
    var url = location.origin + location.pathname + '#n=' + encoded;
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){ showToast('Share link copied'); }).catch(function(){ showToast(url); });
    } else {
      showToast('Copy: '+url);
    }
    location.hash = 'n='+encoded;
  });

  document.getElementById('saveBtn').addEventListener('click', function(){
    var notes = loadNotes();
    var entry = {
      id: 'n'+Date.now()+Math.floor(Math.random()*1000),
      text: state.text,
      pen: state.pen, paper: state.paper, color: state.color,
      size: state.size, slant: state.slant, jitter: state.jitter,
      wobble: state.wobble, spacing: state.spacing, seed: state.seed,
      saved: Date.now()
    };
    notes.unshift(entry);
    if (notes.length > 30) notes.length = 30;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    renderNotes();
    showToast('Note saved');
  });

  function loadNotes(){
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'); }
    catch(e){ return []; }
  }

  function renderNotes(){
    var notes = loadNotes();
    document.getElementById('notesCount').textContent = notes.length;
    var list = document.getElementById('notesList');
    list.innerHTML='';
    if (!notes.length){
      var e = document.createElement('div');
      e.className='empty';
      e.textContent='No saved notes yet — write something and hit Save.';
      list.appendChild(e);
      return;
    }
    notes.forEach(function(n){
      var row = document.createElement('div');
      row.className='noteItem';
      var txt = document.createElement('div');
      txt.className='txt';
      txt.textContent = (n.text||'').replace(/\n/g,' ') || '(empty)';
      row.appendChild(txt);
      var del = document.createElement('div');
      del.className='del';
      del.textContent='✕';
      del.addEventListener('click', function(ev){
        ev.stopPropagation();
        var all = loadNotes().filter(function(x){return x.id!==n.id;});
        localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
        renderNotes();
      });
      row.appendChild(del);
      row.addEventListener('click', function(){
        state.text=n.text; state.pen=n.pen; state.paper=n.paper; state.color=n.color;
        state.size=n.size; state.slant=n.slant; state.jitter=n.jitter; state.wobble=n.wobble;
        state.spacing=n.spacing; state.seed=n.seed;
        userPickedColor = true;
        syncControlsFromState();
        textInput.value = state.text;
        writeProgress = 1;
        render(); persistLast();
        showToast('Note loaded');
      });
      list.appendChild(row);
    });
  }

  function syncControlsFromState(){
    buildChips(penRow, PEN_ORDER, PENS, 'pen');
    buildChips(paperRow, PAPER_ORDER, PAPERS, 'paper');
    inkColor.value = state.color;
    sizeSlider.value = state.size; document.getElementById('sizeVal').textContent = state.size;
    slantSlider.value = state.slant; document.getElementById('slantVal').textContent = state.slant;
    jitterSlider.value = state.jitter; document.getElementById('jitterVal').textContent = state.jitter;
    wobbleSlider.value = state.wobble; document.getElementById('wobbleVal').textContent = state.wobble;
    spaceSlider.value = state.spacing; document.getElementById('spaceVal').textContent = state.spacing;
  }

  function persistLast(){
    try{
      localStorage.setItem(LAST_KEY, JSON.stringify({
        text:state.text, pen:state.pen, paper:state.paper, color:state.color,
        size:state.size, slant:state.slant, jitter:state.jitter, wobble:state.wobble,
        spacing:state.spacing, seed:state.seed
      }));
    }catch(e){}
  }

  /* toolbar / notes drawer toggles */
  var toolbar = document.getElementById('toolbar');
  var toolbarToggle = document.getElementById('toolbarToggle');
  var notesDrawer = document.getElementById('notesDrawer');
  var notesToggle = document.getElementById('notesToggle');
  toolbarToggle.addEventListener('click', function(){
    toolbar.classList.toggle('open');
    notesDrawer.classList.remove('open');
  });
  notesToggle.addEventListener('click', function(){
    notesDrawer.classList.toggle('open');
    toolbar.classList.remove('open');
    renderNotes();
  });

  /* text input wiring */
  var typingTimer = null;
  textInput.addEventListener('input', function(){
    state.text = textInput.value;
    writeProgress = 1;
    render();
    clearTimeout(typingTimer);
    typingTimer = setTimeout(persistLast, 400);
  });

  /* ---------------- boot: load share-link or last session ---------------- */
  function tryLoadFromHash(){
    var m = location.hash.match(/n=([^&]+)/);
    if (!m) return false;
    try{
      var payload = JSON.parse(decodeURIComponent(atob(m[1])));
      state.text = payload.t!=null?payload.t:state.text;
      state.pen = PENS[payload.pe]?payload.pe:state.pen;
      state.paper = PAPERS[payload.pa]?payload.pa:state.paper;
      state.color = payload.c||state.color;
      state.size = payload.s||state.size;
      state.slant = (payload.sl!=null)?payload.sl:state.slant;
      state.jitter = (payload.j!=null)?payload.j:state.jitter;
      state.wobble = (payload.w!=null)?payload.w:state.wobble;
      state.spacing = (payload.sp!=null)?payload.sp:state.spacing;
      state.seed = payload.se||state.seed;
      userPickedColor = true;
      return true;
    }catch(e){ return false; }
  }

  function tryLoadLast(){
    try{
      var raw = localStorage.getItem(LAST_KEY);
      if (!raw) return false;
      var p = JSON.parse(raw);
      state.text = p.text!=null?p.text:state.text;
      state.pen = PENS[p.pen]?p.pen:state.pen;
      state.paper = PAPERS[p.paper]?p.paper:state.paper;
      state.color = p.color||state.color;
      state.size = p.size||state.size;
      state.slant = (p.slant!=null)?p.slant:state.slant;
      state.jitter = (p.jitter!=null)?p.jitter:state.jitter;
      state.wobble = (p.wobble!=null)?p.wobble:state.wobble;
      state.spacing = (p.spacing!=null)?p.spacing:state.spacing;
      state.seed = p.seed||state.seed;
      userPickedColor = true;
      return true;
    }catch(e){ return false; }
  }

  var loadedFromHash = tryLoadFromHash();
  if (!loadedFromHash) tryLoadLast();
  textInput.value = state.text;
  syncControlsFromState();
  renderNotes();
  resize();
  if (loadedFromHash) replay();
})();
</script>
</body>
</html>
