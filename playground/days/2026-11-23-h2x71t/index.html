<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Kiln — Pottery Wheel Studio</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:#ece6df;
  background:
    radial-gradient(1200px 700px at 72% -10%,#2a1d16 0%,transparent 60%),
    radial-gradient(900px 600px at 8% 100%,#17211f 0%,transparent 55%),
    #0c0a09;
  overflow:hidden;
}
.shell{display:flex;flex-direction:column;height:100%}
header.top{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px 14px;border-bottom:1px solid #2a211c;
  background:linear-gradient(#17120ecc,#120e0bcc);backdrop-filter:blur(10px);
}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand h1{font-size:17px;margin:0;letter-spacing:.14em;text-transform:uppercase;font-weight:650}
.brand .sub{font-size:11px;color:#9b8a7c;letter-spacing:.06em;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:#e0894f;box-shadow:0 0 12px #e0894f;align-self:center}
.stats{display:flex;gap:12px;font-variant-numeric:tabular-nums;font-size:11.5px;color:#a89787;margin-left:4px}
.stats b{color:#f0dcc9;font-weight:600}
.acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{
  font:inherit;font-size:12px;color:#e8ddd2;background:#231a15;border:1px solid #3a2b22;
  padding:6px 11px;border-radius:9px;cursor:pointer;transition:.16s;white-space:nowrap
}
.btn:hover{background:#2e221a;border-color:#563d2c;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(#c8723f,#9e5227);border-color:#d7884f;color:#fff8f1;font-weight:600}
.btn.primary:hover{background:linear-gradient(#d87f48,#ad5b2c)}
.btn.on{background:#1f3b36;border-color:#3e7a6b;color:#bdf0e2}
main{flex:1;display:grid;grid-template-columns:1fr 326px;min-height:0}
.stage{position:relative;min-height:0;overflow:hidden}
#view{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.dock{
  position:absolute;left:50%;transform:translateX(-50%);bottom:14px;
  display:flex;gap:4px;padding:5px;border-radius:14px;
  background:#120e0bb8;border:1px solid #3a2b2288;backdrop-filter:blur(12px);
  box-shadow:0 12px 30px #0008
}
.dock button{
  font:inherit;font-size:11.5px;color:#cdbcac;background:transparent;border:0;
  padding:7px 12px;border-radius:10px;cursor:pointer;transition:.15s;letter-spacing:.02em
}
.dock button:hover{color:#fff;background:#ffffff14}
.dock button.sel{background:linear-gradient(#c8723f,#95491f);color:#fff;font-weight:600;box-shadow:0 2px 10px #c8723f55}
.hint{
  position:absolute;top:12px;left:12px;font-size:11px;color:#a08d7d;
  background:#120e0b9e;border:1px solid #32261f;padding:5px 10px;border-radius:999px;
  backdrop-filter:blur(8px);pointer-events:none;transition:opacity .5s
}
.toast{
  position:absolute;left:50%;transform:translateX(-50%);top:14px;
  background:#1d2a26e6;border:1px solid #3f6a5c;color:#c9f3e4;
  padding:7px 14px;border-radius:999px;font-size:12px;pointer-events:none;
  opacity:0;transition:.3s;z-index:9
}
.toast.show{opacity:1}
aside.panel{
  border-left:1px solid #2a211c;background:#100d0bd9;display:flex;flex-direction:column;min-height:0;
  backdrop-filter:blur(8px)
}
.tabs{display:flex;padding:8px 8px 0;gap:4px;border-bottom:1px solid #241c17}
.tabs button{
  flex:1;font:inherit;font-size:12px;color:#9d8c7e;background:transparent;border:0;
  padding:8px 4px;border-radius:9px 9px 0 0;cursor:pointer;border-bottom:2px solid transparent
}
.tabs button.sel{color:#f3e3d3;border-bottom-color:#d7884f;background:#ffffff08}
.panes{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:12px 13px 26px}
.pane{display:none}
.pane.sel{display:block}
.grp{margin-bottom:16px}
.grp>h3{
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#8a7868;
  margin:0 0 8px;font-weight:600
}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  font:inherit;font-size:11.5px;color:#d4c4b4;background:#1d1611;border:1px solid #352821;
  padding:5px 9px;border-radius:8px;cursor:pointer;transition:.15s
}
.chip:hover{background:#2a2018;border-color:#5a4132}
.chip.sel{background:#3b2718;border-color:#d7884f;color:#ffe6cf}
.chip .sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid #0006}
.row{display:flex;align-items:center;gap:9px;margin:9px 0}
.row label{font-size:11.5px;color:#a3917f;flex:0 0 76px}
.row input[type=range]{flex:1;accent-color:#d7884f;min-width:0;height:18px}
.row .val{flex:0 0 46px;text-align:right;font-size:11px;color:#e3d2c0;font-variant-numeric:tabular-nums}
.row input[type=color]{width:34px;height:24px;padding:0;border:1px solid #3a2b22;border-radius:6px;background:#1d1611}
#profEd{
  display:block;width:100%;height:208px;border-radius:12px;border:1px solid #2e241d;
  background:linear-gradient(#17120f,#0f0c0a);touch-action:none;cursor:crosshair;margin-top:4px
}
.note{font-size:11px;color:#7f6d5e;margin:7px 0 0;line-height:1.5}
.shelf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{
  background:#19130f;border:1px solid #30251e;border-radius:11px;padding:7px;
  cursor:pointer;transition:.15s;position:relative
}
.card:hover{border-color:#6c4b34;transform:translateY(-2px)}
.card canvas{display:block;width:100%;height:84px;border-radius:7px;background:#0d0a08}
.card .nm{font-size:11px;color:#cdbcab;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .x{
  position:absolute;top:4px;right:4px;width:19px;height:19px;border-radius:6px;border:0;
  background:#000000a8;color:#e8b8a0;font-size:12px;line-height:1;cursor:pointer;display:none
}
.card:hover .x{display:block}
.empty{font-size:11.5px;color:#7a6859;padding:14px 2px}
@media(max-width:900px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,46vh)}
  aside.panel{border-left:0;border-top:1px solid #2a211c}
  .stats{display:none}
  .brand .sub{display:none}
  #profEd{height:168px}
  .dock{bottom:10px}
}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><span class="dot"></span><h1>Kiln</h1><span class="sub">Pottery Wheel Studio</span></div>
    <div class="stats" id="stats"></div>
    <div class="acts">
      <button class="btn" id="spinBtn">Wheel</button>
      <button class="btn primary" id="fireBtn">Fire</button>
      <button class="btn" id="pngBtn">PNG</button>
      <button class="btn" id="objBtn">OBJ</button>
      <button class="btn" id="shareBtn">Share</button>
    </div>
  </header>
  <main>
    <section class="stage" id="stage">
      <canvas id="view"></canvas>
      <div class="hint" id="hint">Drag on the clay to throw it · scroll to zoom · 1–4 tools</div>
      <div class="dock" id="dock"></div>
      <div class="toast" id="toast"></div>
    </section>
    <aside class="panel">
      <div class="tabs" id="tabs">
        <button data-p="form" class="sel">Form</button>
        <button data-p="glaze">Glaze</button>
        <button data-p="shelf">Shelf</button>
      </div>
      <div class="panes">
        <div class="pane sel" id="pane-form"></div>
        <div class="pane" id="pane-glaze"></div>
        <div class="pane" id="pane-shelf"></div>
      </div>
    </aside>
  </main>
</div>
<script>
(function(){
'use strict';

/* ---------------------------------------------------------------- state */
var PN = 96;                 // profile resolution (radii from base to rim)
var RMAX = 12;               // cm — radius at profile value 1
var LS_KEY = 'kiln_shelf_v1';

var P = {
  h: 24,                     // height in cm
  rings: 68, segs: 48,       // mesh resolution
  flutes: 0, fluteN: 12, twist: 0,
  gloss: 0.72, mottle: 0.26,
  glaze: 'celadon', c1: '#d2e6d7', c2: '#89b39d',
  brush: 0.12, strength: 0.55,
  tool: 'shape'
};

var prof = new Float32Array(PN);
var yaw = 0.6, pitch = 0.34, zoom = 1, spinning = true;
var fireT = 1, fireTarget = 1;
var dirty = true, lastT = 0;

var PRESETS = {
  Vase:    { h:26, k:[[0,.26],[.07,.33],[.3,.62],[.55,.6],[.78,.35],[.9,.29],[1,.34]] },
  Bowl:    { h:13, k:[[0,.2],[.14,.5],[.5,.78],[.82,.92],[1,.97]] },
  Bottle:  { h:30, k:[[0,.3],[.1,.42],[.34,.5],[.55,.42],[.7,.15],[.86,.12],[1,.18]] },
  Amphora: { h:30, k:[[0,.13],[.06,.22],[.26,.56],[.46,.6],[.63,.41],[.76,.25],[.89,.3],[1,.33]] },
  Tumbler: { h:12, k:[[0,.3],[.1,.33],[.5,.37],[.9,.41],[1,.43]] },
  Goblet:  { h:20, k:[[0,.4],[.07,.1],[.3,.08],[.46,.13],[.54,.32],[.72,.47],[1,.5]] },
  Plate:   { h:5,  k:[[0,.34],[.1,.54],[.42,.82],[.8,.97],[1,1]] },
  Jar:     { h:18, k:[[0,.3],[.1,.45],[.4,.61],[.7,.56],[.86,.41],[.94,.44],[1,.47]] }
};

var GLAZES = {
  celadon:   { n:'Celadon',   c1:'#d2e6d7', c2:'#89b39d', g:.78, m:.22 },
  porcelain: { n:'Porcelain', c1:'#f4f1e8', c2:'#ddd7c8', g:.9,  m:.1  },
  cobalt:    { n:'Cobalt',    c1:'#8fb4f2', c2:'#1e3a85', g:.85, m:.3  },
  tenmoku:   { n:'Tenmoku',   c1:'#c4903f', c2:'#331a0f', g:.8,  m:.42 },
  raku:      { n:'Raku',      c1:'#d2673a', c2:'#1a1c21', g:.5,  m:.5  },
  oxblood:   { n:'Oxblood',   c1:'#a82c2c', c2:'#4d0d14', g:.74, m:.34 },
  matte:     { n:'Matte Ash', c1:'#3c3c46', c2:'#1d1d24', g:.12, m:.2  },
  chun:      { n:'Chun Blue', c1:'#cdeef0', c2:'#5aa8ba', g:.88, m:.36 },
  shino:     { n:'Shino',     c1:'#efd9b0', c2:'#a9663a', g:.34, m:.44 },
  terra:     { n:'Terracotta',c1:'#e3a67c', c2:'#a9512f', g:.22, m:.26 }
};
var CLAY1 = [150,108,86], CLAY2 = [108,74,58];

/* ---------------------------------------------------------- utilities */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function hex2rgb(h){
  h = h.replace('#','');
  if(h.length===3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var n = parseInt(h,16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

/* ------------------------------------------------------------ profile */
function profileFromKeys(keys){
  var out = new Float32Array(PN), i, s;
  for(i=0;i<PN;i++){
    var t = i/(PN-1), a = keys[0], b = keys[keys.length-1];
    for(s=0;s<keys.length-1;s++){
      if(t>=keys[s][0] && t<=keys[s+1][0]){ a=keys[s]; b=keys[s+1]; break; }
    }
    var span = b[0]-a[0];
    var u = span>1e-6 ? (t-a[0])/span : 0;
    u = u*u*(3-2*u);
    out[i] = lerp(a[1],b[1],u);
  }
  // soften the joins
  for(var pass=0;pass<3;pass++){
    var cp = out.slice();
    for(i=1;i<PN-1;i++) out[i] = cp[i-1]*0.25 + cp[i]*0.5 + cp[i+1]*0.25;
  }
  return out;
}
function applyPreset(name){
  var pr = PRESETS[name];
  prof = profileFromKeys(pr.k);
  P.h = pr.h;
  syncInputs(); rebuild();
}

// brush: t in 0..1 height, target radius 0..1
function brushAt(t, target){
  var i, w, tk, bw = Math.max(0.015, P.brush), st = P.strength;
  if(P.tool==='smooth'){
    var blur = new Float32Array(PN);
    for(i=0;i<PN;i++){
      var a = prof[Math.max(0,i-2)], b = prof[Math.max(0,i-1)], c = prof[i],
          d = prof[Math.min(PN-1,i+1)], e = prof[Math.min(PN-1,i+2)];
      blur[i] = (a+2*b+3*c+2*d+e)/9;
    }
    for(i=0;i<PN;i++){
      tk = i/(PN-1); w = Math.exp(-0.5*Math.pow((tk-t)/bw,2));
      prof[i] = lerp(prof[i], blur[i], w*st);
    }
  } else if(P.tool==='rib'){
    var nb = bw*0.3;
    for(i=0;i<PN;i++){
      tk = i/(PN-1); w = Math.exp(-0.5*Math.pow((tk-t)/nb,2));
      prof[i] = clamp(prof[i] - w*st*0.07, 0.015, 1);
    }
  } else { // shape — the wall follows the pointer
    for(i=0;i<PN;i++){
      tk = i/(PN-1); w = Math.exp(-0.5*Math.pow((tk-t)/bw,2));
      prof[i] = clamp(lerp(prof[i], target, w*st*0.55), 0.015, 1);
    }
  }
  rebuild();
}

/* --------------------------------------------------------------- mesh */
var MR = 0, MS = 0;                 // built ring / segment counts
var VX, VY, VZ, NX, NY, NZ;         // object-space verts + normals
var SX, SY, DZ, VNX, VNY, VNZ;      // projected + view-space normals
var ringT, ringY, RAD, RNR, RNY;

function rebuild(){ meshDirty = true; dirty = true; statsDirty = true; }
var meshDirty = true, statsDirty = true;

function buildMesh(){
  var rings = MR = (P.rings|0) + 1;   // +1 for the base-cap centre ring
  // a flute needs ~6 facets to read as a curve rather than a sawtooth
  var need = P.flutes > 0.005 ? Math.ceil(P.fluteN*6) : 0;
  var segs  = MS = Math.max(8, Math.min(120, Math.max(P.segs|0, need)));
  var n = rings*segs, i, j, o;
  if(!VX || VX.length !== n){
    VX=new Float32Array(n); VY=new Float32Array(n); VZ=new Float32Array(n);
    NX=new Float32Array(n); NY=new Float32Array(n); NZ=new Float32Array(n);
    SX=new Float32Array(n); SY=new Float32Array(n); DZ=new Float32Array(n);
    VNX=new Float32Array(n); VNY=new Float32Array(n); VNZ=new Float32Array(n);
    ringT=new Float32Array(rings); ringY=new Float32Array(rings);
    RAD=new Float32Array(rings); RNR=new Float32Array(rings); RNY=new Float32Array(rings);
  }
  var cosT=[], sinT=[];
  for(j=0;j<segs;j++){ var a=j/segs*Math.PI*2; cosT.push(Math.cos(a)); sinT.push(Math.sin(a)); }

  for(i=0;i<rings;i++){
    var t = i===0 ? 0 : (i-1)/(rings-2);
    ringT[i] = t;
    var y = (t-0.5)*P.h; ringY[i] = y;
    var f = t*(PN-1), fi = f|0, ff = f-fi;
    var r0 = prof[fi], r1 = prof[Math.min(PN-1,fi+1)];
    var rad = lerp(r0,r1,ff)*RMAX;
    if(i===0) rad = 0.0008;           // closed bottom
    RAD[i] = rad;
    for(j=0;j<segs;j++){
      var th = j/segs*Math.PI*2;
      var m = 1 + P.flutes*Math.cos(P.fluteN*th + P.twist*t);
      var rr = rad*m;
      o = i*segs+j;
      VX[o] = rr*cosT[j]; VY[o] = y; VZ[o] = rr*sinT[j];
    }
  }
  // smooth meridian normal per ring — fluting must not fracture the facing test
  for(i=0;i<rings;i++){
    var pa = Math.max(0,i-1), pb = Math.min(rings-1,i+1);
    var dr = RAD[pb]-RAD[pa], dy = ringY[pb]-ringY[pa];
    if(i===0){ RNR[i]=0; RNY[i]=-1; }
    else {
      var Lm = Math.sqrt(dr*dr+dy*dy)||1;
      RNR[i]=dy/Lm; RNY[i]=-dr/Lm;
    }
  }
  // normals by finite differences on the grid
  for(i=0;i<rings;i++){
    var ia = Math.max(0,i-1), ib = Math.min(rings-1,i+1);
    for(j=0;j<segs;j++){
      var ja = (j-1+segs)%segs, jb = (j+1)%segs;
      var oa = ia*segs+j, ob = ib*segs+j, pa = i*segs+ja, pb = i*segs+jb;
      var ux = VX[ob]-VX[oa], uy = VY[ob]-VY[oa], uz = VZ[ob]-VZ[oa];
      var vx = VX[pb]-VX[pa], vy = VY[pb]-VY[pa], vz = VZ[pb]-VZ[pa];
      var nx = uy*vz-uz*vy, ny = uz*vx-ux*vz, nz = ux*vy-uy*vx;
      var L = Math.sqrt(nx*nx+ny*ny+nz*nz) || 1;
      o = i*segs+j;
      NX[o]=nx/L; NY[o]=ny/L; NZ[o]=nz/L;
    }
  }
  meshDirty = false;
}

/* ------------------------------------------------------------ shading */
var LIGHT = [-0.42,0.66,0.62], FILL = [0.55,-0.2,0.5];
(function(){
  function nrm(v){ var L=Math.hypot(v[0],v[1],v[2]); v[0]/=L;v[1]/=L;v[2]/=L; }
  nrm(LIGHT); nrm(FILL);
})();
var HALF = [LIGHT[0], LIGHT[1], LIGHT[2]+1];
(function(){ var L=Math.hypot(HALF[0],HALF[1],HALF[2]); HALF[0]/=L;HALF[1]/=L;HALF[2]/=L; })();

var g1 = [0,0,0], g2 = [0,0,0];
function refreshGlazeColors(){
  var a = hex2rgb(P.c1), b = hex2rgb(P.c2);
  for(var i=0;i<3;i++){
    g1[i] = lerp(CLAY1[i], a[i], fireT);
    g2[i] = lerp(CLAY2[i], b[i], fireT);
  }
}

function shade(nx,ny,nz,t,inside,noise){
  if(inside){ nx=-nx; ny=-ny; nz=-nz; }
  var d = nx*LIGHT[0]+ny*LIGHT[1]+nz*LIGHT[2]; if(d<0) d=0;
  var f = nx*FILL[0]+ny*FILL[1]+nz*FILL[2];    if(f<0) f=0;
  var s = nx*HALF[0]+ny*HALF[1]+nz*HALF[2];    if(s<0) s=0;
  var gl = lerp(0.05, P.gloss, fireT);
  s = Math.pow(s, 14 + 60*gl) * gl * 1.25;
  var rim = Math.pow(1-Math.min(1,Math.abs(nz)), 4) * 0.22;
  var amb = inside ? 0.14 : 0.2;
  var mul = amb + 0.82*d + 0.26*f + rim;
  if(inside) mul *= 0.52;
  var mo = 1 + P.mottle*fireT*(noise-0.5)*0.9;
  var tt = clamp(t,0,1);
  var r = (lerp(g2[0],g1[0],tt)*mul*mo + 255*s);
  var g = (lerp(g2[1],g1[1],tt)*mul*mo + 255*s);
  var b = (lerp(g2[2],g1[2],tt)*mul*mo + 255*s);
  return 'rgb(' + (r<0?0:r>255?255:r|0) + ',' + (g<0?0:g>255?255:g|0) + ',' + (b<0?0:b>255?255:b|0) + ')';
}
function noiseAt(i,j){
  return 0.5 + 0.25*Math.sin(i*0.41+j*0.17) + 0.15*Math.sin(j*0.63-i*0.22)
            + 0.1*Math.sin(i*1.13+j*0.95);
}

/* -------------------------------------------------------------- render */
var view = document.getElementById('view'), vctx = view.getContext('2d');
var VW = 0, VH = 0, DPR = 1, SCALE = 1, CXp = 0, CYp = 0;

function resize(){
  var r = view.parentNode.getBoundingClientRect();
  DPR = Math.min(1.5, window.devicePixelRatio||1);
  VW = Math.max(240, r.width|0); VH = Math.max(240, r.height|0);
  view.width = (VW*DPR)|0; view.height = (VH*DPR)|0;
  view.style.width = VW+'px'; view.style.height = VH+'px';
  dirty = true;
}

function computeScale(){
  SCALE = Math.min(VW*0.40/RMAX, VH*0.42/(P.h/2+1)) * zoom;
  CXp = VW*0.5; CYp = VH*0.52;
}

function project(){
  var cy = Math.cos(yaw), sy = Math.sin(yaw);
  var cp = Math.cos(pitch), sp = Math.sin(pitch);
  var n = MR*MS, i;
  for(i=0;i<n;i++){
    var x = VX[i], y = VY[i], z = VZ[i];
    var x1 = x*cy + z*sy, z1 = -x*sy + z*cy;
    var y2 = y*cp - z1*sp, z2 = y*sp + z1*cp;
    SX[i] = CXp + x1*SCALE; SY[i] = CYp - y2*SCALE; DZ[i] = z2;
    x = NX[i]; y = NY[i]; z = NZ[i];
    x1 = x*cy + z*sy; z1 = -x*sy + z*cy;
    VNX[i] = x1; VNY[i] = y*cp - z1*sp; VNZ[i] = y*sp + z1*cp;
  }
}

var runs = [];
var faceBuf = null, dirBuf = null, mxBuf = null;
// quality ladder: merge horizontally first (a gradient hides that), only then
// merge rings vertically (which terraces the shading, so it is the last resort)
var QLEVELS = [[4,1],[3,1],[2,1],[2,2],[2,3]];
var qLevel = 0, ringStep = 1, chunkDiv = 4, fpsEMA = 16, cool = 0;
var culled = 0;

// Can the inside of the wall at ring i be seen through the mouth of the pot?
// Walk the meridian ray from the far wall toward the viewer and check it stays
// inside the vessel until it clears the rim.
function interiorVisible(i){
  var sp = Math.sin(pitch), cp = Math.cos(pitch);
  if(sp < 0.004) return false;
  var yA = ringY[i], rA = RAD[i];
  var yTop = ringY[MR-1], rTop = RAD[MR-1];
  if(yA >= yTop-1e-6) return true;
  var cot = cp/sp;
  if(-rA + cot*(yTop-yA) > rTop*1.08) return false;
  for(var k=1;k<6;k++){
    var y = yA + (yTop-yA)*k/6;
    var u = -rA + cot*(y-yA);
    var t = (y + P.h/2)/P.h;
    var f = clamp(t,0,1)*(PN-1), fi = f|0;
    var r = lerp(prof[fi], prof[Math.min(PN-1,fi+1)], f-fi)*RMAX;
    if(Math.abs(u) > r*1.2) return false;
  }
  return true;
}
var sinJ = null, sinJyaw = 0;

function buildRuns(){
  runs.length = 0;
  var segs = MS, rings = MR;
  chunkDiv = QLEVELS[qLevel][0]; ringStep = QLEVELS[qLevel][1];
  var chunk = Math.max(5, Math.round(segs/chunkDiv));
  var step = Math.max(1, Math.min(ringStep, rings-1));
  var cp = Math.cos(pitch), sp = Math.sin(pitch), j;
  if(!sinJ || sinJ.length !== segs) sinJ = new Float32Array(segs);
  for(j=0;j<segs;j++) sinJ[j] = Math.sin(j/segs*Math.PI*2 - yaw);
  if(!faceBuf || faceBuf.length !== segs){
    faceBuf = new Int8Array(segs); dirBuf = new Int8Array(segs); mxBuf = new Float32Array(segs);
  }
  var face = faceBuf, dir = dirBuf, mx = mxBuf;
  // flute ridges on the far side poke past the smooth limb, so widen the
  // front band by the flute depth — otherwise they fall into the culled
  // interior and chew holes out of the silhouette
  var bias = -4*Math.min(0.6, P.flutes*3.2);
  culled = 0;
  for(var i=0;i<rings-1;i+=step){
    var i2 = Math.min(rings-1, i+step);
    if(i2 === i) break;
    var inVis = interiorVisible(i2);
    var ra = i*segs, rb = i2*segs;
    var ka = RNR[i]*cp, kb = RNR[i2]*cp;
    var ya = RNY[i]*sp, yb = RNY[i2]*sp;
    for(j=0;j<segs;j++){
      var jn = (j+1)%segs;
      var zz = (ka*sinJ[j]+ya) + (ka*sinJ[jn]+ya) + (kb*sinJ[j]+yb) + (kb*sinJ[jn]+yb);
      face[j] = zz > bias ? 1 : 0;
      mx[j] = (SX[ra+j]+SX[rb+j])*0.5;
    }
    // a quad strip that folds back on itself in screen space cannot be filled
    // as one path (the winding cancels inside the fold), so cut runs wherever
    // the projected sweep reverses direction
    for(j=0;j<segs;j++) dir[j] = (mx[(j+1)%segs] - mx[j]) >= 0 ? 1 : 0;
    var start = 0;
    for(j=0;j<segs;j++){
      var pj = (j-1+segs)%segs;
      if(face[j] !== face[pj] || dir[j] !== dir[pj]){ start = j; break; }
    }
    var j0 = start, count = 0;
    while(count < segs){
      var f = face[j0 % segs], d0 = dir[j0 % segs], len = 0;
      while(count+len < segs && face[(j0+len)%segs] === f &&
            dir[(j0+len)%segs] === d0 && len < chunk) len++;
      if(len === 0) break;
      // overlap the next chunk by a quad to hide the seam — but never across a
      // facing boundary, where the extra quad would spike out past the limb
      var ext = (count+len < segs && face[(j0+len)%segs] === f &&
                 dir[(j0+len)%segs] === d0) ? 1 : 0;
      var mj = (j0 + (len*0.5|0)) % segs;
      if(f === 1 || inVis){
        runs.push({ i:i, i2:i2, j0:j0%segs, len:len+ext, front:f===1,
                    z: (DZ[ra+mj]+DZ[rb+mj])*0.5 });
      } else culled++;
      j0 += len; count += len;
    }
  }
  runs.sort(function(a,b){ return a.z - b.z; });
}

function drawRun(ctx,r,sc,noStroke){
  var segs = MS, i = r.i, i2 = r.i2, ra = i*segs, rb = i2*segs, k, j;
  ctx.beginPath();
  for(k=0;k<=r.len;k++){
    j = (r.j0+k)%segs;
    if(k===0) ctx.moveTo(SX[ra+j]*sc, SY[ra+j]*sc);
    else ctx.lineTo(SX[ra+j]*sc, SY[ra+j]*sc);
  }
  for(k=r.len;k>=0;k--){
    j = (r.j0+k)%segs;
    ctx.lineTo(SX[rb+j]*sc, SY[rb+j]*sc);
  }
  ctx.closePath();

  // shade samples across the run -> linear gradient along its sweep
  var NSAMP = Math.min(9, Math.max(3, Math.round(r.len/2)));
  var px = [], py = [], col = [];
  var t = (ringT[i]+ringT[i2])*0.5;
  for(var s=0;s<NSAMP;s++){
    var fj = (s+0.5)/NSAMP*r.len;
    j = (r.j0 + fj)|0; j %= segs;
    var jn = (j+1)%segs;
    var nx = (VNX[ra+j]+VNX[ra+jn]+VNX[rb+j]+VNX[rb+jn])*0.25;
    var ny = (VNY[ra+j]+VNY[ra+jn]+VNY[rb+j]+VNY[rb+jn])*0.25;
    var nz = (VNZ[ra+j]+VNZ[ra+jn]+VNZ[rb+j]+VNZ[rb+jn])*0.25;
    var L = Math.sqrt(nx*nx+ny*ny+nz*nz)||1;
    px.push((SX[ra+j]+SX[rb+jn])*0.5*sc);
    py.push((SY[ra+j]+SY[rb+jn])*0.5*sc);
    col.push(shade(nx/L,ny/L,nz/L,t,!r.front,noiseAt(i,j)));
  }
  var ax = px[0], ay = py[0], bx = px[NSAMP-1], by = py[NSAMP-1];
  var dx = bx-ax, dy = by-ay, dd = dx*dx+dy*dy;
  var paint;
  if(NSAMP < 2 || dd < 4){
    paint = col[NSAMP>>1];
  } else {
    paint = ctx.createLinearGradient(ax,ay,bx,by);
    var prev = 0;
    for(var q=0;q<NSAMP;q++){
      var o = ((px[q]-ax)*dx + (py[q]-ay)*dy)/dd;
      o = clamp(o,0,1); if(o<prev) o = prev; prev = o;
      paint.addColorStop(o, col[q]);
    }
  }
  ctx.fillStyle = paint; ctx.fill();
  if(!noStroke){ ctx.strokeStyle = paint; ctx.lineWidth = 1.1; ctx.stroke(); }
}

var bgCv = null, bgKey = '';
function drawBackdrop(ctx,w,h,sc,cache){
  if(!cache){
    paintBackdrop(ctx,w,h,sc);
    return;
  }
  var key = [w,h,sc,pitch.toFixed(3),SCALE.toFixed(2),CXp.toFixed(1),CYp.toFixed(1)].join('|');
  if(!bgCv){ bgCv = document.createElement('canvas'); }
  if(bgKey !== key || bgCv.width !== w || bgCv.height !== h){
    bgCv.width = w; bgCv.height = h;
    var bc = bgCv.getContext('2d');
    bc.setTransform(1,0,0,1,0,0);
    bc.clearRect(0,0,w,h);
    paintBackdrop(bc,w,h,sc);
    bgKey = key;
  }
  ctx.drawImage(bgCv,0,0);
}
function paintBackdrop(ctx,w,h,sc){
  var bgg = ctx.createRadialGradient(w*0.68,h*0.1,10,w*0.5,h*0.6,Math.max(w,h));
  bgg.addColorStop(0,'#2a1e17'); bgg.addColorStop(.55,'#14100d'); bgg.addColorStop(1,'#090807');
  ctx.fillStyle = bgg; ctx.fillRect(0,0,w,h);
  ctx.lineJoin = 'round';
  drawFloor(ctx,sc);
}
function drawFloor(ctx,sc){
  var cp = Math.cos(pitch), sp = Math.sin(pitch);
  var baseY = CYp - (-P.h/2)*cp*SCALE;
  var rw = RMAX*1.05*SCALE, rh = rw*sp;
  // cast shadow
  ctx.save();
  ctx.globalAlpha = 0.5;
  var sh = ctx.createRadialGradient(CXp*sc, baseY*sc, 1, CXp*sc, baseY*sc, rw*1.5*sc);
  sh.addColorStop(0,'rgba(0,0,0,.72)'); sh.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = sh;
  ctx.beginPath();
  ctx.ellipse(CXp*sc, (baseY+rh*0.25)*sc, rw*1.45*sc, Math.max(2,rh*1.5*sc), 0, 0, 6.2832);
  ctx.fill();
  ctx.restore();
  // wheel head
  if(rh > 1.2){
    var wg = ctx.createLinearGradient((CXp-rw)*sc, baseY*sc, (CXp+rw)*sc, baseY*sc);
    wg.addColorStop(0,'#2b2520'); wg.addColorStop(.45,'#564a41');
    wg.addColorStop(.6,'#6a5c51'); wg.addColorStop(1,'#241f1b');
    ctx.fillStyle = wg;
    ctx.beginPath();
    ctx.ellipse(CXp*sc, baseY*sc, rw*sc, rh*sc, 0, 0, 6.2832);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,214,170,.14)'; ctx.lineWidth = 1*sc; ctx.stroke();
    // concentric turning marks, spun with the wheel
    ctx.save();
    ctx.globalAlpha = 0.16; ctx.strokeStyle = '#ffd9b5'; ctx.lineWidth = 1*sc;
    for(var q=1;q<=4;q++){
      var f = q/5;
      ctx.beginPath();
      ctx.ellipse(CXp*sc, baseY*sc, rw*f*sc, rh*f*sc, 0, 0, 6.2832);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function renderTo(ctx,w,h,sc,cache){
  ctx.setTransform(1,0,0,1,0,0);
  drawBackdrop(ctx,w,h,sc,cache);
  ctx.lineJoin = 'round';
  var noStroke = runs.length > 900;
  for(var i=0;i<runs.length;i++) drawRun(ctx,runs[i],sc,noStroke);
  // rim highlight on the lip
  var segs = MS, top = (MR-1)*segs;
  ctx.beginPath();
  for(var j=0;j<=segs;j++){
    var jj = j%segs;
    if(j===0) ctx.moveTo(SX[top+jj]*sc, SY[top+jj]*sc);
    else ctx.lineTo(SX[top+jj]*sc, SY[top+jj]*sc);
  }
  ctx.strokeStyle = 'rgba(255,245,230,' + (0.1+0.2*fireT*P.gloss) + ')';
  ctx.lineWidth = 1.2*sc; ctx.stroke();
}

function frame(ts){
  var dt = Math.min(0.05, (ts-lastT)/1000 || 0.016); lastT = ts;
  if(spinning){ yaw += dt*0.55; dirty = true; }
  if(Math.abs(fireT-fireTarget) > 0.001){
    fireT += (fireTarget-fireT)*Math.min(1, dt*2.6); dirty = true;
  } else if(fireT !== fireTarget){ fireT = fireTarget; dirty = true; }
  if(dirty){
    if(meshDirty) buildMesh();
    refreshGlazeColors();
    computeScale(); project(); buildRuns();
    renderTo(vctx, view.width, view.height, DPR, true);
    // adaptive quality — canvas raster cost only shows up in the frame interval,
    // so steer off that rather than off a timer around the draw calls
    fpsEMA += (dt*1000 - fpsEMA)*0.12;
    if(cool > 0) cool--;
    else if(fpsEMA > 30 && qLevel < QLEVELS.length-1){ qLevel++; fpsEMA = 24; cool = 50; }
    else if(fpsEMA < 18.5 && qLevel > 0){ qLevel--; fpsEMA = 24; cool = 50; }
    drawProfile();
    if(statsDirty){ updateStats(); statsDirty = false; }
    dirty = false;
  }
  requestAnimationFrame(frame);
}

/* --------------------------------------------------------------- stats */
function measure(){
  var vol = 0, maxr = 0, i;
  var dy = P.h/(PN-1);
  for(i=0;i<PN;i++){
    var r = prof[i]*RMAX;
    if(r>maxr) maxr = r;
    vol += Math.PI*r*r*dy*(i===0||i===PN-1?0.5:1);
  }
  return { ml: vol, w: maxr*2, h: P.h };
}
function updateStats(){
  var m = measure();
  document.getElementById('stats').innerHTML =
    'height <b>' + m.h.toFixed(0) + ' cm</b>' +
    '<span>widest <b>' + m.w.toFixed(1) + ' cm</b></span>' +
    '<span>volume <b>' + (m.ml>=1000 ? (m.ml/1000).toFixed(2)+' L' : m.ml.toFixed(0)+' ml') + '</b></span>' +
    '<span>faces <b>' + ((MR-1)*MS) + '</b></span>';
}

/* ------------------------------------------------------ profile editor */
var ped = document.getElementById('profEd');
function drawProfile(){
  if(!ped || !ped.offsetWidth) return;
  var d = Math.min(2, window.devicePixelRatio||1);
  var w = ped.offsetWidth, h = ped.offsetHeight;
  if(ped.width !== (w*d|0)){ ped.width = w*d|0; ped.height = h*d|0; }
  var c = ped.getContext('2d');
  c.setTransform(d,0,0,d,0,0);
  c.clearRect(0,0,w,h);
  var pad = 14, cx = w/2, y0 = h-pad, y1 = pad, rs = (w*0.44);
  // grid
  c.strokeStyle = 'rgba(255,220,190,.07)'; c.lineWidth = 1;
  for(var g=0;g<=4;g++){
    var gy = lerp(y0,y1,g/4);
    c.beginPath(); c.moveTo(pad,gy); c.lineTo(w-pad,gy); c.stroke();
  }
  // silhouette
  c.beginPath();
  for(var i=0;i<PN;i++){
    var t = i/(PN-1), x = cx + prof[i]*rs, y = lerp(y0,y1,t);
    if(i===0) c.moveTo(x,y); else c.lineTo(x,y);
  }
  for(var k=PN-1;k>=0;k--){
    var t2 = k/(PN-1);
    c.lineTo(cx - prof[k]*rs, lerp(y0,y1,t2));
  }
  c.closePath();
  var pg = c.createLinearGradient(cx-rs,0,cx+rs,0);
  pg.addColorStop(0,'rgba(120,80,58,.5)'); pg.addColorStop(.42,'rgba(216,136,79,.75)');
  pg.addColorStop(.58,'rgba(240,180,130,.9)'); pg.addColorStop(1,'rgba(120,80,58,.5)');
  c.fillStyle = pg; c.fill();
  c.strokeStyle = 'rgba(255,214,174,.75)'; c.lineWidth = 1.3; c.stroke();
  // axis
  c.strokeStyle = 'rgba(255,255,255,.18)'; c.setLineDash([3,4]);
  c.beginPath(); c.moveTo(cx,y1); c.lineTo(cx,y0); c.stroke(); c.setLineDash([]);
  // labels
  c.fillStyle = 'rgba(190,170,150,.6)'; c.font = '10px system-ui';
  c.fillText('rim', pad, y1+10); c.fillText('foot', pad, y0-3);
}
function edPointer(ev){
  var r = ped.getBoundingClientRect();
  var pad = 14, y0 = r.height-pad, y1 = pad, rs = r.width*0.44, cx = r.width/2;
  var x = ev.clientX - r.left, y = ev.clientY - r.top;
  var t = clamp((y0-y)/(y0-y1), 0, 1);
  var target = clamp(Math.abs(x-cx)/rs, 0.015, 1);
  brushAt(t, target);
}

/* --------------------------------------------------------- interaction */
var stage = document.getElementById('stage');
var ptrs = {}, orbitMode = false, lastPtr = null, pinch0 = 0, zoom0 = 1;

function hideHint(){
  var hh = document.getElementById('hint');
  if(hh && hh.style.opacity !== '0'){ hh.style.opacity = '0'; }
}
function throwAt(px,py){
  var cp = Math.cos(pitch);
  var t = clamp(0.5 + (CYp-py)/(SCALE*cp*Math.max(1,P.h)), 0, 1);
  var target = clamp(Math.abs(px-CXp)/(RMAX*SCALE), 0.015, 1);
  brushAt(t, target);
}
function stagePos(ev){
  var r = view.getBoundingClientRect();
  return { x: ev.clientX-r.left, y: ev.clientY-r.top };
}
view.addEventListener('pointerdown', function(ev){
  view.setPointerCapture(ev.pointerId);
  ptrs[ev.pointerId] = stagePos(ev);
  hideHint();
  var ids = Object.keys(ptrs);
  if(ids.length >= 2){
    var a = ptrs[ids[0]], b = ptrs[ids[1]];
    pinch0 = Math.hypot(a.x-b.x, a.y-b.y) || 1; zoom0 = zoom; orbitMode = true;
  } else {
    orbitMode = (P.tool === 'orbit') || ev.shiftKey || ev.button === 2;
    lastPtr = ptrs[ev.pointerId];
    if(!orbitMode){ var p = ptrs[ev.pointerId]; throwAt(p.x,p.y); }
  }
  ev.preventDefault();
});
view.addEventListener('pointermove', function(ev){
  if(!(ev.pointerId in ptrs)) return;
  var p = stagePos(ev), prev = ptrs[ev.pointerId];
  ptrs[ev.pointerId] = p;
  var ids = Object.keys(ptrs);
  if(ids.length >= 2){
    var a = ptrs[ids[0]], b = ptrs[ids[1]];
    var d = Math.hypot(a.x-b.x, a.y-b.y) || 1;
    zoom = clamp(zoom0 * d/pinch0, 0.4, 3); dirty = true;
    return;
  }
  if(orbitMode){
    yaw -= (p.x-prev.x)*0.009;
    pitch = clamp(pitch + (p.y-prev.y)*0.006, 0.04, 1.35);
    dirty = true;
  } else {
    throwAt(p.x,p.y);
  }
  ev.preventDefault();
});
function endPtr(ev){
  delete ptrs[ev.pointerId];
  if(Object.keys(ptrs).length === 0) orbitMode = false;
}
view.addEventListener('pointerup', endPtr);
view.addEventListener('pointercancel', endPtr);
view.addEventListener('contextmenu', function(e){ e.preventDefault(); });
view.addEventListener('wheel', function(ev){
  zoom = clamp(zoom * (1 - ev.deltaY*0.0012), 0.4, 3); dirty = true; ev.preventDefault();
}, { passive:false });

window.addEventListener('keydown', function(ev){
  if(/input|textarea/i.test(ev.target.tagName)) return;
  var k = ev.key.toLowerCase();
  var tools = ['shape','smooth','rib','orbit'];
  if(k>='1' && k<='4'){ setTool(tools[+k-1]); }
  else if(k===' '){ toggleSpin(); ev.preventDefault(); }
  else if(k==='f'){ toggleFire(); }
  else if(k==='e'){ exportPNG(); }
  else if(k==='s'){ saveToShelf(); }
  else if(k==='r'){ applyPreset('Vase'); toast('Reset to a fresh vase'); }
});

/* -------------------------------------------------------------- export */
function renderOffscreen(w,h){
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  var sVW = VW, sVH = VH;
  var sQ = qLevel; qLevel = 0;
  VW = w; VH = h; computeScale(); project(); buildRuns();
  renderTo(c.getContext('2d'), w, h, 1, false);
  qLevel = sQ;
  VW = sVW; VH = sVH; computeScale(); dirty = true;
  return c;
}
function download(blob, name){
  var u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); }, 400);
}
function exportPNG(){
  if(meshDirty) buildMesh();
  refreshGlazeColors();
  var c = renderOffscreen(1600,1200);
  c.toBlob(function(b){
    if(!b){ toast('PNG export failed'); return; }
    download(b, 'kiln-' + Date.now() + '.png');
    toast('PNG saved — ' + Math.round(b.size/1024) + ' KB');
  }, 'image/png');
}
function buildOBJ(){
  if(meshDirty) buildMesh();
  var segs = MS, rings = MR, lines = [], i, j;
  lines.push('# Kiln — Pottery Wheel Studio');
  lines.push('# height ' + P.h + 'cm  rings ' + (rings-1) + '  segments ' + segs);
  lines.push('o pot');
  // v1 = foot centre, then rings 1..rings-1
  lines.push('v 0 ' + (-P.h/2).toFixed(4) + ' 0');
  lines.push('vn 0 -1 0');
  for(i=1;i<rings;i++) for(j=0;j<segs;j++){
    var o = i*segs+j;
    lines.push('v ' + VX[o].toFixed(4) + ' ' + VY[o].toFixed(4) + ' ' + VZ[o].toFixed(4));
    lines.push('vn ' + NX[o].toFixed(4) + ' ' + NY[o].toFixed(4) + ' ' + NZ[o].toFixed(4));
  }
  function vi(i,j){ return 2 + (i-1)*segs + (j%segs); }
  for(j=0;j<segs;j++){
    var a = vi(1,j), b = vi(1,j+1);
    lines.push('f 1//1 ' + b + '//' + b + ' ' + a + '//' + a);
  }
  for(i=1;i<rings-1;i++) for(j=0;j<segs;j++){
    var p1 = vi(i,j), p2 = vi(i,j+1), p3 = vi(i+1,j+1), p4 = vi(i+1,j);
    lines.push('f ' + p1 + '//' + p1 + ' ' + p2 + '//' + p2 + ' ' + p3 + '//' + p3 + ' ' + p4 + '//' + p4);
  }
  return lines.join('\n') + '\n';
}
function exportOBJ(){
  var txt = buildOBJ();
  download(new Blob([txt], { type:'model/obj' }), 'kiln-' + Date.now() + '.obj');
  toast('OBJ saved — ' + ((MR-1)*MS) + ' faces, ' + Math.round(txt.length/1024) + ' KB');
}

/* ------------------------------------------------------- state codecs */
function encProf(p){
  var s = '';
  for(var i=0;i<PN;i++) s += String.fromCharCode(clamp(Math.round(p[i]*255),0,255));
  return btoa(s);
}
function decProf(b64){
  var s = atob(b64), out = new Float32Array(PN);
  for(var i=0;i<PN;i++) out[i] = (i<s.length ? s.charCodeAt(i) : 60)/255;
  return out;
}
function snapshot(){
  return { p:encProf(prof), h:P.h, fl:+P.flutes.toFixed(3), fn:P.fluteN,
           tw:+P.twist.toFixed(3), gz:P.glaze, c1:P.c1, c2:P.c2,
           gl:+P.gloss.toFixed(2), mo:+P.mottle.toFixed(2) };
}
function restore(s){
  if(!s) return false;
  try{
    if(s.p) prof = decProf(s.p);
    if(s.h) P.h = +s.h;
    P.flutes = +s.fl||0; P.fluteN = +s.fn||12; P.twist = +s.tw||0;
    P.glaze = s.gz||'celadon'; P.c1 = s.c1||'#d2e6d7'; P.c2 = s.c2||'#89b39d';
    P.gloss = s.gl==null?0.72:+s.gl; P.mottle = s.mo==null?0.26:+s.mo;
    syncInputs(); rebuild();
    return true;
  }catch(e){ return false; }
}
function share(){
  var code = btoa(JSON.stringify(snapshot())).replace(/=+$/,'');
  var url = location.origin + location.pathname + '#k=' + code;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(
      function(){ toast('Share link copied'); },
      function(){ location.hash = 'k=' + code; toast('Link is in the address bar'); }
    );
  } else {
    location.hash = 'k=' + code; toast('Link is in the address bar');
  }
}
function loadHash(){
  var m = /[#&]k=([A-Za-z0-9+/=_-]+)/.exec(location.hash);
  if(!m) return false;
  try{
    var b = m[1].replace(/-/g,'+').replace(/_/g,'/');
    while(b.length % 4) b += '=';
    return restore(JSON.parse(atob(b)));
  }catch(e){ return false; }
}

/* --------------------------------------------------------------- shelf */
function readShelf(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)) || []; }catch(e){ return []; }
}
function writeShelf(a){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(a.slice(0,24))); }catch(e){}
}
function saveToShelf(){
  var a = readShelf(), s = snapshot();
  s.ts = Date.now();
  s.nm = (GLAZES[P.glaze] ? GLAZES[P.glaze].n : 'Custom') + ' · ' + P.h + 'cm';
  a.unshift(s); writeShelf(a); renderShelf();
  toast('Saved to the shelf (' + Math.min(a.length,24) + ')');
}
function thumb(cv, s){
  var sp = prof, sh = P.h, sfl = P.flutes, sfn = P.fluteN, stw = P.twist,
      sc1 = P.c1, sc2 = P.c2, sgl = P.gloss, smo = P.mottle,
      sr = P.rings, ss = P.segs, sy = yaw, sz = zoom, sVW = VW, sVH = VH, sft = fireT,
      sQ = qLevel;
  qLevel = 0;
  prof = decProf(s.p); P.h = s.h; P.flutes = s.fl; P.fluteN = s.fn; P.twist = s.tw;
  P.c1 = s.c1; P.c2 = s.c2; P.gloss = s.gl; P.mottle = s.mo;
  P.rings = 34; P.segs = 28; yaw = 0.6; zoom = 1; fireT = 1;
  buildMesh(); refreshGlazeColors();
  var d = 2; cv.width = 150*d; cv.height = 90*d;
  VW = 150*d; VH = 90*d; computeScale(); project(); buildRuns();
  renderTo(cv.getContext('2d'), cv.width, cv.height, 1, false);
  prof = sp; P.h = sh; P.flutes = sfl; P.fluteN = sfn; P.twist = stw;
  P.c1 = sc1; P.c2 = sc2; P.gloss = sgl; P.mottle = smo;
  P.rings = sr; P.segs = ss; yaw = sy; zoom = sz; VW = sVW; VH = sVH; fireT = sft;
  qLevel = sQ;
  meshDirty = true; dirty = true;
}
function renderShelf(){
  var a = readShelf(), host = document.getElementById('pane-shelf');
  host.innerHTML =
    '<div class="grp"><h3>Shelf</h3>' +
      '<div class="chips"><button class="chip" id="saveBtn">+ Save this pot</button>' +
      '<button class="chip" id="shareBtn2">Copy share link</button>' +
      '<button class="chip" id="objBtn2">Download .obj</button></div>' +
      '<p class="note">Pots live in this browser via localStorage. Click a card to load it; ' +
      'the share link encodes the whole profile in the URL.</p></div>' +
    '<div class="grp"><h3>' + a.length + ' saved</h3><div class="shelf" id="shelfGrid"></div>' +
    (a.length ? '' : '<div class="empty">Nothing on the shelf yet — throw something and hit Save.</div>') +
    '</div>';
  document.getElementById('saveBtn').onclick = saveToShelf;
  document.getElementById('shareBtn2').onclick = share;
  document.getElementById('objBtn2').onclick = exportOBJ;
  var grid = document.getElementById('shelfGrid');
  a.forEach(function(s,idx){
    var card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<canvas></canvas><div class="nm"></div><button class="x" title="Delete">×</button>';
    card.querySelector('.nm').textContent = s.nm || 'Pot';
    grid.appendChild(card);
    try{ thumb(card.querySelector('canvas'), s); }catch(e){}
    card.onclick = function(ev){
      if(ev.target.classList.contains('x')){
        var b = readShelf(); b.splice(idx,1); writeShelf(b); renderShelf(); return;
      }
      restore(s); toast('Loaded ' + (s.nm||'pot'));
    };
  });
}

/* ------------------------------------------------------------------ ui */
var FMT = {
  h: function(v){ return (v|0)+' cm'; },
  brush: function(v){ return Math.round(v*100)+'%'; },
  strength: function(v){ return Math.round(v*100)+'%'; },
  flutes: function(v){ return Math.round(v*100)+'%'; },
  fluteN: function(v){ return (v|0)+'×'; },
  twist: function(v){ return Math.round(v*57.3)+'°'; },
  gloss: function(v){ return Math.round(v*100)+'%'; },
  mottle: function(v){ return Math.round(v*100)+'%'; },
  rings: function(v){ return (v|0)+''; },
  segs: function(v){ return (v|0)+''; }
};
function row(k,label,min,max,step){
  return '<div class="row"><label>'+label+'</label>' +
    '<input type="range" data-k="'+k+'" min="'+min+'" max="'+max+'" step="'+step+'">' +
    '<span class="val" data-v="'+k+'"></span></div>';
}
function buildUI(){
  var pf = document.getElementById('pane-form');
  pf.innerHTML =
    '<div class="grp"><h3>Start from</h3><div class="chips" id="presetChips"></div></div>' +
    '<div class="grp"><h3>Hands</h3>' + row('brush','Brush',0.02,0.4,0.005) +
      row('strength','Pressure',0.1,1,0.02) +
      '<p class="note">Tools: <b>Shape</b> makes the wall follow your finger, ' +
      '<b>Smooth</b> pulls it true, <b>Rib</b> cuts a throwing groove, <b>Orbit</b> turns the view.</p></div>' +
    '<div class="grp"><h3>Profile</h3><canvas id="profEd"></canvas>' +
      '<p class="note">Cross-section — drag here to shape it from the side.</p></div>' +
    '<div class="grp"><h3>Form</h3>' + row('h','Height',4,40,1) +
      row('flutes','Fluting',0,0.18,0.005) + row('fluteN','Flutes',3,36,1) +
      row('twist','Twist',0,9,0.1) + '</div>' +
    '<div class="grp"><h3>Mesh</h3>' + row('rings','Rings',24,96,2) +
      row('segs','Facets',8,80,4) +
      '<div class="chips"><button class="chip" id="trueBtn">Pull true</button>' +
      '<button class="chip" id="centreBtn">Reset view</button></div></div>';

  var pg = document.getElementById('pane-glaze');
  pg.innerHTML =
    '<div class="grp"><h3>Glaze</h3><div class="chips" id="glazeChips"></div></div>' +
    '<div class="grp"><h3>Custom</h3>' +
      '<div class="row"><label>Rim</label><input type="color" data-k="c1"><span class="val"></span></div>' +
      '<div class="row"><label>Foot</label><input type="color" data-k="c2"><span class="val"></span></div>' +
      row('gloss','Gloss',0,1,0.02) + row('mottle','Mottle',0,0.8,0.02) +
      '<p class="note">Hit <b>Fire</b> to run the kiln — the raw clay fades into the glaze, ' +
      'gloss and mottling come up with it.</p></div>';

  var chips = document.getElementById('presetChips');
  Object.keys(PRESETS).forEach(function(n){
    var b = document.createElement('button');
    b.className = 'chip'; b.textContent = n;
    b.onclick = function(){ applyPreset(n); toast(n + ' thrown'); };
    chips.appendChild(b);
  });
  var gc = document.getElementById('glazeChips');
  Object.keys(GLAZES).forEach(function(key){
    var g = GLAZES[key], b = document.createElement('button');
    b.className = 'chip' + (P.glaze===key ? ' sel' : '');
    b.dataset.g = key;
    b.innerHTML = '<span class="sw" style="background:linear-gradient(' + g.c1 + ',' + g.c2 + ')"></span>' + g.n;
    b.onclick = function(){
      P.glaze = key; P.c1 = g.c1; P.c2 = g.c2; P.gloss = g.g; P.mottle = g.m;
      fireTarget = 1;
      [].forEach.call(gc.children, function(c){ c.classList.toggle('sel', c.dataset.g === key); });
      syncInputs(); dirty = true;
    };
    gc.appendChild(b);
  });

  var dock = document.getElementById('dock');
  [['shape','Shape','1'],['smooth','Smooth','2'],['rib','Rib','3'],['orbit','Orbit','4']]
  .forEach(function(t){
    var b = document.createElement('button');
    b.textContent = t[1]; b.dataset.t = t[0]; b.title = 'Key ' + t[2];
    b.onclick = function(){ setTool(t[0]); };
    dock.appendChild(b);
  });

  ped = document.getElementById('profEd');
  ped.addEventListener('pointerdown', function(ev){
    ped.setPointerCapture(ev.pointerId); ped._d = true; edPointer(ev); ev.preventDefault();
  });
  ped.addEventListener('pointermove', function(ev){ if(ped._d) edPointer(ev); });
  ped.addEventListener('pointerup', function(){ ped._d = false; });
  ped.addEventListener('pointercancel', function(){ ped._d = false; });

  document.getElementById('trueBtn').onclick = function(){
    for(var pass=0;pass<6;pass++){
      var cp = prof.slice();
      for(var i=1;i<PN-1;i++) prof[i] = cp[i-1]*0.3 + cp[i]*0.4 + cp[i+1]*0.3;
    }
    rebuild(); toast('Pulled true');
  };
  document.getElementById('centreBtn').onclick = function(){
    yaw = 0.6; pitch = 0.34; zoom = 1; dirty = true;
  };

  [].forEach.call(document.getElementById('tabs').children, function(b){
    b.onclick = function(){
      [].forEach.call(b.parentNode.children, function(x){ x.classList.toggle('sel', x===b); });
      ['form','glaze','shelf'].forEach(function(p){
        document.getElementById('pane-'+p).classList.toggle('sel', p===b.dataset.p);
      });
      dirty = true;
    };
  });

  document.addEventListener('input', function(ev){
    var k = ev.target.dataset && ev.target.dataset.k;
    if(!k) return;
    if(ev.target.type === 'range'){
      P[k] = parseFloat(ev.target.value);
      var vs = document.querySelector('[data-v="'+k+'"]');
      if(vs && FMT[k]) vs.textContent = FMT[k](P[k]);
    } else {
      P[k] = ev.target.value;
      P.glaze = 'custom';
      [].forEach.call(document.getElementById('glazeChips').children,
        function(c){ c.classList.remove('sel'); });
    }
    if(k==='h'||k==='flutes'||k==='fluteN'||k==='twist'||k==='rings'||k==='segs') rebuild();
    else dirty = true;
  });

  document.getElementById('spinBtn').onclick = toggleSpin;
  document.getElementById('fireBtn').onclick = toggleFire;
  document.getElementById('pngBtn').onclick = exportPNG;
  document.getElementById('objBtn').onclick = exportOBJ;
  document.getElementById('shareBtn').onclick = share;
}
function syncInputs(){
  [].forEach.call(document.querySelectorAll('[data-k]'), function(el){
    var k = el.dataset.k;
    if(P[k] === undefined) return;
    el.value = P[k];
    var vs = document.querySelector('[data-v="'+k+'"]');
    if(vs && FMT[k]) vs.textContent = FMT[k](P[k]);
  });
}
function setTool(t){
  P.tool = t;
  [].forEach.call(document.getElementById('dock').children, function(b){
    b.classList.toggle('sel', b.dataset.t === t);
  });
  view.style.cursor = t === 'orbit' ? 'grab' : 'crosshair';
}
function toggleSpin(){
  spinning = !spinning;
  document.getElementById('spinBtn').classList.toggle('on', spinning);
  dirty = true;
}
function toggleFire(){
  fireTarget = fireTarget > 0.5 ? 0 : 1;
  document.getElementById('fireBtn').textContent = fireTarget > 0.5 ? 'Fire' : 'Raw clay';
  toast(fireTarget > 0.5 ? 'Into the kiln…' : 'Back to raw clay');
}

/* -------------------------------------------------------------- bootstrap */
buildUI();
setTool('shape');
document.getElementById('spinBtn').classList.add('on');
if(!loadHash()) applyPreset('Vase');
syncInputs();
renderShelf();
resize();
window.addEventListener('resize', function(){ resize(); dirty = true; });
if(window.ResizeObserver){
  var ro = new ResizeObserver(function(){ resize(); });
  ro.observe(stage);
}
if(matchMedia('(max-width:900px)').matches || matchMedia('(pointer:coarse)').matches){
  P.rings = 44; P.segs = 36; syncInputs(); rebuild();
}
setTimeout(hideHint, 9000);
requestAnimationFrame(frame);
window.__kiln = { P:P, step:function(){ return qLevel; },
                  setView:function(y,pi,q){ yaw=y; pitch=pi; if(q!=null){qLevel=q;cool=1e9;} dirty=true; },
                  culled:function(){ return culled; }, prof:function(){ return prof; }, measure:measure,
                  buildOBJ:buildOBJ, runs:function(){ return runs.length; },
                  brushAt:brushAt, snapshot:snapshot, restore:restore,
                  exportPNG:exportPNG, saveToShelf:saveToShelf, setTool:setTool };
})();
</script>
</body>
