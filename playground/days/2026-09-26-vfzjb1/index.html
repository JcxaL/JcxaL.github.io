<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Easeworks — Motion Timeline Studio</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --bg:#0a0c13; --bg2:#10131d; --panel:rgba(255,255,255,.045); --line:rgba(255,255,255,.1);
    --ink:#e8ecf6; --dim:#8b94ab; --acc:#8b7cff; --acc2:#3fd8c4; --warn:#ffb457; --hot:#ff6b8b;
    --r:14px;
  }
  html,body{height:100%}
  body{
    margin:0; background:radial-gradient(1200px 700px at 12% -10%, #1b1f34 0%, transparent 60%),
      radial-gradient(900px 600px at 105% 110%, #12232a 0%, transparent 55%), var(--bg);
    color:var(--ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; overflow:hidden; -webkit-text-size-adjust:100%;
    touch-action:manipulation;
  }
  /* ---------- top bar ---------- */
  .bar{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01));flex-wrap:wrap;flex:none}
  .brand{font-weight:750;letter-spacing:-.2px;font-size:15px;display:flex;align-items:center;gap:8px}
  .brand i{width:9px;height:9px;border-radius:3px;background:linear-gradient(135deg,var(--acc),var(--acc2));
    box-shadow:0 0 12px rgba(139,124,255,.7);display:block}
  .brand span{font-weight:450;color:var(--dim);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
  .tools{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
  button,select,input[type=text],input[type=number]{font:inherit;color:var(--ink)}
  .btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 11px;cursor:pointer;
    transition:background .16s,border-color .16s,transform .1s;white-space:nowrap;font-size:12.5px}
  .btn:hover{background:rgba(255,255,255,.1)}
  .btn:active{transform:translateY(1px)}
  .btn.on{background:linear-gradient(135deg,rgba(139,124,255,.35),rgba(63,216,196,.25));border-color:rgba(139,124,255,.6)}
  .btn.pri{background:linear-gradient(135deg,var(--acc),#6a5cf0);border-color:transparent;font-weight:600}
  .btn.ghost{background:transparent}
  select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12.5px}
  .tlabel{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12px;min-width:104px;text-align:center}
  /* ---------- layout ---------- */
  main{flex:1;display:flex;min-height:0;min-width:0}
  .stageWrap{flex:1;position:relative;display:grid;place-items:center;overflow:hidden;min-width:0}
  .stage{width:640px;height:360px;position:absolute;left:50%;top:50%;border-radius:18px;transform-origin:center center;
    background:linear-gradient(160deg,#151a2b,#0d1017 70%);border:1px solid var(--line);
    box-shadow:0 30px 80px -30px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.06);overflow:hidden}
  .stage.grid::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:40px 40px}
  .stage.light{background:linear-gradient(160deg,#f2f4fb,#dfe4f2)}
  .obj{position:absolute;left:50%;top:50%;will-change:transform,opacity,filter}
  .shp{position:relative;display:grid;place-items:center;font-weight:700}
  .shp.card{width:150px;height:96px;border-radius:16px;box-shadow:0 14px 34px -14px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.28)}
  .shp.dot{width:26px;height:26px;border-radius:50%}
  .shp.ring{width:104px;height:104px;border-radius:50%;background:transparent!important;border:5px solid}
  .shp.bar{width:180px;height:16px;border-radius:99px}
  .shp.text{font-size:34px;letter-spacing:-.5px;white-space:nowrap;font-weight:800}
  .hint{position:absolute;left:14px;bottom:12px;color:var(--dim);font-size:11.5px;pointer-events:none;
    background:rgba(8,10,16,.6);border:1px solid var(--line);padding:5px 9px;border-radius:99px;backdrop-filter:blur(8px);
    transition:opacity .5s}
  /* ---------- panel ---------- */
  .panel{width:296px;flex:none;min-height:0;border-left:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.008));
    padding:11px;overflow-y:auto;display:flex;flex-direction:column;gap:11px}
  .grp{border:1px solid var(--line);border-radius:var(--r);padding:10px;background:rgba(255,255,255,.025)}
  .grp h3{margin:0 0 8px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700}
  .row{display:flex;align-items:center;gap:8px;margin:6px 0}
  .row label{font-size:11.5px;color:var(--dim);min-width:56px}
  .row output{font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--ink);min-width:44px;text-align:right}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:22px;background:transparent;min-width:0}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:99px;background:rgba(255,255,255,.14)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;margin-top:-5.5px;
    background:linear-gradient(135deg,#fff,#cfd3e4);border:1px solid rgba(0,0,0,.4);box-shadow:0 2px 6px rgba(0,0,0,.5);cursor:pointer}
  input[type=range]::-moz-range-track{height:4px;border-radius:99px;background:rgba(255,255,255,.14)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border:1px solid rgba(0,0,0,.4);border-radius:50%;background:#fff;cursor:pointer}
  input[type=color]{width:30px;height:26px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer}
  input[type=text]{flex:1;min-width:0;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:9px;padding:5px 8px;font-size:12px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:99px;border:1px solid var(--line);
    background:rgba(255,255,255,.04);cursor:pointer;font-size:12px;transition:all .15s}
  .chip.sel{border-color:var(--acc);background:rgba(139,124,255,.2);box-shadow:0 0 0 1px rgba(139,124,255,.35)}
  .chip b{width:9px;height:9px;border-radius:3px;display:block}
  .eases{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
  .eases .btn{padding:5px 2px;font-size:10.5px;text-align:center}
  #bez{width:100%;height:128px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.28);touch-action:none;display:block}
  .empty{color:var(--dim);font-size:11.5px;line-height:1.5}
  kbd{background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:5px;padding:0 4px;font:600 10.5px system-ui}
  /* ---------- timeline ---------- */
  .tl{flex:none;border-top:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(0,0,0,.25));padding:8px 10px 10px}
  .tlhead{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
  #tlc{width:100%;height:196px;display:block;touch-action:none;border-radius:12px}
  #toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,24px);background:rgba(12,15,24,.94);
    border:1px solid var(--line);padding:9px 15px;border-radius:99px;font-size:12.5px;opacity:0;pointer-events:none;
    transition:.28s;backdrop-filter:blur(10px);box-shadow:0 12px 40px -10px #000;z-index:50}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  @media (max-width:880px){
    main{flex-direction:column}
    .stageWrap{flex:1 1 auto;min-height:132px}
    .panel{width:auto;flex:0 0 auto;border-left:0;border-top:1px solid var(--line);max-height:38vh;
      overflow-y:auto;-webkit-overflow-scrolling:touch}
    #tlc{height:168px}
    .tlabel{min-width:88px}
    .bar{padding:7px 10px;gap:7px}
  }
  @media (max-width:560px){
    .brand span{display:none}
    .hint{display:none}
    .panel{max-height:34vh}
    #tlc{height:154px}
    .btn{padding:6px 9px}
  }
  @media (max-height:620px){ .panel{max-height:32vh} #tlc{height:140px} }
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><i></i>Easeworks <span>Motion Timeline Studio</span></div>
  <div class="tools">
    <select id="scene" title="Load a scene"></select>
    <button class="btn pri" id="play" title="Play / pause (space)">Pause</button>
    <button class="btn on" id="loop" title="Loop playback">Loop</button>
    <span class="tlabel" id="tlabel">0.00s / 2.40s</span>
    <button class="btn" id="copyCss" title="Copy CSS @keyframes">Copy CSS</button>
    <button class="btn" id="dlCss" title="Download .css">.css</button>
    <button class="btn" id="dlJson" title="Download project .json">.json</button>
    <button class="btn" id="dlPng" title="Download PNG filmstrip">Filmstrip</button>
    <button class="btn" id="share" title="Copy shareable link">Share</button>
  </div>
</header>
<main>
  <section class="stageWrap">
    <div class="stage grid" id="stage"></div>
    <div class="hint" id="hint">Drag keyframes in the timeline · click a lane to add one · <kbd>space</kbd> play</div>
  </section>
  <aside class="panel" id="panel"></aside>
</main>
<footer class="tl">
  <div class="tlhead">
    <div class="chips" id="chips"></div>
    <div style="margin-left:auto;display:flex;gap:6px">
      <button class="btn ghost" id="addKey" title="Add keyframe at playhead (K)">+ Key</button>
      <button class="btn ghost" id="delKey" title="Delete selected keyframe (Del)">− Key</button>
    </div>
  </div>
  <canvas id="tlc"></canvas>
</footer>
<div id="toast"></div>
<script>
'use strict';
/* ============================ model ============================ */
const PROPKEYS = ['x','y','scale','rotate','opacity','blur'];
const PROPS = {
  x:      {label:'X',       min:-300, max:300, step:1,    def:0, unit:'px',  fmt:v=>v.toFixed(0)+'px'},
  y:      {label:'Y',       min:-200, max:200, step:1,    def:0, unit:'px',  fmt:v=>v.toFixed(0)+'px'},
  scale:  {label:'Scale',   min:0,    max:2.6, step:0.01, def:1, unit:'',    fmt:v=>v.toFixed(2)},
  rotate: {label:'Rotate',  min:-540, max:540, step:1,    def:0, unit:'deg', fmt:v=>v.toFixed(0)+'°'},
  opacity:{label:'Opacity', min:0,    max:1,   step:0.01, def:1, unit:'',    fmt:v=>v.toFixed(2)},
  blur:   {label:'Blur',    min:0,    max:40,  step:0.5,  def:0, unit:'px',  fmt:v=>v.toFixed(1)+'px'}
};
const LANECOL = {x:'#8b7cff', y:'#3fd8c4', scale:'#ffb457', rotate:'#ff6b8b', opacity:'#6fb6ff', blur:'#c58bff'};
const EASES = [
  {n:'linear',  b:[0,0,1,1]},
  {n:'ease',    b:[.25,.1,.25,1]},
  {n:'in',      b:[.42,0,1,1]},
  {n:'out',     b:[0,0,.58,1]},
  {n:'in-out',  b:[.42,0,.58,1]},
  {n:'back',    b:[.34,1.56,.64,1]},
  {n:'spring',  b:[.16,1.36,.28,1]},
  {n:'antic',   b:[.68,-.55,.27,1.25]},
  {n:'expo',    b:[.16,1,.3,1]},
  {n:'steps 4', b:[0,0,1,1], s:4},
  {n:'steps 8', b:[0,0,1,1], s:8},
  {n:'hold',    b:[0,0,1,1], s:1}
];
const EO = [.42,0,.58,1], BACK = [.34,1.56,.64,1], SPR = [.16,1.36,.28,1], EXPO = [.16,1,.3,1];
const K = (t,v,e,s) => ({t:t, v:v, e:(e||EO).slice(), s:s||0});
let uid = 1;
const nid = () => 'o' + (uid++);

function obj(o){
  return Object.assign({
    id:nid(), name:'shape', shape:'card', color:'#8b7cff', text:'Motion',
    count:1, delay:70, ox:0, oy:0, tracks:{}
  }, o);
}
const SCENES = {
  'Dot Wave': () => ({duration:1800, bg:'grid', objects:[
    obj({name:'wave', shape:'dot', color:'#3fd8c4', count:14, delay:52, ox:30, oy:0, tracks:{
      y:[K(0,60,EO), K(700,-60,SPR), K(1500,60,BACK)],
      scale:[K(0,.7,EO), K(700,1.5,SPR), K(1500,.7,EO)],
      opacity:[K(0,.45,EO), K(700,1,EO), K(1500,.45,EO)]
    }}),
    obj({name:'halo', shape:'ring', color:'#8b7cff', count:1, tracks:{
      scale:[K(0,.4,EXPO), K(1100,1.7,EXPO), K(1800,.4,EO)],
      opacity:[K(0,.55,EO), K(1100,0,EO), K(1800,.55,EO)],
      rotate:[K(0,0,[0,0,1,1]), K(1800,180,[0,0,1,1])]
    }})
  ]}),
  'Card Reveal': () => ({duration:2200, bg:'grid', objects:[
    obj({name:'card', shape:'card', color:'#8b7cff', tracks:{
      x:[K(0,-220,BACK), K(1100,0,EO), K(1700,0,EO), K(2200,220,EO)],
      y:[K(0,24,EO), K(1100,0,SPR)],
      rotate:[K(0,-10,BACK), K(1100,0,EO)],
      scale:[K(0,.82,BACK), K(1100,1,EO)],
      opacity:[K(0,0,EO), K(600,1,EO), K(1900,1,EO), K(2200,0,EO)],
      blur:[K(0,16,EXPO), K(900,0,EO)]
    }}),
    obj({name:'label', shape:'text', color:'#e8ecf6', text:'Easeworks', tracks:{
      y:[K(300,110,BACK), K(1300,96,EO)],
      opacity:[K(300,0,EO), K(1000,1,EO), K(1900,1,EO), K(2150,0,EO)],
      blur:[K(300,10,EXPO), K(1100,0,EO)]
    }})
  ]}),
  'Menu Stagger': () => ({duration:2000, bg:'grid', objects:[
    obj({name:'rows', shape:'bar', color:'#ffb457', count:5, delay:110, ox:0, oy:34, tracks:{
      x:[K(0,-150,EXPO), K(750,0,EO), K(1500,0,EO), K(2000,150,EO)],
      opacity:[K(0,0,EO), K(600,1,EO), K(1550,1,EO), K(1950,0,EO)],
      scale:[K(0,.9,BACK), K(750,1,EO)],
      blur:[K(0,7,EXPO), K(700,0,EO)]
    }}),
    obj({name:'dot', shape:'dot', color:'#ff6b8b', count:5, delay:110, ox:0, oy:34, tracks:{
      x:[K(0,-260,EXPO), K(820,-124,BACK)],
      opacity:[K(0,0,EO), K(700,1,EO), K(1600,1,EO), K(1950,0,EO)],
      scale:[K(0,0,BACK), K(820,1,SPR)]
    }})
  ]}),
  'Pulse Grid': () => ({duration:1600, bg:'grid', objects:[
    obj({name:'tiles', shape:'bar', color:'#6fb6ff', count:9, delay:44, ox:34, oy:0, tracks:{
      rotate:[K(0,90,[0,0,1,1]), K(1600,90,[0,0,1,1])],
      scale:[K(0,.35,SPR), K(600,1.25,SPR), K(1300,.35,EO)],
      opacity:[K(0,.35,EO), K(600,1,EO), K(1300,.35,EO)],
      y:[K(0,0,EO), K(600,-18,SPR), K(1300,0,EO)]
    }}),
    obj({name:'title', shape:'text', color:'#c58bff', text:'keyframes', tracks:{
      y:[K(0,-116,EO)],
      scale:[K(0,.96,SPR), K(800,1.04,SPR), K(1600,.96,EO)],
      opacity:[K(0,.7,EO), K(800,1,EO), K(1600,.7,EO)]
    }})
  ]})
};
const DEFAULT_SCENE = 'Dot Wave';

/* ============================ state ============================ */
const LS = 'easeworks_v1';
let st = null;              // {duration, bg, objects}
let sel = {obj:null, prop:'y', idx:null};
let time = 0, playing = true, looping = true, last = 0;

function fresh(name){
  uid = 1;
  const s = SCENES[name]();
  s.name = name;
  return s;
}
function normalize(s){
  if(!s || !Array.isArray(s.objects) || !s.objects.length) return null;
  s.duration = clamp(+s.duration || 2000, 400, 12000);
  s.bg = s.bg === 'light' ? 'light' : 'grid';
  s.objects = s.objects.slice(0, 12).map(o => {
    const t = {};
    PROPKEYS.forEach(p => {
      const arr = (o.tracks && o.tracks[p]) || [];
      t[p] = arr.filter(k => k && isFinite(k.t) && isFinite(k.v)).map(k => ({
        t: clamp(+k.t, 0, s.duration),
        v: clamp(+k.v, PROPS[p].min, PROPS[p].max),
        e: (Array.isArray(k.e) && k.e.length === 4 ? k.e.map(Number) : EO.slice()),
        s: Math.max(0, Math.min(16, ~~k.s))
      })).sort((a,b) => a.t - b.t);
    });
    return obj({
      id:nid(), name:String(o.name || 'shape').slice(0,14),
      shape:['card','dot','ring','bar','text'].includes(o.shape) ? o.shape : 'card',
      color:/^#[0-9a-f]{6}$/i.test(o.color || '') ? o.color : '#8b7cff',
      text:String(o.text == null ? 'Motion' : o.text).slice(0,24),
      count:clamp(~~o.count || 1, 1, 24), delay:clamp(+o.delay || 0, 0, 600),
      ox:clamp(+o.ox || 0, -80, 80), oy:clamp(+o.oy || 0, -80, 80), tracks:t
    });
  });
  return s;
}
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const byId = id => st.objects.find(o => o.id === id);
const selObj = () => byId(sel.obj) || st.objects[0];

/* ============================ easing ============================ */
const cb  = (t,a,b) => { const m = 1-t; return 3*m*m*t*a + 3*m*t*t*b + t*t*t; };
const dcb = (t,a,b) => { const m = 1-t; return 3*m*m*a + 6*m*t*(b-a) + 3*t*t*(1-b); };
function ease(k, u){
  if(k.s > 0) return Math.floor(u * k.s) / k.s;
  const p = k.e;
  if(p[0] === 0 && p[1] === 0 && p[2] === 1 && p[3] === 1) return u;
  let t = u;
  for(let i = 0; i < 20; i++){
    const x = cb(t, p[0], p[2]) - u, d = dcb(t, p[0], p[2]);
    if(Math.abs(x) < 1e-5) break;
    if(Math.abs(d) < 1e-6){ t = t - x; }
    else t -= x / d;
    t = clamp(t, 0, 1);
  }
  return cb(t, p[1], p[3]);
}
function valueAt(track, prop, t){
  if(!track || !track.length) return PROPS[prop].def;
  if(t <= track[0].t) return track[0].v;
  const lastK = track[track.length-1];
  if(t >= lastK.t) return lastK.v;
  for(let i = 0; i < track.length-1; i++){
    const a = track[i], b = track[i+1];
    if(t >= a.t && t <= b.t){
      const span = b.t - a.t;
      const u = span <= 0 ? 1 : (t - a.t) / span;
      return a.v + (b.v - a.v) * ease(a, u);
    }
  }
  return lastK.v;
}
function instTime(i, o){
  let t = time - i * o.delay;
  const D = st.duration;
  if(looping) t = ((t % D) + D) % D;
  return clamp(t, 0, D);
}
function frameOf(o, i, t){
  const f = {};
  PROPKEYS.forEach(p => f[p] = valueAt(o.tracks[p], p, t));
  const centre = (o.count - 1) / 2;
  f.tx = f.x + (i - centre) * o.ox;
  f.ty = f.y + (i - centre) * o.oy;
  return f;
}

/* ============================ stage ============================ */
const stage = document.getElementById('stage');
let nodes = [], sig = '';
function stageSig(){ return st.objects.map(o => o.id+o.shape+o.count+o.color+o.text).join('|') + st.bg; }
function buildStage(){
  sig = stageSig();
  stage.innerHTML = '';
  stage.className = 'stage ' + st.bg;
  nodes = st.objects.map(o => {
    const list = [];
    for(let i = 0; i < o.count; i++){
      const w = document.createElement('div');
      w.className = 'obj';
      const s = document.createElement('div');
      s.className = 'shp ' + o.shape;
      if(o.shape === 'ring'){ s.style.borderColor = o.color; }
      else if(o.shape === 'text'){ s.style.color = o.color; s.textContent = o.text || 'Motion'; }
      else {
        s.style.background = 'linear-gradient(145deg,' + o.color + ',' + shade(o.color,-38) + ')';
        if(o.shape === 'card'){
          const t = document.createElement('span');
          t.style.cssText = 'font-size:13px;opacity:.92;letter-spacing:.04em';
          t.textContent = o.text || 'Motion';
          s.appendChild(t);
        }
      }
      w.appendChild(s);
      stage.appendChild(w);
      list.push(w);
    }
    return list;
  });
  fitStage();
}
function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n>>16) + amt, 0, 255), g = clamp((n>>8 & 255) + amt, 0, 255), b = clamp((n & 255) + amt, 0, 255);
  return '#' + ((1<<24) + (r<<16) + (g<<8) + b).toString(16).slice(1);
}
function applyFrame(){
  st.objects.forEach((o, oi) => {
    const set = nodes[oi]; if(!set) return;
    for(let i = 0; i < set.length; i++){
      const f = frameOf(o, i, instTime(i, o));
      const el = set[i];

function fitStage(){

/* ============================ timeline ============================ */
const tlc = document.getElementById('tlc'), tx = tlc.getContext('2d');
const GUT = 88, RULE = 24, PAD = 10;
let laneH = 26, drag = null;
function tlSize(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = tlc.clientWidth, h = tlc.clientHeight;
  tlc.width = Math.max(1, Math.round(w * dpr));
  tlc.height = Math.max(1, Math.round(h * dpr));
  tx.setTransform(dpr, 0, 0, dpr, 0, 0);
  laneH = Math.max(18, Math.floor((h - RULE - PAD) / PROPKEYS.length));
  drawTL();
}
const tlW = () => tlc.clientWidth - GUT - PAD;
const t2x = t => GUT + (t / st.duration) * tlW();
const x2t = x => clamp((x - GUT) / tlW() * st.duration, 0, st.duration);
function drawTL(){
  const w = tlc.clientWidth, h = tlc.clientHeight;
  tx.clearRect(0, 0, w, h);
  tx.fillStyle = 'rgba(255,255,255,.022)';
  roundRect(tx, 0, 0, w, h, 12); tx.fill();
  const o = selObj(); if(!o) return;
  /* ruler */
  tx.font = '600 10px system-ui,sans-serif';
  tx.textBaseline = 'middle';
  const stepMs = st.duration > 4000 ? 1000 : st.duration > 1600 ? 500 : 200;
  for(let t = 0; t <= st.duration + 1; t += stepMs){
    const X = t2x(Math.min(t, st.duration));
    tx.strokeStyle = 'rgba(255,255,255,.1)';
    tx.beginPath(); tx.moveTo(X, RULE - 6); tx.lineTo(X, h - PAD + 2); tx.stroke();
    tx.fillStyle = 'rgba(200,208,228,.5)';
    tx.textAlign = t === 0 ? 'left' : 'center';
    tx.fillText((t / 1000).toFixed(1) + 's', X + (t === 0 ? 2 : 0), 11);
  }
  tx.textAlign = 'left';
  /* lanes */
  PROPKEYS.forEach((p, li) => {
    const y = RULE + li * laneH, mid = y + laneH / 2;
    const isSel = sel.prop === p;
    tx.fillStyle = isSel ? 'rgba(139,124,255,.1)' : (li % 2 ? 'rgba(255,255,255,.018)' : 'transparent');
    tx.fillRect(GUT - 4, y + 1, w - GUT - PAD + 4, laneH - 2);
    tx.fillStyle = isSel ? '#fff' : 'rgba(200,208,228,.62)';
    tx.font = (isSel ? '700 ' : '500 ') + '11px system-ui,sans-serif';
    tx.fillText(PROPS[p].label, 8, mid);
    const track = o.tracks[p] || [];
    tx.fillStyle = 'rgba(180,190,215,.5)';
    tx.font = '500 10px system-ui,sans-serif';
    tx.textAlign = 'right';
    tx.fillText(PROPS[p].fmt(valueAt(track, p, time)), GUT - 8, mid);
    tx.textAlign = 'left';
    /* connective line + keys */
    if(track.length){
      tx.strokeStyle = LANECOL[p] + '66'; tx.lineWidth = 1.5;
      tx.beginPath();
      track.forEach((k, i) => { const X = t2x(k.t); i ? tx.lineTo(X, mid) : tx.moveTo(X, mid); });
      tx.stroke();
      track.forEach((k, i) => {
        const X = t2x(k.t);
        const on = isSel && sel.idx === i;
        tx.save(); tx.translate(X, mid); tx.rotate(Math.PI / 4);
        const s = on ? 6.2 : 4.6;
        tx.fillStyle = on ? '#fff' : LANECOL[p];
        tx.strokeStyle = 'rgba(8,10,16,.9)'; tx.lineWidth = 1.5;
        tx.fillRect(-s, -s, s*2, s*2); tx.strokeRect(-s, -s, s*2, s*2);
        tx.restore();
        if(k.s > 0){
          tx.fillStyle = 'rgba(255,255,255,.75)'; tx.font = '700 8px system-ui';
          tx.textAlign = 'center'; tx.fillText('S', X, mid - 11); tx.textAlign = 'left';
        }
      });
    }
  });
  /* playhead */
  const PX = t2x(time);
  tx.strokeStyle = '#ff6b8b'; tx.lineWidth = 1.5;
  tx.beginPath(); tx.moveTo(PX, RULE - 10); tx.lineTo(PX, h - PAD + 2); tx.stroke();
  tx.fillStyle = '#ff6b8b';
  tx.beginPath(); tx.moveTo(PX - 5, RULE - 16); tx.lineTo(PX + 5, RULE - 16); tx.lineTo(PX, RULE - 7); tx.fill();
}
function roundRect(c, x, y, w, h, r){
  if(c.roundRect){ c.beginPath(); c.roundRect(x, y, w, h, r); return; }
  c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function tlHit(ev){
  const r = tlc.getBoundingClientRect();

}
tlc.addEventListener('pointerdown', ev => {
  const {x, y} = tlHit(ev);

  if(y < RULE){ drag = {mode:'scrub'}; playing = false; syncPlay(); setTime(x2t(x)); return; }
  const li = Math.floor((y - RULE) / laneH);
  if(li < 0 || li >= PROPKEYS.length) return;
  const p = PROPKEYS[li], o = selObj(), track = o.tracks[p] || (o.tracks[p] = []);
  let hit = -1, best = 11;
  track.forEach((k, i) => { const d = Math.abs(t2x(k.t) - x); if(d < best){ best = d; hit = i; } });
  if(hit >= 0){
    sel.prop = p; sel.idx = hit;
    drag = {mode:'key', prop:p, moved:false};
  } else {
    const t = Math.round(x2t(x) / 10) * 10;
    const v = valueAt(track, p, t);
    track.push(K(t, v, EO)); track.sort((a,b) => a.t - b.t);
    sel.prop = p; sel.idx = track.findIndex(k => k.t === t);
    drag = {mode:'key', prop:p, moved:true};
    toast('Keyframe added · ' + PROPS[p].label + ' ' + PROPS[p].fmt(v));
  }
  buildPanel(); drawTL();
});
tlc.addEventListener('pointermove', ev => {
  if(!drag) return;
  const {x} = tlHit(ev);
  if(drag.mode === 'scrub'){ setTime(x2t(x)); return; }
  const o = selObj(), track = o.tracks[drag.prop];
  if(!track || sel.idx == null || !track[sel.idx]) return;
  const k = track[sel.idx];
  k.t = Math.round(x2t(x) / 5) * 5;
  track.sort((a,b) => a.t - b.t);
  sel.idx = track.indexOf(k);
  drag.moved = true;
  applyFrame(); drawTL(); save();
});
const endDrag = () => { if(drag){ drag = null; save(); buildPanel(); } };
tlc.addEventListener('pointerup', endDrag);
tlc.addEventListener('pointercancel', endDrag);

/* ---------- bezier editor ---------- */
function initBez(k){
  const c = document.getElementById('bez'); if(!c) return;
  const g = c.getContext('2d');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = c.clientWidth || 260, H = c.clientHeight || 128;
  c.width = W * dpr; c.height = H * dpr; g.setTransform(dpr,0,0,dpr,0,0);
  const m = 22, iw = W - m*2, ih = H - m*2;
  const px = u => m + u * iw, py = v => m + (1 - (v + .5) / 2) * ih;
  const ux = X => clamp((X - m) / iw, 0, 1), uy = Y => clamp((1 - (Y - m) / ih) * 2 - .5, -.9, 1.9);
  function draw(){
    g.clearRect(0, 0, W, H);
    g.strokeStyle = 'rgba(255,255,255,.1)';
    g.strokeRect(m, py(1), iw, py(0) - py(1));
    g.strokeStyle = 'rgba(255,255,255,.055)';
    g.beginPath(); g.moveTo(m, py(.5)); g.lineTo(m + iw, py(.5)); g.stroke();
    /* curve */
    g.strokeStyle = '#8b7cff'; g.lineWidth = 2.2; g.beginPath();
    for(let i = 0; i <= 64; i++){
      const u = i / 64, v = ease(k, u);
      i ? g.lineTo(px(u), py(v)) : g.moveTo(px(u), py(v));
    }
    g.stroke();
    if(k.s > 0){
      g.fillStyle = 'rgba(255,255,255,.75)'; g.font = '600 10px system-ui';
      g.fillText('steps(' + k.s + ')', m + 4, m - 8);
      return;
    }
    /* handles */
    const h1 = [px(k.e[0]), py(k.e[1])], h2 = [px(k.e[2]), py(k.e[3])];
    g.strokeStyle = 'rgba(63,216,196,.55)'; g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(px(0), py(0)); g.lineTo(h1[0], h1[1]); g.stroke();
    g.beginPath(); g.moveTo(px(1), py(1)); g.lineTo(h2[0], h2[1]); g.stroke();
    [[h1,'#3fd8c4'],[h2,'#ffb457']].forEach(([p, col]) => {
      g.fillStyle = col; g.beginPath(); g.arc(p[0], p[1], 6, 0, 7); g.fill();
      g.strokeStyle = 'rgba(8,10,16,.9)'; g.lineWidth = 1.5; g.stroke();
    });
    g.fillStyle = 'rgba(200,208,228,.6)'; g.font = '600 9.5px system-ui';
    g.fillText('cubic-bezier(' + k.e.map(v => +v.toFixed(2)).join(', ') + ')', m - 12, H - 5);
  }
  let hot = null;
  const pt = ev => { const r = c.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
  c.addEventListener('pointerdown', ev => {
    if(k.s > 0){ k.s = 0; buildPanel(); return; }
    const [X, Y] = pt(ev);
    const d1 = Math.hypot(X - px(k.e[0]), Y - py(k.e[1])), d2 = Math.hypot(X - px(k.e[2]), Y - py(k.e[3]));
    hot = d1 < d2 ? 0 : 2;
    c.setPointerCapture(ev.pointerId);
    move(ev);
  });
  function move(ev){
    if(hot === null) return;
    const [X, Y] = pt(ev);
    k.e[hot] = ux(X); k.e[hot + 1] = uy(Y);
    draw(); applyFrame(); drawTL();
  }
  c.addEventListener('pointermove', move);
  c.addEventListener('pointerup', () => { if(hot !== null){ hot = null; save(); buildPanel(); } });
  c.addEventListener('pointercancel', () => hot = null);
  draw();
}

/* ============================ export ============================ */
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'shape';
function rawFrame(o, t){
  const f = {};
  PROPKEYS.forEach(p => f[p] = valueAt(o.tracks[p], p, t));
  return f;
}
function kfBody(o, t){
  const f = rawFrame(o, t);
  const tr = 'translate(var(--ew-dx,0px),var(--ew-dy,0px)) translate(' + r2(f.x) + 'px,' + r2(f.y) + 'px) rotate(' +
    r2(f.rotate) + 'deg) scale(' + r3(Math.max(0, f.scale)) + ')';
  let s = '    transform: ' + tr + ';\n    opacity: ' + r3(clamp(f.opacity, 0, 1)) + ';\n';
  s += '    filter: blur(' + r2(f.blur) + 'px);\n';
  return s;
}
const r2 = v => +v.toFixed(2), r3 = v => +v.toFixed(3);
function easeCss(k){
  if(k.s > 0) return k.s === 1 ? 'steps(1, end)' : 'steps(' + k.s + ', end)';
  return 'cubic-bezier(' + k.e.map(v => +v.toFixed(3)).join(', ') + ')';
}
function cssForObject(o){
  const D = st.duration, name = 'ew-' + slug(o.name), cls = '.' + name;
  const times = new Set([0, D]);
  PROPKEYS.forEach(p => (o.tracks[p] || []).forEach(k => times.add(clamp(k.t, 0, D))));
  const ts = [...times].sort((a, b) => a - b);
  let css = cls + ' {\n  animation: ' + name + ' ' + D + 'ms linear infinite both;\n}\n';
  if(o.count > 1){
    const c = (o.count - 1) / 2;
    for(let i = 0; i < o.count; i++){
      css += cls + ':nth-child(' + (i + 1) + ') { animation-delay: ' + (i * o.delay) + 'ms; --ew-dx: ' +
        r2((i - c) * o.ox) + 'px; --ew-dy: ' + r2((i - c) * o.oy) + 'px; }\n';
    }
  }
  css += '@keyframes ' + name + ' {\n';
  for(let i = 0; i < ts.length; i++){
    const a = ts[i], b = ts[i + 1];
    const pct = p => (p / D * 100).toFixed(3).replace(/\.?0+$/, '') + '%';
    if(b == null){ css += '  ' + pct(a) + ' {\n' + kfBody(o, a) + '  }\n'; break; }
    /* which easings govern this segment? */
    const set = [];
    PROPKEYS.forEach(p => {
      const tr = o.tracks[p] || [];
      for(let j = 0; j < tr.length - 1; j++){
        if(tr[j].t <= a && tr[j + 1].t >= b && tr[j].v !== tr[j + 1].v){
          const sig = easeCss(tr[j]);
          if(!set.includes(sig)) set.push(sig);
        }
      }
    });
    if(set.length <= 1){
      css += '  ' + pct(a) + ' {\n' + kfBody(o, a) +
        (set.length ? '    animation-timing-function: ' + set[0] + ';\n' : '') + '  }\n';
    } else {
      /* props disagree on easing across this span — bake it into linear samples */
      const N = 6;
      for(let j = 0; j < N; j++){
        const t = a + (b - a) * j / N;
        css += '  ' + pct(t) + ' {\n' + kfBody(o, t) + '    animation-timing-function: linear;\n  }\n';
      }
    }
  }
  return css + '}\n';
}
function buildCss(){
  let out = '/* Easeworks — Motion Timeline Studio · exported ' + new Date().toISOString().slice(0, 16).replace('T', ' ') +
    '\n   Scene: ' + (st.name || 'custom') + ' · duration ' + st.duration + 'ms · ' + st.objects.length + ' object(s)\n';
  out += '   Markup: one element per copy, siblings inside a wrapper:\n';
  st.objects.forEach(o => {
    const c = slug(o.name);
    out += '     <div class="ew-' + c + '-wrap">' +
      Array.from({length:Math.min(o.count, 3)}, () => '<div class="ew-' + c + '"></div>').join('') +
      (o.count > 3 ? ' \u2026' + o.count + ' total' : '') + '</div>\n';
  });
  out += '*/\n\n';
  st.objects.forEach(o => { out += cssForObject(o) + '\n'; });
  return out;
}
function dl(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return blob.size;
}
function projectJSON(){
  return JSON.stringify({
    tool:'easeworks', version:1, name:st.name || 'custom', duration:st.duration, bg:st.bg,
    objects:st.objects.map(o => ({
      name:o.name, shape:o.shape, color:o.color, text:o.text,
      count:o.count, delay:o.delay, ox:o.ox, oy:o.oy,
      tracks:Object.fromEntries(PROPKEYS.map(p => [p, (o.tracks[p] || []).map(k => ({t:k.t, v:+k.v.toFixed(3), e:k.e.map(x => +x.toFixed(3)), s:k.s}))]))
    }))
  });
}
/* filmstrip contact sheet */
function shapeOnCanvas(g, o, f){
  g.save();
  g.globalAlpha = clamp(f.opacity, 0, 1);
  g.translate(f.tx, f.ty);
  g.rotate(f.rotate * Math.PI / 180);
  g.scale(Math.max(0, f.scale), Math.max(0, f.scale));
  if(f.blur > 0.05){ try { g.filter = 'blur(' + f.blur.toFixed(1) + 'px)'; } catch(e){} }
  if(o.shape === 'ring'){
    g.strokeStyle = o.color; g.lineWidth = 5;
    g.beginPath(); g.arc(0, 0, 49, 0, Math.PI * 2); g.stroke();
  } else if(o.shape === 'text'){
    g.fillStyle = o.color; g.font = '800 34px system-ui,sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(o.text || 'Motion', 0, 0);
  } else {
    const dims = {card:[150, 96, 16], dot:[26, 26, 13], bar:[180, 16, 8]}[o.shape];
    const grd = g.createLinearGradient(-dims[0] / 2, -dims[1] / 2, dims[0] / 2, dims[1] / 2);
    grd.addColorStop(0, o.color); grd.addColorStop(1, shade(o.color, -38));
    g.fillStyle = grd;
    roundRect(g, -dims[0] / 2, -dims[1] / 2, dims[0], dims[1], dims[2]); g.fill();
    if(o.shape === 'card' && o.text){
      g.fillStyle = 'rgba(255,255,255,.92)'; g.font = '700 13px system-ui,sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(o.text, 0, 0);
    }
  }
  g.restore();
}
function exportFilmstrip(){
  const cols = 4, rows = 2, frames = cols * rows, pad = 12, cw = 320, ch = 180, lab = 20;
  const c = document.createElement('canvas');
  c.width = pad + cols * (cw + pad);
  c.height = pad + rows * (ch + lab + pad) + 10;
  const g = c.getContext('2d');
  g.fillStyle = '#0a0c13'; g.fillRect(0, 0, c.width, c.height);
  for(let f = 0; f < frames; f++){
    const t = st.duration * f / (frames - 1);
    const cx = pad + (f % cols) * (cw + pad), cy = pad + Math.floor(f / cols) * (ch + lab + pad);
    g.save();
    roundRect(g, cx, cy, cw, ch, 12); g.clip();
    g.fillStyle = st.bg === 'light' ? '#e8ebf5' : '#121725'; g.fillRect(cx, cy, cw, ch);
    g.translate(cx + cw / 2, cy + ch / 2); g.scale(0.5, 0.5);
    st.objects.forEach(o => {
      for(let i = 0; i < o.count; i++){
        let tt = t - i * o.delay;
        tt = ((tt % st.duration) + st.duration) % st.duration;
        shapeOnCanvas(g, o, frameOf(o, i, tt));
      }
    });
    g.restore();
    g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 1;
    roundRect(g, cx + .5, cy + .5, cw - 1, ch - 1, 12); g.stroke();
    g.fillStyle = 'rgba(200,208,228,.75)'; g.font = '600 12px system-ui,sans-serif';
    g.textAlign = 'left'; g.textBaseline = 'top';
    g.fillText('frame ' + (f + 1) + ' · ' + (t / 1000).toFixed(2) + 's', cx + 2, cy + ch + 5);
  }
  g.fillStyle = 'rgba(139,124,255,.9)'; g.font = '700 13px system-ui,sans-serif';
  g.textAlign = 'right'; g.textBaseline = 'bottom';
  g.fillText('Easeworks · ' + (st.name || 'custom') + ' · ' + st.duration + 'ms', c.width - pad, c.height - 4);
  return new Promise(res => {
    if(c.toBlob) c.toBlob(b => res(b), 'image/png');
    else res(new Blob([Uint8Array.from(atob(c.toDataURL().split(',')[1]), ch2 => ch2.charCodeAt(0))], {type:'image/png'}));
  });
}
/* ============================ persistence ============================ */
const b64e = s => btoa(String.fromCharCode.apply(null, new TextEncoder().encode(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const b64d = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0)));
let saveT = 0;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(() => { try { localStorage.setItem(LS, projectJSON()); } catch(e){} }, 350);
}
function load(){
  try {
    if(location.hash.length > 12){
      const s = normalize(JSON.parse(b64d(location.hash.slice(1))));
      if(s){ toast('Loaded shared scene'); return s; }
    }
  } catch(e){}
  try {
    const raw = localStorage.getItem(LS);
    if(raw){ const s = normalize(JSON.parse(raw)); if(s) return s; }
  } catch(e){}
  return fresh(DEFAULT_SCENE);
}
/* ============================ ui glue ============================ */
let toastT = 0;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 1900);
}
function setTime(t){
  time = clamp(t, 0, st.duration);
  applyFrame(); drawTL(); stamp();
}
function stamp(){
  document.getElementById('tlabel').textContent =
    (time / 1000).toFixed(2) + 's / ' + (st.duration / 1000).toFixed(2) + 's';
}
function syncPlay(){
  const b = document.getElementById('play');
  b.textContent = playing ? 'Pause' : 'Play';
  b.classList.toggle('pri', true);
}
function autoKey(){
  const o = selObj();
  const p = PROPKEYS.find(pp => (o.tracks[pp] || []).length) || 'y';
  sel.prop = p;
  sel.idx = (o.tracks[p] || []).length ? 0 : null;
}
function loadScene(name){
  st = fresh(name);
  sel = {obj:st.objects[0].id, prop:'y', idx:null};
  autoKey();
  time = 0; playing = true; syncPlay();
  buildStage(); applyFrame(); buildPanel(); tlSize(); stamp(); save();
}
function addKeyAtPlayhead(){
  const o = selObj(), p = sel.prop;
  const track = o.tracks[p] || (o.tracks[p] = []);
  const t = Math.round(time / 5) * 5;
  const exist = track.findIndex(k => Math.abs(k.t - t) < 6);
  if(exist >= 0){ sel.idx = exist; toast('Keyframe already here'); }
  else {
    track.push(K(t, valueAt(track, p, t), EO)); track.sort((a, b) => a.t - b.t);
    sel.idx = track.findIndex(k => k.t === t);
    toast('Keyed ' + PROPS[p].label + ' @ ' + t + 'ms');
  }
  buildPanel(); drawTL(); save();
}
function delKey(){
  const o = selObj(), track = o.tracks[sel.prop] || [];
  if(sel.idx == null || !track[sel.idx]) return toast('No keyframe selected');
  track.splice(sel.idx, 1);
  sel.idx = track.length ? Math.max(0, sel.idx - 1) : null;
  buildPanel(); applyFrame(); drawTL(); save();
  toast('Keyframe removed');
}
/* toolbar */
const sceneSel = document.getElementById('scene');
sceneSel.innerHTML = Object.keys(SCENES).map(n => '<option' + (n === DEFAULT_SCENE ? ' selected' : '') + '>' + n + '</option>').join('');
sceneSel.addEventListener('change', e => loadScene(e.target.value));
document.getElementById('play').addEventListener('click', () => { playing = !playing; syncPlay(); });
document.getElementById('loop').addEventListener('click', e => {
  looping = !looping; e.target.classList.toggle('on', looping); applyFrame();
});
document.getElementById('addKey').addEventListener('click', addKeyAtPlayhead);
document.getElementById('delKey').addEventListener('click', delKey);
document.getElementById('copyCss').addEventListener('click', async () => {
  const css = buildCss();
  try { await navigator.clipboard.writeText(css); toast('CSS copied · ' + css.length + ' chars'); }
  catch(e){ dl(new Blob([css], {type:'text/css'}), 'easeworks.css'); toast('Clipboard blocked — downloaded instead'); }
});
document.getElementById('dlCss').addEventListener('click', () => {
  const n = dl(new Blob([buildCss()], {type:'text/css'}), 'easeworks-' + slug(st.name || 'scene') + '.css');
  toast('Downloaded ' + (n / 1024).toFixed(1) + ' kB of CSS');
});
document.getElementById('dlJson').addEventListener('click', () => {
  const n = dl(new Blob([projectJSON()], {type:'application/json'}), 'easeworks-' + slug(st.name || 'scene') + '.json');
  toast('Project saved · ' + (n / 1024).toFixed(1) + ' kB');
});
document.getElementById('dlPng').addEventListener('click', async () => {
  const blob = await exportFilmstrip();
  if(!blob || !blob.size) return toast('Filmstrip failed');
  dl(blob, 'easeworks-filmstrip.png');
  toast('Filmstrip exported · ' + (blob.size / 1024).toFixed(0) + ' kB');
});
document.getElementById('share').addEventListener('click', async () => {
  const h = '#' + b64e(projectJSON());
  history.replaceState(null, '', location.pathname + location.search + h);
  const url = location.href;
  try { await navigator.clipboard.writeText(url); toast('Share link copied (' + url.length + ' chars)'); }
  catch(e){ toast('Link is in the address bar'); }
});
addEventListener('keydown', e => {
  if(/input|select|textarea/i.test((e.target.tagName || ''))) return;
  if(e.code === 'Space'){ e.preventDefault(); playing = !playing; syncPlay(); }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); playing = false; syncPlay(); setTime(time - 16.7); }
  else if(e.key === 'ArrowRight'){ e.preventDefault(); playing = false; syncPlay(); setTime(time + 16.7); }
  else if(e.key === 'k' || e.key === 'K'){ addKeyAtPlayhead(); }
  else if(e.key === 'Backspace' || e.key === 'Delete'){ e.preventDefault(); delKey(); }
});
let rz = 0;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { fitStage(); tlSize(); }, 90); });
/* ============================ main loop ============================ */
function loop(now){
  if(!last) last = now;
  const dt = Math.min(64, now - last); last = now;
  if(playing){
    time += dt;
    if(time > st.duration){ if(looping) time -= st.duration; else { time = st.duration; playing = false; syncPlay(); } }
    applyFrame(); drawTL(); stamp();
  }
  requestAnimationFrame(loop);
}
/* ============================ boot ============================ */
st = load();
if(!st.name) st.name = 'custom';
sel.obj = st.objects[0].id;
autoKey();
buildStage(); buildPanel(); tlSize(); applyFrame(); stamp(); syncPlay();
if(st.name && SCENES[st.name]) sceneSel.value = st.name;
setTimeout(() => { const h = document.getElementById('hint'); if(h) h.style.opacity = '0'; }, 7000);
requestAnimationFrame(loop);
</script>
