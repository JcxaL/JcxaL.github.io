<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chladni Sandbox — Resonance Pattern Studio</title>
<style>
  :root{
    --bg0:#050308;
    --bg1:#0b0714;
    --plate:#100a1c;
    --accent:#8b5cf6;
    --accent2:#22d3ee;
    --accent3:#f0abfc;
    --text:#e9e3f5;
    --dim:#8f88a8;
    --glass:rgba(20,14,34,0.62);
    --glass-brd:rgba(255,255,255,0.09);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;height:100%;width:100%;overflow:hidden;
    background:radial-gradient(120% 120% at 50% 0%, var(--bg1), var(--bg0));
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--text);
    touch-action:none;
    -webkit-user-select:none;user-select:none;
  }
  #stage{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
  }
  #plateWrap{
    position:relative;
    border-radius:22px;
    padding:14px;
    background:linear-gradient(155deg,#221733,#0d0816 60%);
    box-shadow:
      0 40px 90px -30px rgba(0,0,0,0.8),
      inset 0 1px 0 rgba(255,255,255,0.06),
      0 0 0 1px rgba(255,255,255,0.05);
  }
  #plateInner{
    position:relative;border-radius:14px;overflow:hidden;
    background:var(--plate);
    box-shadow:inset 0 0 60px rgba(0,0,0,0.7), inset 0 0 2px rgba(255,255,255,0.15);
  }
  canvas{display:block;touch-action:none;}
  #screwTL,#screwTR,#screwBL,#screwBR{
    position:absolute;width:9px;height:9px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #a89bd8, #4a3f6b 70%);
    box-shadow:0 1px 2px rgba(0,0,0,0.6);
  }
  #screwTL{top:6px;left:6px;} #screwTR{top:6px;right:6px;}
  #screwBL{bottom:6px;left:6px;} #screwBR{bottom:6px;right:6px;}

  .glass{
    background:var(--glass);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border:1px solid var(--glass-brd);
    border-radius:16px;
    box-shadow:0 18px 50px -20px rgba(0,0,0,0.6);
  }

  /* top bar */
  #topbar{
    position:fixed;top:14px;left:14px;right:14px;
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;z-index:30;pointer-events:none;
  }
  #brand{
    display:flex;align-items:center;gap:9px;padding:9px 14px;
    pointer-events:auto;
  }
  #brand .dot{
    width:9px;height:9px;border-radius:50%;
    background:conic-gradient(from 0deg,var(--accent),var(--accent2),var(--accent3),var(--accent));
    animation:spin 4s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #brand b{font-size:13.5px;font-weight:650;letter-spacing:.2px;}
  #brand span{font-size:10.5px;color:var(--dim);}

  #topActions{display:flex;gap:8px;pointer-events:auto;}
  .iconbtn{
    width:38px;height:38px;border-radius:12px;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    background:var(--glass);border:1px solid var(--glass-brd);color:var(--text);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    font-size:16px;transition:transform .15s ease, background .15s ease;
  }
  .iconbtn:active{transform:scale(0.9);}
  .iconbtn.active{background:linear-gradient(135deg,var(--accent),#5b3fae);border-color:transparent;}

  /* side panel */
  #panel{
    position:fixed;top:66px;right:14px;width:280px;
    max-height:calc(100% - 150px);
    overflow-y:auto;overflow-x:hidden;
    padding:16px;z-index:25;
    display:flex;flex-direction:column;gap:14px;
    transition:transform .3s cubic-bezier(.22,1,.36,1), opacity .3s ease;
  }
  #panel.hidden{transform:translateX(320px);opacity:0;pointer-events:none;}
  #panel::-webkit-scrollbar{width:5px;}
  #panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:3px;}

  .sect-title{
    font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;
    color:var(--dim);font-weight:700;margin:0 0 2px;
  }
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .row label{font-size:12.5px;color:var(--text);}
  .row .val{font-size:11.5px;color:var(--accent3);font-variant-numeric:tabular-nums;}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    outline:none;margin:6px 0 2px;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:#fff;box-shadow:0 0 0 3px rgba(139,92,246,0.45),0 2px 6px rgba(0,0,0,0.4);
    cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:15px;height:15px;border-radius:50%;background:#fff;border:none;
    box-shadow:0 0 0 3px rgba(139,92,246,0.45);
    cursor:pointer;
  }

  .presetGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .presetBtn{
    padding:8px 6px;border-radius:10px;border:1px solid var(--glass-brd);
    background:rgba(255,255,255,0.04);color:var(--text);font-size:11px;
    cursor:pointer;text-align:center;line-height:1.25;transition:background .15s;
  }
  .presetBtn:active{background:rgba(139,92,246,0.35);}
  .presetBtn b{display:block;font-size:11.5px;}
  .presetBtn i{display:block;font-style:normal;color:var(--dim);font-size:9.5px;}

  .swatches{display:flex;gap:7px;flex-wrap:wrap;}
  .swatch{
    width:24px;height:24px;border-radius:50%;cursor:pointer;
    border:2px solid rgba(255,255,255,0.15);
  }
  .swatch.on{border-color:#fff;transform:scale(1.12);}

  button.action{
    width:100%;padding:10px;border-radius:11px;border:none;cursor:pointer;
    font-size:12.5px;font-weight:600;color:#fff;
    background:linear-gradient(135deg,var(--accent),#6d28d9);
    box-shadow:0 8px 20px -8px rgba(139,92,246,0.65);
  }
  button.action.ghost{
    background:rgba(255,255,255,0.06);color:var(--text);
    border:1px solid var(--glass-brd);box-shadow:none;
  }
  button.action:active{transform:scale(0.97);}
  .btnRow{display:flex;gap:8px;}
  .btnRow button.action{flex:1;}

  #savedList{display:flex;flex-direction:column;gap:5px;max-height:110px;overflow-y:auto;}
  .savedItem{
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 9px;border-radius:9px;background:rgba(255,255,255,0.04);
    font-size:11.5px;cursor:pointer;
  }
  .savedItem:active{background:rgba(139,92,246,0.3);}
  .savedItem .del{color:#f87171;font-size:13px;padding:0 3px;}

  hr{border:none;border-top:1px solid var(--glass-brd);margin:2px 0;}

  /* bottom hint */
  #hint{
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
    padding:8px 16px;font-size:11.5px;color:var(--dim);
    display:flex;align-items:center;gap:7px;z-index:20;
    opacity:0.95;transition:opacity .4s ease;
  }
  #hint.fade{opacity:0;}

  #toast{
    position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(10px);
    padding:9px 16px;font-size:12px;font-weight:600;z-index:60;
    opacity:0;transition:opacity .25s ease, transform .25s ease;pointer-events:none;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  #modeReadout{
    position:absolute;left:14px;bottom:12px;font-size:11px;color:rgba(255,255,255,0.55);
    letter-spacing:.4px;pointer-events:none;font-variant-numeric:tabular-nums;
  }

  @media (max-width:760px){
    #panel{
      top:auto;bottom:0;left:0;right:0;width:auto;max-height:62%;
      border-radius:20px 20px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));
    }
    #panel.hidden{transform:translateY(100%);}
    #topbar{top:calc(10px + env(safe-area-inset-top));}
    #hint{display:none;}
  }
</style>
</head>
<body>

<div id="stage">
  <div id="plateWrap">
    <div id="plateInner">
      <canvas id="c"></canvas>
      <div id="modeReadout">n=2 m=3</div>
    </div>
    <div id="screwTL"></div><div id="screwTR"></div><div id="screwBL"></div><div id="screwBR"></div>
  </div>
</div>

<div id="topbar">
  <div class="glass" id="brand">
    <div class="dot"></div>
    <div><b>Chladni Sandbox</b><br><span>resonance pattern studio</span></div>
  </div>
  <div id="topActions">
    <button class="iconbtn" id="soundBtn" title="Toggle tone">🔇</button>
    <button class="iconbtn" id="panelBtn" title="Controls">⚙</button>
  </div>
</div>

<div id="panel" class="glass">
  <div>
    <div class="sect-title">Resonant Mode</div>
    <div class="row"><label>n (harmonic X)</label><span class="val" id="nVal">2</span></div>
    <input type="range" id="nSlider" min="1" max="12" value="2" step="1">
    <div class="row"><label>m (harmonic Y)</label><span class="val" id="mVal">3</span></div>
    <input type="range" id="mSlider" min="1" max="12" value="3" step="1">
    <div class="btnRow" style="margin-top:8px;">
      <button class="action ghost" id="randomizeBtn">🎲 Randomize</button>
      <button class="action ghost" id="tapBtn">👋 Tap Plate</button>
    </div>
  </div>

  <hr>

  <div>
    <div class="sect-title">Presets</div>
    <div class="presetGrid" id="presetGrid"></div>
  </div>

  <hr>

  <div>
    <div class="sect-title">Sand</div>
    <div class="row"><label>Grain count</label><span class="val" id="countVal">2600</span></div>
    <input type="range" id="countSlider" min="600" max="6000" value="2600" step="100">
    <div class="row" style="margin-top:8px;"><label>Shake energy</label><span class="val" id="shakeVal">38</span></div>
    <input type="range" id="shakeSlider" min="4" max="100" value="38" step="1">
    <div class="row" style="margin-top:10px;margin-bottom:2px;"><label>Grain color</label></div>
    <div class="swatches" id="swatches"></div>
  </div>

  <hr>

  <div>
    <div class="sect-title">My Patterns</div>
    <div id="savedList"><div style="font-size:11px;color:var(--dim);padding:4px 0;">No saved patterns yet.</div></div>
    <div class="btnRow" style="margin-top:8px;">
      <button class="action ghost" id="saveBtn">💾 Save current</button>
    </div>
  </div>

  <hr>

  <div class="btnRow">
    <button class="action" id="exportBtn">⬇ Export PNG</button>
    <button class="action ghost" id="shareBtn">🔗 Copy Link</button>
  </div>
</div>

<div id="hint" class="glass">✋ drag the sand • ⚙ open controls • tap plate to shake</div>
<div id="toast" class="glass"></div>

<script>
(function(){
  "use strict";

  /* ---------- canvas / plate sizing ---------- */
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var plateInner = document.getElementById('plateInner');
  var plateWrap = document.getElementById('plateWrap');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var PLATE_PX = 0; // css size of square plate

  function sizePlate(){
    var margin = window.innerWidth < 760 ? 40 : 80;
    var reserved = window.innerWidth < 760 ? 300 : 0; // panel is bottom sheet on mobile, no side reserve needed since it overlays
    var maxW = window.innerWidth - margin;
    var maxH = window.innerHeight - margin - (window.innerWidth < 760 ? 40 : 0);
    var side = Math.max(220, Math.min(maxW, maxH, 640));
    PLATE_PX = Math.round(side);
    plateInner.style.width = PLATE_PX + 'px';
    plateInner.style.height = PLATE_PX + 'px';
    canvas.style.width = PLATE_PX + 'px';
    canvas.style.height = PLATE_PX + 'px';
    canvas.width = Math.round(PLATE_PX * DPR);
    canvas.height = Math.round(PLATE_PX * DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', sizePlate);
  sizePlate();

  /* ---------- state ---------- */
  var state = {
    n: 2, m: 3,
    shake: 38,
    count: 2600,
    color: '#f0abfc'
  };

  var morph = null; // {fromN,fromM,toN,toM,t}
  var particles = [];
  var soundOn = false;
  var audioCtx = null, oscA = null, oscB = null, gainNode = null;

  var COLORS = ['#f0abfc','#22d3ee','#facc15','#f87171','#a3e635','#e9e3f5'];

  /* ---------- Chladni field f(x,y) for mode (n,m), x,y in [0,1] ---------- */
  function field(x, y, n, m){
    if (n === m){
      // degenerate case: fall back to a grid pattern so it never collapses to zero everywhere
      return Math.sin(n*Math.PI*x) * Math.sin(n*Math.PI*y);
    }
    return Math.sin(n*Math.PI*x)*Math.sin(m*Math.PI*y) - Math.sin(m*Math.PI*x)*Math.sin(n*Math.PI*y);
  }

  function currentField(x, y){
    if (morph){
      var a = field(x, y, morph.fromN, morph.fromM);
      var b = field(x, y, morph.toN, morph.toM);
      return a * (1 - morph.t) + b * morph.t;
    }
    return field(x, y, state.n, state.m);
  }

  /* ---------- particles ---------- */
  function initParticles(count){
    particles = new Array(count);
    for (var i = 0; i < count; i++){
      particles[i] = { x: Math.random(), y: Math.random() };
    }
  }
  initParticles(state.count);

  function resizeParticleCount(count){
    if (count > particles.length){
      var toAdd = count - particles.length;
      for (var i = 0; i < toAdd; i++) particles.push({ x: Math.random(), y: Math.random() });
    } else {
      particles.length = count;
    }
  }

  function scatterAll(intensity){
    for (var i = 0; i < particles.length; i++){
      particles[i].x = Math.min(0.995, Math.max(0.005, particles[i].x + (Math.random()-0.5) * intensity));
      particles[i].y = Math.min(0.995, Math.max(0.005, particles[i].y + (Math.random()-0.5) * intensity));
    }
  }

  /* ---------- simulation step (stochastic hill-descent, classic chladni-sand technique) ---------- */
  function step(){
    var shake = state.shake / 100; // 0..1
    var jump = 0.012 + shake * 0.05;
    var uphillChance = 0.02 + shake * 0.22;
    var iterations = 2;
    for (var it = 0; it < iterations; it++){
      for (var i = 0; i < particles.length; i++){
        var p = particles[i];
        var cur = Math.abs(currentField(p.x, p.y));
        var nx = p.x + (Math.random()*2-1) * jump;
        var ny = p.y + (Math.random()*2-1) * jump;
        if (nx < 0.002) nx = 0.002; if (nx > 0.998) nx = 0.998;
        if (ny < 0.002) ny = 0.002; if (ny > 0.998) ny = 0.998;
        var nv = Math.abs(currentField(nx, ny));
        if (nv <= cur || Math.random() < uphillChance){
          p.x = nx; p.y = ny;
        }
      }
    }
  }

  /* ---------- rendering ---------- */
  function render(){
    ctx.clearRect(0,0,PLATE_PX,PLATE_PX);
    var grad = ctx.createRadialGradient(PLATE_PX/2,PLATE_PX/2,PLATE_PX*0.05,PLATE_PX/2,PLATE_PX/2,PLATE_PX*0.75);
    grad.addColorStop(0,'rgba(139,92,246,0.05)');
    grad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,PLATE_PX,PLATE_PX);

    ctx.fillStyle = state.color;
    ctx.shadowColor = state.color;
    ctx.shadowBlur = 2.2;
    var sz = particles.length > 4000 ? 1.1 : 1.5;
    for (var i = 0; i < particles.length; i++){
      var p = particles[i];
      ctx.fillRect(p.x*PLATE_PX, p.y*PLATE_PX, sz, sz);
    }
    ctx.shadowBlur = 0;
  }

  var raf = null;
  function loop(){
    step();
    render();
    if (morph){
      morph.t += 0.018;
      if (morph.t >= 1){
        state.n = morph.toN; state.m = morph.toM;
        updateReadout();
        morph = null;
      }
    }
    raf = requestAnimationFrame(loop);
  }
  loop();

  /* ---------- UI wiring ---------- */
  var nSlider = document.getElementById('nSlider');
  var mSlider = document.getElementById('mSlider');
  var nVal = document.getElementById('nVal');
  var mVal = document.getElementById('mVal');
  var modeReadout = document.getElementById('modeReadout');

  function updateReadout(){
    nVal.textContent = state.n;
    mVal.textContent = state.m;
    modeReadout.textContent = 'n=' + state.n + '  m=' + state.m;
    if (soundOn) setTone();
  }

  function setMode(n, m, animated){
    n = Math.max(1, Math.min(12, n|0));
    m = Math.max(1, Math.min(12, m|0));
    if (animated && (n !== state.n || m !== state.m)){
      morph = { fromN: state.n, fromM: state.m, toN: n, toM: m, t: 0 };
    } else {
      state.n = n; state.m = m; morph = null;
    }
    nSlider.value = n; mSlider.value = m;
    state.n = animated ? state.n : n;
    state.m = animated ? state.m : m;
    if (!animated){ updateReadout(); }
    else { nVal.textContent = n; mVal.textContent = m; modeReadout.textContent = 'n=' + n + '  m=' + m; if (soundOn) { state._pendingTone = [n,m]; setTone(n,m); } }
  }

  nSlider.addEventListener('input', function(){ setMode(+nSlider.value, +mSlider.value, false); });
  mSlider.addEventListener('input', function(){ setMode(+nSlider.value, +mSlider.value, false); });

  document.getElementById('randomizeBtn').addEventListener('click', function(){
    setMode(1 + Math.floor(Math.random()*12), 1 + Math.floor(Math.random()*12), true);
    scatterAll(0.35);
  });

  document.getElementById('tapBtn').addEventListener('click', function(){
    scatterAll(0.5);
    flashToast('Plate tapped — settling…');
  });

  /* ---------- presets ---------- */
  var PRESETS = [
    { name:'Butterfly', n:2, m:3 },
    { name:'Web', n:3, m:5 },
    { name:'Mandala', n:4, m:5 },
    { name:'Snowflake', n:1, m:4 },
    { name:'Star Burst', n:5, m:6 },
    { name:'Grid Weave', n:6, m:6 },
    { name:'Spiral Knot', n:2, m:7 },
    { name:'Cathedral', n:3, m:8 }
  ];
  var presetGrid = document.getElementById('presetGrid');
  PRESETS.forEach(function(p){
    var b = document.createElement('button');
    b.className = 'presetBtn';
    b.innerHTML = '<b>' + p.name + '</b><i>n=' + p.n + ' m=' + p.m + '</i>';
    b.addEventListener('click', function(){
      setMode(p.n, p.m, true);
      scatterAll(0.3);
    });
    presetGrid.appendChild(b);
  });

  /* ---------- sand controls ---------- */
  var countSlider = document.getElementById('countSlider');
  var countVal = document.getElementById('countVal');
  countSlider.addEventListener('input', function(){
    state.count = +countSlider.value;
    countVal.textContent = state.count;
    resizeParticleCount(state.count);
  });

  var shakeSlider = document.getElementById('shakeSlider');
  var shakeVal = document.getElementById('shakeVal');
  shakeSlider.addEventListener('input', function(){
    state.shake = +shakeSlider.value;
    shakeVal.textContent = state.shake;
  });

  var swatchWrap = document.getElementById('swatches');
  COLORS.forEach(function(c, i){
    var s = document.createElement('div');
    s.className = 'swatch' + (i===0?' on':'');
    s.style.background = c;
    s.addEventListener('click', function(){
      state.color = c;
      Array.prototype.forEach.call(swatchWrap.children, function(el){ el.classList.remove('on'); });
      s.classList.add('on');
    });
    swatchWrap.appendChild(s);
  });

  /* ---------- panel toggle ---------- */
  var panel = document.getElementById('panel');
  var panelBtn = document.getElementById('panelBtn');
  var hint = document.getElementById('hint');
  var panelOpen = window.innerWidth >= 760;
  if (!panelOpen) panel.classList.add('hidden');
  panelBtn.addEventListener('click', function(){
    panelOpen = !panelOpen;
    panel.classList.toggle('hidden', !panelOpen);
    panelBtn.classList.toggle('active', panelOpen);
  });
  panelBtn.classList.toggle('active', panelOpen);
  setTimeout(function(){ hint.classList.add('fade'); }, 5000);

  /* ---------- drag sand with pointer ---------- */
  var dragging = false, lastPt = null;
  function toPlateCoords(clientX, clientY){
    var r = canvas.getBoundingClientRect();
    return { x: (clientX - r.left) / r.width, y: (clientY - r.top) / r.height };
  }
  function disturb(px, py, radius, strength){
    for (var i = 0; i < particles.length; i++){
      var p = particles[i];
      var dx = p.x - px, dy = p.y - py;
      var d2 = dx*dx + dy*dy;
      if (d2 < radius*radius){
        var d = Math.sqrt(d2) || 0.0001;
        var f = (1 - d/radius) * strength;
        p.x = Math.min(0.995, Math.max(0.005, p.x + (dx/d) * f));
        p.y = Math.min(0.995, Math.max(0.005, p.y + (dy/d) * f));
      }
    }
  }
  canvas.addEventListener('pointerdown', function(e){
    dragging = true; canvas.setPointerCapture(e.pointerId);
    lastPt = toPlateCoords(e.clientX, e.clientY);
  });
  canvas.addEventListener('pointermove', function(e){
    if (!dragging) return;
    var pt = toPlateCoords(e.clientX, e.clientY);
    disturb(pt.x, pt.y, 0.09, 0.05);
    lastPt = pt;
  });
  window.addEventListener('pointerup', function(){ dragging = false; });
  window.addEventListener('pointercancel', function(){ dragging = false; });

  /* ---------- audio (created only after first gesture) ---------- */
  var soundBtn = document.getElementById('soundBtn');
  function ensureAudio(){
    if (audioCtx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    gainNode = audioCtx.createGain();
    gainNode.gain.value = 0;
    gainNode.connect(audioCtx.destination);
    oscA = audioCtx.createOscillator();
    oscB = audioCtx.createOscillator();
    oscA.type = 'sine'; oscB.type = 'sine';
    var gA = audioCtx.createGain(); gA.gain.value = 0.5;
    var gB = audioCtx.createGain(); gB.gain.value = 0.5;
    oscA.connect(gA).connect(gainNode);
    oscB.connect(gB).connect(gainNode);
    oscA.start(); oscB.start();
  }
  function setTone(){
    if (!audioCtx) return;
    var base = 82.4; // low E
    oscA.frequency.setTargetAtTime(base * state.n, audioCtx.currentTime, 0.08);
    oscB.frequency.setTargetAtTime(base * state.m, audioCtx.currentTime, 0.08);
  }
  soundBtn.addEventListener('click', function(){
    ensureAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? '🔊' : '🔇';
    soundBtn.classList.toggle('active', soundOn);
    if (soundOn){
      setTone();
      gainNode.gain.setTargetAtTime(0.05, audioCtx.currentTime, 0.15);
    } else {
      gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.15);
    }
  });

  /* ---------- export PNG ---------- */
  document.getElementById('exportBtn').addEventListener('click', function(){
    canvas.toBlob(function(blob){
      if (!blob){ flashToast('Export failed'); return; }
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'chladni-n' + state.n + '-m' + state.m + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      flashToast('PNG exported ✓');
    }, 'image/png');
  });

  /* ---------- share link ---------- */
  document.getElementById('shareBtn').addEventListener('click', function(){
    var payload = { n: state.n, m: state.m, c: state.color, cnt: state.count };
    var hash = btoa(JSON.stringify(payload));
    var url = location.origin + location.pathname + '#' + hash;
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){
        flashToast('Link copied ✓');
      }).catch(function(){
        flashToast(url);
      });
    } else {
      window.prompt('Copy this link:', url);
    }
  });

  function loadFromHash(){
    if (!location.hash || location.hash.length < 2) return false;
    try {
      var payload = JSON.parse(atob(location.hash.slice(1)));
      if (payload.n && payload.m){
        setMode(payload.n, payload.m, false);
        if (payload.c){ state.color = payload.c; }
        if (payload.cnt){ state.count = Math.max(600, Math.min(6000, payload.cnt)); resizeParticleCount(state.count); countSlider.value = state.count; countVal.textContent = state.count; }
        scatterAll(0.4);
        return true;
      }
    } catch(e){ /* ignore malformed hash */ }
    return false;
  }

  /* ---------- localStorage saved patterns ---------- */
  var SAVE_KEY = 'chladni_sandbox_patterns_v1';
  function loadSaved(){
    try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || []; }
    catch(e){ return []; }
  }
  function writeSaved(list){
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(list)); } catch(e){ /* storage unavailable */ }
  }
  function renderSaved(){
    var list = loadSaved();
    var wrap = document.getElementById('savedList');
    wrap.innerHTML = '';
    if (!list.length){
      wrap.innerHTML = '<div style="font-size:11px;color:var(--dim);padding:4px 0;">No saved patterns yet.</div>';
      return;
    }
    list.forEach(function(item, idx){
      var row = document.createElement('div');
      row.className = 'savedItem';
      var label = document.createElement('span');
      label.textContent = item.label;
      row.appendChild(label);
      var del = document.createElement('span');
      del.className = 'del'; del.textContent = '✕';
      del.addEventListener('click', function(ev){
        ev.stopPropagation();
        var l = loadSaved(); l.splice(idx,1); writeSaved(l); renderSaved();
      });
      row.appendChild(del);
      row.addEventListener('click', function(){
        setMode(item.n, item.m, true);
        state.color = item.c || state.color;
        scatterAll(0.3);
        flashToast('Loaded "' + item.label + '"');
      });
      wrap.appendChild(row);
    });
  }
  document.getElementById('saveBtn').addEventListener('click', function(){
    var label = window.prompt('Name this pattern:', 'n' + state.n + ' m' + state.m);
    if (!label) return;
    var list = loadSaved();
    list.push({ label: label.slice(0,24), n: state.n, m: state.m, c: state.color });
    if (list.length > 12) list.shift();
    writeSaved(list);
    renderSaved();
    flashToast('Saved ✓');
  });
  renderSaved();

  /* ---------- toast ---------- */
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function flashToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }

  /* ---------- init ---------- */
  if (!loadFromHash()){
    updateReadout();
  }
})();
</script>
</body>
</html>
