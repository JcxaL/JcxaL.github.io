<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Linkwright — Mechanism Workshop</title>
<meta name="description" content="Design four-bar linkages, gear trains and cam profiles, watch them run, and export real SVG cutting files.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070a0f; --bg2:#0a0e15; --panel:#0d131c; --card:#111925; --line:#1c2635;
  --ink:#e9eff7; --dim:#7e8da3; --dim2:#566376;
  --teal:#5ee0c8; --amber:#ffb347; --blue:#7aa2ff; --red:#ff6f6f; --violet:#b79cff;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --accent:var(--teal);
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);overflow:hidden;
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
}
#app{display:flex;flex-direction:column;height:100%}

/* ---------- top bar ---------- */
#bar{
  display:flex;align-items:center;gap:14px;padding:10px 14px;
  background:linear-gradient(180deg,#0d141e,#0a0f17);
  border-bottom:1px solid var(--line);flex:0 0 auto;
  padding-top:max(10px,env(safe-area-inset-top));
}
.brand{
  font:700 15px/1 var(--mono);letter-spacing:.18em;white-space:nowrap;
  color:var(--ink);
}
.brand span{color:var(--accent)}
.brand i{display:block;font:400 9px/1.6 var(--mono);letter-spacing:.14em;color:var(--dim2);font-style:normal}

/* segmented control */
.segs{position:relative;display:flex;background:#0a1017;border:1px solid var(--line);border-radius:10px;padding:3px;flex:0 0 auto}
.segs button{
  position:relative;z-index:2;appearance:none;background:none;border:0;cursor:pointer;
  color:var(--dim);font:600 12px/1 var(--mono);letter-spacing:.06em;
  padding:8px 13px;border-radius:7px;transition:color .25s;
}
.segs button.on{color:#06121a}
.segs .thumb{
  position:absolute;z-index:1;top:3px;left:3px;height:calc(100% - 6px);
  border-radius:7px;background:var(--accent);
  transition:transform .42s cubic-bezier(.34,1.56,.64,1),width .42s cubic-bezier(.34,1.56,.64,1),background .3s;
  box-shadow:0 2px 10px -2px var(--accent);
}
.acts{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.btn{
  appearance:none;cursor:pointer;background:#121b26;border:1px solid var(--line);
  color:var(--ink);font:600 11px/1 var(--mono);letter-spacing:.06em;
  padding:9px 11px;border-radius:8px;transition:border-color .2s,background .2s,transform .1s;
  white-space:nowrap;
}
.btn:hover{border-color:var(--accent);background:#16212e}
.btn:active{transform:translateY(1px)}
.btn.key{background:var(--accent);border-color:var(--accent);color:#06121a}
.btn.key:hover{filter:brightness(1.1)}
.btn.ic{width:38px;text-align:center;font-size:13px}

/* ---------- main ---------- */
main{display:flex;flex:1 1 auto;min-height:0}
#stage{position:relative;flex:1 1 auto;min-width:0;background:
  radial-gradient(90% 70% at 50% 0%,#0d1520 0%,#070a0f 70%)}
#cv{display:block;width:100%;height:100%;touch-action:none}

#hud{
  position:absolute;left:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;
  max-width:calc(100% - 24px);pointer-events:none;
}
.chip{
  background:rgba(13,19,28,.82);border:1px solid var(--line);border-radius:7px;
  padding:5px 9px;font:600 10.5px/1.3 var(--mono);letter-spacing:.04em;color:var(--dim);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.chip b{color:var(--ink);font-weight:700}
.chip.hi b{color:var(--accent)}
.chip.warn{border-color:#5a3a2a}.chip.warn b{color:var(--amber)}

#plotwrap{
  position:absolute;right:12px;bottom:12px;width:244px;
  background:rgba(13,19,28,.86);border:1px solid var(--line);border-radius:10px;
  padding:8px 9px 6px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;
}
#plotwrap.on{display:block}
#plotwrap h4{font:700 9.5px/1 var(--mono);letter-spacing:.14em;color:var(--dim2);margin-bottom:6px}
#plot{display:block;width:100%;height:96px}
.plegend{display:flex;gap:9px;margin-top:5px;font:600 9px/1 var(--mono);letter-spacing:.06em}
.plegend i{display:inline-block;width:8px;height:2px;margin-right:4px;vertical-align:middle;border-radius:2px}

#tip{
  position:absolute;left:50%;top:14px;transform:translate(-50%,-14px);opacity:0;
  background:rgba(10,15,22,.92);border:1px solid var(--line);border-radius:999px;
  padding:7px 15px;font:600 11px/1 var(--mono);letter-spacing:.05em;color:var(--accent);
  pointer-events:none;transition:opacity .3s,transform .3s;white-space:nowrap;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-width:92%;overflow:hidden;text-overflow:ellipsis;
}
#tip.on{opacity:1;transform:translate(-50%,0)}

/* ---------- panel ---------- */
#panel{
  flex:0 0 312px;background:var(--panel);border-left:1px solid var(--line);
  overflow-y:auto;overflow-x:hidden;padding:4px 0 28px;
  scrollbar-width:thin;scrollbar-color:#223044 transparent;
}
#panel::-webkit-scrollbar{width:8px}
#panel::-webkit-scrollbar-thumb{background:#223044;border-radius:4px}
.pg{display:none;padding:10px 14px}
.pg.on{display:block}
.sec{margin:0 0 16px}
.sec>h3{
  font:700 9.5px/1 var(--mono);letter-spacing:.16em;color:var(--dim2);
  padding:0 0 9px;border-bottom:1px solid var(--line);margin-bottom:11px;
  display:flex;align-items:center;gap:7px;
}
.sec>h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

.row{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.row label{flex:0 0 78px;font:600 10.5px/1.25 var(--mono);letter-spacing:.03em;color:var(--dim)}
.row .val{flex:0 0 46px;text-align:right;font:700 10.5px/1 var(--mono);color:var(--accent)}
input[type=range]{
  flex:1 1 auto;min-width:0;appearance:none;height:22px;background:none;cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:#1e2a3a;border-radius:3px}
input[type=range]::-webkit-slider-thumb{
  appearance:none;width:15px;height:15px;border-radius:50%;background:var(--ink);
  border:3px solid var(--panel);box-shadow:0 0 0 1px var(--accent);margin-top:-6px;transition:box-shadow .15s;
}
input[type=range]:active::-webkit-slider-thumb{box-shadow:0 0 0 1px var(--accent),0 0 0 6px rgba(94,224,200,.16)}
input[type=range]::-moz-range-track{height:3px;background:#1e2a3a;border-radius:3px}
input[type=range]::-moz-range-thumb{
  width:12px;height:12px;border-radius:50%;background:var(--ink);
  border:3px solid var(--panel);box-shadow:0 0 0 1px var(--accent)
}
select,input[type=number]{
  flex:1 1 auto;min-width:0;appearance:none;background:#0a1017;border:1px solid var(--line);
  color:var(--ink);font:600 11px/1 var(--mono);padding:8px 9px;border-radius:7px;cursor:pointer;
}
select:focus,input[type=number]:focus{outline:none;border-color:var(--accent)}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{
  appearance:none;cursor:pointer;background:#0a1017;border:1px solid var(--line);color:var(--dim);
  font:600 10px/1 var(--mono);letter-spacing:.04em;padding:7px 9px;border-radius:999px;transition:.18s;
}
.pill:hover{color:var(--ink);border-color:#2b3a4e}
.pill.on{background:var(--accent);border-color:var(--accent);color:#06121a}
.tog{display:flex;align-items:center;gap:9px;margin-bottom:9px;cursor:pointer;user-select:none}
.tog span{font:600 10.5px/1 var(--mono);letter-spacing:.03em;color:var(--dim)}
.tog i{
  position:relative;flex:0 0 34px;height:19px;border-radius:999px;background:#1a2431;
  border:1px solid var(--line);transition:background .25s;
}
.tog i::after{
  content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;
  background:var(--dim);transition:transform .3s cubic-bezier(.34,1.56,.64,1),background .25s;
}
.tog.on i{background:rgba(94,224,200,.22);border-color:var(--accent)}
.tog.on i::after{transform:translateX(15px);background:var(--accent)}
.tog.on span{color:var(--ink)}

/* segment editor */
.segrow{display:flex;gap:5px;align-items:center;margin-bottom:6px}
.segrow select{flex:1 1 auto;padding:7px 6px;font-size:10px}
.segrow input[type=number]{flex:0 0 52px;padding:7px 4px;font-size:10px;text-align:center;cursor:text}
.segrow .kill{
  flex:0 0 24px;height:30px;appearance:none;cursor:pointer;background:#141c27;border:1px solid var(--line);
  border-radius:6px;color:var(--dim);font:700 13px/1 var(--mono);
}
.segrow .kill:hover{color:var(--red);border-color:#44262b}
.note{font:500 10px/1.5 var(--mono);color:var(--dim2);letter-spacing:.02em;margin-top:6px}
.note b{color:var(--amber)}

/* gear list */
.glist{display:flex;flex-direction:column;gap:6px}
.grow{
  display:flex;align-items:center;gap:7px;background:#0a1017;border:1px solid var(--line);
  border-radius:8px;padding:7px 8px;transition:border-color .2s;
}
.grow.sel{border-color:var(--accent)}
.grow .ix{flex:0 0 18px;font:700 10px/1 var(--mono);color:var(--dim2);text-align:center}
.grow .dot{flex:0 0 9px;height:9px;border-radius:50%}
.grow input[type=range]{height:18px}
.grow .tn{flex:0 0 28px;text-align:right;font:700 10.5px/1 var(--mono);color:var(--ink)}

kbd{
  display:inline-block;background:#121b26;border:1px solid var(--line);border-bottom-width:2px;
  border-radius:5px;padding:2px 5px;font:600 9.5px/1.3 var(--mono);color:var(--dim)
}

@media (max-width:860px){
  #bar{flex-wrap:wrap;gap:9px;padding:9px 11px}
  .brand{font-size:13px}
  .acts{width:100%;margin-left:0;justify-content:flex-start}
  main{flex-direction:column}
  #stage{flex:1 1 46%;min-height:230px}
  #panel{flex:1 1 54%;border-left:0;border-top:1px solid var(--line);max-height:54vh}
  #plotwrap{width:200px;right:8px;bottom:8px}
  #plot{height:76px}
  #hud{left:8px;bottom:8px;max-width:62%}
  #hud .chip{font-size:9.5px;padding:4px 7px}
  #hud .chip:nth-child(n+4){display:none}
  .row label{flex-basis:70px}
}
@media (max-width:420px){
  .segs button{padding:7px 9px;font-size:11px}
  .btn{padding:8px 9px;font-size:10px}
  .btn.ic{width:34px}
}
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <div class="brand">LINK<span>WRIGHT</span><i>MECHANISM WORKSHOP</i></div>
    <div class="segs" id="tabs">
      <button data-b="linkage" class="on">Linkage</button>
      <button data-b="gears">Gears</button>
      <button data-b="cam">Cam</button>
      <i class="thumb" id="thumb"></i>
    </div>
    <div class="acts">
      <button class="btn ic key" id="bPlay" title="Play / pause (space)">⏸</button>
      <button class="btn" id="bSvg" title="Download the mechanism as SVG">SVG</button>
      <button class="btn" id="bPng" title="Download a PNG snapshot">PNG</button>
      <button class="btn" id="bJson" title="Download the design as JSON">JSON</button>
      <button class="btn" id="bOpen" title="Load a design JSON">OPEN</button>
      <button class="btn" id="bShare" title="Copy a share link">SHARE</button>
      <button class="btn" id="bReset" title="Reset this bench">RESET</button>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </div>
  </header>
  <main>
    <section id="stage">
      <canvas id="cv"></canvas>
      <div id="hud"></div>
      <div id="plotwrap">
        <h4>FOLLOWER MOTION</h4>
        <canvas id="plot" width="456" height="192"></canvas>
        <div class="plegend">
          <span style="color:var(--teal)"><i style="background:var(--teal)"></i>s</span>
          <span style="color:var(--amber)"><i style="background:var(--amber)"></i>v</span>
          <span style="color:var(--violet)"><i style="background:var(--violet)"></i>a</span>
        </div>
      </div>
      <div id="tip"></div>
    </section>
    <aside id="panel">
      <div class="pg on" id="pg-linkage"></div>
      <div class="pg" id="pg-gears"></div>
      <div class="pg" id="pg-cam"></div>
    </aside>
  </main>
</div>
<script>
(function(){
'use strict';

/* ======================================================================
   LINKWRIGHT — three kinematics benches in one page.
   Units are "millimetres" in a nominal sense; the SVG export writes mm so
   a cam profile can go straight to a laser cutter.
   ====================================================================== */

var TAU = Math.PI * 2, D2R = Math.PI / 180, R2D = 180 / Math.PI;
var LS_KEY = 'linkwright.v1';

/* ---------------------------------------------------------------- presets */

var LINK_PRESETS = {
  crankrocker: { label:'Crank-rocker', kind:'fourbar', r1:100, r2:30, r3:95, r4:80, u:52, v:38, branch:1 },
  hoeken:      { label:'Hoeken straight-line', kind:'fourbar', r1:80, r2:40, r3:100, r4:100, u:200, v:0, branch:1 },
  chebyshev:   { label:'Chebyshev lambda', kind:'fourbar', r1:80, r2:100, r3:40, r4:100, u:20, v:0, branch:-1 },
  dragline:    { label:'Drag-link (double crank)', kind:'fourbar', r1:36, r2:72, r3:60, r4:68, u:34, v:44, branch:1 },
  watt:        { label:'Watt beam', kind:'fourbar', r1:120, r2:60, r3:40, r4:60, u:20, v:0, branch:-1 },
  rocker2:     { label:'Double rocker', kind:'fourbar', r1:90, r2:78, r3:34, r4:86, u:17, v:30, branch:1 },
  offslider:   { label:'Offset slider-crank', kind:'slider', r2:40, r3:110, e:26, u:55, v:34, branch:1, r1:100, r4:80 },
  inline:      { label:'Inline slider-crank', kind:'slider', r2:45, r3:120, e:0, u:60, v:0, branch:1, r1:100, r4:80 }
};

var GEAR_PRESETS = {
  reduction: { label:'3-stage reduction', module:6, rpm:60, gears:[{n:14,phi:0},{n:30,phi:-28},{n:16,phi:34},{n:44,phi:-12}] },
  idler:     { label:'Idler pair', module:6, rpm:90, gears:[{n:24,phi:0},{n:12,phi:0},{n:24,phi:0}] },
  overdrive: { label:'Overdrive', module:7, rpm:40, gears:[{n:48,phi:0},{n:16,phi:-18}] },
  snake:     { label:'Snake train', module:5, rpm:70, gears:[{n:18,phi:0},{n:14,phi:52},{n:18,phi:-52},{n:14,phi:52},{n:22,phi:-30}] }
};

var CAM_PRESETS = {
  standard: { label:'Rise–dwell–fall–dwell', base:36, lift:28, roller:9, rpm:45,
    segs:[{t:'rise',law:'poly345',span:100},{t:'dwell',law:'poly345',span:60},
          {t:'fall',law:'cycloidal',span:110},{t:'dwell',law:'poly345',span:90}] },
  quick: { label:'Quick return', base:34, lift:30, roller:8, rpm:60,
    segs:[{t:'rise',law:'cycloidal',span:220},{t:'dwell',law:'harmonic',span:20},
          {t:'fall',law:'harmonic',span:120}] },
  twin: { label:'Twin lift', base:40, lift:20, roller:7, rpm:50,
    segs:[{t:'rise',law:'harmonic',span:70},{t:'fall',law:'harmonic',span:70},
          {t:'rise',law:'poly345',span:80},{t:'dwell',law:'poly345',span:30},
          {t:'fall',law:'poly345',span:110}] },
  snap: { label:'Snap drop', base:32, lift:34, roller:10, rpm:55,
    segs:[{t:'rise',law:'poly345',span:240},{t:'fall',law:'linear',span:40},
          {t:'dwell',law:'linear',span:80}] }
};

var LAWS = {
  linear:    { label:'Constant velocity', f:function(x){ return x; } },
  harmonic:  { label:'Simple harmonic',   f:function(x){ return (1 - Math.cos(Math.PI * x)) / 2; } },
  cycloidal: { label:'Cycloidal',         f:function(x){ return x - Math.sin(TAU * x) / TAU; } },
  poly345:   { label:'Polynomial 3-4-5',  f:function(x){ var a=x*x*x; return 10*a - 15*a*x + 6*a*x*x; } }
};

/* ------------------------------------------------------------------ state */

function freshState(){
  return {
    bench: 'linkage',
    playing: true,
    speed: 1,
    linkage: assign({ preset:'crankrocker', trace:true, ghosts:false, theta:0, dir:1 },
                     LINK_PRESETS.crankrocker),
    gears: assign({ preset:'reduction', theta:0, teethOn:true, sel:1 }, deep(GEAR_PRESETS.reduction)),
    cam: assign({ preset:'standard', theta:0, pitchOn:true }, deep(CAM_PRESETS.standard))
  };
}

function assign(a, b){ for (var k in b) if (Object.prototype.hasOwnProperty.call(b,k)) a[k] = b[k]; return a; }
function deep(o){ return JSON.parse(JSON.stringify(o)); }
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function fmt(v, n){ var s = (+v).toFixed(n === undefined ? 1 : n); return s === '-0.0' ? '0.0' : s; }

var S = freshState();

/* ================================================================
   KINEMATICS — four-bar / slider-crank
   ================================================================ */

/* Solve the mechanism at crank angle th. Returns null when the dyad
   cannot close (the rocker and coupler circles do not intersect). */
function solveLink(L, th){
  var A = { x:0, y:0 };
  var B = { x: L.r2 * Math.cos(th), y: L.r2 * Math.sin(th) };
  var C, D;

  if (L.kind === 'slider'){
    // Slider rides a horizontal line at height e; C is on that line.
    var dy = L.e - B.y, k = L.r3 * L.r3 - dy * dy;
    if (k < 0) return null;
    var dx = Math.sqrt(k) * (L.branch >= 0 ? 1 : -1);
    C = { x: B.x + dx, y: L.e };
    D = null;
  } else {
    D = { x: L.r1, y: 0 };
    var ex = D.x - B.x, ey = D.y - B.y, d = Math.hypot(ex, ey);
    if (d > L.r3 + L.r4 - 1e-9 || d < Math.abs(L.r3 - L.r4) + 1e-9 || d === 0) return null;
    var a = (L.r3 * L.r3 - L.r4 * L.r4 + d * d) / (2 * d);
    var h2 = L.r3 * L.r3 - a * a;
    if (h2 < 0) return null;
    var h = Math.sqrt(h2), ux = ex / d, uy = ey / d;
    var mx = B.x + a * ux, my = B.y + a * uy, s = L.branch >= 0 ? 1 : -1;
    C = { x: mx + s * h * -uy, y: my + s * h * ux };
  }

  // Coupler-fixed point P, expressed in the frame B -> C.
  var cx = C.x - B.x, cy = C.y - B.y, cl = Math.hypot(cx, cy) || 1;
  var hx = cx / cl, hy = cy / cl;
  var P = { x: B.x + L.u * hx + L.v * -hy, y: B.y + L.u * hy + L.v * hx };

  return { A:A, B:B, C:C, D:D, P:P, th:th };
}

/* Which crank angles actually close? Returns the usable sweep. */
function linkRange(L){
  var N = 720, ok = [], i, any = false, all = true;
  for (i = 0; i < N; i++){
    var v = !!solveLink(L, i / N * TAU);
    ok.push(v); if (v) any = true; else all = false;
  }
  if (!any) return { full:false, lo:0, hi:0, dead:true };
  if (all)  return { full:true,  lo:0, hi:TAU, dead:false };

  // Longest circular run of valid angles.
  var best = { len:0, start:0 }, run = 0, start = 0;
  for (i = 0; i < N * 2; i++){
    if (ok[i % N]){ if (run === 0) start = i; run++; if (run > best.len) best = { len:run, start:start }; }
    else run = 0;
    if (run >= N) break;
  }
  var lo = best.start / N * TAU, hi = (best.start + best.len - 1) / N * TAU;
  var pad = (hi - lo) * 0.015;
  return { full:false, lo:lo + pad, hi:hi - pad, dead:false };
}

/* Coupler curve over the usable sweep. */
function couplerCurve(L, range, n){
  n = n || 420;
  var pts = [], i, span = range.full ? TAU : (range.hi - range.lo);
  for (i = 0; i <= n; i++){
    var s = solveLink(L, range.lo + span * (i / n));
    if (s) pts.push(s.P);
  }
  return pts;
}

/* Grashof class + transmission angle. */
function linkFacts(L, sol){
  var out = { grashof:'—', mu:null };
  if (L.kind === 'fourbar'){
    var links = [L.r1, L.r2, L.r3, L.r4], sorted = links.slice().sort(function(a,b){ return a-b; });
    var s = sorted[0], l = sorted[3], p = sorted[1], q = sorted[2];
    if (s + l < p + q - 1e-9){
      var shortest = links.indexOf(s);
      out.grashof = shortest === 1 ? 'Grashof · crank-rocker'
                  : shortest === 0 ? 'Grashof · double crank'
                  : shortest === 2 ? 'Grashof · double rocker'
                  : 'Grashof · rocker-crank';
    } else if (Math.abs(s + l - (p + q)) < 1e-9) out.grashof = 'Change point';
    else out.grashof = 'Non-Grashof · triple rocker';

    if (sol && sol.D){
      var a1 = Math.atan2(sol.B.y - sol.C.y, sol.B.x - sol.C.x);
      var a2 = Math.atan2(sol.D.y - sol.C.y, sol.D.x - sol.C.x);
      var m = Math.abs(((a1 - a2) * R2D % 360 + 360) % 360);
      if (m > 180) m = 360 - m;
      out.mu = m;
    }
  } else {
    out.grashof = L.r3 >= L.r2 + Math.abs(L.e) ? 'Full rotation' : 'Limited rotation';
    if (sol){
      var b1 = Math.atan2(sol.C.y - sol.B.y, sol.C.x - sol.B.x);
      var mm = Math.abs(b1 * R2D); if (mm > 90) mm = 180 - mm;
      out.mu = 90 - mm;
    }
  }
  return out;
}

/* ================================================================
   KINEMATICS — gear train
   ================================================================ */

function gearRadii(G){
  return G.gears.map(function(g){ return G.module * g.n / 2; });
}

/* Centre positions: each gear hangs off the previous one at angle phi. */
function gearCenters(G){
  var r = gearRadii(G), c = [{ x:0, y:0 }], i;
  for (i = 1; i < G.gears.length; i++){
    var a = G.gears[i].phi * D2R, d = r[i-1] + r[i];
    c.push({ x: c[i-1].x + d * Math.cos(a), y: c[i-1].y + d * Math.sin(a) });
  }
  return c;
}

/* Tooth-accurate phases.  For an external mesh along the line of centres
   at angle phi, rolling without slip plus a tooth-into-gap condition gives
      thB = (nA/nB)(phi - thA) + phi + PI - PI/nB
   which both counter-rotates at the right ratio and keeps teeth meshed. */
function gearAngles(G, drive){
  var th = [drive], i;
  for (i = 1; i < G.gears.length; i++){
    var nA = G.gears[i-1].n, nB = G.gears[i].n, phi = G.gears[i].phi * D2R;
    th.push((nA / nB) * (phi - th[i-1]) + phi + Math.PI - Math.PI / nB);
  }
  return th;
}

function gearFacts(G){
  var k = G.gears.length - 1;
  var ratio = G.gears[0].n / G.gears[k].n;           // simple train: ends decide
  var rpm = G.rpm * ratio * (k % 2 === 0 ? 1 : -1);
  var torque = Math.abs(ratio) > 0 ? 1 / Math.abs(ratio) : 0;
  return { ratio:ratio, rpm:rpm, torque:torque, stages:k };
}

/* One tooth outline, built from pitch/addendum/dedendum radii. The flanks
   taper the way an involute does without the full involute integral. */
function toothPath(r, n, m){
  var ra = r + m, rd = Math.max(1, r - 1.25 * m);
  var hp = Math.PI / (2 * n), ha = hp * 0.52, hd = hp * 1.42;
  return { ra:ra, rd:rd, hp:hp, ha:ha, hd:hd };
}

/* ================================================================
   KINEMATICS — cam
   ================================================================ */

function camSamples(C, n){
  n = n || 720;
  var total = C.segs.reduce(function(a, s){ return a + Math.max(1, s.span); }, 0) || 360;
  var s = new Float64Array(n + 1), i;
  // Walk segments, tracking the current level, mapping onto 0..360.
  var bounds = [], acc = 0, lvl = 0;
  for (i = 0; i < C.segs.length; i++){
    var sg = C.segs[i], w = Math.max(1, sg.span) / total * 360;
    var from = lvl, to = sg.t === 'rise' ? C.lift : sg.t === 'fall' ? 0 : lvl;
    bounds.push({ a0:acc, a1:acc + w, from:from, to:to, law:sg.law, t:sg.t });
    acc += w; lvl = to;
  }
  for (i = 0; i <= n; i++){
    var deg = i / n * 360, k = 0;
    while (k < bounds.length - 1 && deg > bounds[k].a1) k++;
    var b = bounds[k], span = Math.max(1e-6, b.a1 - b.a0);
    var x = clamp((deg - b.a0) / span, 0, 1);
    var f = (LAWS[b.law] || LAWS.harmonic).f(x);
    s[i] = b.from + (b.to - b.from) * f;
  }
  return { s:s, n:n, total:total, bounds:bounds };
}

function camDerivs(sm){
  var n = sm.n, s = sm.s, v = new Float64Array(n + 1), a = new Float64Array(n + 1), i;
  var h = TAU / n;
  for (i = 0; i <= n; i++){
    var p = s[(i - 1 + n) % n], q = s[(i + 1) % n];
    v[i] = (q - p) / (2 * h);
  }
  for (i = 0; i <= n; i++){
    var p2 = v[(i - 1 + n) % n], q2 = v[(i + 1) % n];
    a[i] = (q2 - p2) / (2 * h);
  }
  return { v:v, a:a };
}

function camLift(sm, deg){
  var x = ((deg % 360) + 360) % 360 / 360 * sm.n;
  var i = Math.floor(x), f = x - i;
  return sm.s[i] * (1 - f) + sm.s[(i + 1) % sm.n] * f;
}

/* Pitch curve (roller-centre locus) drawn in world space for cam rotation rot.
   The follower sits on the +Y axis, so body angle = 90deg - camAngle + rot. */
function camPitch(C, sm, rot, n){
  n = n || 360;
  var pts = [], i;
  for (i = 0; i <= n; i++){
    var deg = i / n * 360;
    var R = C.base + camLift(sm, deg) + C.roller;
    var a = (90 - deg + rot) * D2R;
    pts.push({ x: R * Math.cos(a), y: R * Math.sin(a) });
  }
  return pts;
}

/* Physical cam surface: pitch curve offset inward by the roller radius. */
function camProfile(pts, roller){
  var out = [], i, n = pts.length;
  for (i = 0; i < n; i++){
    var p = pts[i], a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n];
    var tx = b.x - a.x, ty = b.y - a.y, tl = Math.hypot(tx, ty) || 1;
    // Inward normal points roughly toward the origin.
    var nx = ty / tl, ny = -tx / tl;
    if (nx * p.x + ny * p.y > 0){ nx = -nx; ny = -ny; }
    out.push({ x: p.x + nx * roller, y: p.y + ny * roller });
  }
  return out;
}

/* ================================================================
   CANVAS + VIEW
   ================================================================ */

var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var plotc = document.getElementById('plot'), pctx = plotc.getContext('2d');
var DPR = 1, VW = 0, VH = 0;
var view = { s:1, ox:0, oy:0 };

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  var r = cv.parentNode.getBoundingClientRect();
  VW = Math.max(120, r.width); VH = Math.max(120, r.height);
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  fitView();
}

function W2S(p){ return { x: view.ox + p.x * view.s, y: view.oy - p.y * view.s }; }
function S2W(p){ return { x: (p.x - view.ox) / view.s, y: (view.oy - p.y) / view.s }; }

function benchBounds(){
  var b = { x0:-60, y0:-60, x1:60, y1:60 }, i;
  function add(p){ if (!p) return;
    b.x0 = Math.min(b.x0, p.x); b.x1 = Math.max(b.x1, p.x);
    b.y0 = Math.min(b.y0, p.y); b.y1 = Math.max(b.y1, p.y); }

  if (S.bench === 'linkage'){
    var L = S.linkage, R = linkRange(L);
    add({ x:0, y:0 }); add({ x:L.kind === 'slider' ? L.r2 + L.r3 : L.r1, y:0 });
    var cc = couplerCurve(L, R, 160);
    for (i = 0; i < cc.length; i++) add(cc[i]);
    for (i = 0; i < 24; i++){
      var sp = R.full ? i / 24 * TAU : R.lo + (R.hi - R.lo) * i / 23;
      var sl = solveLink(L, sp);
      if (sl){ add(sl.B); add(sl.C); add(sl.P); }
    }
  } else if (S.bench === 'gears'){
    var G = S.gears, c = gearCenters(G), rr = gearRadii(G);
    for (i = 0; i < c.length; i++){
      add({ x:c[i].x - rr[i] - G.module, y:c[i].y - rr[i] - G.module });
      add({ x:c[i].x + rr[i] + G.module, y:c[i].y + rr[i] + G.module });
    }
  } else {
    var C = S.cam, big = C.base + C.lift + C.roller * 2 + 22;
    add({ x:-big, y:-big }); add({ x:big, y:big + 40 });
  }
  return b;
}

function fitView(){
  var b = benchBounds();
  var bw = Math.max(1, b.x1 - b.x0), bh = Math.max(1, b.y1 - b.y0);
  var pad = 1.18;
  view.s = Math.min(VW / (bw * pad), VH / (bh * pad));
  view.ox = VW / 2 - (b.x0 + b.x1) / 2 * view.s;
  view.oy = VH / 2 + (b.y0 + b.y1) / 2 * view.s;
}

/* --------------------------------------------------------- draw helpers */

function grid(){
  var step = 20 * view.s;
  while (step < 26) step *= 2;
  while (step > 120) step /= 2;
  var ox = view.ox % step, oy = view.oy % step, x, y;
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(120,160,200,.055)';
  ctx.beginPath();
  for (x = ox; x < VW; x += step){ ctx.moveTo(x, 0); ctx.lineTo(x, VH); }
  for (y = oy; y < VH; y += step){ ctx.moveTo(0, y); ctx.lineTo(VW, y); }
  ctx.stroke();
  // Origin cross-hair.
  var o = W2S({ x:0, y:0 });
  ctx.strokeStyle = 'rgba(120,160,200,.16)';
  ctx.beginPath();
  ctx.moveTo(o.x - 9, o.y); ctx.lineTo(o.x + 9, o.y);
  ctx.moveTo(o.x, o.y - 9); ctx.lineTo(o.x, o.y + 9);
  ctx.stroke();
}

function capsule(p, q, w, fill, stroke){
  var a = W2S(p), b = W2S(q), r = w * view.s / 2;
  var ang = Math.atan2(b.y - a.y, b.x - a.x);
  ctx.beginPath();
  ctx.arc(a.x, a.y, r, ang + Math.PI / 2, ang - Math.PI / 2);
  ctx.arc(b.x, b.y, r, ang - Math.PI / 2, ang + Math.PI / 2);
  ctx.closePath();
  if (fill){ ctx.fillStyle = fill; ctx.fill(); }
  if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = 1.4; ctx.stroke(); }
}

function hole(p, r, col){
  var a = W2S(p);
  ctx.beginPath(); ctx.arc(a.x, a.y, Math.max(2, r * view.s), 0, TAU);
  ctx.fillStyle = '#070a0f'; ctx.fill();
  ctx.strokeStyle = col || 'rgba(200,220,240,.55)'; ctx.lineWidth = 1.3; ctx.stroke();
}

function groundPivot(p){
  var a = W2S(p), h = 15, w = 13, i;
  ctx.beginPath();
  ctx.moveTo(a.x, a.y); ctx.lineTo(a.x - w, a.y + h); ctx.lineTo(a.x + w, a.y + h);
  ctx.closePath();
  ctx.fillStyle = 'rgba(122,162,255,.18)'; ctx.fill();
  ctx.strokeStyle = 'rgba(122,162,255,.75)'; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.beginPath();
  for (i = -2; i <= 3; i++){
    ctx.moveTo(a.x + i * 6 - 3, a.y + h);
    ctx.lineTo(a.x + i * 6 - 9, a.y + h + 7);
  }
  ctx.moveTo(a.x - w - 3, a.y + h); ctx.lineTo(a.x + w + 3, a.y + h);
  ctx.strokeStyle = 'rgba(122,162,255,.45)'; ctx.lineWidth = 1.1; ctx.stroke();
}

function label(p, text, col, dx, dy){
  var a = W2S(p);
  ctx.font = '700 11px ui-monospace,Menlo,monospace';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  var w = ctx.measureText(text).width;
  ctx.fillStyle = 'rgba(7,10,15,.78)';
  ctx.fillRect(a.x + (dx || 10) - 3, a.y + (dy || -12) - 8, w + 6, 16);
  ctx.fillStyle = col || '#e9eff7';
  ctx.fillText(text, a.x + (dx || 10), a.y + (dy || -12));
}

function poly(pts, col, w, close, dash){
  if (!pts.length) return;
  ctx.beginPath();
  var a = W2S(pts[0]); ctx.moveTo(a.x, a.y);
  for (var i = 1; i < pts.length; i++){ var b = W2S(pts[i]); ctx.lineTo(b.x, b.y); }
  if (close) ctx.closePath();
  ctx.setLineDash(dash || []);
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.setLineDash([]);
}

/* ------------------------------------------------------------- linkage */

function drawLinkageSkeleton(sol, L, alpha, thin){
  var g = thin ? 0.4 : 1;
  ctx.globalAlpha = alpha;
  capsule(sol.A, sol.B, 9, 'rgba(255,179,71,' + (0.13 * g + 0.04) + ')', 'rgba(255,179,71,' + (0.8 * g) + ')');
  capsule(sol.B, sol.C, 9, 'rgba(94,224,200,' + (0.11 * g + 0.04) + ')', 'rgba(94,224,200,' + (0.8 * g) + ')');
  if (sol.D) capsule(sol.C, sol.D, 9, 'rgba(122,162,255,' + (0.13 * g + 0.04) + ')', 'rgba(122,162,255,' + (0.8 * g) + ')');
  // Coupler plate B-C-P
  if (Math.abs(L.v) > 0.5 || Math.abs(L.u - Math.hypot(sol.C.x - sol.B.x, sol.C.y - sol.B.y)) > 0.5){
    capsule(sol.B, sol.P, 7, 'rgba(94,224,200,' + (0.08 * g) + ')', 'rgba(94,224,200,' + (0.42 * g) + ')');
    capsule(sol.C, sol.P, 7, 'rgba(94,224,200,' + (0.08 * g) + ')', 'rgba(94,224,200,' + (0.42 * g) + ')');
    var a = W2S(sol.B), b = W2S(sol.C), c = W2S(sol.P);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.closePath();
    ctx.fillStyle = 'rgba(94,224,200,' + (0.07 * g) + ')'; ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawLinkage(){
  var L = S.linkage, R = L._range, sol = solveLink(L, L.theta);
  if (!sol){
    ctx.font = '600 13px ui-monospace,monospace'; ctx.fillStyle = '#ff6f6f';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('dyad will not close — adjust the link lengths', VW / 2, VH / 2);
    return;
  }

  // Slider rail
  if (L.kind === 'slider'){
    var y = L.e, x0 = -L.r2 - 12, x1 = L.r2 + L.r3 + 20;
    poly([{ x:x0, y:y }, { x:x1, y:y }], 'rgba(122,162,255,.3)', 1.3, false, [7, 6]);
    var r0 = W2S({ x:x0, y:y }), r1 = W2S({ x:x1, y:y });
    ctx.beginPath();
    for (var hx = r0.x; hx < r1.x; hx += 9){ ctx.moveTo(hx, r0.y + 11); ctx.lineTo(hx + 7, r0.y + 18); }
    ctx.moveTo(r0.x, r0.y + 11); ctx.lineTo(r1.x, r0.y + 11);
    ctx.strokeStyle = 'rgba(122,162,255,.35)'; ctx.lineWidth = 1.1; ctx.stroke();
  }

  // Ghost poses
  if (L.ghosts){
    var n = 11, i;
    for (i = 0; i < n; i++){
      var t = R.full ? i / n * TAU : R.lo + (R.hi - R.lo) * i / (n - 1);
      var gs = solveLink(L, t);
      if (gs) drawLinkageSkeleton(gs, L, 0.3, true);
    }
  }

  // Coupler curve
  if (L.trace && L._curve && L._curve.length > 2){
    ctx.save();
    ctx.shadowColor = 'rgba(183,156,255,.55)'; ctx.shadowBlur = 12;
    poly(L._curve, 'rgba(183,156,255,.9)', 2, R.full);
    ctx.restore();
  }

  drawLinkageSkeleton(sol, L, 1, false);

  // Crank circle hint
  var ca = W2S(sol.A);
  ctx.beginPath(); ctx.arc(ca.x, ca.y, L.r2 * view.s, 0, TAU);
  ctx.setLineDash([3, 6]); ctx.strokeStyle = 'rgba(255,179,71,.25)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.setLineDash([]);

  groundPivot(sol.A);
  if (sol.D) groundPivot(sol.D);

  // Slider block
  if (L.kind === 'slider'){
    var sc = W2S(sol.C), bw = 26, bh = 16;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(sc.x - bw / 2, sc.y - bh / 2, bw, bh, 4);
    else ctx.rect(sc.x - bw / 2, sc.y - bh / 2, bw, bh);
    ctx.fillStyle = 'rgba(122,162,255,.22)'; ctx.fill();
    ctx.strokeStyle = 'rgba(122,162,255,.85)'; ctx.lineWidth = 1.4; ctx.stroke();
  }

  hole(sol.A, 4.5, 'rgba(122,162,255,.9)');
  hole(sol.B, 4.5, 'rgba(255,179,71,.9)');
  hole(sol.C, 4.5, 'rgba(94,224,200,.9)');
  if (sol.D) hole(sol.D, 4.5, 'rgba(122,162,255,.9)');

  // Tracer point P — the draggable one.
  var pp = W2S(sol.P);
  ctx.beginPath(); ctx.arc(pp.x, pp.y, 8, 0, TAU);
  ctx.fillStyle = 'rgba(183,156,255,.26)'; ctx.fill();
  ctx.beginPath(); ctx.arc(pp.x, pp.y, 4.5, 0, TAU);
  ctx.fillStyle = '#b79cff'; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2; ctx.stroke();

  label(sol.A, 'A', 'rgba(122,162,255,.95)', -20, 4);
  label(sol.B, 'B', 'rgba(255,179,71,.95)');
  label(sol.C, 'C', 'rgba(94,224,200,.95)');
  if (sol.D) label(sol.D, 'D', 'rgba(122,162,255,.95)', 10, 4);
  label(sol.P, 'P · drag me', '#b79cff', 12, -14);

  L._sol = sol;
}

/* --------------------------------------------------------------- gears */

var GCOL = ['#5ee0c8', '#ffb347', '#7aa2ff', '#b79cff', '#ff6f6f', '#6fe08a'];

function drawGearBody(c, r, n, m, rot, col, showTeeth, dim){
  var o = W2S(c), t = toothPath(r, n, m), i;
  var S_ = view.s;
  ctx.beginPath();
  if (showTeeth && t.hp * r * S_ > 1.1){
    for (i = 0; i < n; i++){
      var a0 = rot + i / n * TAU;
      var pt = function(rad, ang){ return { x: o.x + rad * S_ * Math.cos(ang), y: o.y - rad * S_ * Math.sin(ang) }; };
      var p1 = pt(t.rd, a0 - t.hd), p2 = pt(r, a0 - t.hp), p3 = pt(t.ra, a0 - t.ha),
          p4 = pt(t.ra, a0 + t.ha), p5 = pt(r, a0 + t.hp), p6 = pt(t.rd, a0 + t.hd);
      if (i === 0) ctx.moveTo(p1.x, p1.y); else ctx.lineTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y);
      ctx.lineTo(p5.x, p5.y); ctx.lineTo(p6.x, p6.y);
      var nd = rot + (i + 1) / n * TAU - t.hd;
      ctx.arc(o.x, o.y, t.rd * S_, -(a0 + t.hd), -nd, true);
    }
  } else {
    ctx.arc(o.x, o.y, r * S_, 0, TAU);
  }
  ctx.closePath();
  ctx.fillStyle = dim ? 'rgba(25,34,47,.75)' : 'rgba(22,32,44,.92)';
  ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = dim ? 1.2 : 1.8; ctx.globalAlpha = dim ? .72 : 1; ctx.stroke();
  ctx.globalAlpha = 1;

  // Pitch circle
  ctx.beginPath(); ctx.arc(o.x, o.y, r * S_, 0, TAU);
  ctx.setLineDash([2, 5]); ctx.strokeStyle = col; ctx.globalAlpha = .3; ctx.lineWidth = 1; ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha = 1;

  // Hub + keyway mark so rotation is readable
  var hr = Math.max(3, Math.min(r * 0.3, r - 2 * m) * S_);
  ctx.beginPath(); ctx.arc(o.x, o.y, hr, 0, TAU);
  ctx.fillStyle = '#070a0f'; ctx.fill();
  ctx.strokeStyle = col; ctx.globalAlpha = .7; ctx.lineWidth = 1.2; ctx.stroke(); ctx.globalAlpha = 1;
  ctx.beginPath();
  ctx.moveTo(o.x, o.y);
  ctx.lineTo(o.x + (r - m) * S_ * Math.cos(rot), o.y - (r - m) * S_ * Math.sin(rot));
  ctx.strokeStyle = col; ctx.globalAlpha = .55; ctx.lineWidth = 1.6; ctx.stroke(); ctx.globalAlpha = 1;
}

function drawGears(){
  var G = S.gears, c = gearCenters(G), r = gearRadii(G), th = gearAngles(G, G.theta), i;

  // Centre-line skeleton
  for (i = 1; i < c.length; i++)
    poly([c[i-1], c[i]], 'rgba(160,190,220,.18)', 1.2, false, [5, 5]);

  // Paint largest-first: at a mesh the teeth interleave, and an opaque big
  // gear drawn last would swallow the small one it is meshing with.
  var order = G.gears.map(function(_, k){ return k; })
                     .sort(function(a, b){ return r[b] - r[a]; });
  order.forEach(function(i){
    drawGearBody(c[i], r[i], G.gears[i].n, G.module, th[i],
                 GCOL[i % GCOL.length], G.teethOn, G.sel !== i);
  });
  ctx.font = '700 11px ui-monospace,Menlo,monospace';
  for (i = 0; i < G.gears.length; i++){
    var tag = (i === 0 ? 'DRIVE · ' : i === G.gears.length - 1 ? 'OUT · ' : '') + G.gears[i].n + 'T';
    label(c[i], tag, GCOL[i % GCOL.length], -ctx.measureText(tag).width / 2 - 2, -r[i] * view.s - 16);
  }
  G._c = c; G._r = r;
}

/* ----------------------------------------------------------------- cam */

function drawCam(){
  var C = S.cam, sm = C._sm, rot = C.theta;
  var pitch = camPitch(C, sm, rot, 360);
  var prof = camProfile(pitch, C.roller);
  var lift = camLift(sm, ((rot % 360) + 360) % 360);

  // Cam body
  ctx.beginPath();
  var a0 = W2S(prof[0]); ctx.moveTo(a0.x, a0.y);
  for (var i = 1; i < prof.length; i++){ var b = W2S(prof[i]); ctx.lineTo(b.x, b.y); }
  ctx.closePath();
  ctx.fillStyle = 'rgba(22,32,44,.95)'; ctx.fill();
  ctx.save();
  ctx.shadowColor = 'rgba(94,224,200,.4)'; ctx.shadowBlur = 14;
  ctx.strokeStyle = '#5ee0c8'; ctx.lineWidth = 1.8; ctx.stroke();
  ctx.restore();

  if (C.pitchOn) poly(pitch, 'rgba(183,156,255,.45)', 1.1, true, [4, 5]);

  // Base circle + shaft
  var o = W2S({ x:0, y:0 });
  ctx.beginPath(); ctx.arc(o.x, o.y, C.base * view.s, 0, TAU);
  ctx.setLineDash([3, 5]); ctx.strokeStyle = 'rgba(255,179,71,.35)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(o.x, o.y, Math.max(4, 9 * view.s), 0, TAU);
  ctx.fillStyle = '#070a0f'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,179,71,.8)'; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(o.x, o.y);
  ctx.lineTo(o.x + C.base * view.s * Math.cos(rot * D2R), o.y - C.base * view.s * Math.sin(rot * D2R));
  ctx.strokeStyle = 'rgba(255,179,71,.45)'; ctx.lineWidth = 1.5; ctx.stroke();

  // Follower: roller + stem + guide
  var rc = { x:0, y: C.base + lift + C.roller };
  var rs = W2S(rc);
  var top = C.base + C.lift + C.roller + 34;
  poly([{ x:0, y:rc.y }, { x:0, y:top }], 'rgba(122,162,255,.85)', 3);
  var gy = W2S({ x:0, y: top - 6 }), gw = 15;
  ctx.strokeStyle = 'rgba(122,162,255,.5)'; ctx.lineWidth = 1.3;
  ctx.strokeRect(gy.x - gw, gy.y - 10, gw * 2, 24);
  ctx.beginPath(); ctx.arc(rs.x, rs.y, C.roller * view.s, 0, TAU);
  ctx.fillStyle = 'rgba(122,162,255,.2)'; ctx.fill();
  ctx.strokeStyle = '#7aa2ff'; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.beginPath(); ctx.arc(rs.x, rs.y, Math.max(1.5, 2 * view.s), 0, TAU);
  ctx.fillStyle = '#7aa2ff'; ctx.fill();

  // Lift gauge
  var z0 = W2S({ x: 30, y: C.base + C.roller }), z1 = W2S({ x: 30, y: rc.y });
  ctx.beginPath(); ctx.moveTo(z0.x, z0.y); ctx.lineTo(z1.x, z1.y);
  ctx.strokeStyle = 'rgba(94,224,200,.6)'; ctx.lineWidth = 2; ctx.stroke();
  label({ x: 30, y: (C.base + C.roller + rc.y) / 2 }, fmt(lift, 1) + ' mm', '#5ee0c8', 8, 0);

  C._lift = lift;
}

/* --------------------------------------------------------- motion plot */

function drawPlot(){
  var C = S.cam, sm = C._sm, d = C._d;
  var w = plotc.width, h = plotc.height, i;
  pctx.clearRect(0, 0, w, h);
  pctx.fillStyle = 'rgba(7,10,15,.5)'; pctx.fillRect(0, 0, w, h);

  var pad = 6, iw = w - pad * 2, ih = h - pad * 2;
  pctx.strokeStyle = 'rgba(120,160,200,.14)'; pctx.lineWidth = 1;
  pctx.beginPath();
  for (i = 0; i <= 4; i++){ var x = pad + iw * i / 4; pctx.moveTo(x, pad); pctx.lineTo(x, pad + ih); }
  pctx.moveTo(pad, pad + ih / 2); pctx.lineTo(pad + iw, pad + ih / 2);
  pctx.stroke();

  function curve(arr, col, norm){
    var mx = 1e-9;
    for (var k = 0; k <= sm.n; k++) mx = Math.max(mx, Math.abs(arr[k]));
    pctx.beginPath();
    for (k = 0; k <= sm.n; k += 2){
      var px = pad + iw * k / sm.n;
      var py = norm ? pad + ih - ih * (arr[k] / mx) : pad + ih / 2 - ih / 2 * (arr[k] / mx) * .88;
      if (k === 0) pctx.moveTo(px, py); else pctx.lineTo(px, py);
    }
    pctx.strokeStyle = col; pctx.lineWidth = 2; pctx.lineJoin = 'round'; pctx.stroke();
  }
  curve(d.a, '#b79cff', false);
  curve(d.v, '#ffb347', false);
  curve(sm.s, '#5ee0c8', true);

  var t = ((C.theta % 360) + 360) % 360 / 360;
  pctx.beginPath();
  pctx.moveTo(pad + iw * t, pad); pctx.lineTo(pad + iw * t, pad + ih);
  pctx.strokeStyle = 'rgba(255,255,255,.55)'; pctx.lineWidth = 1.5; pctx.stroke();
}

/* ================================================================
   DERIVED DATA + PERSISTENCE
   ================================================================ */

var saveTimer = 0;

function recompute(){
  var L = S.linkage;
  L._range = linkRange(L);
  L._curve = couplerCurve(L, L._range, 420);
  var C = S.cam;
  C._sm = camSamples(C, 720);
  C._d = camDerivs(C._sm);
  scheduleSave();
}
function changed(){ recompute(); }

function cleanState(){
  // Drop render caches (_foo) and preset labels — both are derived, and the
  // labels carry non-ASCII that plain btoa() refuses.
  return JSON.parse(JSON.stringify(S, function(k, v){
    return (k.charAt(0) === '_' || k === 'label') ? undefined : v;
  }));
}

/* base64 that survives any stray non-ASCII in the payload */
function b64(str){
  try { return btoa(str); } catch(e){}
  var bytes = new TextEncoder().encode(str), out = '', i;
  for (i = 0; i < bytes.length; i++) out += String.fromCharCode(bytes[i]);
  return btoa(out);
}
function unb64(str){
  var raw = atob(str);
  try {
    var bytes = new Uint8Array(raw.length), i;
    for (i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  } catch(e){ return raw; }
}
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    try { localStorage.setItem(LS_KEY, JSON.stringify(cleanState())); } catch(e){}
  }, 400);
}
function adoptState(raw){
  if (!raw || typeof raw !== 'object') return false;
  var base = freshState();
  ['linkage', 'gears', 'cam'].forEach(function(k){
    if (raw[k] && typeof raw[k] === 'object') base[k] = assign(base[k], raw[k]);
  });
  if (raw.bench && /^(linkage|gears|cam)$/.test(raw.bench)) base.bench = raw.bench;
  if (typeof raw.speed === 'number') base.speed = clamp(raw.speed, 0.1, 3);
  // Guard the shapes the renderer assumes.
  if (!Array.isArray(base.gears.gears) || base.gears.gears.length < 2) base.gears.gears = deep(GEAR_PRESETS.reduction.gears);
  base.gears.gears = base.gears.gears.slice(0, 6).map(function(g){
    return { n: clamp(Math.round(+g.n || 18), 8, 60), phi: clamp(+g.phi || 0, -180, 180) };
  });
  base.gears.sel = clamp(Math.round(+base.gears.sel || 1), 0, base.gears.gears.length - 1);
  if (!Array.isArray(base.cam.segs) || base.cam.segs.length < 2) base.cam.segs = deep(CAM_PRESETS.standard.segs);
  base.cam.segs = base.cam.segs.slice(0, 7).map(function(s){
    return {
      t: /^(rise|fall|dwell)$/.test(s.t) ? s.t : 'dwell',
      law: LAWS[s.law] ? s.law : 'harmonic',
      span: clamp(+s.span || 60, 5, 320)
    };
  });
  base.playing = true;
  S = base;
  return true;
}

function download(name, blob){
  var url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
function stamp(){
  var d = new Date(), p = function(n){ return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
}

function svgDoc(pts, body, title){
  var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  pts.forEach(function(p){
    x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x);
    y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y);
  });
  var pad = 10, w = (x1 - x0) + pad * 2, h = (y1 - y0) + pad * 2;
  var map = function(p){ return { x: p.x - x0 + pad, y: (y1 - p.y) + pad }; };
  return {
    text:
      '<?xml version="1.0" encoding="UTF-8"?>\n' +
      '<svg xmlns="http://www.w3.org/2000/svg" width="' + fmt(w, 2) + 'mm" height="' + fmt(h, 2) + 'mm" ' +
      'viewBox="0 0 ' + fmt(w, 2) + ' ' + fmt(h, 2) + '">\n' +
      '<title>' + title + '</title>\n' +
      '<rect width="100%" height="100%" fill="#ffffff"/>\n' +
      body(map) +
      '</svg>\n',
    map: map
  };
}
function pathOf(map, pts, close){
  return pts.map(function(p, i){
    var q = map(p);
    return (i ? 'L' : 'M') + fmt(q.x, 2) + ' ' + fmt(q.y, 2);
  }).join(' ') + (close ? ' Z' : '');
}
function circleOf(map, c, r, attrs){
  var q = map(c);
  return '<circle cx="' + fmt(q.x, 2) + '" cy="' + fmt(q.y, 2) + '" r="' + fmt(r, 2) + '" ' + attrs + '/>\n';
}

function exportSVG(){
  var name, doc;
  if (S.bench === 'linkage'){
    var L = S.linkage, sol = L._sol || solveLink(L, L.theta);
    if (!sol) return tip('nothing to export — the chain will not close');
    var all = (L._curve || []).concat([sol.A, sol.B, sol.C, sol.P]);
    if (sol.D) all.push(sol.D);
    doc = svgDoc(all, function(map){
      var s = '<g fill="none" stroke-linecap="round">\n';
      if (L._curve && L._curve.length > 1)
        s += '<path d="' + pathOf(map, L._curve, L._range.full) + '" stroke="#7c3aed" stroke-width="0.8"/>\n';
      s += '<path d="' + pathOf(map, [sol.A, sol.B]) + '" stroke="#b45309" stroke-width="2.4"/>\n';
      s += '<path d="' + pathOf(map, [sol.B, sol.C]) + '" stroke="#0f766e" stroke-width="2.4"/>\n';
      if (sol.D) s += '<path d="' + pathOf(map, [sol.C, sol.D]) + '" stroke="#1d4ed8" stroke-width="2.4"/>\n';
      s += '<path d="' + pathOf(map, [sol.B, sol.P, sol.C]) + '" stroke="#0f766e" stroke-width="1" stroke-dasharray="3 2"/>\n';
      s += '</g>\n<g fill="#111">\n';
      [sol.A, sol.B, sol.C, sol.P].concat(sol.D ? [sol.D] : []).forEach(function(p){
        s += circleOf(map, p, 1.6, 'fill="none" stroke="#111" stroke-width="0.6"');
      });
      return s + '</g>\n';
    }, 'Linkwright linkage — ' + (LINK_PRESETS[L.preset] ? LINK_PRESETS[L.preset].label : 'custom'));
    name = 'linkwright-linkage-' + stamp() + '.svg';

  } else if (S.bench === 'gears'){
    var G = S.gears, c = gearCenters(G), r = gearRadii(G), th = gearAngles(G, G.theta);
    var pts = [];
    c.forEach(function(ci, i){
      pts.push({ x:ci.x - r[i] - G.module, y:ci.y - r[i] - G.module });
      pts.push({ x:ci.x + r[i] + G.module, y:ci.y + r[i] + G.module });
    });
    doc = svgDoc(pts, function(map){
      var s = '<g fill="none" stroke="#111" stroke-width="0.5">\n';
      c.forEach(function(ci, i){
        s += '<path d="' + pathOf(map, gearOutline(ci, r[i], G.gears[i].n, G.module, th[i]), true) + '"/>\n';
        s += circleOf(map, ci, Math.max(2, r[i] * 0.3), 'fill="none" stroke="#111" stroke-width="0.5"');
        s += circleOf(map, ci, r[i], 'fill="none" stroke="#999" stroke-width="0.3" stroke-dasharray="2 2"');
      });
      return s + '</g>\n';
    }, 'Linkwright gear train');
    name = 'linkwright-gears-' + stamp() + '.svg';

  } else {
    var C = S.cam, pitch = camPitch(C, C._sm, 0, 720), prof = camProfile(pitch, C.roller);
    doc = svgDoc(prof, function(map){
      var s = '<g fill="none" stroke="#111" stroke-width="0.5">\n';
      s += '<path d="' + pathOf(map, prof, true) + '"/>\n';
      s += circleOf(map, { x:0, y:0 }, 5, 'fill="none" stroke="#111" stroke-width="0.5"');
      s += circleOf(map, { x:0, y:0 }, C.base, 'fill="none" stroke="#999" stroke-width="0.3" stroke-dasharray="2 2"');
      return s + '</g>\n';
    }, 'Linkwright cam — base ' + C.base + 'mm, lift ' + C.lift + 'mm');
    name = 'linkwright-cam-' + stamp() + '.svg';
  }
  download(name, new Blob([doc.text], { type:'image/svg+xml' }));
  tip('saved ' + name);
}

/* Gear outline in world coordinates, shared by canvas and SVG export. */
function gearOutline(c, r, n, m, rot){
  var t = toothPath(r, n, m), pts = [], i, k;
  for (i = 0; i < n; i++){
    var a0 = rot + i / n * TAU;
    var at = function(rad, ang){ return { x: c.x + rad * Math.cos(ang), y: c.y + rad * Math.sin(ang) }; };
    pts.push(at(t.rd, a0 - t.hd), at(r, a0 - t.hp), at(t.ra, a0 - t.ha),
             at(t.ra, a0 + t.ha), at(r, a0 + t.hp), at(t.rd, a0 + t.hd));
    var nd = rot + (i + 1) / n * TAU - t.hd;
    for (k = 1; k < 4; k++) pts.push(at(t.rd, a0 + t.hd + (nd - a0 - t.hd) * k / 4));
  }
  return pts;
}

function exportPNG(){
  if (!cv.toBlob) return tip('this browser cannot export PNG');
  cv.toBlob(function(b){
    if (!b || !b.size) return tip('PNG export produced nothing');
    download('linkwright-' + S.bench + '-' + stamp() + '.png', b);
    tip('saved PNG · ' + Math.round(b.size / 1024) + ' kB');
  }, 'image/png');
}

function exportJSON(){
  var txt = JSON.stringify(cleanState(), null, 2);
  download('linkwright-' + stamp() + '.json', new Blob([txt], { type:'application/json' }));
  tip('saved design JSON');
}

function shareLink(){
  var txt;
  try { txt = b64(JSON.stringify(cleanState())); }
  catch(e){ return tip('could not encode the link'); }
  var url = location.origin + location.pathname + '#d=' + txt;
  try { history.replaceState(null, '', '#d=' + txt); } catch(e){}
  // replaceState is refused on some origins (file://), so fall back to the hash itself.
  if (location.hash.indexOf('#d=') !== 0){ try { location.hash = 'd=' + txt; } catch(e2){} }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){ tip('share link copied'); },
      function(){ tip('link is in the address bar'); });
  } else tip('link is in the address bar');
}

function openJSON(f){
  var fr = new FileReader();
  fr.onload = function(){
    var raw = null;
    try { raw = JSON.parse(String(fr.result)); } catch(e){}
    if (!raw) return tip('that file is not Linkwright JSON');
    adoptState(raw);
    recompute(); rebuildPanels(); setBench(S.bench, true); fitView();
    tip('design loaded');
  };
  fr.onerror = function(){ tip('could not read that file'); };
  fr.readAsText(f);
}

/* ================================================================
   HUD + CHROME
   ================================================================ */

var hud = document.getElementById('hud'), tipEl = document.getElementById('tip'), tipT = 0;

function tip(msg){
  tipEl.textContent = msg;
  tipEl.classList.add('on');
  clearTimeout(tipT);
  tipT = setTimeout(function(){ tipEl.classList.remove('on'); }, 2000);
}

function chip(label, value, cls){
  return '<div class="chip ' + (cls || '') + '">' + label + ' <b>' + value + '</b></div>';
}

function paintHUD(){
  var h = '';
  if (S.bench === 'linkage'){
    var L = S.linkage, f = linkFacts(L, L._sol);
    h += chip('θ₂', fmt(((L.theta * R2D) % 360 + 360) % 360, 0) + '°', 'hi');
    h += chip('CLASS', f.grashof);
    if (f.mu != null)
      h += chip('TRANS μ', fmt(f.mu, 0) + '°', f.mu < 30 ? 'warn' : '');
    h += chip('SWEEP', L._range.full ? 'full 360°' : fmt((L._range.hi - L._range.lo) * R2D, 0) + '°',
              L._range.full ? '' : 'warn');
    if (L._curve && L._curve.length) h += chip('TRACE', L._curve.length + ' pts');
  } else if (S.bench === 'gears'){
    var G = S.gears, gf = gearFacts(G);
    h += chip('RATIO', (gf.ratio >= 1 ? fmt(gf.ratio, 2) + ' : 1' : '1 : ' + fmt(1 / gf.ratio, 2)), 'hi');
    h += chip('OUT', fmt(Math.abs(gf.rpm), 1) + ' rpm ' + (gf.rpm < 0 ? '↺' : '↻'));
    h += chip('TORQUE', '×' + fmt(gf.torque, 2));
    h += chip('MESHES', String(gf.stages));
    h += chip('CENTRES', fmt(gearCenters(G).reduce(function(a, c, i, arr){
      return i ? a + Math.hypot(c.x - arr[i-1].x, c.y - arr[i-1].y) : 0; }, 0), 1) + ' mm');
  } else {
    var C = S.cam, i = Math.round(((C.theta % 360) + 360) % 360 / 360 * C._sm.n) % C._sm.n;
    var vmax = 0, amax = 0, k;
    for (k = 0; k <= C._sm.n; k++){
      vmax = Math.max(vmax, Math.abs(C._d.v[k])); amax = Math.max(amax, Math.abs(C._d.a[k]));
    }
    h += chip('CAM θ', fmt(C.theta % 360, 0) + '°', 'hi');
    h += chip('LIFT', fmt(C._lift || 0, 2) + ' mm');
    h += chip('v', fmt(C._d.v[i], 2) + ' mm/rad');
    h += chip('PEAK a', fmt(amax, 1), amax > 400 ? 'warn' : '');
    h += chip('Ø MAX', fmt((C.base + C.lift) * 2, 0) + ' mm');
  }
  hud.innerHTML = h;
}

var bPlay = document.getElementById('bPlay');
function paintPlay(){ bPlay.textContent = S.playing ? '⏸' : '▶'; }

/* tabs */
var tabs = document.getElementById('tabs'), thumb = document.getElementById('thumb');
var tabBtns = [].slice.call(tabs.querySelectorAll('button'));
var ACCENT = { linkage:'#5ee0c8', gears:'#ffb347', cam:'#b79cff' };

function moveThumb(){
  var b = tabBtns.filter(function(x){ return x.dataset.b === S.bench; })[0] || tabBtns[0];
  thumb.style.width = b.offsetWidth + 'px';
  thumb.style.transform = 'translateX(' + (b.offsetLeft - 3) + 'px)';
}
function setBench(b, silent){
  S.bench = b;
  tabBtns.forEach(function(x){ x.classList.toggle('on', x.dataset.b === b); });
  ['linkage', 'gears', 'cam'].forEach(function(k){
    document.getElementById('pg-' + k).classList.toggle('on', k === b);
  });
  document.documentElement.style.setProperty('--accent', ACCENT[b]);
  document.getElementById('plotwrap').classList.toggle('on', b === 'cam');
  moveThumb(); fitView(); refreshAll(); scheduleSave();
  if (!silent) tip(b === 'linkage' ? 'Linkage bench — four-bar chains and coupler curves'
                 : b === 'gears' ? 'Gear bench — meshed spur trains'
                 : 'Cam bench — profiles from motion laws');
}
tabBtns.forEach(function(x){
  x.addEventListener('click', function(){ setBench(x.dataset.b); });
});

function rebuildPanels(){
  refreshers.length = 0;
  ['linkage', 'gears', 'cam'].forEach(function(k){ document.getElementById('pg-' + k).innerHTML = ''; });
  buildLinkage(document.getElementById('pg-linkage'));
  buildGears(document.getElementById('pg-gears'));
  buildCam(document.getElementById('pg-cam'));
}

/* ================================================================
   POINTER INTERACTION
   ================================================================ */

var drag = null;

function localPt(ev){
  var r = cv.getBoundingClientRect();
  return { x: ev.clientX - r.left, y: ev.clientY - r.top };
}

cv.addEventListener('pointerdown', function(ev){
  var p = localPt(ev), w = S2W(p);
  if (S.bench === 'linkage'){
    var L = S.linkage, sol = L._sol;
    if (!sol) return;
    var sp = W2S(sol.P), sb = W2S(sol.B);
    if (Math.hypot(p.x - sp.x, p.y - sp.y) < 22) drag = { t:'P' };
    else if (Math.hypot(p.x - sb.x, p.y - sb.y) < 22){ drag = { t:'crank' }; S.playing = false; paintPlay(); }
    else return;
  } else if (S.bench === 'gears'){
    var G = S.gears, c = G._c || gearCenters(G), r = G._r || gearRadii(G), i, hit = -1;
    for (i = 0; i < c.length; i++)
      if (Math.hypot(w.x - c[i].x, w.y - c[i].y) < r[i] + G.module) hit = i;
    if (hit < 0) return;
    G.sel = hit; refreshAll();
    drag = hit === 0 ? { t:'drive' } : { t:'gear', i:hit };
    if (hit === 0){ S.playing = false; paintPlay(); }
  } else {
    drag = { t:'cam', a0: Math.atan2(w.y, w.x) * R2D, th0: S.cam.theta };
    S.playing = false; paintPlay();
  }
  cv.setPointerCapture(ev.pointerId);
  ev.preventDefault();
});

cv.addEventListener('pointermove', function(ev){
  if (!drag) return;
  var p = localPt(ev), w = S2W(p);

  if (drag.t === 'P'){
    var L = S.linkage, sol = L._sol;
    if (!sol) return;
    var cx = sol.C.x - sol.B.x, cy = sol.C.y - sol.B.y, cl = Math.hypot(cx, cy) || 1;
    var hx = cx / cl, hy = cy / cl;
    var dx = w.x - sol.B.x, dy = w.y - sol.B.y;
    L.u = clamp(Math.round(dx * hx + dy * hy), -120, 260);
    L.v = clamp(Math.round(dx * -hy + dy * hx), -140, 140);
    L.preset = 'custom'; recompute(); refreshAll();

  } else if (drag.t === 'crank'){
    S.linkage.theta = Math.atan2(w.y, w.x);
    refreshAll();

  } else if (drag.t === 'gear'){
    var G = S.gears, c = gearCenters(G), prev = c[drag.i - 1];
    G.gears[drag.i].phi = Math.round(Math.atan2(w.y - prev.y, w.x - prev.x) * R2D);
    G.preset = 'custom'; refreshAll(); scheduleSave();

  } else if (drag.t === 'drive'){
    S.gears.theta = Math.atan2(w.y, w.x);

  } else if (drag.t === 'cam'){
    var a = Math.atan2(w.y, w.x) * R2D;
    S.cam.theta = drag.th0 + (a - drag.a0);
    refreshAll();
  }
  ev.preventDefault();
});

function endDrag(ev){
  if (!drag) return;
  drag = null;
  try { cv.releasePointerCapture(ev.pointerId); } catch(e){}
  scheduleSave();
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

/* double tap / click to refit */
cv.addEventListener('dblclick', function(){ fitView(); tip('view refitted'); });

/* ================================================================
   BUTTONS + KEYS
   ================================================================ */

bPlay.addEventListener('click', function(){ S.playing = !S.playing; paintPlay(); });
document.getElementById('bSvg').addEventListener('click', exportSVG);
document.getElementById('bPng').addEventListener('click', exportPNG);
document.getElementById('bJson').addEventListener('click', exportJSON);
document.getElementById('bShare').addEventListener('click', shareLink);
var fileIn = document.getElementById('file');
document.getElementById('bOpen').addEventListener('click', function(){ fileIn.click(); });
fileIn.addEventListener('change', function(){
  if (fileIn.files && fileIn.files[0]) openJSON(fileIn.files[0]);
  fileIn.value = '';
});
document.getElementById('bReset').addEventListener('click', function(){
  var f = freshState();
  S[S.bench] = f[S.bench];
  recompute(); rebuildPanels(); setBench(S.bench, true); fitView();
  tip('bench reset');
});

window.addEventListener('keydown', function(ev){
  var t = ev.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT')) return;
  var k = ev.key;
  if (k === ' '){ S.playing = !S.playing; paintPlay(); ev.preventDefault(); }
  else if (k === '1') setBench('linkage');
  else if (k === '2') setBench('gears');
  else if (k === '3') setBench('cam');
  else if (k === 'ArrowLeft' || k === 'ArrowRight'){
    var d = (k === 'ArrowRight' ? 1 : -1) * (ev.shiftKey ? 10 : 2);
    S.playing = false; paintPlay();
    if (S.bench === 'linkage') S.linkage.theta += d * D2R;
    else if (S.bench === 'gears') S.gears.theta += d * D2R;
    else S.cam.theta += d;
    refreshAll(); ev.preventDefault();
  } else if (k === 'f' || k === 'F'){ fitView(); }
});

window.addEventListener('resize', function(){ resize(); moveThumb(); });
if (window.ResizeObserver){
  var ro = new ResizeObserver(function(){ resize(); moveThumb(); });
  ro.observe(document.getElementById('stage'));
}

/* ================================================================
   LOOP
   ================================================================ */

var last = 0, hudTick = 0;

function step(now){
  var dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
  last = now;

  if (S.playing && !drag){
    if (S.bench === 'linkage'){
      var L = S.linkage, R = L._range, d = 1.1 * S.speed * dt;
      if (R.dead){ /* nothing to drive */ }
      else if (R.full) L.theta = (L.theta + d) % TAU;
      else {
        L.theta += d * (L.dir || 1);
        if (L.theta > R.hi){ L.theta = R.hi; L.dir = -1; }
        if (L.theta < R.lo){ L.theta = R.lo; L.dir = 1; }
      }
    } else if (S.bench === 'gears'){
      S.gears.theta += S.gears.rpm / 60 * TAU * dt * S.speed * 0.35;
    } else {
      S.cam.theta += S.cam.rpm / 60 * 360 * dt * S.speed * 0.35;
    }
  }

  ctx.clearRect(0, 0, VW, VH);
  grid();
  if (S.bench === 'linkage') drawLinkage();
  else if (S.bench === 'gears') drawGears();
  else { drawCam(); drawPlot(); }

  if (++hudTick % 3 === 0) paintHUD();
  requestAnimationFrame(step);
}

/* ================================================================
   BOOT
   ================================================================ */

function boot(){
  var loaded = false;
  var m = /[#&]d=([^&]+)/.exec(location.hash || '');
  if (m){
    try { loaded = adoptState(JSON.parse(unb64(decodeURIComponent(m[1])))); } catch(e){ loaded = false; }
  }
  if (!loaded){
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) loaded = adoptState(JSON.parse(raw));
    } catch(e){}
  }
  recompute();
  rebuildPanels();
  resize();
  setBench(S.bench, true);
  paintPlay();
  paintHUD();
  moveThumb();
  requestAnimationFrame(step);
  setTimeout(function(){
    tip(loaded ? 'design restored — 1/2/3 switch benches, space pauses'
               : 'drag P to shape the coupler curve · 1/2/3 switch benches');
  }, 650);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
</body>
