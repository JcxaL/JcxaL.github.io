<title>Terrarium Composer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<style>
  :root{
    --bg:#0d120e;
    --foliage-deep:#3f6b4a;
    --leaf-bright:#8fbf6f;
    --soil:#c9a875;
    --mist:#eef3e6;
    --panel: rgba(18,24,18,0.78);
    --panel-2: rgba(18,24,18,0.55);
    --border: rgba(238,243,230,0.14);
    --text: var(--mist);
    --muted: rgba(238,243,230,0.6);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; margin:0; overscroll-behavior:none; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    user-select:none;
  }
  button{
    font-family:inherit;
    color:inherit;
    background:none;
    border:none;
    cursor:pointer;
  }

  header.topbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    background:var(--panel);
    backdrop-filter: blur(10px);
    border-bottom:1px solid var(--border);
    flex-shrink:0;
    z-index:5;
  }
  .brand{
    font-weight:700;
    font-size:14px;
    letter-spacing:0.02em;
    white-space:nowrap;
    color:var(--leaf-bright);
    margin-right:2px;
  }
  .tool-tabs{
    display:flex;
    gap:6px;
    flex:1;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .tool-tabs::-webkit-scrollbar{ display:none; }
  .tool-tab{
    display:flex;
    align-items:center;
    gap:6px;
    padding:8px 12px;
    border-radius:999px;
    background:var(--panel-2);
    border:1px solid var(--border);
    font-size:13px;
    white-space:nowrap;
    transition: background .15s, border-color .15s, transform .1s;
  }
  .tool-tab .ic{ font-size:15px; }
  .tool-tab.active{
    background: rgba(143,191,111,0.22);
    border-color: var(--leaf-bright);
    color: var(--leaf-bright);
  }
  .tool-tab:active{ transform: scale(0.96); }

  .icon-btn{
    width:36px; height:36px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    background:var(--panel-2);
    border:1px solid var(--border);
    font-size:16px;
    flex-shrink:0;
  }

  .subpalette{
    display:flex;
    gap:8px;
    padding:8px 12px;
    background: rgba(18,24,18,0.55);
    border-bottom:1px solid var(--border);
    overflow-x:auto;
    scrollbar-width:none;
    flex-shrink:0;
    z-index:4;
  }
  .subpalette::-webkit-scrollbar{ display:none; }
  .subgroup{ display:none; gap:8px; }
  .subgroup.active{ display:flex; }
  .chip{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    padding:6px 12px;
    border-radius:12px;
    background:var(--panel-2);
    border:1px solid var(--border);
    font-size:11px;
    white-space:nowrap;
    color:var(--muted);
    transition: background .15s, border-color .15s, color .15s;
  }
  .chip .swatch{
    width:16px; height:16px;
    border-radius:5px;
    margin-bottom:1px;
    border:1px solid rgba(255,255,255,0.25);
  }
  .chip.active{
    background: rgba(143,191,111,0.2);
    border-color: var(--leaf-bright);
    color: var(--text);
  }

  .stage{
    position:relative;
    flex:1;
    min-height:0;
    touch-action:none;
  }
  #canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
  }
  .hint{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    padding:6px 14px;
    border-radius:999px;
    background:var(--panel);
    border:1px solid var(--border);
    font-size:12px;
    color:var(--muted);
    pointer-events:none;
    max-width:88%;
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  footer.actionbar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 12px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    background:var(--panel);
    backdrop-filter: blur(10px);
    border-top:1px solid var(--border);
    flex-shrink:0;
    z-index:5;
  }
  .action-btn{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    padding:9px 4px;
    border-radius:12px;
    background:var(--panel-2);
    border:1px solid var(--border);
    font-size:10px;
    color:var(--muted);
  }
  .action-btn .ic{ font-size:16px; }
  .action-btn:active{ transform: scale(0.95); }
  .action-btn.primary{
    background: linear-gradient(160deg, var(--leaf-bright), var(--foliage-deep));
    color:#0d120e;
    border-color: transparent;
    font-weight:700;
    flex:1.3;
  }
  .action-btn.primary .ic{ font-size:18px; }

  .drawer{
    position:fixed;
    left:0; right:0; bottom:0;
    max-height:70vh;
    background: rgba(13,18,14,0.97);
    backdrop-filter: blur(14px);
    border-top:1px solid var(--border);
    border-radius:18px 18px 0 0;
    transform: translateY(105%);
    transition: transform .28s cubic-bezier(.22,.9,.3,1.2);
    z-index:20;
    display:flex;
    flex-direction:column;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
  }
  .drawer.open{ transform: translateY(0); }
  .drawer-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 16px;
    border-bottom:1px solid var(--border);
  }
  .drawer-head h2{ margin:0; font-size:15px; }
  .drawer-body{
    padding:14px 16px 20px;
    overflow-y:auto;
  }
  .gallery-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap:12px;
  }
  .thumb-card{
    position:relative;
    border-radius:12px;
    overflow:hidden;
    border:1px solid var(--border);
    background:#000;
    aspect-ratio: 4/3;
    cursor:pointer;
  }
  .thumb-card img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .thumb-del{
    position:absolute;
    top:4px; right:4px;
    width:22px; height:22px;
    border-radius:50%;
    background:rgba(0,0,0,0.6);
    color:#fff;
    font-size:13px;
    line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .thumb-time{
    position:absolute;
    bottom:4px; left:4px;
    font-size:9px;
    padding:2px 6px;
    border-radius:999px;
    background:rgba(0,0,0,0.55);
  }
  .empty-note{
    color:var(--muted);
    font-size:13px;
    padding:20px 0;
    text-align:center;
  }

  @media (max-width: 480px){
    .brand{ display:none; }
    .tool-tab span.label{ display:none; }
    .tool-tab{ padding:9px 10px; }
    .action-btn{ font-size:9px; padding:8px 2px; }
    .hint{ font-size:11px; padding:5px 10px; }
  }
</style>

<header class="topbar">
  <div class="brand">🪴 Terrarium</div>
  <div class="tool-tabs" id="toolTabs">
    <button class="tool-tab active" data-tool="plant"><span class="ic">🌿</span><span class="label">Plant</span></button>
    <button class="tool-tab" data-tool="layer"><span class="ic">🪨</span><span class="label">Layer</span></button>
    <button class="tool-tab" data-tool="decorate"><span class="ic">✨</span><span class="label">Decorate</span></button>

  </div>

</header>

<div class="subpalette" id="subpalette">
  <div class="subgroup active" data-group="plant">
    <button class="chip active" data-plant="fern"><span class="swatch" style="background:#5c8f5f"></span>Fern</button>
    <button class="chip" data-plant="succulent"><span class="swatch" style="background:#8fbf6f"></span>Succulent</button>
    <button class="chip" data-plant="cactus"><span class="swatch" style="background:#6f9e6a"></span>Cactus</button>
    <button class="chip" data-plant="mushroom"><span class="swatch" style="background:#b5674a"></span>Mushroom</button>
    <button class="chip" data-plant="vine"><span class="swatch" style="background:#3f6b4a"></span>Vine</button>
  </div>
  <div class="subgroup" data-group="layer">
    <button class="chip active" data-material="sand"><span class="swatch" style="background:#d9c48f"></span>Sand</button>
    <button class="chip" data-material="pebbles"><span class="swatch" style="background:#9aa0a6"></span>Pebbles</button>
    <button class="chip" data-material="soil"><span class="swatch" style="background:#6b4a30"></span>Soil</button>
    <button class="chip" data-material="moss"><span class="swatch" style="background:#3f6b4a"></span>Moss</button>
  </div>
  <div class="subgroup" data-group="decorate">
    <button class="chip active" data-deco="rock"><span class="swatch" style="background:#7a7e82"></span>Rock</button>
    <button class="chip" data-deco="crystal"><span class="swatch" style="background:#7fb8c9"></span>Crystal</button>
    <button class="chip" data-deco="mushroom"><span class="swatch" style="background:#b5674a"></span>Mini 'Shroom</button>
  </div>
  <div class="subgroup" data-group="light">
    <button class="chip active" data-time="dawn"><span class="swatch" style="background:linear-gradient(#6b3f4a,#c97b5a)"></span>Dawn</button>
    <button class="chip" data-time="day"><span class="swatch" style="background:#bfe3f0"></span>Day</button>
    <button class="chip" data-time="dusk"><span class="swatch" style="background:#7a3b52"></span>Dusk</button>
    <button class="chip" data-time="night"><span class="swatch" style="background:#0d120e"></span>Night</button>
  </div>
</div>

<div class="stage" id="stage">
  <canvas id="canvas"></canvas>
  <div class="hint" id="toolHint">Tap inside the jar to grow a fern</div>
</div>

<footer class="actionbar">
  <button class="action-btn primary" id="btnGrowWild"><span class="ic">🌱</span>Grow Wild</button>
  <button class="action-btn" id="btnUndo"><span class="ic">↩️</span>Undo</button>
  <button class="action-btn" id="btnClear"><span class="ic">🗑️</span>Clear</button>
  <button class="action-btn" id="btnSave"><span class="ic">💾</span>Save</button>
  <button class="action-btn" id="btnExport"><span class="ic">⬇️</span>Export</button>
</footer>

<div class="drawer" id="galleryDrawer">
  <div class="drawer-head">
    <h2>Saved Terrariums</h2>
    <button class="icon-btn" id="btnGalleryClose">✕</button>
  </div>
  <div class="drawer-body">
    <div class="gallery-grid" id="galleryGrid"></div>
    <div class="empty-note" id="galleryEmpty">No saved terrariums yet — build one and tap Save.</div>
  </div>
</div>

<a id="downloadLink" style="display:none"></a>

<script>
(function(){
  "use strict";

  /* ---------------- utils ---------------- */
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function randSeed(){ return Math.floor(Math.random()*4294967295); }
  function randomChoice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      const t = arr[i]; arr[i]=arr[j]; arr[j]=t;
    }
    return arr;
  }
  function mulberry32(seed){
    let a = seed >>> 0;
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hexToRgb(hex){
    hex = hex.replace('#','');
    return [parseInt(hex.substr(0,2),16), parseInt(hex.substr(2,2),16), parseInt(hex.substr(4,2),16)];
  }
  function mixRGBA(hexA, hexB, t, alpha){
    const a = hexToRgb(hexA), b = hexToRgb(hexB);
    const r = Math.round(a[0]+(b[0]-a[0])*t);
    const g = Math.round(a[1]+(b[1]-a[1])*t);
    const bl = Math.round(a[2]+(b[2]-a[2])*t);
    return 'rgba('+r+','+g+','+bl+','+alpha+')';
  }
  function roundRectPath(ctx,x,y,w,h,r){
    r = Math.max(0, Math.min(r, Math.min(w,h)/2));
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  const PAL = {
    bg: '#0d120e',
    foliageDeep: '#3f6b4a',
    leafBright: '#8fbf6f',
    soil: '#c9a875',
    mist: '#eef3e6'
  };

  /* ---------------- plant drawers ---------------- */
  function drawFrond(ctx, rng, x0,y0, angle, len, depth, scale){
    if (depth<=0 || len < 3*scale) return;
    const x1 = x0 + Math.cos(angle)*len;
    const y1 = y0 + Math.sin(angle)*len;
    const t = depth/5;
    ctx.strokeStyle = mixRGBA(PAL.foliageDeep, PAL.leafBright, 1-t, 0.95);
    ctx.lineWidth = Math.max(0.6, depth*0.85*scale);
    ctx.lineCap = 'round';
    const midx = (x0+x1)/2 + Math.cos(angle+Math.PI/2)*len*0.1;
    const midy = (y0+y1)/2 + Math.sin(angle+Math.PI/2)*len*0.1;
    ctx.beginPath();
    ctx.moveTo(x0,y0);
    ctx.quadraticCurveTo(midx,midy,x1,y1);
    ctx.stroke();
    if (depth>1){
      const leaflets = 2 + Math.floor(rng()*2);
      for (let i=1;i<=leaflets;i++){
        const along = i/(leaflets+1);
        const lx = x0+(x1-x0)*along, ly = y0+(y1-y0)*along;
        drawFrond(ctx, rng, lx, ly, angle-0.85-rng()*0.25, len*0.34, depth-2, scale);
        drawFrond(ctx, rng, lx, ly, angle+0.85+rng()*0.25, len*0.34, depth-2, scale);
      }
    }
  }
  function drawFern(ctx, seed, x, y, scale){
    const rng = mulberry32(seed);
    const totalH = (46+rng()*28)*scale;
    const frondCount = 4 + Math.floor(rng()*3);
    for (let i=0;i<frondCount;i++){
      const spread = i/(frondCount-1||1);
      const side = i%2===0 ? -1 : 1;
      const baseAngle = -Math.PI/2 + side*(0.18+spread*0.5);
      const len = totalH*(0.55+rng()*0.3)*(1-spread*0.2);
      drawFrond(ctx, rng, x, y, baseAngle, len, 4, scale);
    }
    drawFrond(ctx, rng, x, y, -Math.PI/2, totalH*0.85, 5, scale);
  }

  function drawSucculent(ctx, seed, x, y, scale){
    const rng = mulberry32(seed);
    const maxLen = (17+rng()*9)*scale;
    const rows = 3;
    for (let r=0; r<rows; r++){
      const rowLeaves = 9 - r*2 + Math.floor(rng()*3);
      const rowLen = maxLen*(1-r*0.26);
      for (let i=0;i<rowLeaves;i++){
        const angle = (i/rowLeaves)*Math.PI*2 + r*0.35 + rng()*0.2;
        const len = rowLen*(0.8+rng()*0.3);
        const w = len*0.42;
        ctx.save();
        ctx.translate(x, y - 1.5*scale*r);
        ctx.rotate(angle);
        const grad = ctx.createLinearGradient(0,0,0,-len);
        const t = r/rows;
        grad.addColorStop(0, mixRGBA(PAL.foliageDeep, PAL.leafBright, 0.2+t*0.3, 0.95));
        grad.addColorStop(1, mixRGBA(PAL.leafBright, PAL.mist, 0.15+rng()*0.2, 0.92));
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(0, -len/2, w/2, len/2, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
    }
  }

  function drawCactus(ctx, seed, x, y, scale){
    const rng = mulberry32(seed);
    const segCount = 2 + Math.floor(rng()*3);
    let cx = x, cy = y, w = (13+rng()*7)*scale;
    for (let s=0; s<segCount; s++){
      const h = (22+rng()*18)*scale;
      ctx.fillStyle = mixRGBA(PAL.foliageDeep, PAL.leafBright, 0.25+rng()*0.35, 1);
      roundRectPath(ctx, cx-w/2, cy-h, w, h, w*0.4);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.18)';
      ctx.lineWidth = 1;
      const ribs = 3 + Math.floor(rng()*2);
      for (let i=1;i<ribs;i++){
        const rx = cx-w/2 + (w/ribs)*i;
        ctx.beginPath(); ctx.moveTo(rx, cy-2); ctx.lineTo(rx, cy-h+3); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      const spineCount = 5 + Math.floor(rng()*6);
      for (let i=0;i<spineCount;i++){
        const sx = cx-w/2 + rng()*w;
        const sy = cy-h + rng()*h;
        ctx.fillRect(sx, sy, 1, 3);
      }
      cy = cy - h*0.82;
      cx = cx + (rng()-0.5)*w*0.6;
      w = w*(0.68+rng()*0.25);
    }
  }

  function drawSingleMushroom(ctx, rng, x, y, s, capColor){
    const stemH = (9+rng()*9)*s;
    const stemW = (3+rng()*2)*s;
    ctx.fillStyle = 'rgba(238,243,230,0.85)';
    roundRectPath(ctx, x-stemW/2, y-stemH, stemW, stemH, stemW*0.4);
    ctx.fill();
    const capR = (7+rng()*6)*s;
    ctx.fillStyle = capColor || mixRGBA('#c9a875','#b5674a', rng(), 1);
    ctx.beginPath();
    ctx.arc(x, y-stemH, capR, Math.PI, Math.PI*2);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    const spots = 1 + Math.floor(rng()*3);
    for (let i=0;i<spots;i++){
      const a = Math.PI + rng()*Math.PI;
      const rr = capR*(0.3+rng()*0.5);
      ctx.beginPath();
      ctx.arc(x+Math.cos(a)*rr, y-stemH-Math.abs(Math.sin(a))*capR*0.5, capR*0.1, 0, Math.PI*2);
      ctx.fill();
    }
  }
  function drawMushroomCluster(ctx, seed, x, y, scale){
    const rng = mulberry32(seed);
    const count = 3 + Math.floor(rng()*3);
    for (let i=0;i<count;i++){
      const mx = x + (rng()-0.5)*24*scale;
      const s = (0.5+rng()*0.9)*scale;
      drawSingleMushroom(ctx, rng, mx, y, s, null);
    }
  }

  function vineBranch(ctx, rng, x, y, angle, len, depth, scale){
    if (depth<=0 || len < 5*scale) return;
    const endX = x + Math.cos(angle)*len;
    const endY = y + Math.sin(angle)*len;
    const midX = (x+endX)/2 + Math.cos(angle+Math.PI/2)*len*0.22;
    const midY = (y+endY)/2 + Math.sin(angle+Math.PI/2)*len*0.22;
    ctx.strokeStyle = mixRGBA(PAL.foliageDeep, PAL.leafBright, 0.4, 1);
    ctx.lineWidth = Math.max(1, depth*1.05*scale);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.quadraticCurveTo(midX,midY,endX,endY);
    ctx.stroke();
    for (let i=0;i<3;i++){
      const t = (i+1)/4;
      const lx = x+(endX-x)*t, ly = y+(endY-y)*t;
      ctx.save();
      ctx.translate(lx,ly);
      ctx.rotate(rng()*Math.PI*2);
      ctx.fillStyle = mixRGBA(PAL.leafBright, PAL.mist, rng()*0.3, 0.9);
      ctx.beginPath();
      ctx.ellipse(0,0, 3*scale, 1.5*scale, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
    if (depth>1 && rng()>0.4){
      vineBranch(ctx, rng, endX, endY, angle + (rng()-0.5)*1.0, len*0.7, depth-1, scale);
    }
    vineBranch(ctx, rng, endX, endY, angle + 0.32 + rng()*0.18, len*0.75, depth-1, scale);
  }
  function drawVine(ctx, seed, x, y, scale){
    const rng = mulberry32(seed);
    const startAngle = -Math.PI/2 + (rng()-0.5)*0.4;
    vineBranch(ctx, rng, x, y, startAngle, (17+rng()*9)*scale, 5, scale);
  }

  const PLANT_DRAW = { fern: drawFern, succulent: drawSucculent, cactus: drawCactus, mushroom: drawMushroomCluster, vine: drawVine };

  /* ---------------- decoration drawers ---------------- */
  function drawRock(ctx, seed, x, y, scale){
    const rng = mulberry32(seed);
    const r = (8+rng()*9)*scale;
    const points = 7 + Math.floor(rng()*4);
    ctx.save();
    ctx.translate(x,y);
    const grad = ctx.createLinearGradient(-r,-r,r,r);
    grad.addColorStop(0, '#9a9ea1');
    grad.addColorStop(1, '#4d5154');
    ctx.fillStyle = grad;
    ctx.beginPath();
    for (let i=0;i<points;i++){
      const a = (i/points)*Math.PI*2;
      const rr = r*(0.75+rng()*0.4);
      const px = Math.cos(a)*rr, py = Math.sin(a)*rr*0.68;
      if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }
  function drawCrystal(ctx, seed, x, y, scale){
    const rng = mulberry32(seed);
    const clusterCount = 2 + Math.floor(rng()*3);
    for (let i=0;i<clusterCount;i++){
      const cx = x + (rng()-0.5)*14*scale;
      const h = (13+rng()*15)*scale;
      const w = h*0.32;
      ctx.save();
      ctx.translate(cx, y);
      ctx.rotate((rng()-0.5)*0.3);
      ctx.fillStyle = 'hsla('+(190+rng()*60)+',60%,'+(55+rng()*15)+'%,0.78)';
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.lineTo(-w/2, -h*0.4);
      ctx.lineTo(0,-h);
      ctx.lineTo(w/2, -h*0.4);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 0.8;
      ctx.stroke();
      ctx.restore();
    }
  }
  function drawMiniMushroomDeco(ctx, seed, x, y, scale){
    const rng = mulberry32(seed);
    drawSingleMushroom(ctx, rng, x, y, (0.55+rng()*0.4)*scale, mixRGBA('#c9a875','#8b4a3d', rng(), 1));
    if (rng()>0.5){
      drawSingleMushroom(ctx, rng, x+(rng()-0.5)*10*scale, y, (0.35+rng()*0.3)*scale, mixRGBA('#c9a875','#8b4a3d', rng(), 1));
    }
  }
  const DECO_DRAW = { rock: drawRock, crystal: drawCrystal, mushroom: drawMiniMushroomDeco };

  /* ---------------- layer bands ---------------- */
  function drawLayerBand(ctx, layer, xLeft, xRight, yTop, yBottom){
    const rng = mulberry32(layer.seed || 1);
    const w = xRight-xLeft, h = yBottom-yTop;
    if (h<=0 || w<=0) return;
    let base0, base1;
    if (layer.material === 'sand'){ base0='#e6d3a0'; base1='#c9a875'; }
    else if (layer.material === 'pebbles'){ base0='#a4a9ad'; base1='#6f7477'; }
    else if (layer.material === 'soil'){ base0='#6b4a30'; base1='#402c1d'; }
    else { base0='#4c7a55'; base1='#2f4f37'; }
    const grad = ctx.createLinearGradient(0, yTop, 0, yBottom);
    grad.addColorStop(0, base0);
    grad.addColorStop(1, base1);
    ctx.fillStyle = grad;
    ctx.fillRect(xLeft, yTop, w, h);

    const count = Math.max(4, Math.min(30, Math.floor((w*h)/220)));
    if (layer.material === 'sand'){
      for (let i=0;i<count;i++){
        const px = xLeft + rng()*w, py = yTop + rng()*h;
        ctx.fillStyle = rng()>0.5 ? 'rgba(255,246,220,0.5)' : 'rgba(90,65,30,0.25)';
        ctx.fillRect(px, py, 1, 1);
      }
    } else if (layer.material === 'pebbles'){
      for (let i=0;i<count;i++){
        const px = xLeft + rng()*w, py = yTop + rng()*h;
        const pr = 1.2 + rng()*2.4;
        ctx.fillStyle = 'rgba('+(150+Math.floor(rng()*80))+','+(150+Math.floor(rng()*80))+','+(155+Math.floor(rng()*80))+',0.85)';
        ctx.beginPath(); ctx.ellipse(px,py,pr,pr*0.8,0,0,Math.PI*2); ctx.fill();
      }
    } else if (layer.material === 'soil'){
      const lines = Math.max(2, Math.floor(h/6));
      for (let i=0;i<lines;i++){
        const py = yTop + (i+0.5)*(h/lines) + (rng()-0.5)*3;
        ctx.strokeStyle = 'rgba('+(rng()>0.5?'0,0,0':'120,90,60')+','+(0.15+rng()*0.15)+')';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(xLeft+2, py); ctx.lineTo(xRight-2, py); ctx.stroke();
      }
    } else {
      const blobs = Math.max(3, Math.floor(count/2));
      for (let i=0;i<blobs;i++){
        const px = xLeft + rng()*w, py = yTop + rng()*h;
        const br = 2 + rng()*3.5;
        ctx.fillStyle = mixRGBA(PAL.foliageDeep, PAL.leafBright, rng(), 0.55);
        ctx.beginPath(); ctx.ellipse(px,py,br,br*0.7,rng()*Math.PI,0,Math.PI*2); ctx.fill();
      }
    }
  }

  /* ---------------- jar geometry ---------------- */
  function getJarGeom(w, h){
    const bodyWidth = Math.min(w*0.6, 380);
    const r = bodyWidth/2;
    const cx = w/2;
    const floorY = h*0.86;
    const domeBaseY = h*0.30;
    return {
      cx: cx, r: r,
      left: cx-r, right: cx+r,
      domeBaseY: domeBaseY, floorY: floorY,
      top: domeBaseY - r,
      cornerR: Math.min(16, r*0.15)
    };
  }
  function buildJarPath(jar){
    const p = new Path2D();
    p.moveTo(jar.left, jar.domeBaseY);
    p.arc(jar.cx, jar.domeBaseY, jar.r, Math.PI, Math.PI*2);
    p.lineTo(jar.right, jar.floorY - jar.cornerR);
    p.arcTo(jar.right, jar.floorY, jar.right-jar.cornerR, jar.floorY, jar.cornerR);
    p.lineTo(jar.left+jar.cornerR, jar.floorY);
    p.arcTo(jar.left, jar.floorY, jar.left, jar.floorY-jar.cornerR, jar.cornerR);
    p.closePath();
    return p;
  }
  function getInterior(jar){
    return {
      left: jar.left + jar.r*0.14,
      right: jar.right - jar.r*0.14,
      top: jar.domeBaseY - jar.r*0.55,
      bottom: jar.floorY - 4
    };
  }
  function normToPx(nx, ny, jar){
    const it = getInterior(jar);
    return {
      x: it.left + nx*(it.right-it.left),
      y: it.bottom - ny*(it.bottom-it.top)
    };
  }
  function pxToNorm(px, py, jar){
    const it = getInterior(jar);
    return {
      nx: clamp((px-it.left)/(it.right-it.left), 0, 1),
      ny: clamp((it.bottom-py)/(it.bottom-it.top), 0, 1)
    };
  }

  /* ---------------- lighting ---------------- */
  const TIME_CONFIG = {
    dawn:  { bg:['#241a2e','#6b3f4a','#c97b5a'], tint:'rgba(255,190,150,0.10)', ray:'rgba(255,200,140,0.35)', mote:[255,214,160] },
    day:   { bg:['#bfe3f0','#dff0e0','#eef3e6'], tint:'rgba(235,255,235,0.06)', ray:'rgba(255,255,230,0.42)', mote:[255,255,255] },
    dusk:  { bg:['#2e1f3d','#7a3b52','#d97a4a'], tint:'rgba(255,140,110,0.12)', ray:'rgba(255,140,90,0.4)',  mote:[255,170,120] },
    night: { bg:['#05070a','#0d120e','#132018'], tint:'rgba(140,180,220,0.08)', ray:'rgba(160,200,255,0.16)', mote:[180,220,255] }
  };

  /* ---------------- dust motes (ambient, not persisted) ---------------- */
  const MOTE_COUNT = 46;
  const motes = [];
  for (let i=0;i<MOTE_COUNT;i++){
    motes.push({
      nx: Math.random(), ny: Math.random(),
      phase: Math.random()*Math.PI*2,
      speed: 0.6+Math.random()*0.8,
      r: 0.6+Math.random()*1.3,
      baseAlpha: 0.35+Math.random()*0.45
    });
  }

  /* ---------------- state ---------------- */
  let state = { time:'day', layers:[], plants:[], decorations:[] };
  let history = [];

  function normalizeState(s){
    const out = { time:'day', layers:[], plants:[], decorations:[] };
    if (!s || typeof s !== 'object') return out;
    if (typeof s.time === 'string' && TIME_CONFIG[s.time]) out.time = s.time;
    if (Array.isArray(s.layers)) out.layers = s.layers.filter(l=>l && typeof l.material==='string').map(l=>({
      material: l.material, height: clamp(+l.height||0.08, 0.01, 0.9), seed: (+l.seed>>>0) || randSeed()
    }));
    if (Array.isArray(s.plants)) out.plants = s.plants.filter(p=>p && PLANT_DRAW[p.type]).map(p=>({
      type: p.type, nx: clamp(+p.nx||0.5,0,1), ny: clamp(+p.ny||0,0,1), seed:(+p.seed>>>0)||randSeed(), scale: clamp(+p.scale||1,0.3,3)
    }));
    if (Array.isArray(s.decorations)) out.decorations = s.decorations.filter(d=>d && DECO_DRAW[d.type]).map(d=>({
      type: d.type, nx: clamp(+d.nx||0.5,0,1), ny: clamp(+d.ny||0,0,1), seed:(+d.seed>>>0)||randSeed(), scale: clamp(+d.scale||1,0.3,3)
    }));
    return out;
  }

  function saveSession(){
    try { localStorage.setItem('terrarium_session_v1', JSON.stringify(state)); } catch(e){ /* ignore quota errors */ }
  }
  function loadSession(){
    try {
      const raw = localStorage.getItem('terrarium_session_v1');
      if (!raw) return null;
      return normalizeState(JSON.parse(raw));
    } catch(e){ return null; }
  }
  function loadGallery(){
    try {
      const raw = localStorage.getItem('terrarium_gallery_v1');
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch(e){ return []; }
  }
  function writeGallery(list){
    try { localStorage.setItem('terrarium_gallery_v1', JSON.stringify(list)); } catch(e){ /* ignore quota errors */ }
  }

  /* ---------------- scene render ---------------- */
  function drawScene(ctx, w, h, now){
    ctx.clearRect(0,0,w,h);
    const cfg = TIME_CONFIG[state.time] || TIME_CONFIG.day;
    const jar = getJarGeom(w,h);
    const jarPath = buildJarPath(jar);

    // background
    const bgGrad = ctx.createLinearGradient(0,0,0,h);
    bgGrad.addColorStop(0, cfg.bg[0]);
    bgGrad.addColorStop(0.55, cfg.bg[1]);
    bgGrad.addColorStop(1, cfg.bg[2]);
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0,0,w,h);

    // ground shadow
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(jar.cx, jar.floorY+10, jar.r*0.92, 14, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.filter = 'blur(6px)';
    ctx.fill();
    ctx.restore();

    // interior contents (clipped)
    ctx.save();
    ctx.clip(jarPath);

    const interiorGrad = ctx.createLinearGradient(0, jar.domeBaseY-jar.r, 0, jar.floorY);
    interiorGrad.addColorStop(0, 'rgba(255,255,255,0.05)');
    interiorGrad.addColorStop(1, 'rgba(0,0,0,0.12)');
    ctx.fillStyle = interiorGrad;
    ctx.fillRect(jar.left, jar.top, jar.right-jar.left, jar.floorY-jar.top);

    drawLayers(ctx, jar);
    drawPlantsAndDeco(ctx, jar);
    drawDustMotes(ctx, jar, cfg, now);
    drawGodRay(ctx, jar, cfg);

    ctx.restore();

    // glass tint + highlight (also clipped)
    ctx.save();
    ctx.clip(jarPath);
    ctx.fillStyle = cfg.tint;
    ctx.fillRect(jar.left, jar.top, jar.right-jar.left, jar.floorY-jar.top);
    const hlGrad = ctx.createLinearGradient(jar.left, 0, jar.left+jar.r*0.7, 0);
    hlGrad.addColorStop(0, 'rgba(255,255,255,0.16)');
    hlGrad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hlGrad;
    ctx.fillRect(jar.left, jar.top, jar.r*0.7, jar.floorY-jar.top);
    ctx.restore();

    // glass rim + lid knob
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(238,243,230,0.35)';
    ctx.stroke(jarPath);
    ctx.beginPath();
    ctx.ellipse(jar.cx, jar.top+6, jar.r*0.14, 5, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(238,243,230,0.55)';
    ctx.fill();
  }

  function drawLayers(ctx, jar){
    const it = getInterior(jar);
    let cum = 0;
    for (const layer of state.layers){
      const bandH = layer.height*(it.bottom-it.top);
      const yBottom = it.bottom - cum;
      const yTop = yBottom - bandH;
      drawLayerBand(ctx, layer, it.left, it.right, yTop, yBottom);
      cum += bandH;
    }
    if (dragState.active){
      const bandH = dragState.height*(it.bottom-it.top);
      const yBottom = it.bottom - cum;
      const yTop = yBottom - bandH;
      ctx.save();
      ctx.globalAlpha = 0.88;
      drawLayerBand(ctx, {material:dragState.material, seed:dragState.seed}, it.left, it.right, yTop, yBottom);
      ctx.strokeStyle = 'rgba(238,243,230,0.6)';
      ctx.setLineDash([4,3]);
      ctx.strokeRect(it.left, yTop, it.right-it.left, bandH);
      ctx.setLineDash([]);
      ctx.restore();
    }
  }

  function drawPlantsAndDeco(ctx, jar){
    const items = state.plants.map(p=>({kind:'plant', item:p}))
      .concat(state.decorations.map(d=>({kind:'deco', item:d})));
    items.sort((a,b)=> a.item.ny - b.item.ny); // farther-back (higher ny) drawn first for pseudo depth... actually draw low-ny (front/near floor) after
    items.sort((a,b)=> b.item.ny - a.item.ny);
    for (const entry of items){
      const {x,y} = normToPx(entry.item.nx, entry.item.ny, jar);
      const fn = entry.kind === 'plant' ? PLANT_DRAW[entry.item.type] : DECO_DRAW[entry.item.type];
      if (fn) fn(ctx, entry.item.seed, x, y, entry.item.scale);
    }
  }

  function drawDustMotes(ctx, jar, cfg, now){
    const it = getInterior(jar);
    const color = cfg.mote;
    for (const m of motes){
      const driftY = Math.sin(now*0.00022*m.speed + m.phase)*0.05;
      const driftX = Math.cos(now*0.00016*m.speed + m.phase*1.3)*0.04;
      const nx = clamp(m.nx+driftX, 0, 1);
      const ny = clamp(m.ny+driftY, 0, 1);
      const x = it.left + nx*(it.right-it.left);
      const y = it.bottom - ny*(it.bottom-it.top);
      const alpha = m.baseAlpha * (0.6+0.4*Math.sin(now*0.0004+m.phase));
      ctx.fillStyle = 'rgba('+color[0]+','+color[1]+','+color[2]+','+alpha+')';
      ctx.beginPath();
      ctx.arc(x,y,m.r,0,Math.PI*2);
      ctx.fill();
    }
  }

  function drawGodRay(ctx, jar, cfg){
    ctx.save();
    ctx.translate(jar.cx - jar.r*0.35, jar.domeBaseY - jar.r*0.35);
    ctx.rotate(-0.38);
    const len = (jar.floorY-jar.domeBaseY) + jar.r*1.6;
    const beamW = jar.r*0.42;
    const grad = ctx.createLinearGradient(0,0,0,len);
    grad.addColorStop(0, cfg.ray);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(-beamW/2, -20, beamW, len);
    ctx.restore();
  }

  /* ---------------- canvas setup / loop ---------------- */
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  let cssW = 0, cssH = 0, rafId = null;

  function resizeCanvas(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = stage.getBoundingClientRect();
    cssW = Math.max(1, rect.width);
    cssH = Math.max(1, rect.height);
    canvas.width = Math.round(cssW*dpr);
    canvas.height = Math.round(cssH*dpr);
    canvas.style.width = cssW+'px';
    canvas.style.height = cssH+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function frame(now){
    drawScene(ctx, cssW, cssH, now);
    rafId = requestAnimationFrame(frame);
  }
  function startLoop(){ if (!rafId) rafId = requestAnimationFrame(frame); }
  function stopLoop(){ if (rafId){ cancelAnimationFrame(rafId); rafId = null; } }

  /* ---------------- tools / interaction ---------------- */
  let currentTool = 'plant';
  let currentPlantType = 'fern';
  let currentMaterial = 'sand';
  let currentDecoType = 'rock';

  const dragState = { active:false, material:'sand', seed:1, height:0, startY:0 };

  function pushHistory(kind){ history.push({kind:kind}); }

  function placePlant(x,y){
    const jar = getJarGeom(cssW,cssH);
    if (!ctx.isPointInPath(buildJarPath(jar), x, y)) return;
    const n = pxToNorm(x,y,jar);
    state.plants.push({ type:currentPlantType, nx:n.nx, ny:n.ny, seed:randSeed(), scale: 0.75+Math.random()*0.6 });
    pushHistory('plant');
    saveSession();
  }
  function placeDecoration(x,y){
    const jar = getJarGeom(cssW,cssH);
    if (!ctx.isPointInPath(buildJarPath(jar), x, y)) return;
    const n = pxToNorm(x,y,jar);
    state.decorations.push({ type:currentDecoType, nx:n.nx, ny: Math.min(n.ny, 0.18), seed:randSeed(), scale: 0.7+Math.random()*0.5 });
    pushHistory('decoration');
    saveSession();
  }
  function startLayerDrag(x,y){
    const jar = getJarGeom(cssW,cssH);
    if (!ctx.isPointInPath(buildJarPath(jar), x, y)) return;
    dragState.active = true;
    dragState.material = currentMaterial;
    dragState.seed = randSeed();
    dragState.startY = y;
    dragState.height = 0.035;
  }
  function updateLayerDrag(y){
    if (!dragState.active) return;
    const jar = getJarGeom(cssW,cssH);
    const it = getInterior(jar);
    const delta = (dragState.startY - y) / (it.bottom-it.top);
    dragState.height = clamp(0.035+Math.max(0,delta), 0.02, 0.6);
  }
  function commitLayerDrag(){
    if (!dragState.active) return;
    state.layers.push({ material: dragState.material, height: dragState.height, seed: dragState.seed });
    pushHistory('layer');
    dragState.active = false;
    saveSession();
  }

  function getCanvasPos(e){
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function onPointerDown(e){
    const p = getCanvasPos(e);
    if (currentTool === 'plant') placePlant(p.x,p.y);
    else if (currentTool === 'decorate') placeDecoration(p.x,p.y);
    else if (currentTool === 'layer') startLayerDrag(p.x,p.y);
  }
  function onWindowPointerMove(e){
    if (!dragState.active) return;
    const p = getCanvasPos(e);
    updateLayerDrag(p.y);
  }
  function onWindowPointerUp(){
    if (dragState.active) commitLayerDrag();
  }

  canvas.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onWindowPointerMove);
  window.addEventListener('pointerup', onWindowPointerUp);
  window.addEventListener('pointercancel', onWindowPointerUp);

  /* ---------------- undo / clear / grow wild ---------------- */
  function undo(){
    const last = history.pop();
    if (!last) return;
    if (last.kind === 'plant') state.plants.pop();
    else if (last.kind === 'layer') state.layers.pop();
    else if (last.kind === 'decoration') state.decorations.pop();
    saveSession();
  }
  function clearAll(){
    state = { time: state.time, layers:[], plants:[], decorations:[] };
    history = [];
    saveSession();
  }
  function growWild(){
    const times = ['dawn','day','dusk','night'];
    const materials = shuffle(['sand','pebbles','soil','moss']);
    const plantTypes = ['fern','succulent','cactus','mushroom','vine'];
    const decoTypes = ['rock','crystal','mushroom'];

    const newState = { time: randomChoice(times), layers:[], plants:[], decorations:[] };
    const bandCount = 2 + Math.floor(Math.random()*3);
    for (let i=0;i<bandCount;i++){
      newState.layers.push({ material: materials[i % materials.length], height: 0.07+Math.random()*0.13, seed: randSeed() });
    }
    const plantCount = 4 + Math.floor(Math.random()*4);
    for (let i=0;i<plantCount;i++){
      newState.plants.push({
        type: randomChoice(plantTypes),
        nx: 0.12+Math.random()*0.76,
        ny: Math.random()*0.55,
        seed: randSeed(),
        scale: 0.7+Math.random()*0.7
      });
    }
    const decoCount = 2 + Math.floor(Math.random()*3);
    for (let i=0;i<decoCount;i++){
      newState.decorations.push({
        type: randomChoice(decoTypes),
        nx: 0.1+Math.random()*0.8,
        ny: Math.random()*0.1,
        seed: randSeed(),
        scale: 0.7+Math.random()*0.6
      });
    }
    state = newState;
    history = [];
    saveSession();
    syncLightButtons();
  }

  /* ---------------- gallery / export ---------------- */
  function makeThumbnail(targetW){
    const targetH = Math.max(1, Math.round(targetW * ((cssH||3)/(cssW||4))));
    const off = document.createElement('canvas');
    off.width = targetW; off.height = targetH;
    const octx = off.getContext('2d');
    drawScene(octx, targetW, targetH, performance.now());
    return off.toDataURL('image/png');
  }
  function saveToGallery(){
    const thumb = makeThumbnail(160);
    const entry = {
      id: Date.now().toString(36)+Math.random().toString(36).slice(2,7),
      state: JSON.parse(JSON.stringify(state)),
      thumb: thumb,
      savedAt: Date.now()
    };
    let gallery = loadGallery();
    gallery.unshift(entry);
    if (gallery.length > 20) gallery = gallery.slice(0,20);
    writeGallery(gallery);
    renderGallery();
  }
  function deleteEntry(id){
    const gallery = loadGallery().filter(function(g){ return g.id !== id; });
    writeGallery(gallery);
    renderGallery();
  }
  function loadEntry(id){
    const entry = loadGallery().filter(function(g){ return g.id === id; })[0];
    if (!entry) return;
    state = normalizeState(entry.state);
    history = [];
    saveSession();
    syncLightButtons();
    closeGallery();
  }
  function renderGallery(){
    const gallery = loadGallery();
    const grid = document.getElementById('galleryGrid');
    const empty = document.getElementById('galleryEmpty');
    grid.innerHTML = '';
    if (gallery.length === 0){
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    for (const entry of gallery){
      const card = document.createElement('div');
      card.className = 'thumb-card';
      card.dataset.id = entry.id;
      const img = document.createElement('img');
      img.src = entry.thumb;
      img.alt = 'Saved terrarium';
      const del = document.createElement('button');
      del.className = 'thumb-del';
      del.textContent = '×';
      del.dataset.id = entry.id;
      const timeTag = document.createElement('div');
      timeTag.className = 'thumb-time';
      timeTag.textContent = (entry.state && entry.state.time) || '';
      card.appendChild(img);
      card.appendChild(timeTag);
      card.appendChild(del);
      grid.appendChild(card);
    }
  }
  document.getElementById('galleryGrid').addEventListener('click', function(e){
    const del = e.target.closest('.thumb-del');
    if (del){ e.stopPropagation(); deleteEntry(del.dataset.id); return; }
    const card = e.target.closest('.thumb-card');
    if (card) loadEntry(card.dataset.id);
  });

  function exportPNG(){
    canvas.toBlob(function(blob){
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.getElementById('downloadLink');
      a.href = url;
      a.download = 'terrarium-'+Date.now()+'.png';
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
    }, 'image/png');
  }

  /* ---------------- UI wiring ---------------- */
  const toolHint = document.getElementById('toolHint');
  const HINTS = {
    plant: 'Tap inside the jar to grow a ',
    layer: 'Drag up inside the jar to build a substrate layer',
    decorate: 'Tap inside the jar to place a decoration',
    light: 'Choose a time of day'
  };
  function updateHint(){
    if (currentTool === 'plant') toolHint.textContent = HINTS.plant + currentPlantType;
    else toolHint.textContent = HINTS[currentTool];
  }

  document.getElementById('toolTabs').addEventListener('click', function(e){
    const btn = e.target.closest('.tool-tab');
    if (!btn) return;
    currentTool = btn.dataset.tool;
    document.querySelectorAll('.tool-tab').forEach(function(b){ b.classList.toggle('active', b===btn); });
    document.querySelectorAll('.subgroup').forEach(function(g){ g.classList.toggle('active', g.dataset.group===currentTool); });
    updateHint();
  });

  document.querySelector('.subgroup[data-group="plant"]').addEventListener('click', function(e){
    const btn = e.target.closest('.chip'); if (!btn) return;
    currentPlantType = btn.dataset.plant;
    this.querySelectorAll('.chip').forEach(function(c){ c.classList.toggle('active', c===btn); });
    updateHint();
  });
  document.querySelector('.subgroup[data-group="layer"]').addEventListener('click', function(e){
    const btn = e.target.closest('.chip'); if (!btn) return;
    currentMaterial = btn.dataset.material;
    this.querySelectorAll('.chip').forEach(function(c){ c.classList.toggle('active', c===btn); });
  });
  document.querySelector('.subgroup[data-group="decorate"]').addEventListener('click', function(e){
    const btn = e.target.closest('.chip'); if (!btn) return;
    currentDecoType = btn.dataset.deco;
    this.querySelectorAll('.chip').forEach(function(c){ c.classList.toggle('active', c===btn); });
  });
  document.querySelector('.subgroup[data-group="light"]').addEventListener('click', function(e){
    const btn = e.target.closest('.chip'); if (!btn) return;
    state.time = btn.dataset.time;
    syncLightButtons();
    saveSession();
  });
  function syncLightButtons(){
    document.querySelectorAll('.subgroup[data-group="light"] .chip').forEach(function(c){
      c.classList.toggle('active', c.dataset.time === state.time);
    });
  }

  document.getElementById('btnGrowWild').addEventListener('click', growWild);
  document.getElementById('btnUndo').addEventListener('click', undo);
  document.getElementById('btnClear').addEventListener('click', clearAll);
  document.getElementById('btnSave').addEventListener('click', saveToGallery);
  document.getElementById('btnExport').addEventListener('click', exportPNG);

  const galleryDrawer = document.getElementById('galleryDrawer');
  function openGallery(){ renderGallery(); galleryDrawer.classList.add('open'); }
  function closeGallery(){ galleryDrawer.classList.remove('open'); }
  document.getElementById('btnGalleryOpen').addEventListener('click', openGallery);
  document.getElementById('btnGalleryClose').addEventListener('click', closeGallery);

  window.addEventListener('keydown', function(e){
    if (e.key === 'z' || e.key === 'Z') undo();
    else if (e.key === 'g' || e.key === 'G') growWild();
    else if (e.key === 'Escape') closeGallery();
  });

  document.addEventListener('visibilitychange', function(){
    if (document.hidden) stopLoop(); else startLoop();
  });

  /* ---------------- boot ---------------- */
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  const saved = loadSession();
  if (saved && (saved.layers.length || saved.plants.length || saved.decorations.length)){
    state = saved;
  } else {
    growWild();
  }
  syncLightButtons();
  updateHint();
  renderGallery();
  startLoop();
})();
</script>
