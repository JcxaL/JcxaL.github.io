<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Kiln — Lathe &amp; Glaze Studio</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --ink:#0e0c0b; --ink2:#17130f; --panel:#1d1815; --line:#332a24;
    --cream:#f3e9dc; --mut:#a2938a;
    --clay:#e2703a; --celadon:#6fb3a0; --ochre:#c9a227;
    --r:14px;
    font-synthesis-weight:none;
  }
  html,body{height:100%;margin:0}
  body{
    background:
      radial-gradient(120% 80% at 70% -10%, #2a211c 0%, transparent 60%),
      radial-gradient(90% 70% at 0% 110%, #1b2420 0%, transparent 55%),
      var(--ink);
    color:var(--cream);
    font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    overflow:hidden;
    display:flex;flex-direction:column;
    touch-action:manipulation;
  }
  button,select,input{font:inherit;color:inherit}

  /* ---------- top bar ---------- */
  #bar{
    display:flex;align-items:center;gap:10px;padding:10px 14px;
    border-bottom:1px solid var(--line);background:rgba(14,12,11,.72);
    backdrop-filter:blur(14px);flex:0 0 auto;z-index:30;
    overflow-x:auto;scrollbar-width:none;
  }
  #bar::-webkit-scrollbar{display:none}
  @media(max-width:520px){#bar{gap:7px;padding:9px 10px}#bar .btn{padding:7px 11px}}
  #logo{display:flex;align-items:center;gap:9px;margin-right:4px}
  #logo b{font-size:15px;letter-spacing:.14em;text-transform:uppercase;font-weight:650}
  #logo span{color:var(--mut);font-size:11px;letter-spacing:.06em;display:none}
  @media(min-width:900px){#logo span{display:inline}}
  .spark{width:22px;height:22px;border-radius:50%;
    background:conic-gradient(from 200deg,var(--clay),var(--ochre),var(--celadon),var(--clay));
    box-shadow:0 0 18px -4px var(--clay);flex:0 0 auto}
  #bar .grow{flex:1}
  .btn{
    background:#241d18;border:1px solid var(--line);border-radius:999px;
    padding:7px 13px;cursor:pointer;white-space:nowrap;transition:.16s ease;
    display:inline-flex;align-items:center;gap:6px;font-size:12.5px
  }
  .btn:hover{border-color:#5a4537;background:#2d241d;transform:translateY(-1px)}
  .btn:active{transform:translateY(0) scale(.97)}
  .btn.on{background:var(--clay);border-color:var(--clay);color:#1a0f08;font-weight:600}
  .btn.ghost{background:transparent}
  #bar .btn.hideSm{display:none}
  @media(min-width:760px){#bar .btn.hideSm{display:inline-flex}}

  /* ---------- stage ---------- */
  #stage{flex:1;display:grid;min-height:0;
    grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);}
  @media(min-width:860px){
    #stage{grid-template-columns:300px minmax(0,1fr) 288px;grid-template-rows:minmax(0,1fr)}
  }
  .pane{position:relative;min-width:0;min-height:0;overflow:hidden}
  #profilePane{border-right:1px solid var(--line);background:linear-gradient(180deg,#141110,#0f0d0c);
    display:flex;flex-direction:column}
  #viewPane{background:transparent}
  #ctrlPane{border-left:1px solid var(--line);background:linear-gradient(180deg,#141110,#100e0d);
    overflow-y:auto;overscroll-behavior:contain}
  @media(max-width:859px){
    #profilePane,#viewPane,#ctrlPane{grid-area:1/1;display:none}
    #profilePane.show,#viewPane.show,#ctrlPane.show{display:flex;flex-direction:column}
    #ctrlPane.show{display:block}
    #profilePane{border-right:0}#ctrlPane{border-left:0}
  }

  /* profile editor */
  #profileWrap{flex:1;position:relative;min-height:0}
  #profile{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .paneHead{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}
  .paneHead h2{margin:0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:600}
  .paneHead .grow{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
  .chip{background:#221b17;border:1px solid var(--line);border-radius:8px;padding:5px 9px;
    font-size:11.5px;cursor:pointer;color:var(--mut);transition:.15s}
  .chip:hover{color:var(--cream);border-color:#5a4537}
  .chip.on{background:var(--celadon);color:#06201a;border-color:var(--celadon);font-weight:600}
  .tip{padding:0 12px 10px;color:#7d6f66;font-size:11px}

  /* 3D viewport */
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #gl.drag{cursor:grabbing}
  #hud{position:absolute;left:12px;bottom:12px;display:flex;gap:7px;flex-wrap:wrap;pointer-events:none}
  .pill{background:rgba(20,16,14,.68);border:1px solid var(--line);border-radius:999px;
    padding:4px 10px;font-size:11px;color:var(--mut);backdrop-filter:blur(8px)}
  .pill b{color:var(--cream);font-weight:600}
  #viewTools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:7px}
  .sq{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
    background:rgba(24,19,16,.72);border:1px solid var(--line);cursor:pointer;backdrop-filter:blur(8px);
    transition:.15s;font-size:15px;line-height:1}
  .sq:hover{border-color:#5a4537;background:rgba(40,31,25,.85)}
  .sq.on{background:var(--clay);border-color:var(--clay);color:#1a0f08}

  /* controls */
  .group{padding:12px 14px;border-bottom:1px solid var(--line)}
  .group h3{margin:0 0 9px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:600}
  .row{display:flex;align-items:center;gap:9px;margin:7px 0}
  .row label{flex:0 0 76px;font-size:11.5px;color:var(--mut)}
  .row output{flex:0 0 42px;text-align:right;font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--cream)}
  input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:22px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:#3a2f27}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;margin-top:-6px;
    border-radius:50%;background:var(--cream);border:2px solid var(--clay);box-shadow:0 1px 5px #000a}
  input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:#3a2f27}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--cream);border:2px solid var(--clay)}
  .glazes{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .glaze{aspect-ratio:1;border-radius:11px;border:2px solid transparent;cursor:pointer;position:relative;
    transition:.16s;overflow:hidden}
  .glaze:hover{transform:translateY(-2px)}
  .glaze.on{border-color:var(--cream);box-shadow:0 0 0 3px #0008}
  .glaze i{position:absolute;inset:0;opacity:.55;
    background:repeating-linear-gradient(115deg,#fff2 0 3px,#0000 3px 7px)}
  .glaze em{position:absolute;left:0;right:0;bottom:0;font-style:normal;font-size:8.5px;text-align:center;
    background:#0009;padding:2px 0;letter-spacing:.03em}

  /* shelf */
  #shelf{position:fixed;inset:auto 0 0 0;max-height:72vh;background:rgba(17,14,12,.96);
    border-top:1px solid var(--line);transform:translateY(102%);transition:transform .4s cubic-bezier(.22,1,.36,1);
    z-index:40;backdrop-filter:blur(18px);overflow-y:auto;padding:14px 16px 22px}
  #shelf.open{transform:none}
  #shelfGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-top:10px}
  .piece{background:#1e1815;border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;
    position:relative;transition:.16s}
  .piece:hover{border-color:var(--clay);transform:translateY(-2px)}
  .piece img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#0d0b0a}
  .piece span{display:block;padding:6px 8px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .piece button{position:absolute;top:5px;right:5px;width:21px;height:21px;border-radius:50%;
    background:#000a;border:1px solid var(--line);cursor:pointer;font-size:11px;line-height:1;padding:0;opacity:0}
  .piece:hover button{opacity:1}
  .empty{color:#7d6f66;font-size:12px;padding:16px 0}

  #toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,24px);opacity:0;pointer-events:none;
    background:#241c17;border:1px solid var(--clay);border-radius:999px;padding:9px 18px;font-size:12.5px;
    z-index:60;transition:.3s cubic-bezier(.22,1,.36,1);box-shadow:0 14px 40px -12px #000}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  #tabs{display:none;gap:6px;padding:8px 12px;border-top:1px solid var(--line);background:#120f0e;flex:0 0 auto}
  @media(max-width:859px){#tabs{display:flex}}
  #tabs .btn{flex:1;justify-content:center}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header id="bar">
  <div id="logo"><div class="spark"></div><b>Kiln</b><span>lathe &amp; glaze studio</span></div>
  <div class="grow"></div>
  <button class="btn hideSm" id="bSnap" title="Save a PNG of the viewport">⬓ PNG</button>
  <button class="btn hideSm" id="bObj" title="Download Wavefront OBJ">OBJ</button>
  <button class="btn" id="bStl" title="Download printable binary STL">STL</button>
  <button class="btn" id="bShare" title="Copy a link that rebuilds this piece">↗ Share</button>
  <button class="btn" id="bSave">＋ Shelf</button>
  <button class="btn ghost" id="bShelf">Shelf</button>
</header>

<main id="stage">
  <section class="pane show" id="profilePane">
    <div class="paneHead">
      <h2>Profile</h2><div class="grow"></div>
      <button class="chip" id="bSmooth">Smooth</button>
      <button class="chip" id="bDel" title="Remove selected point">− point</button>
    </div>
    <div id="profileWrap"><canvas id="profile"></canvas></div>
    <div class="chips" id="shapeChips"></div>
    <p class="tip">Drag the dots to turn the silhouette. Click empty space to add a point, double-click one to remove it.</p>
  </section>

  <section class="pane show" id="viewPane">
    <canvas id="gl"></canvas>
    <div id="viewTools">
      <button class="sq on" id="bSpin" title="Turntable">⟳</button>
      <button class="sq" id="bWire" title="Wireframe">⌗</button>
      <button class="sq" id="bLight" title="Cycle lighting">☀</button>
      <button class="sq" id="bReset" title="Reset camera">⌂</button>
    </div>
    <div id="hud">
      <span class="pill" id="hTris">—</span>
      <span class="pill" id="hSize">—</span>
      <span class="pill" id="hFps">—</span>
    </div>
  </section>

  <aside class="pane" id="ctrlPane">
    <div class="group">
      <h3>Glaze</h3>
      <div class="glazes" id="glazes"></div>
    </div>
    <div class="group">
      <h3>Form</h3>
      <div class="row"><label for="sHeight">Height</label><input type="range" id="sHeight" min="60" max="320" value="180"><output id="oHeight"></output></div>
      <div class="row"><label for="sWidth">Girth</label><input type="range" id="sWidth" min="40" max="200" value="100"><output id="oWidth"></output></div>
      <div class="row"><label for="sWall">Wall</label><input type="range" id="sWall" min="2" max="26" value="9"><output id="oWall"></output></div>
      <div class="row"><label for="sFacets">Facets</label><input type="range" id="sFacets" min="5" max="128" value="96"><output id="oFacets"></output></div>
      <div class="row"><label for="sFlutes">Flutes</label><input type="range" id="sFlutes" min="0" max="24" value="0"><output id="oFlutes"></output></div>
      <div class="row"><label for="sDepth">Depth</label><input type="range" id="sDepth" min="0" max="40" value="12"><output id="oDepth"></output></div>
      <div class="row"><label for="sTwist">Twist</label><input type="range" id="sTwist" min="-180" max="180" value="0"><output id="oTwist"></output></div>
      <div class="row"><label for="sWobble">Wobble</label><input type="range" id="sWobble" min="0" max="40" value="0"><output id="oWobble"></output></div>
    </div>
    <div class="group">
      <h3>Surface</h3>
      <div class="row"><label for="sRough">Matte</label><input type="range" id="sRough" min="0" max="100" value="38"><output id="oRough"></output></div>
      <div class="row"><label for="sSpeck">Speckle</label><input type="range" id="sSpeck" min="0" max="100" value="22"><output id="oSpeck"></output></div>
      <div class="row"><label for="sDrip">Drip</label><input type="range" id="sDrip" min="0" max="100" value="45"><output id="oDrip"></output></div>
      <div class="row"><label for="sBands">Rings</label><input type="range" id="sBands" min="0" max="60" value="16"><output id="oBands"></output></div>
    </div>
    <div class="group">
      <h3>Pattern</h3>
      <div class="chips" style="padding:0;border:0" id="patterns"></div>
    </div>
  </aside>
</main>

<nav id="tabs">
  <button class="btn on" data-pane="profilePane">Profile</button>
  <button class="btn on" data-pane="viewPane">Wheel</button>
  <button class="btn" data-pane="ctrlPane">Glaze</button>
</nav>

<div id="shelf">
  <div class="paneHead" style="padding:0 0 8px;border:0">
    <h2>The Shelf — saved pieces</h2><div class="grow"></div>
    <button class="chip" id="bShelfClose">Close</button>
  </div>
  <div id="shelfGrid"></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var clamp=function(v,a,b){return v<a?a:v>b?b:v};
var lerp=function(a,b,t){return a+(b-a)*t};
var toastEl=$('toast'),toastT=0;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove('show')},1900)}

/* ------------------------------------------------------------------ presets */
var SHAPES=[
 {n:'Vase',    p:[[.40,0],[.62,.18],[.72,.40],[.50,.70],[.33,.88],[.40,1]]},
 {n:'Bowl',    p:[[.16,0],[.48,.18],[.76,.50],[.92,.84],[.96,1]]},
 {n:'Bottle',  p:[[.48,0],[.62,.12],[.60,.40],[.24,.62],[.17,.84],[.25,1]]},
 {n:'Goblet',  p:[[.42,0],[.18,.09],[.09,.30],[.22,.50],[.52,.80],[.58,1]]},
 {n:'Amphora', p:[[.20,0],[.55,.20],[.68,.46],[.50,.72],[.28,.90],[.36,1]]},
 {n:'Tumbler', p:[[.44,0],[.49,.26],[.52,.62],[.54,.92],[.55,1]]},
 {n:'Jar',     p:[[.46,0],[.76,.24],[.80,.54],[.60,.84],[.56,1]]},
 {n:'Dish',    p:[[.26,0],[.70,.13],[.93,.32],[1.0,.46]]}
];
function hex(h){var f=function(i){return Math.pow(parseInt(h.substr(i,2),16)/255,2.2)};
  return new Float32Array([f(1),f(3),f(5)]);}
var GLAZES=[
 {n:'Celadon', a:'#8fc9b2', b:'#2d6a5c', rough:34, speck:14, drip:58, bands:14, pat:3},
 {n:'Tenmoku', a:'#3b221a', b:'#d08b3a', rough:18, speck:30, drip:72, bands:8,  pat:3},
 {n:'Cobalt',  a:'#2d4ea8', b:'#dbe6ff', rough:22, speck:10, drip:30, bands:26, pat:1},
 {n:'Copper',  a:'#7a3f27', b:'#3f9f86', rough:12, speck:46, drip:50, bands:6,  pat:5},
 {n:'Ash',     a:'#9c9a89', b:'#e3dccb', rough:66, speck:52, drip:38, bands:10, pat:2},
 {n:'Shino',   a:'#efe3d2', b:'#c87b49', rough:52, speck:34, drip:44, bands:4,  pat:3},
 {n:'Oxblood', a:'#7c1f23', b:'#e0b45c', rough:16, speck:18, drip:60, bands:6,  pat:3},
 {n:'Basalt',  a:'#232020', b:'#5a5450', rough:86, speck:26, drip:12, bands:20, pat:2}
];
var PATTERNS=['Plain','Rings','Speckle','Drip','Spiral','Crackle'];
var LIGHTS=[
 {n:'Studio', key:[.55,.85,.60], kc:'#fff4e8', fill:[-.70,.25,-.45], fc:'#6f8fb5', sky:'#3c3630', gnd:'#120f0d', ex:1.00},
 {n:'Sunset', key:[.80,.35,.45], kc:'#ffb067', fill:[-.50,.55,-.60], fc:'#4a63a8', sky:'#53352a', gnd:'#140e0c', ex:1.08},
 {n:'Night',  key:[.35,.80,.50], kc:'#9fd2ff', fill:[-.80,.10,-.30], fc:'#2f4f7a', sky:'#1d2733', gnd:'#0a0c10', ex:0.92}
];

/* ------------------------------------------------------------------ state */
var S={
 pts:SHAPES[0].p.map(function(q){return {r:q[0],y:q[1]}}),
 smooth:1,shape:0,
 height:180,width:100,wall:9,facets:96,flutes:0,depth:12,twist:0,wobble:0,
 rough:34,speck:14,drip:58,bands:14,pattern:3,glaze:0,
 spin:1,wire:0,light:0
};
var SLIDERS=[['sHeight','height','oHeight',function(v){return v+'mm'}],
 ['sWidth','width','oWidth',function(v){return v+'%'}],
 ['sWall','wall','oWall',function(v){return (v/2).toFixed(1)+'mm'}],
 ['sFacets','facets','oFacets',function(v){return v+''}],
 ['sFlutes','flutes','oFlutes',function(v){return v+''}],
 ['sDepth','depth','oDepth',function(v){return v+'%'}],
 ['sTwist','twist','oTwist',function(v){return v+'°'}],
 ['sWobble','wobble','oWobble',function(v){return v+'%'}],
 ['sRough','rough','oRough',function(v){return v+'%'}],
 ['sSpeck','speck','oSpeck',function(v){return v+'%'}],
 ['sDrip','drip','oDrip',function(v){return v+'%'}],
 ['sBands','bands','oBands',function(v){return v+''}]];

var dirtyMesh=true,dirtyDraw=true,selected=-1;
function touchMesh(){dirtyMesh=true;dirtyDraw=true;scheduleSave()}
function touchDraw(){dirtyDraw=true}

/* ------------------------------------------------------------------ curve */
function sortedPts(){
  var a=S.pts.slice().sort(function(p,q){return p.y-q.y});
  a[0].y=0; a[a.length-1].y=1; return a;
}
function catmull(p0,p1,p2,p3,t){
  var t2=t*t,t3=t2*t;
  return 0.5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t2+(-p0+3*p1-3*p2+p3)*t3);
}
/* resample the silhouette into N evenly indexed samples {r,y} in 0..1 */
function sampleProfile(N){
  var p=sortedPts(),n=p.length,out=[],i,k,t;
  if(n<2)return [{r:.3,y:0},{r:.3,y:1}];
  if(!S.smooth||n<3){
    for(i=0;i<N;i++){
      var u=i/(N-1)*(n-1),a=Math.min(n-2,Math.floor(u)),f=u-a;
      out.push({r:lerp(p[a].r,p[a+1].r,f),y:lerp(p[a].y,p[a+1].y,f)});
    }
  }else{
    var per=Math.max(2,Math.ceil(N/(n-1)));
    for(k=0;k<n-1;k++){
      var q0=p[Math.max(0,k-1)],q1=p[k],q2=p[k+1],q3=p[Math.min(n-1,k+2)];
      for(i=0;i<per;i++){
        t=i/per;
        out.push({r:catmull(q0.r,q1.r,q2.r,q3.r,t),y:catmull(q0.y,q1.y,q2.y,q3.y,t)});
      }
    }
    out.push({r:p[n-1].r,y:p[n-1].y});
  }
  /* keep it monotonic in y and inside the box so the lathe never folds */
  var prev=-1;
  for(i=0;i<out.length;i++){
    out[i].y=clamp(out[i].y,0,1);
    if(out[i].y<prev)out[i].y=prev;
    prev=out[i].y;
    out[i].r=clamp(out[i].r,0.012,1.05);
  }
  return out;
}

/* ------------------------------------------------------------------ mesh */
var mesh={pos:null,nrm:null,uv:null,idx:null,lines:null,tris:0,verts:0,H:1,R:1};
function buildMesh(){
  var H=S.height/100, Rw=S.width/180;
  var t=clamp(S.wall/400,0.004,0.12);
  var prof=sampleProfile(84),i,j;
  var outer=[];
  for(i=0;i<prof.length;i++){
    var wob=1+(S.wobble/100)*0.18*Math.sin(prof[i].y*Math.PI*9.0+0.7);
    outer.push({r:Math.max(0.006,prof[i].r*Rw*wob),y:prof[i].y*H});
  }
  /* closed cross-section: axis → outside → rim → inside → floor → axis */
  var loop=[{r:0,y:0}];
  for(i=0;i<outer.length;i++)loop.push(outer[i]);
  var floorY=Math.min(t,H*0.45),inner=[];
  for(i=outer.length-1;i>=0;i--){
    var y=outer[i].y,r=outer[i].r-t;
    if(y<=floorY)break;
    if(r<=0.006){inner.push({r:0.0,y:y});break}
    inner.push({r:r,y:y});
  }
  if(!inner.length)inner.push({r:0,y:Math.min(H*0.8,floorY+0.02)});
  for(i=0;i<inner.length;i++)loop.push(inner[i]);

  }
  c.fillStyle='#6d5f56';c.font='10px system-ui,sans-serif';c.textAlign='center';
  c.fillText('axis of revolution',w/2,h-8);
}
function peHit(x,y){
  var p=sortedPts();
  for(var i=0;i<p.length;i++){
    if(Math.hypot(peX(p[i].r)-x,peY(p[i].y)-y)<16)return i;
  }
  return -1;
}
function peLocal(e){
  var b=PE.cv.getBoundingClientRect();
  return {x:e.clientX-b.left,y:e.clientY-b.top};
}
function initProfileEditor(){
  PE.cv=$('profile');PE.ctx=PE.cv.getContext('2d');
  PE.cv.addEventListener('pointerdown',function(e){
    var q=peLocal(e),hit=peHit(q.x,q.y);
    if(hit<0){
      var np={r:peR(q.x),y:peYv(q.y)};
      S.pts=sortedPts();S.pts.push(np);S.pts.sort(function(a,b){return a.y-b.y});
      hit=S.pts.indexOf(np);
    }else{S.pts=sortedPts()}
    selected=hit;PE.drag=hit;S.shape=-1;
    PE.cv.setPointerCapture(e.pointerId);
    touchMesh();drawProfile();syncChips();e.preventDefault();
  });
  PE.cv.addEventListener('pointermove',function(e){
    if(PE.drag<0)return;
    var q=peLocal(e),p=S.pts,obj=p[PE.drag];
    if(!obj)return;
    obj.r=peR(q.x);
    if(PE.drag>0&&PE.drag<p.length-1)obj.y=clamp(peYv(q.y),0,1);
    p.sort(function(a,b){return a.y-b.y});
    PE.drag=selected=p.indexOf(obj);
    touchMesh();drawProfile();
  });
  var up=function(e){if(PE.drag>=0){PE.drag=-1;scheduleSave()}};
  PE.cv.addEventListener('pointerup',up);PE.cv.addEventListener('pointercancel',up);
  PE.cv.addEventListener('dblclick',function(e){
    var q=peLocal(e),hit=peHit(q.x,q.y);
    if(hit>=0)removePoint(hit);
  });
  PE.cv.addEventListener('contextmenu',function(e){e.preventDefault()});
}
function removePoint(i){
  if(S.pts.length<=3){toast('A profile needs at least three points');return}
  S.pts=sortedPts();S.pts.splice(i,1);selected=-1;S.shape=-1;
  touchMesh();drawProfile();syncChips();toast('Point removed');
}

/* ------------------------------------------------------------------ camera input */
function initCamera(){
  var cv=$('gl'),pts={},lastD=0,last=null;
  cv.addEventListener('pointerdown',function(e){
    pts[e.pointerId]={x:e.clientX,y:e.clientY};last={x:e.clientX,y:e.clientY};
    cv.setPointerCapture(e.pointerId);cv.classList.add('drag');
  });
  cv.addEventListener('pointermove',function(e){
    if(!pts[e.pointerId])return;
    pts[e.pointerId]={x:e.clientX,y:e.clientY};
    var ids=Object.keys(pts);
    if(ids.length>=2){
      var a=pts[ids[0]],b=pts[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(lastD)R.cam.dist=clamp(R.cam.dist*(lastD/d),1.1,9);
      lastD=d;touchDraw();return;
    }
    if(!last)return;
    R.cam.yaw-=(e.clientX-last.x)*0.0075;
    R.cam.pitch=clamp(R.cam.pitch+(e.clientY-last.y)*0.0062,-1.25,1.35);
    last={x:e.clientX,y:e.clientY};touchDraw();
  });
  var end=function(e){delete pts[e.pointerId];last=null;
    if(Object.keys(pts).length<2)lastD=0;cv.classList.remove('drag')};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  cv.addEventListener('wheel',function(e){
    e.preventDefault();R.cam.dist=clamp(R.cam.dist*(1+Math.sign(e.deltaY)*0.09),1.1,9);touchDraw();
  },{passive:false});
}

/* ------------------------------------------------------------------ controls */
function buildChips(){
  var sc=$('shapeChips'),i;
  sc.innerHTML='';
  for(i=0;i<SHAPES.length;i++){
    (function(k){
      var b=document.createElement('button');
      b.className='chip';b.textContent=SHAPES[k].n;b.dataset.shape=k;
      b.addEventListener('click',function(){
        S.pts=SHAPES[k].p.map(function(q){return {r:q[0],y:q[1]}});
        S.shape=k;selected=-1;touchMesh();drawProfile();syncChips();
      });
      sc.appendChild(b);
    })(i);
  }
  var pc=$('patterns');pc.innerHTML='';
  for(i=0;i<PATTERNS.length;i++){
    (function(k){
      var b=document.createElement('button');
      b.className='chip';b.textContent=PATTERNS[k];b.dataset.pat=k;
      b.addEventListener('click',function(){S.pattern=k;syncChips();touchDraw();scheduleSave()});
      pc.appendChild(b);
    })(i);
  }
  var gz=$('glazes');gz.innerHTML='';
  for(i=0;i<GLAZES.length;i++){
    (function(k){
      var G=GLAZES[k],b=document.createElement('button');
      b.className='glaze';b.title=G.n;b.dataset.glaze=k;
      b.style.background='linear-gradient(150deg,'+G.a+' 10%,'+G.b+' 92%)';
      b.innerHTML='<i></i><em>'+G.n+'</em>';
      b.addEventListener('click',function(){
        S.glaze=k;S.rough=G.rough;S.speck=G.speck;S.drip=G.drip;S.bands=G.bands;S.pattern=G.pat;
        syncSliders();syncChips();drawProfile();touchDraw();scheduleSave();toast(G.n+' glaze');
      });
      gz.appendChild(b);
    })(i);
  }
}
function syncChips(){
  var i,n=$('shapeChips').children;
  for(i=0;i<n.length;i++)n[i].classList.toggle('on',+n[i].dataset.shape===S.shape);
  n=$('patterns').children;
  for(i=0;i<n.length;i++)n[i].classList.toggle('on',+n[i].dataset.pat===S.pattern);
  n=$('glazes').children;
  for(i=0;i<n.length;i++)n[i].classList.toggle('on',+n[i].dataset.glaze===S.glaze);
  $('bSmooth').classList.toggle('on',!!S.smooth);
  $('bSpin').classList.toggle('on',!!S.spin);
  $('bWire').classList.toggle('on',!!S.wire);
}
function syncSliders(){
  for(var i=0;i<SLIDERS.length;i++){
    var s=SLIDERS[i],el=$(s[0]);
    el.value=S[s[1]];$(s[2]).textContent=s[3](+el.value);
  }
}
function initControls(){
  for(var i=0;i<SLIDERS.length;i++){
    (function(s){
      var el=$(s[0]);
      el.addEventListener('input',function(){
        S[s[1]]=+el.value;$(s[2]).textContent=s[3](+el.value);
        if(['height','width','wall','facets','flutes','depth','twist','wobble'].indexOf(s[1])>=0){
          touchMesh();drawProfile();
        }else{touchDraw();scheduleSave()}
      });
    })(SLIDERS[i]);
  }
  $('bSmooth').addEventListener('click',function(){S.smooth=S.smooth?0:1;syncChips();touchMesh();drawProfile()});
  $('bDel').addEventListener('click',function(){
    if(selected<0){toast('Tap a point first');return}
    removePoint(selected);
  });
  $('bSpin').addEventListener('click',function(){S.spin=S.spin?0:1;syncChips();touchDraw()});
  $('bWire').addEventListener('click',function(){S.wire=S.wire?0:1;syncChips();touchDraw()});
  $('bLight').addEventListener('click',function(){
    S.light=(S.light+1)%LIGHTS.length;toast(LIGHTS[S.light].n+' light');touchDraw();scheduleSave();
  });
  $('bReset').addEventListener('click',function(){
    R.cam.yaw=0.7;R.cam.pitch=0.28;R.cam.dist=3.4;touchDraw();
  });
  var tabs=$('tabs').querySelectorAll('button');
  for(i=0;i<tabs.length;i++){
    (function(b){
      b.addEventListener('click',function(){
        var id=b.dataset.pane,pane=$(id),on=pane.classList.contains('show');
        if(window.innerWidth>=860)return;
        var panes=['profilePane','viewPane','ctrlPane'],k;
        for(k=0;k<panes.length;k++)$(panes[k]).classList.remove('show');
        for(k=0;k<tabs.length;k++)tabs[k].classList.remove('on');
        pane.classList.add('show');b.classList.add('on');
        if(id==='profilePane')requestAnimationFrame(drawProfile);
        if(id==='viewPane')touchDraw();
      });
    })(tabs[i]);
  }
  $('bShelf').addEventListener('click',function(){$('shelf').classList.toggle('open');renderShelf()});
  $('bShelfClose').addEventListener('click',function(){$('shelf').classList.remove('open')});
  $('bSave').addEventListener('click',savePiece);
  $('bShare').addEventListener('click',share);
  $('bSnap').addEventListener('click',exportPNG);
  $('bObj').addEventListener('click',exportOBJ);
  $('bStl').addEventListener('click',exportSTL);
  window.addEventListener('keydown',function(e){
    if(e.target.tagName==='INPUT')return;
    var k=e.key.toLowerCase();
    if(k===' '){e.preventDefault();S.spin=S.spin?0:1;syncChips();touchDraw()}
    else if(k==='w'){S.wire=S.wire?0:1;syncChips();touchDraw()}
    else if(k==='l'){S.light=(S.light+1)%LIGHTS.length;touchDraw()}
    else if(k==='g'){S.glaze=(S.glaze+1)%GLAZES.length;$('glazes').children[S.glaze].click()}
    else if(k==='s'){savePiece()}
    else if(k==='delete'||k==='backspace'){if(selected>=0)removePoint(selected)}
  });
  window.addEventListener('resize',function(){dirtyDraw=true;drawProfile()});
}

/* ------------------------------------------------------------------ export */
function stamp(){
  var G=GLAZES[S.glaze].n.toLowerCase();
  return 'kiln-'+G+'-'+Math.round(S.height)+'mm';
}
function dl(blob,name){
  var u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove()},900);
}
function snapshotCanvas(size){
  var src=R.cv;if(!src)return null;
  var out=document.createElement('canvas');
  var w=size||src.width,h=size?size:src.height;
  if(size){var ar=src.width/Math.max(src.height,1);w=size;h=Math.round(size/Math.max(ar,.0001))}
  out.width=w;out.height=h;
  var c=out.getContext('2d');
  var g=c.createLinearGradient(0,0,w,h);
  g.addColorStop(0,'#1b1512');g.addColorStop(.55,'#120f0e');g.addColorStop(1,'#0b1310');
  c.fillStyle=g;c.fillRect(0,0,w,h);
  draw();
  c.drawImage(src,0,0,w,h);
  return out;
}
function exportPNG(){
  if(!gpu.ok){toast('No WebGL — nothing to photograph');return}
  var out=snapshotCanvas(0);
  out.toBlob(function(b){
    if(!b||!b.size){toast('Snapshot failed');return}
    dl(b,stamp()+'.png');toast('PNG saved · '+Math.round(b.size/1024)+' KB');
  },'image/png');
}
function exportOBJ(){
  if(!mesh.pos){toast('Nothing on the wheel');return}
  var P=mesh.pos,N=mesh.nrm,I=mesh.idx,i,n=P.length/3;
  var out=['# Kiln — lathe & glaze studio','# '+new Date().toISOString(),'o '+stamp()];
  for(i=0;i<n;i++)out.push('v '+(P[i*3]*100).toFixed(3)+' '+(P[i*3+1]*100).toFixed(3)+' '+(P[i*3+2]*100).toFixed(3));
  for(i=0;i<n;i++)out.push('vn '+N[i*3].toFixed(4)+' '+N[i*3+1].toFixed(4)+' '+N[i*3+2].toFixed(4));
  for(i=0;i<I.length;i+=3){
    var a=I[i]+1,b=I[i+1]+1,c=I[i+2]+1;
    out.push('f '+a+'//'+a+' '+b+'//'+b+' '+c+'//'+c);
  }
  var blob=new Blob([out.join('\n')+'\n'],{type:'model/obj'});
  dl(blob,stamp()+'.obj');toast('OBJ saved · '+mesh.tris.toLocaleString()+' triangles');
}
function exportSTL(){
  if(!mesh.pos){toast('Nothing on the wheel');return}
  var P=mesh.pos,I=mesh.idx,tri=I.length/3;
  var buf=new ArrayBuffer(84+tri*50),dv=new DataView(buf),i,o=84;
  var head='Kiln lathe export — '+stamp();
  for(i=0;i<80;i++)dv.setUint8(i,i<head.length?head.charCodeAt(i)&0x7f:32);
  dv.setUint32(80,tri,true);
  for(i=0;i<tri;i++){
    var a=I[i*3]*3,b=I[i*3+1]*3,c=I[i*3+2]*3;
    var ax=P[a],ay=P[a+1],az=P[a+2],bx=P[b],by=P[b+1],bz=P[b+2],cx=P[c],cy=P[c+1],cz=P[c+2];
    var ux=bx-ax,uy=by-ay,uz=bz-az,vx=cx-ax,vy=cy-ay,vz=cz-az;
    var nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx,L=Math.hypot(nx,ny,nz)||1;
    dv.setFloat32(o,nx/L,true);dv.setFloat32(o+4,ny/L,true);dv.setFloat32(o+8,nz/L,true);
    dv.setFloat32(o+12,ax*100,true);dv.setFloat32(o+16,ay*100,true);dv.setFloat32(o+20,az*100,true);
    dv.setFloat32(o+24,bx*100,true);dv.setFloat32(o+28,by*100,true);dv.setFloat32(o+32,bz*100,true);
    dv.setFloat32(o+36,cx*100,true);dv.setFloat32(o+40,cy*100,true);dv.setFloat32(o+44,cz*100,true);
    dv.setUint16(o+48,0,true);o+=50;
  }
  dl(new Blob([buf],{type:'model/stl'}),stamp()+'.stl');
  toast('STL saved · '+Math.round(buf.byteLength/1024)+' KB, printable');
}

/* ------------------------------------------------------------------ state io */
function encode(){
  var o={p:sortedPts().map(function(q){return [+q.r.toFixed(3),+q.y.toFixed(3)]}),
    s:S.smooth,sh:S.shape,h:S.height,w:S.width,wa:S.wall,f:S.facets,fl:S.flutes,d:S.depth,
    t:S.twist,wo:S.wobble,ro:S.rough,sp:S.speck,dr:S.drip,ba:S.bands,pa:S.pattern,g:S.glaze,li:S.light};
  return btoa(JSON.stringify(o)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decode(str){
  try{
    var b=str.replace(/-/g,'+').replace(/_/g,'/');
    while(b.length%4)b+='=';
    var o=JSON.parse(atob(b));
    if(!o||!o.p||!o.p.length)return false;
    S.pts=o.p.map(function(q){return {r:clamp(+q[0],0.02,1.05),y:clamp(+q[1],0,1)}});
    var map={s:'smooth',sh:'shape',h:'height',w:'width',wa:'wall',f:'facets',fl:'flutes',d:'depth',
      t:'twist',wo:'wobble',ro:'rough',sp:'speck',dr:'drip',ba:'bands',pa:'pattern',g:'glaze',li:'light'};
    for(var k in map)if(o[k]!==undefined&&isFinite(o[k]))S[map[k]]=+o[k];
    S.glaze=clamp(S.glaze|0,0,GLAZES.length-1);
    S.pattern=clamp(S.pattern|0,0,PATTERNS.length-1);
    S.light=clamp(S.light|0,0,LIGHTS.length-1);
    return true;
  }catch(err){return false}
}
var saveT=0;
function scheduleSave(){
  clearTimeout(saveT);
  saveT=setTimeout(function(){
    try{localStorage.setItem('kiln.last.v1',encode())}catch(e){}
  },420);
}
function share(){
  var h='#'+encode();
  try{history.replaceState(null,'',location.pathname+location.search+h)}catch(e){location.hash=h}
  var url=location.href;
  var done=function(){toast('Share link copied')};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done,function(){toast('Link is in the address bar')});
  }else{
    var ta=document.createElement('textarea');ta.value=url;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');done()}catch(e){toast('Link is in the address bar')}
    ta.remove();
  }
}
function shelfRead(){
  try{return JSON.parse(localStorage.getItem('kiln.shelf.v1')||'[]')}catch(e){return []}
}
function shelfWrite(a){
  try{localStorage.setItem('kiln.shelf.v1',JSON.stringify(a.slice(0,40)))}catch(e){toast('Storage is full')}
}
function savePiece(){
  var thumb='';
  var t=snapshotCanvas(150);
  if(t){try{thumb=t.toDataURL('image/jpeg',0.72)}catch(e){thumb=''}}
  var a=shelfRead();
  a.unshift({id:Date.now(),name:GLAZES[S.glaze].n+' '+(S.shape>=0?SHAPES[S.shape].n:'piece'),
    hash:encode(),thumb:thumb});
  shelfWrite(a);renderShelf();$('shelf').classList.add('open');
  toast('Added to the shelf');
}
function renderShelf(){
  var g=$('shelfGrid'),a=shelfRead(),i;
  g.innerHTML='';
  if(!a.length){g.innerHTML='<p class="empty">Nothing fired yet. Throw a shape and press ＋ Shelf.</p>';return}
  for(i=0;i<a.length;i++){
    (function(p){
      var d=document.createElement('div');d.className='piece';
      d.innerHTML=(p.thumb?'<img alt="" src="'+p.thumb+'">':'<div style="aspect-ratio:1;background:#17120f"></div>')+
        '<span></span><button title="Remove">✕</button>';
      d.querySelector('span').textContent=p.name;
      d.addEventListener('click',function(){
        if(decode(p.hash)){syncSliders();syncChips();touchMesh();drawProfile();
          $('shelf').classList.remove('open');toast('Loaded “'+p.name+'”')}
      });
      d.querySelector('button').addEventListener('click',function(e){
        e.stopPropagation();
        var arr=shelfRead().filter(function(x){return x.id!==p.id});
        shelfWrite(arr);renderShelf();
      });
      g.appendChild(d);
    })(a[i]);
  }
}

/* ------------------------------------------------------------------ loop + init */
var rafId=0,frames=0,fpsT=0;
function frame(ts){
  if(dirtyMesh){buildMesh();uploadMesh();dirtyMesh=false;dirtyDraw=true}
  if(S.spin&&gpu.ok){R.cam.yaw+=0.0042;dirtyDraw=true}
  if(dirtyDraw&&gpu.ok){draw();dirtyDraw=false}
  frames++;
  if(!fpsT)fpsT=ts;
  if(ts-fpsT>600){
    $('hFps').innerHTML='<b>'+Math.round(frames*1000/(ts-fpsT))+'</b> fps';
    frames=0;fpsT=ts;
  }
  rafId=requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){if(rafId){cancelAnimationFrame(rafId);rafId=0}}
  else if(!rafId){fpsT=0;frames=0;rafId=requestAnimationFrame(frame)}
});
function init(){
  buildChips();initProfileEditor();initControls();
  var ok=initGL();
  if(ok)initCamera();
  var h=(location.hash||'').slice(1),loaded=false;
  if(h)loaded=decode(h);
  if(!loaded){
    var last=null;try{last=localStorage.getItem('kiln.last.v1')}catch(e){}
    if(last)loaded=decode(last);
  }
  syncSliders();syncChips();
  buildMesh();if(ok)uploadMesh();
  dirtyMesh=false;dirtyDraw=true;
  drawProfile();renderShelf();
  if(window.innerWidth<860){
    $('profilePane').classList.remove('show');
    var tb=$('tabs').querySelectorAll('button');
    for(var i=0;i<tb.length;i++)tb[i].classList.toggle('on',tb[i].dataset.pane==='viewPane');
  }
  rafId=requestAnimationFrame(frame);
  setTimeout(function(){
    if(!loaded)toast('Drag the profile dots — the wheel follows');
  },900);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
