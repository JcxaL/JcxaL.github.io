<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Spectra — Radar Chart Studio</title>
<style>
  :root{
    --bg:#080a14; --panel:#0f1220ee; --panel-border:#ffffff14;
    --text:#eef1fb; --dim:#8b90ac; --accent:#7c93ff;
    --grid:#ffffff22; --ring-strong:#ffffff3a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(120% 100% at 50% -10%, #131736 0%, var(--bg) 55%, #05060d 100%);
    color:var(--text); overflow:hidden; height:100dvh; display:flex; flex-direction:column;
  }
  header{
    display:flex; align-items:center; gap:14px; padding:12px 16px;
    border-bottom:1px solid var(--panel-border); flex:0 0 auto; flex-wrap:wrap;
  }
  header h1{font-size:16px; margin:0; font-weight:700; letter-spacing:.2px; display:flex; align-items:center; gap:8px;}
  header h1 .dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#7c93ff,#f472b6); box-shadow:0 0 12px #7c93ffaa;}
  header .sub{font-size:11.5px; color:var(--dim); margin-left:2px;}
  header .spacer{flex:1;}
  select, .btn, input[type=text]{
    background:#151933; border:1px solid var(--panel-border); color:var(--text);
    border-radius:9px; padding:7px 11px; font-size:12.5px; font-family:inherit; cursor:pointer;
  }
  select:focus, .btn:focus, input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .btn{display:inline-flex; align-items:center; gap:6px; user-select:none; transition:transform .12s, background .12s;}
  .btn:hover{background:#1c2144;}
  .btn:active{transform:scale(.96);}
  .btn.primary{background:linear-gradient(135deg,#7c93ff,#5865e0); border-color:transparent; color:#fff; font-weight:600;}
  .btn.primary:hover{filter:brightness(1.1);}
  main{flex:1; display:grid; grid-template-columns:1fr 300px; min-height:0;}
  #stage{position:relative; min-width:0; min-height:0;}
  #chart{width:100%; height:100%; display:block; touch-action:none;}
  #tooltip{
    position:absolute; pointer-events:none; background:#0b0e1fee; border:1px solid var(--panel-border);
    padding:5px 9px; border-radius:8px; font-size:12px; font-weight:600; opacity:0; transform:translate(-50%,-130%);
    transition:opacity .1s; white-space:nowrap; z-index:5;
  }
  #legend{position:absolute; left:12px; bottom:12px; display:flex; flex-direction:column; gap:5px; font-size:11.5px; pointer-events:none;}
  #legend .row{display:flex; align-items:center; gap:6px; background:#0b0e1fcc; padding:3px 8px; border-radius:7px; border:1px solid var(--panel-border);}
  #legend .sw{width:9px;height:9px;border-radius:3px;}
  aside{
    border-left:1px solid var(--panel-border); overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:16px;
    background:#0a0c18a0;
  }
  .section h2{font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--dim); margin:0 0 8px;}
  .chiprow{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{
    display:flex; align-items:center; gap:6px; background:#151933; border:1.5px solid var(--panel-border);
    padding:5px 9px 5px 7px; border-radius:20px; font-size:12px; cursor:pointer; user-select:none; transition:.12s;
    max-width:100%;
  }
  .chip .sw{width:11px;height:11px;border-radius:50%; flex:0 0 auto;}
  .chip.active{border-color:var(--accent); background:#1a1f44; box-shadow:0 0 0 1px var(--accent) inset;}
  .chip .name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:110px;}
  .chip .x{opacity:.5; font-size:13px; padding:0 1px;}
  .chip .x:hover{opacity:1; color:#f87171;}
  .chip.add{border-style:dashed; color:var(--dim);}
  .chip.add:hover{color:var(--text); border-color:var(--accent);}
  .field{display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12px; color:var(--dim); margin-bottom:8px;}
  .field .val{color:var(--text); font-weight:600; font-variant-numeric:tabular-nums;}
  input[type=range]{width:100%; accent-color:#7c93ff;}
  .toggles{display:flex; gap:6px;}
  .toggles .btn{flex:1; justify-content:center; padding:6px 4px; font-size:11.5px;}
  .toggles .btn.on{background:#1a1f44; border-color:var(--accent); color:#c7d0ff;}
  .swatches{display:flex; gap:6px; flex-wrap:wrap;}
  .swatch{width:22px;height:22px;border-radius:7px; cursor:pointer; border:2px solid transparent;}
  .swatch.on{border-color:#fff;}
  .actions{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .actions .btn{justify-content:center; width:100%;}
  #fileInput{display:none;}
  #toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
    background:#151933; border:1px solid var(--panel-border); padding:9px 16px; border-radius:10px;
    font-size:12.5px; font-weight:600; transition:.25s; pointer-events:none; z-index:50; box-shadow:0 10px 30px #000a;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .hint{font-size:11px; color:var(--dim); line-height:1.5;}
  @media (max-width:820px){
    main{grid-template-columns:1fr; grid-template-rows:1fr auto;}
    aside{border-left:none; border-top:1px solid var(--panel-border); max-height:44dvh; flex-direction:row; flex-wrap:wrap; gap:14px;}
    aside .section{flex:1 1 240px; min-width:200px;}
    header h1 .sub{display:none;}
  }
  @media (max-width:520px){
    header{padding:9px 10px; gap:8px;}
    #legend{display:none;}
  }
</style>
</head>
<body>
<header>
  <h1><span class="dot"></span>Spectra <span class="sub">— Radar Chart Studio</span></h1>
  <select id="presetSelect" aria-label="Preset">
    <option value="rpg">RPG Party Stats</option>
    <option value="product">Product Comparison</option>
    <option value="skills">Skill Radar</option>
    <option value="sports">Player Ratings</option>
    <option value="blank">Blank Canvas</option>
  </select>
  <div class="spacer"></div>
  <button class="btn" id="shareBtn" title="Copy shareable link">🔗 Share</button>
  <button class="btn primary" id="pngBtn" title="Export as PNG">⬇ PNG</button>
</header>
<main>
  <div id="stage">
    <canvas id="chart"></canvas>
    <div id="tooltip"></div>
    <div id="legend"></div>
  </div>
  <aside>
    <div class="section">
      <h2>Entities</h2>
      <div class="chiprow" id="entityChips"></div>
      <p class="hint">Tap a chip to select it, then drag its dots on the chart. Click × to remove.</p>
    </div>
    <div class="section">
      <h2>Axes</h2>
      <div class="chiprow" id="axisChips"></div>
    </div>
    <div class="section">
      <h2>Entity Color</h2>
      <div class="swatches" id="colorSwatches"></div>
    </div>
    <div class="section">
      <h2>Style</h2>
      <div class="toggles" style="margin-bottom:8px;">
        <button class="btn" id="fillToggle">Filled</button>
        <button class="btn" id="gridToggle">Web Grid</button>
      </div>
      <div class="field"><span>Grid rings</span><span class="val" id="ringsVal">5</span></div>
      <input type="range" id="ringsRange" min="2" max="8" value="5">
    </div>
    <div class="section">
      <h2>Theme</h2>
      <div class="swatches" id="themeSwatches"></div>
    </div>
    <div class="section">
      <h2>Data</h2>
      <div class="actions">
        <button class="btn" id="exportJsonBtn">⬇ JSON</button>
        <button class="btn" id="importJsonBtn">⬆ Import</button>
        <button class="btn" id="resetBtn" style="grid-column:1/3;">↺ Reset chart</button>
      </div>
      <input type="file" id="fileInput" accept="application/json">
    </div>
  </aside>
</main>
<div id="toast"></div>

<script>
(function(){
"use strict";

var THEMES = {
  nebula:  {label:"Nebula",  bg:["#161a3a","#080a14"], grid:"#ffffff22", ring:"#ffffff3a", label:"#aab0d6", cycle:["#7c93ff","#f472b6","#34d399","#fbbf24","#22d3ee","#c084fc"]},
  ocean:   {label:"Ocean",   bg:["#0c2a36","#061319"], grid:"#5ee7ff22", ring:"#5ee7ff3a", label:"#8fd8e8", cycle:["#22d3ee","#34d399","#fbbf24","#f472b6","#7c93ff","#a3e635"]},
  sunset:  {label:"Sunset",  bg:["#3a1a2a","#160a10"], grid:"#ff9a6222", ring:"#ff9a623a", label:"#e8b6b0", cycle:["#fb923c","#f472b6","#fbbf24","#a78bfa","#34d399","#f87171"]},
  mono:    {label:"Mono",    bg:["#20222c","#0c0d12"], grid:"#ffffff20", ring:"#ffffff38", label:"#c4c7d6", cycle:["#e8e8f0","#9aa0c4","#7c93ff","#5865e0","#4a4f7a","#c084fc"]}
};

var PRESETS = {
  rpg: {
    axes:["Strength","Agility","Intellect","Vitality","Wisdom","Charisma"],
    entities:[
      {name:"Warrior", values:[92,58,30,80,45,50]},
      {name:"Mage",    values:[25,45,95,40,80,55]},
      {name:"Rogue",   values:[55,95,50,45,40,70]}
    ]
  },
  product: {
    axes:["Price","Quality","Features","Support","Ease of Use"],
    entities:[
      {name:"Product A", values:[70,85,60,50,90]},
      {name:"Product B", values:[45,60,90,80,55]}
    ]
  },
  skills: {
    axes:["Frontend","Backend","DevOps","Design","Testing","Communication"],
    entities:[
      {name:"You",      values:[85,60,45,70,55,75]},
      {name:"Team Avg", values:[65,70,60,50,65,68]}
    ]
  },
  sports: {
    axes:["Pace","Shooting","Passing","Dribbling","Defending","Physical"],
    entities:[
      {name:"Player 1", values:[88,82,75,90,35,60]},
      {name:"Player 2", values:[55,60,85,70,88,78]}
    ]
  },
  blank: {
    axes:["Axis 1","Axis 2","Axis 3","Axis 4","Axis 5"],
    entities:[{name:"Entity 1", values:[50,50,50,50,50]}]
  }
};

var STORAGE_KEY = "spectra_radar_v1";
var MAX_V = 100;

var state = null;
var activeEntityId = null;
var themeKey = "nebula";
var style = { filled:true, web:true, rings:5 };
var uidSeed = 1;

var canvas = document.getElementById("chart");
var ctx = canvas.getContext("2d");
var stage = document.getElementById("stage");
var tooltip = document.getElementById("tooltip");
var legendEl = document.getElementById("legend");

var geo = { cx:0, cy:0, R:0, dpr:1 };
var dragging = null;

function uid(){ return "e" + (uidSeed++) + "_" + Math.floor(performance.now()); }

function clonePreset(key){
  var p = PRESETS[key];
  return {
    preset:key,
    axes: p.axes.slice(),
    entities: p.entities.map(function(e){
      return { id: uid(), name:e.name, color:null, values:e.values.slice() };
    })
  };
}

function assignColors(){
  var theme = THEMES[themeKey];
  state.entities.forEach(function(e,i){
    if(!e.color) e.color = theme.cycle[i % theme.cycle.length];
  });
}

function loadState(){
  var fromHash = tryLoadFromHash();
  if(fromHash){ state = fromHash; assignColors(); return; }
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      var parsed = JSON.parse(raw);
      if(parsed && parsed.axes && parsed.entities){
        state = parsed;
        if(parsed.theme) themeKey = parsed.theme;
        if(parsed.style) style = parsed.style;
        assignColors();
        return;
      }
    }
  }catch(err){}
  state = clonePreset("rpg");
  assignColors();
}

function tryLoadFromHash(){
  if(!location.hash || location.hash.length < 2) return null;
  try{
    var json = decodeURIComponent(escape(atob(location.hash.slice(1))));
    var parsed = JSON.parse(json);
    if(parsed && parsed.axes && parsed.entities){
      parsed.entities.forEach(function(e){ if(!e.id) e.id = uid(); });
      if(parsed.theme) themeKey = parsed.theme;
      if(parsed.style) style = parsed.style;
      return parsed;
    }
  }catch(err){}
  return null;
}

function saveToStorage(){
  try{
    var payload = JSON.parse(JSON.stringify(state));
    payload.theme = themeKey;
    payload.style = style;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  }catch(err){}
}

function ensureActiveEntity(){
  if(!state.entities.length){
    activeEntityId = null;
    return;
  }
  if(!activeEntityId || !state.entities.some(function(e){return e.id===activeEntityId;})){
    activeEntityId = state.entities[0].id;
  }
}

function getEntity(id){
  for(var i=0;i<state.entities.length;i++) if(state.entities[i].id===id) return state.entities[i];
  return null;
}

/* ---------- geometry ---------- */

function resizeCanvas(){
  var rect = stage.getBoundingClientRect();
  var dpr = Math.max(1, window.devicePixelRatio || 1);
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  canvas.style.width = rect.width + "px";
  canvas.style.height = rect.height + "px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  geo.dpr = dpr;
  geo.cx = rect.width/2;
  geo.cy = rect.height/2 + 6;
  var pad = rect.width < 560 ? 64 : 96;
  geo.R = Math.max(40, Math.min(rect.width, rect.height)/2 - pad);
  draw();
}

function axisAngle(i, n){
  return -Math.PI/2 + i * (2*Math.PI/n);
}

function axisPoint(i, n, radius){
  var a = axisAngle(i,n);
  return { x: geo.cx + Math.cos(a)*radius, y: geo.cy + Math.sin(a)*radius };
}

function valueToPoint(i, n, value){
  var r = Math.max(0, Math.min(1, value/MAX_V)) * geo.R;
  return axisPoint(i, n, r);
}

function pointToValue(i, n, x, y){
  var a = axisAngle(i, n);
  var dx = x - geo.cx, dy = y - geo.cy;
  var dirx = Math.cos(a), diry = Math.sin(a);
  var proj = dx*dirx + dy*diry;
  var v = (proj / geo.R) * MAX_V;
  return Math.max(0, Math.min(MAX_V, Math.round(v)));
}

/* ---------- drawing ---------- */

function draw(){
  var theme = THEMES[themeKey];
  var w = canvas.width/geo.dpr, h = canvas.height/geo.dpr;
  ctx.clearRect(0,0,w,h);

  var grad = ctx.createRadialGradient(geo.cx, geo.cy, 0, geo.cx, geo.cy, geo.R*1.4);
  grad.addColorStop(0, theme.bg[0]);
  grad.addColorStop(1, theme.bg[1]);
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,w,h);

  var n = state.axes.length;
  if(n < 3){ legendEl.innerHTML=""; return; }

  var rings = style.rings;
  ctx.lineWidth = 1;
  for(var r=1;r<=rings;r++){
    var frac = r/rings;
    ctx.strokeStyle = r===rings ? theme.ring : theme.grid;
    ctx.beginPath();
    if(style.web){
      for(var i=0;i<n;i++){
        var p = axisPoint(i, n, geo.R*frac);
        if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
      }
      ctx.closePath();
    } else {
      ctx.arc(geo.cx, geo.cy, geo.R*frac, 0, Math.PI*2);
    }
    ctx.stroke();
  }

  ctx.strokeStyle = theme.grid;
  ctx.fillStyle = theme.label;
  ctx.font = "600 12px system-ui,sans-serif";
  for(var i2=0;i2<n;i2++){
    var end = axisPoint(i2, n, geo.R);
    ctx.beginPath();
    ctx.moveTo(geo.cx, geo.cy);
    ctx.lineTo(end.x, end.y);
    ctx.stroke();

    var lp = axisPoint(i2, n, geo.R + 18);
    ctx.textAlign = Math.abs(Math.cos(axisAngle(i2,n))) < 0.2 ? "center" : (Math.cos(axisAngle(i2,n))>0?"left":"right");
    ctx.textBaseline = Math.sin(axisAngle(i2,n)) < -0.5 ? "bottom" : (Math.sin(axisAngle(i2,n)) > 0.5 ? "top" : "middle");
    ctx.fillText(state.axes[i2], lp.x, lp.y);
  }

  state.entities.forEach(function(entity){
    var isActive = entity.id === activeEntityId;
    var pts = entity.values.map(function(v,i){ return valueToPoint(i, n, v); });
    ctx.beginPath();
    pts.forEach(function(p,i){ if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
    ctx.closePath();
    if(style.filled){
      ctx.fillStyle = entity.color + (isActive ? "55" : "22");
      ctx.fill();
    }
    ctx.strokeStyle = entity.color;
    ctx.lineWidth = isActive ? 2.5 : 1.5;
    ctx.globalAlpha = isActive ? 1 : 0.55;
    ctx.stroke();
    ctx.globalAlpha = 1;

    if(isActive){
      pts.forEach(function(p){
        ctx.beginPath();
        ctx.arc(p.x, p.y, 5.5, 0, Math.PI*2);
        ctx.fillStyle = "#0b0e1f";
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = entity.color;
        ctx.stroke();
      });
    }
  });

  renderLegend();
}

function renderLegend(){
  legendEl.innerHTML = "";
  state.entities.forEach(function(e){
    var row = document.createElement("div");
    row.className = "row";
    row.innerHTML = '<span class="sw" style="background:'+e.color+'"></span><span>'+escapeHtml(e.name)+'</span>';
    legendEl.appendChild(row);
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

/* ---------- pointer interaction ---------- */

function canvasPos(evt){
  var rect = canvas.getBoundingClientRect();
  return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
}

function findVertexNear(x, y){
  var entity = getEntity(activeEntityId);
  if(!entity) return -1;
  var n = state.axes.length;
  var threshold = 22;
  var best = -1, bestDist = threshold;
  entity.values.forEach(function(v,i){
    var p = valueToPoint(i, n, v);
    var d = Math.hypot(p.x-x, p.y-y);
    if(d < bestDist){ bestDist = d; best = i; }
  });
  return best;
}

canvas.addEventListener("pointerdown", function(evt){
  var pos = canvasPos(evt);
  var idx = findVertexNear(pos.x, pos.y);
  if(idx >= 0){
    dragging = idx;
    canvas.setPointerCapture(evt.pointerId);
    updateDrag(pos);
    evt.preventDefault();
  }
});

canvas.addEventListener("pointermove", function(evt){
  if(dragging === null) return;
  updateDrag(canvasPos(evt));
});

function endDrag(){
  if(dragging === null) return;
  dragging = null;
  tooltip.style.opacity = 0;
  saveToStorage();
}
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);
canvas.addEventListener("pointerleave", function(){ if(dragging===null) tooltip.style.opacity=0; });

function updateDrag(pos){
  var entity = getEntity(activeEntityId);
  if(!entity) return;
  var n = state.axes.length;
  var v = pointToValue(dragging, n, pos.x, pos.y);
  entity.values[dragging] = v;
  draw();
  tooltip.style.left = pos.x + "px";
  tooltip.style.top = pos.y + "px";
  tooltip.style.opacity = 1;
  tooltip.textContent = state.axes[dragging] + ": " + v;
}

/* ---------- UI wiring ---------- */

var entityChipsEl = document.getElementById("entityChips");
var axisChipsEl = document.getElementById("axisChips");
var colorSwatchesEl = document.getElementById("colorSwatches");
var themeSwatchesEl = document.getElementById("themeSwatches");

function renderEntityChips(){
  entityChipsEl.innerHTML = "";
  state.entities.forEach(function(e){
    var chip = document.createElement("div");
    chip.className = "chip" + (e.id===activeEntityId ? " active" : "");
    chip.innerHTML = '<span class="sw" style="background:'+e.color+'"></span><span class="name">'+escapeHtml(e.name)+'</span><span class="x" data-id="'+e.id+'">✕</span>';
    chip.addEventListener("click", function(evt){
      if(evt.target.classList.contains("x")){
        removeEntity(e.id);
        return;
      }
      activeEntityId = e.id;
      renderEntityChips();
      renderColorSwatches();
      draw();
    });
    chip.querySelector(".name").addEventListener("dblclick", function(evt){
      evt.stopPropagation();
      var name = prompt("Rename entity", e.name);
      if(name && name.trim()){ e.name = name.trim().slice(0,30); renderEntityChips(); draw(); saveToStorage(); }
    });
    entityChipsEl.appendChild(chip);
  });
  var addChip = document.createElement("div");
  addChip.className = "chip add";
  addChip.textContent = "+ Add entity";
  addChip.addEventListener("click", addEntity);
  entityChipsEl.appendChild(addChip);
}

function renderAxisChips(){
  axisChipsEl.innerHTML = "";
  state.axes.forEach(function(name, i){
    var chip = document.createElement("div");
    chip.className = "chip";
    chip.innerHTML = '<span class="name">'+escapeHtml(name)+'</span><span class="x" data-i="'+i+'">✕</span>';
    chip.querySelector(".x").addEventListener("click", function(evt){
      evt.stopPropagation();
      removeAxis(i);
    });
    chip.addEventListener("click", function(evt){
      if(evt.target.classList.contains("x")) return;
      var name2 = prompt("Rename axis", state.axes[i]);
      if(name2 && name2.trim()){ state.axes[i] = name2.trim().slice(0,20); renderAxisChips(); draw(); saveToStorage(); }
    });
    axisChipsEl.appendChild(chip);
  });
  var addChip = document.createElement("div");
  addChip.className = "chip add";
  addChip.textContent = "+ Add axis";
  addChip.addEventListener("click", addAxis);
  axisChipsEl.appendChild(addChip);
}

function renderColorSwatches(){
  colorSwatchesEl.innerHTML = "";
  var entity = getEntity(activeEntityId);
  var theme = THEMES[themeKey];
  theme.cycle.forEach(function(color){
    var sw = document.createElement("div");
    sw.className = "swatch" + (entity && entity.color===color ? " on" : "");
    sw.style.background = color;
    sw.addEventListener("click", function(){
      if(!entity) return;
      entity.color = color;
      renderEntityChips();
      renderColorSwatches();
      draw();
      saveToStorage();
    });
    colorSwatchesEl.appendChild(sw);
  });
}

function renderThemeSwatches(){
  themeSwatchesEl.innerHTML = "";
  Object.keys(THEMES).forEach(function(key){
    var theme = THEMES[key];
    var sw = document.createElement("div");
    sw.className = "swatch" + (key===themeKey ? " on" : "");
    sw.style.background = "linear-gradient(135deg,"+theme.cycle[0]+","+theme.cycle[1]+")";
    sw.title = theme.label;
    sw.addEventListener("click", function(){
      themeKey = key;
      state.entities.forEach(function(e,i){ e.color = THEMES[key].cycle[i % THEMES[key].cycle.length]; });
      renderThemeSwatches();
      renderEntityChips();
      renderColorSwatches();
      draw();
      saveToStorage();
    });
    themeSwatchesEl.appendChild(sw);
  });
}

function addEntity(){
  var theme = THEMES[themeKey];
  var newEntity = {
    id: uid(),
    name: "Entity " + (state.entities.length + 1),
    color: theme.cycle[state.entities.length % theme.cycle.length],
    values: state.axes.map(function(){ return 50; })
  };
  state.entities.push(newEntity);
  activeEntityId = newEntity.id;
  renderEntityChips();
  renderColorSwatches();
  draw();
  saveToStorage();
}

function removeEntity(id){
  if(state.entities.length <= 1){ toast("Keep at least one entity"); return; }
  state.entities = state.entities.filter(function(e){ return e.id !== id; });
  ensureActiveEntity();
  renderEntityChips();
  renderColorSwatches();
  draw();
  saveToStorage();
}

function addAxis(){
  if(state.axes.length >= 10){ toast("Max 10 axes"); return; }
  state.axes.push("Axis " + (state.axes.length + 1));
  state.entities.forEach(function(e){ e.values.push(50); });
  renderAxisChips();
  draw();
  saveToStorage();
}

function removeAxis(i){
  if(state.axes.length <= 3){ toast("Need at least 3 axes"); return; }
  state.axes.splice(i,1);
  state.entities.forEach(function(e){ e.values.splice(i,1); });
  renderAxisChips();
  draw();
  saveToStorage();
}

/* ---------- top controls ---------- */

document.getElementById("presetSelect").addEventListener("change", function(evt){
  state = clonePreset(evt.target.value);
  assignColors();
  activeEntityId = null;
  ensureActiveEntity();
  renderEntityChips();
  renderAxisChips();
  renderColorSwatches();
  history.replaceState(null, "", location.pathname);
  draw();
  saveToStorage();
});

var fillBtn = document.getElementById("fillToggle");
var gridBtn = document.getElementById("gridToggle");
function syncStyleButtons(){
  fillBtn.classList.toggle("on", style.filled);
  gridBtn.classList.toggle("on", style.web);
}
fillBtn.addEventListener("click", function(){ style.filled = !style.filled; syncStyleButtons(); draw(); saveToStorage(); });
gridBtn.addEventListener("click", function(){ style.web = !style.web; syncStyleButtons(); draw(); saveToStorage(); });

var ringsRange = document.getElementById("ringsRange");
var ringsVal = document.getElementById("ringsVal");
ringsRange.addEventListener("input", function(){
  style.rings = parseInt(ringsRange.value, 10);
  ringsVal.textContent = style.rings;
  draw();
  saveToStorage();
});

document.getElementById("resetBtn").addEventListener("click", function(){
  if(!confirm("Reset to the current preset's default data?")) return;
  state = clonePreset(state.preset || "rpg");
  assignColors();
  activeEntityId = null;
  ensureActiveEntity();
  renderEntityChips();
  renderAxisChips();
  renderColorSwatches();
  draw();
  saveToStorage();
});

document.getElementById("pngBtn").addEventListener("click", function(){
  canvas.toBlob(function(blob){
    if(!blob){ toast("Export failed"); return; }
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "spectra-radar.png";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    toast("PNG exported");
  }, "image/png");
});

document.getElementById("exportJsonBtn").addEventListener("click", function(){
  var payload = JSON.parse(JSON.stringify(state));
  payload.theme = themeKey;
  payload.style = style;
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "spectra-radar.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  toast("JSON exported");
});

var fileInput = document.getElementById("fileInput");
document.getElementById("importJsonBtn").addEventListener("click", function(){ fileInput.click(); });
fileInput.addEventListener("change", function(){
  var file = fileInput.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var parsed = JSON.parse(reader.result);
      if(!parsed.axes || !parsed.entities) throw new Error("bad shape");
      parsed.entities.forEach(function(e){ if(!e.id) e.id = uid(); });
      state = parsed;
      if(parsed.theme) themeKey = parsed.theme;
      if(parsed.style) style = parsed.style;
      assignColors();
      activeEntityId = null;
      ensureActiveEntity();
      renderEntityChips();
      renderAxisChips();
      renderColorSwatches();
      renderThemeSwatches();
      syncStyleButtons();
      ringsRange.value = style.rings;
      ringsVal.textContent = style.rings;
      draw();
      saveToStorage();
      toast("Imported " + file.name);
    }catch(err){
      toast("Invalid JSON file");
    }
    fileInput.value = "";
  };
  reader.readAsText(file);
});

document.getElementById("shareBtn").addEventListener("click", function(){
  var payload = JSON.parse(JSON.stringify(state));
  payload.theme = themeKey;
  payload.style = style;
  var encoded = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  var url = location.origin + location.pathname + "#" + encoded;
  history.replaceState(null, "", "#" + encoded);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){ toast("Link copied to clipboard"); })
      .catch(function(){ toast("Link ready in address bar"); });
  } else {
    toast("Link ready in address bar");
  }
});

var toastEl = document.getElementById("toast");
var toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 1800);
}

/* ---------- init ---------- */

function init(){
  loadState();
  ensureActiveEntity();
  document.getElementById("presetSelect").value = state.preset && PRESETS[state.preset] ? state.preset : "blank";
  renderEntityChips();
  renderAxisChips();
  renderColorSwatches();
  renderThemeSwatches();
  syncStyleButtons();
  ringsRange.value = style.rings;
  ringsVal.textContent = style.rings;

  var ro = new ResizeObserver(function(){ resizeCanvas(); });
  ro.observe(stage);
  resizeCanvas();
  window.addEventListener("orientationchange", resizeCanvas);
}

init();

})();
</script>
</body>
</html>
