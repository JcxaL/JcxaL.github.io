<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Lumière — Stained Glass Studio</title>
<meta name="description" content="Design a stained-glass window: four tracery generators, a pane painter, eight leaded palettes, a movable sun, and PNG/SVG/JSON export.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#07080c; --ink2:#0d0f16; --line:rgba(255,255,255,.1);
  --fg:#e9e6f2; --dim:#9a97ab; --gold:#e8c468; --acc:#8ab4ff;
  --panel:rgba(16,18,26,.82);
  --r:14px; --bar:54px;
}
html,body{height:100%}
body{
  background:var(--ink); color:var(--fg);
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overflow:hidden; -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}

/* ---------- top bar ---------- */
#bar{
  height:var(--bar);flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:0 12px;border-bottom:1px solid var(--line);min-width:0;
  background:linear-gradient(180deg,#14161f,#0b0d13);z-index:40;
}
.brand{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.brand b{font-size:15px;letter-spacing:.3px;font-weight:650}
.brand small{color:var(--dim);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.mark{width:22px;height:22px;border-radius:50%;flex:0 0 auto;
  background:conic-gradient(from 0deg,#e5484d,#e8c468,#3dd68c,#4a7cff,#a06bff,#e5484d);
  box-shadow:0 0 0 1.5px #0b0d13 inset,0 0 14px rgba(232,196,104,.45)}
#modes{display:flex;gap:4px;margin-left:8px;background:#0a0c12;padding:3px;border-radius:11px;border:1px solid var(--line);min-width:0;overflow-x:auto;scrollbar-width:none}
#modes::-webkit-scrollbar{display:none}
#modes button{
  appearance:none;border:0;background:transparent;color:var(--dim);
  font:600 12px/1 system-ui,sans-serif;padding:8px 11px;border-radius:8px;cursor:pointer;
  transition:background .18s,color .18s;white-space:nowrap
}
#modes button[aria-pressed=true]{background:#252a3a;color:var(--fg);box-shadow:0 1px 0 rgba(255,255,255,.07) inset}
.spacer{flex:1 1 auto;min-width:4px}
.acts{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.btn{
  appearance:none;cursor:pointer;color:var(--fg);background:#1b1f2b;border:1px solid var(--line);
  font:600 12px/1 system-ui,sans-serif;padding:9px 11px;border-radius:10px;
  transition:transform .12s,background .18s,border-color .18s;white-space:nowrap
}
.btn:hover{background:#242938;border-color:rgba(255,255,255,.2)}
.btn:active{transform:translateY(1px)}
.btn.gold{background:linear-gradient(180deg,#f0d485,#d9b355);color:#241a05;border-color:#b8923c}
.btn.ghost{background:transparent}
#panelToggle{display:none}

/* ---------- stage ---------- */
#body{flex:1 1 auto;display:flex;min-height:0;min-width:0;position:relative}
#stage{flex:1 1 auto;position:relative;min-width:0;overflow:hidden;background:#05060a;touch-action:none}
#cv{display:block;width:100%;height:100%}
#hint{
  position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
  background:rgba(8,10,16,.72);border:1px solid var(--line);backdrop-filter:blur(10px);
  padding:7px 13px;border-radius:16px;color:var(--dim);font-size:11.5px;letter-spacing:.02em;
  pointer-events:none;opacity:1;transition:opacity .5s;text-align:center;
  max-width:min(92%,420px);text-wrap:balance
}
#hint.gone{opacity:0}

/* ---------- tools + swatches ---------- */
#tools{
  position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:5px;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;
  backdrop-filter:blur(14px);z-index:20
}
#tools button{
  width:38px;height:38px;border:0;border-radius:9px;background:transparent;color:var(--dim);
  cursor:pointer;font-size:17px;display:grid;place-items:center;transition:background .16s,color .16s
}
#tools button[aria-pressed=true]{background:#2b3144;color:var(--gold)}
#tools button:hover{color:var(--fg)}
#swatches{
  position:absolute;left:50%;transform:translateX(-50%);bottom:56px;z-index:20;
  display:flex;gap:7px;align-items:center;padding:7px 9px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);
  max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none
}
#swatches::-webkit-scrollbar{display:none}
.sw{
  width:28px;height:28px;border-radius:50%;flex:0 0 auto;cursor:pointer;border:2px solid rgba(255,255,255,.14);
  transition:transform .14s,border-color .14s;position:relative
}
.sw:hover{transform:scale(1.1)}
.sw[aria-pressed=true]{border-color:var(--gold);transform:scale(1.14);box-shadow:0 0 0 3px rgba(232,196,104,.18)}
#swEdit{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:#0a0c12;padding:0;cursor:pointer}

/* ---------- panel ---------- */
#panel{
  flex:0 0 272px;border-left:1px solid var(--line);background:linear-gradient(180deg,#0e1017,#0a0c12);
  overflow-y:auto;overscroll-behavior:contain;padding:12px 12px 26px;z-index:30
}
#panel h3{
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  margin:14px 2px 8px;font-weight:700
}
#panel h3:first-child{margin-top:2px}
.card{background:#111420;border:1px solid var(--line);border-radius:var(--r);padding:11px}
.ctl{margin:0 0 11px}
.ctl:last-child{margin-bottom:2px}
.ctl label{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--dim);margin-bottom:6px}
.ctl label b{color:var(--fg);font-variant-numeric:tabular-nums;font-weight:600;font-size:11.5px}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;cursor:pointer;display:block
}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:99px;background:#272c3b}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:15px;height:15px;margin-top:-5.5px;border-radius:50%;
  background:linear-gradient(180deg,#f3dc9c,#d9b355);border:1px solid #8a6d26;
  box-shadow:0 1px 4px rgba(0,0,0,.5)
}
input[type=range]::-moz-range-track{height:4px;border-radius:99px;background:#272c3b}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#e4c173;border:1px solid #8a6d26}
.palgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.pal{
  cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:6px;background:#0c0e15;
  display:flex;flex-direction:column;gap:5px;transition:border-color .16s,background .16s
}
.pal[aria-pressed=true]{border-color:var(--gold);background:#161a26}
.pal .bars{display:flex;height:16px;border-radius:5px;overflow:hidden}
.pal .bars i{flex:1}
.pal span{font-size:10.5px;color:var(--dim);letter-spacing:.02em}
.pal[aria-pressed=true] span{color:var(--fg)}
.row{display:flex;gap:6px}
.row .btn{flex:1;text-align:center}
.seg{display:flex;gap:3px;background:#0a0c12;border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;appearance:none;border:0;background:transparent;color:var(--dim);font:600 11.5px/1 system-ui,sans-serif;padding:8px 4px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed=true]{background:#252a3a;color:var(--fg)}
.sub{font-size:11px;color:var(--dim);margin:8px 2px 0;line-height:1.4}
#gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:2px}
#gal .slot{
  position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:#0c0e15;
  border:1px solid var(--line);cursor:pointer
}
#gal .slot img{width:100%;height:100%;object-fit:cover;display:block}
#gal .slot .x{
  position:absolute;top:2px;right:2px;width:17px;height:17px;border-radius:50%;border:0;
  background:rgba(6,8,12,.8);color:#ffb3b3;font-size:11px;line-height:1;cursor:pointer;display:grid;place-items:center
}
#gal .empty{display:grid;place-items:center;color:#3a3f4f;font-size:17px}
.kbd{font:600 10.5px/1 ui-monospace,monospace;background:#1b1f2b;border:1px solid var(--line);border-radius:4px;padding:2px 4px;color:var(--dim)}

#toast{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);z-index:90;
  background:#171b26;border:1px solid var(--line);border-radius:999px;padding:9px 16px;
  font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;
  transition:opacity .24s,transform .24s
}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:880px){
  :root{--bar:50px}
  .brand small{display:none}
  #modes{margin-left:4px;flex:0 1 auto}
  .btn{padding:8px 9px}
  #panelToggle{display:inline-block}
  #panel{
    position:absolute;left:0;right:0;bottom:0;top:auto;flex:none;height:62vh;
    border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    transform:translateY(102%);transition:transform .32s cubic-bezier(.3,1.3,.5,1);
    box-shadow:0 -18px 50px rgba(0,0,0,.6)
  }
  #panel.open{transform:translateY(0)}
  #swatches{bottom:14px}
  #tools{left:10px;top:10px;flex-direction:row}
  #hint{bottom:58px;font-size:11px}
  #modes button{padding:8px 8px;font-size:11.5px}
  .acts .wide{display:none}
}
@media (max-width:560px){
  .brand b{display:none}
  #modes{flex:1 1 60px;min-width:0}
  #modes button{padding:7px 7px;font-size:11px}
  .btn{padding:8px 8px;font-size:11.5px}
  #bar{gap:6px;padding:0 8px}
  #hint{font-size:10.5px;padding:6px 11px}
}
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <div class="brand"><span class="mark"></span><b>Lumière</b><small>Stained Glass Studio</small></div>
    <nav id="modes" aria-label="Tracery generator"></nav>
    <span class="spacer"></span>
    <div class="acts">
      <button class="btn ghost wide" id="bRandom" title="New seed (R)">Reseed</button>
      <button class="btn ghost" id="bUndo" title="Undo paint (Z)">Undo</button>
      <button class="btn gold" id="bPng" title="Export PNG (E)">PNG</button>
      <button class="btn ghost wide" id="bSvg">SVG</button>
      <button class="btn ghost" id="panelToggle">Controls</button>
    </div>
  </header>
  <div id="body">
    <main id="stage">
      <canvas id="cv"></canvas>
      <div id="tools" role="group" aria-label="Tools"></div>
      <div id="swatches"></div>
      <div id="hint">Tap a pane to glaze it · drag to sweep · pick <b>Sun</b> to move the light</div>
    </main>
    <aside id="panel" aria-label="Controls"></aside>
  </div>
</div>
<div id="toast" role="status"></div>
<input type="file" id="loadFile" accept="application/json,.json" hidden>
<script>
(function(){
'use strict';

/* ============================================================
   Lumière — Stained Glass Studio
   Four tracery generators -> watertight polygons -> leaded glass
   render -> pane painter -> PNG / SVG / JSON / share-link export.
   ============================================================ */

var SS_KEY = 'lumiere_state_v1', GAL_KEY = 'lumiere_gallery_v1';

var PALETTES = [
  { name:'Chartres',  cols:['#1b3fa0','#8e1724','#d9a43a','#17644a','#3f2a6e','#cfd8e8'] },
  { name:'Sainte-Ch', cols:['#14328f','#b4202f','#e3bb57','#0e5f77','#6a1f6b','#eae2cd'] },
  { name:'Tiffany',   cols:['#1f6f54','#7fae4a','#d7a63f','#b2561f','#2d5b7a','#f0e3c2'] },
  { name:'Mucha',     cols:['#5f7f6a','#b98a63','#d9c38c','#8a5f74','#49617d','#f2ead9'] },
  { name:'Deco',      cols:['#0e1117','#c9a84c','#1f7a6a','#b2453a','#dfd4bb','#5a6479'] },
  { name:'Ember',     cols:['#7a1512','#bf3b1b','#e0872a','#f0c75a','#3a1b1f','#f6e6c8'] },
  { name:'Frost',     cols:['#13365e','#2f6f9e','#79b4cf','#c9e4ef','#1a2440','#f1f7fa'] },
  { name:'Jewel',     cols:['#4b1361','#128a7a','#b8143f','#e3a01e','#123a66','#efe4f0'] }
];

var MODES = [
  { k:'rose',    label:'Rose' },
  { k:'lancet',  label:'Lancet' },
  { k:'shards',  label:'Shards' },
  { k:'nouveau', label:'Nouveau' }
];

var FRAMES = [ {k:'circle',label:'Circle'}, {k:'round',label:'Rounded'}, {k:'arch',label:'Arch'} ];

var TOOLS = [
  { k:'paint', ico:'◆', title:'Glaze a pane' },
  { k:'pick',  ico:'◎', title:'Pick colour from pane' },
  { k:'clear', ico:'⌫', title:'Revert pane to generated colour' },
  { k:'sun',   ico:'☀', title:'Move the sun' }
];

function defaults(){
  return {
    mode:'rose', frame:'circle', seed:7421,
    sectors:12, rings:4, cusp:0.45,
    density:84, wobble:0.45,
    quarry:92, skew:0.35,
    leadWidth:6, texture:0.5, depth:0.62, mixAmt:0.16,
    pal:0, cols:PALETTES[0].cols.slice(),
    lx:0.34, ly:0.22, intensity:0.78, warmth:0.45, bloom:0.6, beam:0.52,
    drift:false,
    paints:{}
  };
}
var S = defaults();
var tool = 'paint', swatch = 0, cells = [], bound = [], design = {w:1000,h:1000};
var undoStack = [], driftT = 0, rafId = 0, needBase = true;

/* ---------- small math helpers ---------- */
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function lerp(a,b,t){ return a+(b-a)*t; }
function mulberry(a){
  return function(){
    a|=0; a = a+0x6D2B79F5|0;
    var t = Math.imul(a ^ a>>>15, 1|a);
    t = t + Math.imul(t ^ t>>>7, 61|t) ^ t;
    return ((t ^ t>>>14)>>>0)/4294967296;
  };
}
function hash2(x,y,s){
  var h = Math.imul(x|0, 374761393) ^ Math.imul(y|0, 668265263) ^ Math.imul(s|0, 2246822519);
  h = (h ^ h>>>13); h = Math.imul(h, 1274126177);
  return ((h ^ h>>>16)>>>0)/4294967296;
}

/* hex <-> hsl so panes can be shaded without extra assets */
function hex2rgb(h){
  h = String(h).replace('#','');
  if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) h = '888888';
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function rgb2hsl(r,g,b){
  r/=255; g/=255; b/=255;
  var mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx-mn, h = 0, l = (mx+mn)/2;
  var s = d === 0 ? 0 : d/(1-Math.abs(2*l-1));
  if(d !== 0){
    if(mx === r) h = ((g-b)/d)%6;
    else if(mx === g) h = (b-r)/d + 2;
    else h = (r-g)/d + 4;
    h *= 60; if(h < 0) h += 360;
  }
  return [h, clamp(s,0,1), clamp(l,0,1)];
}
function hsl(h,s,l,a){
  return 'hsla('+h.toFixed(1)+','+(s*100).toFixed(1)+'%,'+(l*100).toFixed(1)+'%,'+(a === undefined?1:a)+')';
}
function hexHsl(hx){ var c = hex2rgb(hx); return rgb2hsl(c[0],c[1],c[2]); }

/* ---------- polygon utilities ---------- */
function polyArea(p){
  var a = 0;
  for(var i=0,n=p.length;i<n;i++){ var q=p[(i+1)%n]; a += p[i][0]*q[1] - q[0]*p[i][1]; }
  return a/2;
}
function centroid(p){
  var a = 0, cx = 0, cy = 0;
  for(var i=0,n=p.length;i<n;i++){
    var q = p[(i+1)%n], f = p[i][0]*q[1] - q[0]*p[i][1];
    a += f; cx += (p[i][0]+q[0])*f; cy += (p[i][1]+q[1])*f;
  }
  if(Math.abs(a) < 1e-9){
    cx = 0; cy = 0;
    for(var j=0;j<p.length;j++){ cx += p[j][0]; cy += p[j][1]; }
    return [cx/p.length, cy/p.length];
  }
  a *= 3;
  return [cx/a, cy/a];
}
/* Sutherland-Hodgman: subject may be concave, clip half-plane is a line */
function clipHalf(poly, ax, ay, nx, ny){
  // keep points where dot(p - a, n) <= 0
  var out = [], n = poly.length;
  for(var i=0;i<n;i++){
    var p = poly[i], q = poly[(i+1)%n];
    var dp = (p[0]-ax)*nx + (p[1]-ay)*ny;
    var dq = (q[0]-ax)*nx + (q[1]-ay)*ny;
    if(dp <= 0) out.push(p);
    if((dp < 0 && dq > 0) || (dp > 0 && dq < 0)){
      var t = dp/(dp-dq);
      out.push([ p[0]+(q[0]-p[0])*t, p[1]+(q[1]-p[1])*t ]);
    }
  }
  return out;
}
function pointIn(p, x, y){
  var inside = false;
  for(var i=0,j=p.length-1;i<p.length;j=i++){
    var xi=p[i][0], yi=p[i][1], xj=p[j][0], yj=p[j][1];
    if((yi>y) !== (yj>y) && x < (xj-xi)*(y-yi)/(yj-yi)+xi) inside = !inside;
  }
  return inside;
}
function bbox(p){
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(var i=0;i<p.length;i++){
    if(p[i][0]<x0)x0=p[i][0]; if(p[i][0]>x1)x1=p[i][0];
    if(p[i][1]<y0)y0=p[i][1]; if(p[i][1]>y1)y1=p[i][1];
  }
  return [x0,y0,x1,y1];
}

/* ---------- frame boundaries (all convex, so half-plane clipping is exact) ---------- */
function frameCircle(cx,cy,r,n){
  var p = [];
  for(var i=0;i<n;i++){ var t = i/n*Math.PI*2; p.push([cx+Math.cos(t)*r, cy+Math.sin(t)*r]); }
  return p;
}
function frameRound(x,y,w,h,rad,per){
  var p = [], k = Math.max(3, per|0), corners = [
    [x+w-rad, y+h-rad, 0], [x+rad, y+h-rad, 90], [x+rad, y+rad, 180], [x+w-rad, y+rad, 270]
  ];
  for(var c=0;c<4;c++){
    for(var i=0;i<=k;i++){
      var a = (corners[c][2] + i/k*90) * Math.PI/180;
      p.push([ corners[c][0] + Math.cos(a)*rad, corners[c][1] + Math.sin(a)*rad ]);
    }
  }
  return p;
}
function frameArch(w,h,n){
  // vertical sides + equilateral pointed arch: convex, apex on top
  var ys = h*0.63, p = [[0,h],[0,ys]], k = Math.max(6,n|0), i, t;
  for(i=1;i<=k;i++){ t = Math.PI + (i/k)*(Math.PI/3); p.push([ w+Math.cos(t)*w, ys+Math.sin(t)*w ]); }
  for(i=0;i<k;i++){ t = -Math.PI/3 + (i/k)*(Math.PI/3); p.push([ Math.cos(t)*w, ys+Math.sin(t)*w ]); }
  p.push([w,ys]); p.push([w,h]);
  return p;
}

/* ---------- generator 1: rose window ----------
   Radii are sampled on one shared angular grid, so every band edge is
   byte-identical for the cells on either side of it: no seams, ever. */
function genRose(){
  design = {w:1000,h:1000};
  var cx = 500, cy = 500, R = 468, rings = S.rings|0, sectors = S.sectors|0;
  var SAMP = sectors*16, out = [];
  var mod = Math.max(2, sectors*2);

  var radii = [R*0.175];
  for(var b=1;b<=rings;b++) radii.push(R*(0.175 + 0.825*Math.pow(b/rings, 0.92)));

  // edge[b][k] = radius of band boundary b at grid angle k (cusped, aligned to grid)
  var edge = [];
  for(var e=0;e<=rings;e++){
    var amp = (e === 0 || e === rings) ? S.cusp*0.055 : S.cusp*0.085;
    var ph = (e%2) ? Math.PI/mod : 0, arr = new Float64Array(SAMP);
    for(var k=0;k<SAMP;k++){
      var th = k/SAMP*Math.PI*2;
      arr[k] = radii[e] * (1 - amp*(1+Math.cos(mod*th + mod*ph))/2);
    }
    edge.push(arr);
  }
  function ptAt(e,k){
    var kk = ((k%SAMP)+SAMP)%SAMP, th = kk/SAMP*Math.PI*2;
    return [cx+Math.cos(th)*edge[e][kk], cy+Math.sin(th)*edge[e][kk]];
  }

  // central boss
  var boss = [];
  for(var k0=0;k0<SAMP;k0++) boss.push(ptAt(0,k0));
  out.push({ pts:boss, ring:-1, idx:0 });

  for(var bi=0;bi<rings;bi++){
    var count = sectors * ((bi%2 === 0) ? 1 : 2);
    var step = SAMP/count;
    for(var s=0;s<count;s++){
      var k1 = Math.round(s*step), k2 = Math.round((s+1)*step), pts = [], kk;
      for(kk=k1;kk<=k2;kk++) pts.push(ptAt(bi+1,kk));
      for(kk=k2;kk>=k1;kk--) pts.push(ptAt(bi,kk));
      out.push({ pts:pts, ring:bi, idx:s });
    }
  }
  bound = frameCircle(cx,cy,R,180);
  return out;
}

/* ---------- generator 2: lancet with a diamond quarry lattice ---------- */
function genLancet(){
  design = {w:820,h:1240};
  var W = design.w, H = design.h;
  bound = frameArch(W,H,34);
  var g = clamp(S.quarry,40,170), sk = S.skew, out = [], rnd = mulberry(S.seed*17+3);
  var rows = Math.ceil(H/(g*0.62))+3, colsN = Math.ceil(W/g)+3;
  for(var r=-1;r<rows;r++){
    for(var c=-1;c<colsN;c++){
      var ox = (r%2 ? g*0.5 : 0) + sk*g*0.25*Math.sin(r*0.7);
      var x = c*g + ox, y = r*g*0.62;
      var hw = g*0.52, hh = g*0.38;
      var dia = [[x,y-hh],[x+hw,y],[x,y+hh],[x-hw,y]];
      var cl = clipToFrame(dia, bound);
      if(cl && Math.abs(polyArea(cl)) > g*g*0.02) out.push({ pts:cl, ring:r, idx:c });
    }
  }
  return out;
}

/* ---------- generators 3 & 4: Voronoi shards / relaxed organic glass ---------- */
function frameFor(){
  if(S.mode === 'lancet') return null;
  if(S.frame === 'arch'){ design = {w:820,h:1240}; return frameArch(820,1240,34); }
  if(S.frame === 'round'){ design = {w:1000,h:1000}; return frameRound(24,24,952,952,120,10); }
  design = {w:1000,h:1000}; return frameCircle(500,500,468,180);
}
function ccw(fr){ return polyArea(fr) > 0 ? fr : fr.slice().reverse(); }
function clipToFrame(poly, fr){
  var f = ccw(fr), cl = poly;
  for(var i=0;i<f.length;i++){
    var a = f[i], b = f[(i+1)%f.length];
    var ex = b[0]-a[0], ey = b[1]-a[1];
    cl = clipHalf(cl, a[0], a[1], ey, -ex);

}
function voronoi(sites, fr){
  var out = [], NEI = 26;
  for(var i=0;i<sites.length;i++){
    var pi = sites[i];
    var ord = [];
    for(var j=0;j<sites.length;j++){
      if(j === i) continue;
      var dx = sites[j][0]-pi[0], dy = sites[j][1]-pi[1];
      ord.push([dx*dx+dy*dy, j]);
    }
    ord.sort(function(a,b){ return a[0]-b[0]; });
    var cl = fr, lim = Math.min(NEI, ord.length);
    for(var o=0;o<lim && cl && cl.length>2;o++){

      var nx = pj[0]-pi[0], ny = pj[1]-pi[1];
      cl = clipHalf(cl, (pi[0]+pj[0])/2, (pi[1]+pj[1])/2, nx, ny);

    out.push(cl && cl.length > 2 ? cl : null);
  }
  return out;
}
function genVoronoi(organic){
  var fr = frameFor();
  bound = fr;
  var bb = bbox(fr), rnd = mulberry(S.seed*13+5), n = clamp(S.density|0, 10, 190);
  var sites = [], tries = 0;
  while(sites.length < n && tries < n*60){
    tries++;
    var x = lerp(bb[0],bb[2],rnd()), y = lerp(bb[1],bb[3],rnd());
    if(!pointIn(fr,x,y)) continue;
    var ok = true, minD = Math.sqrt((bb[2]-bb[0])*(bb[3]-bb[1])/n)*0.58;
    for(var i=0;i<sites.length;i++){
      var dx = sites[i][0]-x, dy = sites[i][1]-y;
      if(dx*dx+dy*dy < minD*minD){ ok = false; break; }
    }
    if(ok) sites.push([x,y]);
  }
  var polys = voronoi(sites, ccw(fr));
  var iters = organic ? 2 : 1;
  for(var it=0;it<iters;it++){
    for(var s=0;s<sites.length;s++) if(polys[s]) sites[s] = centroid(polys[s]);
    polys = voronoi(sites, ccw(fr));
  }

  var out = [];
  for(var p=0;p<polys.length;p++){
    if(!polys[p]) continue;
    var pts = polys[p];
    if(organic && S.wobble > 0.001) pts = wobbleRing(pts, fr);
    out.push({ pts:pts, ring:0, idx:p });
  }
  return out;
}
/* Vertex displacement is keyed on the quantised coordinate, so a vertex
   shared by three panes moves the same way in all three: stays watertight. */
function wobbleRing(pts, fr){
  var amp = S.wobble, out = [], n = pts.length;
  function disp(p){
    var qx = Math.round(p[0]*4), qy = Math.round(p[1]*4);
    if(!pointIn(fr, p[0], p[1]+0.001) || nearEdge(p, fr)) return p;
    var a = hash2(qx,qy,S.seed)*Math.PI*2, r = hash2(qy,qx,S.seed+91)*amp*17;

  }
  function mid(p,q){
    var mx = (p[0]+q[0])/2, my = (p[1]+q[1])/2;
    if(nearEdge(p,fr) || nearEdge(q,fr)) return [mx,my];
    var qx = Math.round(mx*4), qy = Math.round(my*4);
    var dx = q[0]-p[0], dy = q[1]-p[1], len = Math.hypot(dx,dy) || 1;
    var off = (hash2(qx,qy,S.seed+17)-0.5)*amp*0.46*len;
    return [mx - dy/len*off, my + dx/len*off];
  }
  for(var i=0;i<n;i++){
    var p = pts[i], q = pts[(i+1)%n];

}
function nearEdge(p, fr){

    var dx = b[0]-a[0], dy = b[1]-a[1], L2 = dx*dx+dy*dy || 1;
    var t = clamp(((p[0]-a[0])*dx + (p[1]-a[1])*dy)/L2, 0, 1);
    var ex = a[0]+dx*t - p[0], ey = a[1]+dy*t - p[1];
    if(ex*ex+ey*ey < 9) return true;
  }
  return false;
}

/* ---------- build + colour ---------- */
function build(){
  if(S.mode === 'rose') cells = genRose();
  else if(S.mode === 'lancet') cells = genLancet();
  else cells = genVoronoi(S.mode === 'nouveau');
  colour();
  needBase = true;
}
function colour(){
  var nc = S.cols.length, rnd = mulberry(S.seed*7+11);
  for(var i=0;i<cells.length;i++){
    var c = cells[i];
    c.c = centroid(c.pts);
    c.bb = bbox(c.pts);
    c.key = Math.round(c.c[0]*2)+'_'+Math.round(c.c[1]*2);
    /* the last swatch is held back as sparse "clear" glass, the way a real
       cartoon keeps a few bright quarries to let the light through */
    var acc = Math.max(1, nc-1), structured;
    if(S.mode === 'rose'){
      if(c.ring < 0){ structured = 2 % acc; }
      else {
        var b = c.ring % acc;
        structured = (c.idx % 2) ? b : (b + 2) % acc;
        if((c.ring + c.idx) % 7 === 0) structured = nc-1;
      }
    }else if(S.mode === 'lancet'){
      var rr = ((c.ring % 4) + 4) % 4, cc2 = ((c.idx % 2) + 2) % 2;
      structured = (rr + cc2*2) % acc;
      if((c.ring*3 + c.idx) % 9 === 0) structured = nc-1;
    }else{
      var dcx = c.c[0]-design.w/2, dcy = c.c[1]-design.h/2;
      var band = Math.floor(Math.hypot(dcx,dcy)/(design.w*0.52)*acc);
      structured = clamp(band, 0, acc-1);
      if((Math.round(c.c[0]/37) + Math.round(c.c[1]/41)) % 8 === 0) structured = nc-1;
    }
    var r = rnd();
    c.gen = r < S.mixAmt ? Math.floor(rnd()*nc) % nc : structured;
    c.shade = hash2(Math.round(c.c[0]), Math.round(c.c[1]), S.seed+3);
    var ov = S.paints[c.key];
    c.ci = (ov === undefined || ov === null) ? c.gen : clamp(ov|0, 0, nc-1);
  }
}

/* ============================================================
   Rendering: glass is drawn once into an offscreen "base" canvas;
   the sun is a cheap masked copy of a blurred base, so dragging
   the light (or the drift loop) costs three draw calls a frame.
   ============================================================ */
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var baseCv = null, glowCv = null, beamCv = null, view = { sc:1, ox:0, oy:0, dpr:1 };

function tracePath(c, pts, sc){
  c.beginPath();

  for(var i=1;i<pts.length;i++) c.lineTo(pts[i][0]*sc, pts[i][1]*sc);
  c.closePath();

function noiseTile(){
  if(noiseTile.c) return noiseTile.c;
  var n = document.createElement('canvas'); n.width = n.height = 128;
  var nc = n.getContext('2d'), img = nc.createImageData(128,128), d = img.data;
  for(var i=0;i<d.length;i+=4){
    var v = 118 + Math.random()*70;
    d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255;

}
function paneFill(c, cell, sc){
  var base = S.cols[cell.ci] || '#888888', h = hexHsl(base);
  var jitter = (cell.shade - 0.5) * 0.085 * (0.4 + S.depth);
  var hu = h[0], sa = clamp(h[1]*(1 + jitter*0.5), 0, 1), li = clamp(h[2] + jitter, 0.04, 0.95);
  var b = cell.bb, d = S.depth;
  var g = c.createLinearGradient(b[0]*sc, b[1]*sc, b[2]*sc, b[3]*sc);
  g.addColorStop(0, hsl(hu, sa, clamp(li*(1+0.42*d), 0, 0.96)));
  g.addColorStop(0.52, hsl(hu, sa, li));
  g.addColorStop(1, hsl(hu, clamp(sa*1.06,0,1), clamp(li*(1-0.34*d), 0.02, 1)));

}
function renderGlass(c, sc){
  var W = design.w*sc, H = design.h*sc, i;

  c.clearRect(0,0,W,H);

  /* lead matrix behind everything so hairline seams read as came, not holes */
  if(bound && bound.length){
    tracePath(c, bound, sc);
    c.fillStyle = '#05060a'; c.fill();
  }
  for(i=0;i<cells.length;i++){
    tracePath(c, cells[i].pts, sc);
    c.fillStyle = paneFill(c, cells[i], sc);
    c.fill();
  }

  /* glass texture, clipped to the window */
  if(S.texture > 0.01){
    c.save();
    if(bound && bound.length){ tracePath(c, bound, sc); c.clip(); }
    c.globalCompositeOperation = 'overlay';
    c.globalAlpha = S.texture * 0.5;
    var pat = c.createPattern(noiseTile(), 'repeat');
    c.fillStyle = pat; c.fillRect(0,0,W,H);
    c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
    c.restore();

    c.strokeStyle = 'rgba(226,214,186,.13)'; c.lineWidth = lw*0.26; c.stroke();
  }
  if(bound && bound.length){
    tracePath(c, bound, sc);
    c.strokeStyle = '#070810'; c.lineWidth = lw*2.4; c.stroke();
    c.strokeStyle = 'rgba(214,190,140,.26)'; c.lineWidth = lw*0.45; c.stroke();

}
function makeBase(sc){
  var c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(design.w*sc));
  c.height = Math.max(1, Math.round(design.h*sc));

}
function makeGlow(src){
  var q = 0.5, g = document.createElement('canvas');

  g.height = Math.max(1, Math.round(src.height*q));
  var gc = g.getContext('2d');
  try { gc.filter = 'blur(' + (6 + S.bloom*12).toFixed(1) + 'px)'; } catch(e){}
  gc.drawImage(src, 0, 0, g.width, g.height);

}
function makeBeam(glow){

    b = beamCv = document.createElement('canvas');
    b.width = glow.width; b.height = glow.height;
  }
  var bc = b.getContext('2d'), W = b.width, H = b.height;
  bc.setTransform(1,0,0,1,0,0);
  bc.globalCompositeOperation = 'source-over';

  bc.drawImage(glow,0,0);

    bc.globalCompositeOperation = 'source-atop';
    bc.fillStyle = 'rgba(255,196,110,' + (S.warmth*0.38).toFixed(3) + ')';
    bc.fillRect(0,0,W,H);
  }

  var r = Math.max(W,H) * lerp(0.3, 1.05, S.beam);
  var g = bc.createRadialGradient(S.lx*W, S.ly*H, r*0.02, S.lx*W, S.ly*H, r);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.45, 'rgba(255,255,255,.55)');
  g.addColorStop(1, 'rgba(255,255,255,0)');

}
/* Light is a two-stage composite on top of the baked glass: a multiply

function applyLight(c, glow, dx, dy, dw, dh, W, H){
  var sx = dx + S.lx*dw, sy = dy + S.ly*dh;
  var reach = Math.max(dw,dh) * lerp(0.62, 1.7, S.beam);

  var shade = Math.round(255 * (1 - 0.62*S.intensity));
  c.globalCompositeOperation = 'multiply';
  var fall = c.createRadialGradient(sx, sy, reach*0.04, sx, sy, reach);
  fall.addColorStop(0, 'rgb(255,255,255)');
  fall.addColorStop(0.35, 'rgb(' + Math.round(lerp(255, shade, 0.3)) + ',' + Math.round(lerp(255, shade, 0.34)) + ',' + Math.round(lerp(255, shade, 0.3)) + ')');
  fall.addColorStop(1, 'rgb(' + shade + ',' + Math.round(shade*1.02) + ',' + Math.min(255, Math.round(shade*1.18)) + ')');
  c.fillStyle = fall; c.fillRect(0,0,W,H);

  var beam = makeBeam(glow);
  c.globalCompositeOperation = 'lighter';
  c.globalAlpha = clamp(0.3 + S.intensity*1.05, 0, 1.6) * 0.92;

function fitView(){
  var st = document.getElementById('stage');

  cv.height = Math.max(1, Math.round(ch*dpr));

  var sc = Math.min(cw/design.w, ch/design.h) * pad;

}

}

    var b = el('button', 'sw');
    b.style.background = c;
    b.title = 'Glaze colour ' + (i+1);
    b.setAttribute('aria-label', 'Glaze colour ' + (i+1));
    b.setAttribute('aria-pressed', swatch === i ? 'true' : 'false');
    b.onclick = function(){ swatch = i; tool = 'paint'; buildTools(); buildSwatches(); edit.value = S.cols[i]; };
    box.appendChild(b);
  });
  var edit = el('input');
  edit.type = 'color'; edit.id = 'swEdit'; edit.value = S.cols[swatch];
  edit.title = 'Recolour the selected glass';
  edit.oninput = function(){
    S.cols[swatch] = edit.value;
    buildSwatches(); buildPalettes(); colour(); needBase = true; paint(); saveSoon();
  };
  box.appendChild(edit);
}
function buildPalettes(){
  var holder = document.getElementById('palHolder');
  if(!holder) return;
  holder.innerHTML = '';
  PALETTES.forEach(function(p,i){
    var b = el('button', 'pal');
    b.setAttribute('aria-pressed', S.pal === i ? 'true' : 'false');
    var bars = el('div','bars');
    p.cols.forEach(function(c){ var s = el('i'); s.style.background = c; bars.appendChild(s); });
    b.appendChild(bars);
    b.appendChild(el('span', null, p.name));
    b.onclick = function(){
      S.pal = i; S.cols = p.cols.slice();
      swatch = Math.min(swatch, S.cols.length-1);
      buildPalettes(); buildSwatches(); colour(); needBase = true; paint(); saveSoon();
    };
    holder.appendChild(b);
  });
}
function syncVisible(){
  Object.keys(ctlEls).forEach(function(k){
    var item = ctlEls[k].item;
    var on = item.modes === '*' || item.modes.indexOf(S.mode) >= 0;
    ctlEls[k].node.style.display = on ? '' : 'none';
  });
  var vis = (S.mode === 'shards' || S.mode === 'nouveau') ? '' : 'none';
  var fc = document.getElementById('frameCard'), fh = document.getElementById('frameHead');
  if(fc) fc.style.display = vis;
  if(fh) fh.style.display = vis;
}
function buildPanel(){
  var p = document.getElementById('panel');
  p.innerHTML = '';

  CONTROLS.forEach(function(gr){
    p.appendChild(el('h3', null, gr.group));
    var card = el('div','card');
    gr.items.forEach(function(item){
      var ctl = el('div','ctl');
      var lab = el('label');
      lab.innerHTML = '<span>' + item.label + '</span><b>' + fmt(item) + '</b>';
      var r = el('input');
      r.type = 'range'; r.min = item.min; r.max = item.max; r.step = item.step;
      r.value = S[item.k];
      r.setAttribute('aria-label', item.label);
      r.oninput = function(){
        S[item.k] = parseFloat(r.value);
        lab.querySelector('b').textContent = fmt(item);
        if(item.light){ paint(); }
        else if(item.glow){ glowCv = makeGlow(baseCv); paint(); }
        else { needBase = true; build(); paint(); }
        saveSoon();
      };
      ctl.appendChild(lab); ctl.appendChild(r);
      card.appendChild(ctl);
      rangeEls[item.k] = r; ctlEls[item.k] = { node:ctl, item:item, lab:lab };
    });
    p.appendChild(card);
  });

  var fhead = el('h3', null, 'Window shape');
  fhead.id = 'frameHead';
  p.appendChild(fhead);
  var fcard = el('div','card');
  fcard.id = 'frameCard';
  var fseg = el('div','seg'); fseg.id = 'frameHolder';
  FRAMES.forEach(function(f){
    var b = el('button', null, f.label);
    b.setAttribute('aria-pressed', S.frame === f.k ? 'true' : 'false');
    b.onclick = function(){
      S.frame = f.k;
      Array.prototype.forEach.call(fseg.children, function(c){ c.setAttribute('aria-pressed','false'); });
      b.setAttribute('aria-pressed','true');
      rebuild();
    };
    fseg.appendChild(b);
  });
  fcard.appendChild(fseg);
  fcard.appendChild(el('div','sub','Shards and Nouveau can be cut to a rose, a rounded light or a pointed arch.'));
  p.appendChild(fcard);

  p.appendChild(el('h3', null, 'Palette'));
  var pcard = el('div','card');
  var holder = el('div','palgrid'); holder.id = 'palHolder';
  pcard.appendChild(holder);
  pcard.appendChild(el('div','sub','Tap a swatch under the window, then tap panes to glaze them. The colour box recolours the whole batch.'));
  p.appendChild(pcard);

  p.appendChild(el('h3', null, 'Sun'));
  var scard = el('div','card');
  var drow = el('div','row');
  var bDrift = el('button','btn ghost', S.drift ? 'Stop drift' : 'Drift the sun');
  bDrift.onclick = function(){
    S.drift = !S.drift;
    bDrift.textContent = S.drift ? 'Stop drift' : 'Drift the sun';
    if(S.drift) startLoop(); else paint();
    saveSoon();
  };
  var bCentre = el('button','btn ghost','Centre');
  bCentre.onclick = function(){ S.drift = false; bDrift.textContent = 'Drift the sun'; S.lx = 0.5; S.ly = 0.3; paint(); saveSoon(); };
  drow.appendChild(bDrift); drow.appendChild(bCentre);
  scard.appendChild(drow);
  scard.appendChild(el('div','sub','Pick the ☀ tool to drag the sun across the glass.'));
  p.appendChild(scard);

  p.appendChild(el('h3', null, 'Save & export'));
  var ecard = el('div','card');
  var r1 = el('div','row');
  var bp = el('button','btn gold','PNG ×2'); bp.onclick = exportPNG;
  var bs = el('button','btn ghost','SVG'); bs.onclick = exportSVG;
  r1.appendChild(bp); r1.appendChild(bs);
  var r2 = el('div','row'); r2.style.marginTop = '6px';
  var bj = el('button','btn ghost','Save .json'); bj.onclick = exportJSON;
  var bl = el('button','btn ghost','Open .json'); bl.onclick = function(){ document.getElementById('loadFile').click(); };
  r2.appendChild(bj); r2.appendChild(bl);
  var r3 = el('div','row'); r3.style.marginTop = '6px';
  var bsh = el('button','btn ghost','Copy share link'); bsh.onclick = shareLink;
  var bst = el('button','btn ghost','Keep in studio'); bst.onclick = galleryAdd;
  r3.appendChild(bsh); r3.appendChild(bst);
  ecard.appendChild(r1); ecard.appendChild(r2); ecard.appendChild(r3);
  p.appendChild(ecard);

  p.appendChild(el('h3', null, 'Studio'));
  var gcard = el('div','card');
  var g = el('div'); g.id = 'gal';
  gcard.appendChild(g);
  gcard.appendChild(el('div','sub','Up to six windows are kept in this browser.'));
  p.appendChild(gcard);

  p.appendChild(el('h3', null, 'Shortcuts'));
  var kcard = el('div','card');
  kcard.appendChild(el('div','sub',
    '<span class="kbd">1</span>–<span class="kbd">4</span> tracery &nbsp; ' +
    '<span class="kbd">R</span> reseed &nbsp; <span class="kbd">Z</span> undo &nbsp; ' +
    '<span class="kbd">E</span> png &nbsp; <span class="kbd">D</span> drift &nbsp; ' +
    '<span class="kbd">S</span> sun tool'));
  p.appendChild(kcard);

  buildPalettes(); galleryRender(); syncVisible();
}
function syncRanges(){
  Object.keys(rangeEls).forEach(function(k){
    if(rangeEls[k]) rangeEls[k].value = S[k];
    if(ctlEls[k]) ctlEls[k].lab.querySelector('b').textContent = fmt(ctlEls[k].item);
  });
}

/* ---------- canvas interaction ---------- */
function toDesign(ev){
  var r = cv.getBoundingClientRect();
  return [ (ev.clientX - r.left - view.ox)/view.sc, (ev.clientY - r.top - view.oy)/view.sc ];
}
function hit(x,y){
  for(var i=cells.length-1;i>=0;i--) if(pointIn(cells[i].pts, x, y)) return cells[i];
  return null;
}
var dragging = false, lastKey = null;
function applyAt(ev){
  var d = toDesign(ev);
  if(tool === 'sun'){
    S.lx = clamp(d[0]/design.w, -0.1, 1.1);
    S.ly = clamp(d[1]/design.h, -0.1, 1.1);
    S.drift = false;
    paint(); saveSoon(); return;
  }
  var c = hit(d[0], d[1]);
  if(!c || c.key === lastKey) return;
  lastKey = c.key;
  if(tool === 'pick'){
    swatch = c.ci; tool = 'paint'; buildTools(); buildSwatches();
    toast('Picked ' + S.cols[c.ci]);
    return;
  }
  var prev = (S.paints[c.key] === undefined) ? null : S.paints[c.key];
  if(tool === 'clear'){
    if(prev === null) return;
    delete S.paints[c.key];
    c.ci = c.gen;
  }else{
    if(prev === swatch) return;
    S.paints[c.key] = swatch;
    c.ci = swatch;
  }
  undoStack.push({ key:c.key, prev:prev });
  if(undoStack.length > 400) undoStack.shift();
  needBase = true; paint(); saveSoon();
}
function undo(){
  var a = undoStack.pop();
  if(!a){ toast('Nothing to undo'); return; }
  if(a.prev === null) delete S.paints[a.key]; else S.paints[a.key] = a.prev;
  colour(); needBase = true; paint(); saveSoon();
}
cv.addEventListener('pointerdown', function(ev){
  dragging = true; lastKey = null;
  try { cv.setPointerCapture(ev.pointerId); } catch(e){}
  applyAt(ev);
  hideHint();
  ev.preventDefault();
});
cv.addEventListener('pointermove', function(ev){ if(dragging) applyAt(ev); });
cv.addEventListener('pointerup', function(){ dragging = false; lastKey = null; });
cv.addEventListener('pointercancel', function(){ dragging = false; lastKey = null; });
cv.addEventListener('contextmenu', function(ev){ ev.preventDefault(); });

function hideHint(){
  var h = document.getElementById('hint');
  if(h && !h.classList.contains('gone')) h.classList.add('gone');
}
var hintTimer = setTimeout(hideHint, 7000);

/* ---------- export ---------- */
function stamp(){
  var d = new Date(), p = function(n){ return (n<10?'0':'')+n; };
  return d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
}
function download(blob, name){
  var url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
function composeExport(sc){
  var base = makeBase(sc), glow = makeGlow(base);
  var out = document.createElement('canvas');
  out.width = base.width; out.height = base.height;
  var c = out.getContext('2d');
  c.fillStyle = '#05060a'; c.fillRect(0,0,out.width,out.height);
  c.drawImage(base,0,0);
  var keep = beamCv; beamCv = null;
  applyLight(c, glow, 0, 0, out.width, out.height, out.width, out.height);
  beamCv = keep;
  return out;
}
function exportPNG(){
  var out = composeExport(2);
  if(out.toBlob){
    out.toBlob(function(b){
      if(!b || !b.size){ toast('Export failed'); return; }
      download(b, 'lumiere-' + S.mode + '-' + stamp() + '.png');
      toast('PNG saved · ' + Math.round(b.size/1024) + ' KB');
    }, 'image/png');
  }else{
    var url = out.toDataURL('image/png'), a = document.createElement('a');
    a.href = url; a.download = 'lumiere-' + stamp() + '.png'; a.click();
    toast('PNG saved');
  }
}
function svgPath(pts){
  var d = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
  for(var i=1;i<pts.length;i++) d += 'L' + pts[i][0].toFixed(1) + ' ' + pts[i][1].toFixed(1);
  return d + 'Z';
}
function buildSVG(){
  var W = design.w, H = design.h, i, s = [];
  s.push('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">');
  s.push('<defs><radialGradient id="sun" cx="' + (S.lx*100).toFixed(1) + '%" cy="' + (S.ly*100).toFixed(1) +
         '%" r="' + (lerp(30,105,S.beam)).toFixed(0) + '%">' +
         '<stop offset="0" stop-color="#fff2cf" stop-opacity="' + (S.intensity*0.5).toFixed(3) + '"/>' +
         '<stop offset="1" stop-color="#fff2cf" stop-opacity="0"/></radialGradient></defs>');
  s.push('<rect width="' + W + '" height="' + H + '" fill="#05060a"/>');
  if(bound && bound.length) s.push('<path d="' + svgPath(bound) + '" fill="#05060a"/>');
  s.push('<g>');
  for(i=0;i<cells.length;i++){
    var c = cells[i], h = hexHsl(S.cols[c.ci] || '#888888');
    var j = (c.shade-0.5)*0.085*(0.4+S.depth);
    s.push('<path d="' + svgPath(c.pts) + '" fill="' + hsl(h[0], clamp(h[1]*(1+j*0.5),0,1), clamp(h[2]+j,0.04,0.95)) + '"/>');
  }
  s.push('</g>');
  s.push('<g fill="none" stroke="#04050a" stroke-width="' + (S.leadWidth*0.5).toFixed(2) + '" stroke-linejoin="round">');
  for(i=0;i<cells.length;i++) s.push('<path d="' + svgPath(cells[i].pts) + '"/>');
  s.push('</g>');
  if(bound && bound.length){
    s.push('<path d="' + svgPath(bound) + '" fill="none" stroke="#0a0b11" stroke-width="' + (S.leadWidth*1.3).toFixed(2) + '"/>');
  }
  s.push('<rect width="' + W + '" height="' + H + '" fill="url(#sun)"/>');
  s.push('</svg>');
  return s.join('\n');
}
function exportSVG(){
  var blob = new Blob([buildSVG()], { type:'image/svg+xml' });
  download(blob, 'lumiere-' + S.mode + '-' + stamp() + '.svg');
  toast('SVG saved · ' + cells.length + ' panes');
}
function exportJSON(){
  var blob = new Blob([JSON.stringify(snapshot(), null, 2)], { type:'application/json' });
  download(blob, 'lumiere-' + S.mode + '-' + stamp() + '.json');
  toast('Design saved');
}
function snapshot(){
  return {
    app:'lumiere', v:1, mode:S.mode, frame:S.frame, seed:S.seed,
    sectors:S.sectors, rings:S.rings, cusp:S.cusp, density:S.density, wobble:S.wobble,
    quarry:S.quarry, skew:S.skew, leadWidth:S.leadWidth, texture:S.texture, depth:S.depth,
    mixAmt:S.mixAmt, pal:S.pal, cols:S.cols.slice(), lx:S.lx, ly:S.ly,
    intensity:S.intensity, warmth:S.warmth, bloom:S.bloom, beam:S.beam,
    drift:!!S.drift, paints:S.paints
  };
}
function adopt(o){
  if(!o || typeof o !== 'object') return false;
  var d = defaults(), k;
  for(k in d){ if(Object.prototype.hasOwnProperty.call(d,k)) S[k] = d[k]; }
  for(k in o){
    if(!Object.prototype.hasOwnProperty.call(d,k)) continue;
    if(k === 'cols' && Object.prototype.toString.call(o.cols) === '[object Array]'){ S.cols = o.cols.slice(0,8).map(String); continue; }
    if(k === 'paints' && o.paints && typeof o.paints === 'object'){ S.paints = o.paints; continue; }
    if(typeof d[k] === 'number'){ var n = parseFloat(o[k]); if(isFinite(n)) S[k] = n; continue; }
    if(typeof d[k] === 'boolean'){ S[k] = !!o[k]; continue; }
    if(typeof d[k] === 'string'){ S[k] = String(o[k]); continue; }
  }
  if(!S.cols.length) S.cols = PALETTES[0].cols.slice();
  if(MODES.map(function(m){ return m.k; }).indexOf(S.mode) < 0) S.mode = 'rose';
  swatch = Math.min(swatch, S.cols.length-1);
  return true;
}
function shareLink(){
  var txt = '';
  try {
    txt = location.origin + location.pathname + '#g=' + btoa(JSON.stringify(snapshot())).replace(/\+/g,'-').replace(/\//g,'_');
  } catch(e){ toast('Could not build link'); return; }
  location.hash = txt.slice(txt.indexOf('#'));
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast('Share link copied'); }, function(){ toast('Link is in the address bar'); });
  }else{
    toast('Link is in the address bar');
  }
}
function readHash(){
  var m = /#g=([A-Za-z0-9\-_=]+)/.exec(location.hash || '');
  if(!m) return false;
  try {
    var json = atob(m[1].replace(/-/g,'+').replace(/_/g,'/'));
    return adopt(JSON.parse(json));
  } catch(e){ return false; }
}

/* ---------- persistence + studio shelf ---------- */
var saveT = 0;
function saveSoon(){
  clearTimeout(saveT);
  saveT = setTimeout(function(){
    try { localStorage.setItem(SS_KEY, JSON.stringify(snapshot())); } catch(e){}
  }, 350);
}
function restore(){
  try {
    var raw = localStorage.getItem(SS_KEY);
    if(raw) return adopt(JSON.parse(raw));
  } catch(e){}
  return false;
}
function galleryList(){
  try { var a = JSON.parse(localStorage.getItem(GAL_KEY) || '[]'); return (Object.prototype.toString.call(a) === '[object Array]') ? a : []; }
  catch(e){ return []; }
}
function galleryAdd(){
  var list = galleryList();
  var thumb = document.createElement('canvas'), T = 150;
  thumb.width = T; thumb.height = T;
  var tc = thumb.getContext('2d');
  tc.fillStyle = '#06070c'; tc.fillRect(0,0,T,T);
  var sc = Math.min(T/design.w, T/design.h);
  ensureBase();
  tc.drawImage(baseCv, (T-design.w*sc)/2, (T-design.h*sc)/2, design.w*sc, design.h*sc);
  var data;
  try { data = thumb.toDataURL('image/jpeg', 0.72); } catch(e){ data = ''; }
  list.unshift({ t:Date.now(), thumb:data, state:snapshot() });
  list = list.slice(0,6);
  try { localStorage.setItem(GAL_KEY, JSON.stringify(list)); toast('Kept in the studio'); }
  catch(e){ toast('Studio shelf is full'); }
  galleryRender();
}
function galleryRender(){
  var g = document.getElementById('gal');
  if(!g) return;
  var list = galleryList();
  g.innerHTML = '';
  for(var i=0;i<6;i++){
    var slot = el('div','slot');
    if(list[i]){
      (function(item){
        if(item.thumb){ var im = el('img'); im.src = item.thumb; im.alt = 'Saved window'; slot.appendChild(im); }
        slot.title = 'Open this window';
        slot.onclick = function(){
          if(adopt(item.state)){
            undoStack = [];
            buildModes(); buildSwatches(); buildPalettes(); syncRanges(); syncVisible();
            rebuild(); if(S.drift) startLoop();
            toast('Window restored');
          }
        };
        var x = el('button','x','×');
        x.title = 'Remove';
        x.onclick = function(ev){
          ev.stopPropagation();
          var l = galleryList();
          for(var j=0;j<l.length;j++) if(l[j].t === item.t){ l.splice(j,1); break; }
          try { localStorage.setItem(GAL_KEY, JSON.stringify(l)); } catch(e){}
          galleryRender();
        };
        slot.appendChild(x);
      })(list[i]);
    }else{
      slot.className = 'slot empty';
      slot.innerHTML = '+';
      slot.title = 'Keep the current window here';
      slot.onclick = galleryAdd;
    }
    g.appendChild(slot);
  }
}

/* ---------- misc UI ---------- */
var toastT = 0;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(function(){ t.classList.remove('on'); }, 1700);
}
document.getElementById('bRandom').onclick = function(){
  S.seed = (Math.random()*1e9)|0;
  rebuild(); toast('Seed ' + S.seed);
};
document.getElementById('bUndo').onclick = undo;
document.getElementById('bPng').onclick = exportPNG;
document.getElementById('bSvg').onclick = exportSVG;
document.getElementById('panelToggle').onclick = function(){
  document.getElementById('panel').classList.toggle('open');
};
document.getElementById('loadFile').onchange = function(ev){
  var f = ev.target.files && ev.target.files[0];
  if(!f) return;
  var fr = new FileReader();
  fr.onload = function(){
    try {
      if(adopt(JSON.parse(String(fr.result)))){
        undoStack = [];
        buildModes(); buildSwatches(); buildPalettes(); syncRanges(); syncVisible();
        rebuild(); if(S.drift) startLoop();
        toast('Design opened');
      }
    } catch(e){ toast('That file is not a Lumière design'); }
  };
  fr.readAsText(f);
  ev.target.value = '';
};
window.addEventListener('keydown', function(ev){
  if(ev.target && /input|textarea|select/i.test(ev.target.tagName)) return;
  var k = ev.key.toLowerCase();
  if(k >= '1' && k <= '4'){
    S.mode = MODES[parseInt(k,10)-1].k;
    buildModes(); syncVisible(); rebuild();
  }
  else if(k === 'r'){ S.seed = (Math.random()*1e9)|0; rebuild(); toast('Seed ' + S.seed); }
  else if(k === 'z'){ undo(); }
  else if(k === 'e'){ exportPNG(); }
  else if(k === 's'){ tool = (tool === 'sun' ? 'paint' : 'sun'); buildTools(); paint(); }
  else if(k === 'd'){ S.drift = !S.drift; if(S.drift) startLoop(); else paint(); buildPanel(); }
  else return;
  hideHint();
});
var rT = 0;
window.addEventListener('resize', function(){
  clearTimeout(rT);
  rT = setTimeout(function(){ needBase = true; fitView(); paint(); }, 90);
});
document.addEventListener('visibilitychange', function(){
  if(document.hidden){ if(rafId){ cancelAnimationFrame(rafId); rafId = 0; } }
  else startLoop();
});

/* ---------- boot ---------- */
if(!readHash()) restore();
buildModes(); buildTools(); buildSwatches(); buildPanel();
build(); fitView(); paint(); startLoop();

/* debug handle used by the headless smoke test */
window.__lum = {
  state:S, cells:function(){ return cells; }, build:build, paint:paint, fit:fitView,
  exportCanvas:function(){ return composeExport(1); }, svg:buildSVG,
  snapshot:snapshot, adopt:adopt, design:function(){ return design; }
};
})();
</script>
