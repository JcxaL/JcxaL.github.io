<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#070b12">
<title>Switchboard — Logic Circuit Workbench</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#070b12;color:#e7eefb;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root{
  --bg:#070b12; --panel:rgba(16,22,35,.86); --line:rgba(140,170,220,.16);
  --hi:#22d3ee; --lo:#2b3a54; --amber:#fbbf24; --vio:#a78bfa; --grn:#34d399; --txt:#e7eefb;
  --dim:#8a9bb8;
}
#app{display:grid;grid-template-rows:auto auto 1fr;height:100dvh;height:100vh}
header{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(26,34,52,.95),rgba(10,15,24,.95));flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-size:15px;letter-spacing:.2px}
.brand span{font-size:10.5px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
button,select{font:inherit;color:var(--txt);background:rgba(255,255,255,.06);border:1px solid var(--line);
  border-radius:9px;padding:7px 11px;font-size:12.5px;cursor:pointer;transition:background .14s,border-color .14s,transform .1s}
button:active{transform:scale(.96)}
button:hover,select:hover{background:rgba(255,255,255,.11)}
button.on{background:rgba(34,211,238,.17);border-color:rgba(34,211,238,.5);color:#bdf4ff}
button.ghost{background:transparent}
.seg{display:flex;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:8px}
.seg button.on{background:rgba(167,139,250,.22);color:#ddd0ff}
select{padding:7px 8px}
#bar{display:flex;gap:6px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none;background:rgba(10,15,24,.6)}
#bar::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:58px;
  padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  cursor:pointer;transition:background .14s,border-color .14s,transform .1s}
.chip:active{transform:scale(.95)}
.chip.sel{background:rgba(34,211,238,.18);border-color:rgba(34,211,238,.55)}
.chip svg{width:30px;height:20px;display:block}
.chip i{font-style:normal;font-size:9.5px;letter-spacing:.07em;color:var(--dim);text-transform:uppercase}
.chip.sel i{color:#bdf4ff}
.sepv{flex:0 0 auto;width:1px;height:26px;background:var(--line);margin:0 3px}
#stageWrap{position:relative;overflow:hidden}
canvas#stage{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;align-items:center;
  font-size:11px;color:var(--dim);background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:6px 11px;backdrop-filter:blur(10px);pointer-events:none;letter-spacing:.03em}
#hud b{color:var(--hi);font-weight:600}
#zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:34px;height:34px;padding:0;border-radius:10px;background:var(--panel);backdrop-filter:blur(10px);font-size:15px}
#panel{position:absolute;top:0;right:0;bottom:0;width:min(340px,86vw);background:var(--panel);
  backdrop-filter:blur(16px);border-left:1px solid var(--line);transform:translateX(102%);
  transition:transform .32s cubic-bezier(.3,1.3,.5,1);display:flex;flex-direction:column;z-index:5}
#panel.open{transform:none}
#panel h3{margin:0;padding:12px 14px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
#panel h3 button{margin-left:auto;padding:4px 9px;font-size:11px}
#panelBody{flex:1;overflow:auto;padding:12px 14px;font-size:12.5px;line-height:1.5}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12px}
th,td{padding:4px 5px;text-align:center;border-bottom:1px solid rgba(140,170,220,.09)}
th{color:var(--dim);font-weight:600;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
tbody tr{cursor:pointer}
tbody tr:hover{background:rgba(255,255,255,.05)}
tbody tr.cur{background:rgba(34,211,238,.15);box-shadow:inset 2px 0 0 var(--hi)}
td.v1{color:var(--hi);font-weight:600}
td.v0{color:#5b6b85}
.note{color:var(--dim);font-size:11.5px;line-height:1.55;margin:10px 0 0}
#scope{width:100%;display:block;border-radius:10px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:9px;margin:11px 0}
.row label{font-size:11px;color:var(--dim);min-width:74px;letter-spacing:.05em;text-transform:uppercase}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:3px;
  background:linear-gradient(90deg,var(--hi),var(--vio));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;
  background:#eaf6ff;border:2px solid #0b1220;box-shadow:0 1px 6px rgba(0,0,0,.6);cursor:pointer}
input[type=range]::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:#eaf6ff;
  border:2px solid #0b1220;cursor:pointer}
.val{font-size:11.5px;color:var(--hi);min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
#toast{position:absolute;left:50%;bottom:62px;transform:translate(-50%,16px);background:rgba(10,16,26,.95);
  border:1px solid rgba(34,211,238,.4);color:#d8f6ff;padding:9px 15px;border-radius:999px;font-size:12.5px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9;backdrop-filter:blur(8px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#tip{position:absolute;left:50%;top:12px;transform:translateX(-50%);font-size:11.5px;color:var(--dim);
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 13px;
  backdrop-filter:blur(10px);pointer-events:none;white-space:nowrap;transition:opacity .4s}
@media (max-width:720px){
  .brand span{display:none}
  header{gap:6px;padding:7px 8px}
  .brand b{font-size:13.5px}
  button,select{padding:5px 8px;font-size:11.5px;border-radius:8px}
  .seg button{padding:5px 9px}
  #presets{max-width:122px}
  .chip{min-width:52px;padding:5px 7px}
  #hud{font-size:10px;padding:5px 9px}
  #tip{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><b>Switchboard</b><span>Logic Circuit Workbench</span></div>
    <div class="seg" id="modes">
      <button data-mode="build" class="on">Build</button>
      <button data-mode="table">Truth</button>
      <button data-mode="scope">Scope</button>
    </div>
    <select id="presets" title="Load a circuit">
      <option value="">Load circuit…</option>
    </select>
    <button id="runBtn" class="on" title="Pause / resume the simulation">⏸ Running</button>
    <button id="delBtn" class="ghost" title="Delete tool — tap parts or wires to remove">✕ Erase</button>
    <button id="clearBtn" class="ghost" title="Empty the board">Clear</button>
    <button id="pngBtn" class="ghost" title="Export the board as a PNG">PNG</button>
    <button id="jsonBtn" class="ghost" title="Download circuit as JSON">JSON</button>
    <button id="linkBtn" class="ghost" title="Copy a share link with this circuit in it">Share</button>
  </header>
  <div id="bar"></div>
  <div id="stageWrap">
    <canvas id="stage"></canvas>
    <div id="tip">Tap a switch to flip it · drag a pin to wire · drag empty space to pan</div>
    <div id="hud"></div>
    <div id="zoom">
      <button id="zIn" title="Zoom in">+</button>
      <button id="zOut" title="Zoom out">−</button>
      <button id="zFit" title="Fit circuit to view" style="font-size:11px">fit</button>
    </div>
    <div id="panel">
      <h3><span id="panelTitle">Truth table</span><button id="panelClose">Close</button></h3>
      <div id="panelBody"></div>
    </div>
    <div id="toast"></div>
  </div>
</div>
<script>
"use strict";
/* ─────────────────────────── part specs ─────────────────────────── */
const SPEC = {
  sw  :{w:62,h:40,ins:[],              outs:1,label:"SW",  group:"in"},
  clk :{w:62,h:40,ins:[],              outs:1,label:"CLK", group:"in"},
  and :{w:66,h:48,ins:["A","B"],       outs:1,label:"AND", group:"logic"},
  or  :{w:66,h:48,ins:["A","B"],       outs:1,label:"OR",  group:"logic"},
  xor :{w:66,h:48,ins:["A","B"],       outs:1,label:"XOR", group:"logic"},
  not :{w:58,h:40,ins:["A"],           outs:1,label:"NOT", group:"logic"},
  nand:{w:66,h:48,ins:["A","B"],       outs:1,label:"NAND",group:"logic"},
  nor :{w:66,h:48,ins:["A","B"],       outs:1,label:"NOR", group:"logic"},
  dff :{w:74,h:58,ins:["D","CK"],      outs:1,label:"DFF", group:"mem"},
  lamp:{w:54,h:40,ins:[""],            outs:0,label:"LED", group:"out"},
  seg :{w:78,h:96,ins:["1","2","4","8"],outs:0,label:"7SEG",group:"out"}
};
const GROUPS = [["in","Input"],["logic","Logic"],["mem","Memory"],["out","Output"]];
const GRID = 20;
let uidN = 1;
const uid = () => uidN++;

/* ─────────────────────────── state ─────────────────────────── */
let parts = [], wires = [];
let view = {x:0, y:0, z:1};
let cur = {};                       // partId -> [outputs]
let running = true, delTool = false, armed = null, selected = null;
let clkPeriod = 9;                  // ticks per clock half-cycle
let mode = "build";
const SCOPE_LEN = 260;
let scope = [];                     // [{id,label,color,data:Uint8Array}]
let scopeHead = 0;

/* ─────────────────────────── geometry ─────────────────────────── */
const inPort = (p,i) => {
  const s = SPEC[p.type], n = Math.max(1, s.ins.length);
  return {x:p.x, y:p.y + s.h*(i+1)/(n+1)};
};
const outPort = p => { const s = SPEC[p.type]; return {x:p.x + s.w, y:p.y + s.h/2}; };
const byId = id => parts.find(p => p.id === id);
const toWorld = (sx,sy) => ({x:(sx - view.x)/view.z, y:(sy - view.y)/view.z});
const toScreen = (wx,wy) => ({x:wx*view.z + view.x, y:wy*view.z + view.y});

function wireInto(id, port){ return wires.find(w => w.di === id && w.dp === port); }

/* ─────────────────────────── simulation ─────────────────────────── */
function evaluate(){
  const out = {};
  const srcMap = new Map();
  for (const w of wires) srcMap.set(w.di + ":" + w.dp, w);
  for (const p of parts){
    if (p.type === "sw")      out[p.id] = [p.on ? 1 : 0];
    else if (p.type === "clk")out[p.id] = [p.on ? 1 : 0];
    else if (p.type === "dff")out[p.id] = [p.q ? 1 : 0];
    /* gates start from their previous level, so cross-coupled feedback
       (an SR latch) settles back into the state it was already holding */
    else                      out[p.id] = [(cur[p.id] && cur[p.id][0]) | 0];
  }
  const inOf = (p,i) => {
    const w = srcMap.get(p.id + ":" + i);
    if (!w) return 0;
    const v = out[w.si];
    return v ? (v[w.sp] | 0) : 0;
  };
  for (let pass = 0; pass < 48; pass++){
    let changed = false;
    for (const p of parts){
      let v;
      switch(p.type){
        case "and" : v = inOf(p,0) & inOf(p,1); break;
        case "or"  : v = inOf(p,0) | inOf(p,1); break;
        case "xor" : v = inOf(p,0) ^ inOf(p,1); break;
        case "nand": v = (inOf(p,0) & inOf(p,1)) ^ 1; break;
        case "nor" : v = (inOf(p,0) | inOf(p,1)) ^ 1; break;
        case "not" : v = inOf(p,0) ^ 1; break;
        default: continue;
      }
      if (out[p.id][0] !== v){ out[p.id][0] = v; changed = true; }
    }
    if (!changed) break;
  }
  out.__get = (p,i) => inOf(p,i);
  return out;
}

function tick(advanceClocks){
  if (advanceClocks){
    for (const p of parts) if (p.type === "clk"){
      p.phase = (p.phase || 0) + 1;
      if (p.phase >= clkPeriod){ p.phase = 0; p.on = !p.on; }
    }
  }
  let out = evaluate();
  let flipped = false;
  for (const p of parts) if (p.type === "dff"){
    const d = out.__get(p,0), c = out.__get(p,1);
    if (c === 1 && p.prevClk === 0 && p.q !== d){ p.q = d; flipped = true; }
    p.prevClk = c;
  }
  if (flipped) out = evaluate();
  cur = out;
}

/* value of a part's visible signal, for scope / lamps */
function sigOf(p){
  if (p.type === "lamp") return cur.__get ? cur.__get(p,0) : 0;
  const v = cur[p.id];
  return v ? v[0] : 0;
}

/* ─────────────────────────── scope ─────────────────────────── */
function rebuildScope(){
  const picks = parts.filter(p => p.type === "sw" || p.type === "clk" || p.type === "lamp" || p.type === "dff").slice(0,12);
  scope = picks.map((p,i) => ({
    id:p.id,
    label:(p.type === "sw" ? "SW" : p.type === "clk" ? "CLK" : p.type === "dff" ? "Q" : "LED") + (i+1),
    color:p.type === "lamp" ? "#fbbf24" : p.type === "clk" ? "#a78bfa" : p.type === "dff" ? "#34d399" : "#22d3ee",
    data:new Uint8Array(SCOPE_LEN)
  }));
  scopeHead = 0;
}
function recordScope(){
  for (const s of scope){
    const p = byId(s.id);
    s.data[scopeHead] = p ? sigOf(p) : 0;
  }
  scopeHead = (scopeHead + 1) % SCOPE_LEN;
}

/* ─────────────────────────── drawing ─────────────────────────── */
const stage = document.getElementById("stage");
const ctx = stage.getContext("2d");
let W = 0, H = 0, DPR = 1, T = 0;

function resize(){
  const r = stage.parentElement.getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const nW = Math.max(1, Math.round(r.width)), nH = Math.max(1, Math.round(r.height));
  /* keep whatever was in the middle of the board in the middle of the board */
  if (W && H && (nW !== W || nH !== H)){ view.x += (nW - W)/2; view.y += (nH - H)/2; }
  W = nW; H = nH;
  stage.width = Math.round(W*DPR); stage.height = Math.round(H*DPR);
}

function wirePath(w){
  const a = byId(w.si), b = byId(w.di);
  if (!a || !b) return null;
  const p1 = outPort(a), p2 = inPort(b, w.dp);
  const d = Math.max(28, Math.min(130, Math.abs(p2.x - p1.x)*0.55));
  return {p1, p2, c1:{x:p1.x + d, y:p1.y}, c2:{x:p2.x - d, y:p2.y}};
}
function wirePoint(pp, t){
  const u = 1 - t, a = u*u*u, b = 3*u*u*t, c = 3*u*t*t, e = t*t*t;
  return {x:a*pp.p1.x + b*pp.c1.x + c*pp.c2.x + e*pp.p2.x,
          y:a*pp.p1.y + b*pp.c1.y + c*pp.c2.y + e*pp.p2.y};
}

function rrect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}

const SEG7 = ["1111110","0110000","1101101","1111001","0110011","1011011","1011111",
              "1110000","1111111","1111011","1110111","0011111","1001110","0111101","1001111","1000111"];

function drawPart(c, p, hot){
  const s = SPEC[p.type], v = sigOf(p);
  const on = v === 1;
  c.save();
  c.translate(p.x, p.y);

  /* pins */
  c.lineWidth = 2;
  for (let i = 0; i < s.ins.length; i++){
    const q = inPort(p,i); const y = q.y - p.y;
    const iv = cur.__get ? cur.__get(p,i) : 0;
    c.strokeStyle = iv ? "rgba(34,211,238,.85)" : "rgba(120,145,180,.5)";
    c.beginPath(); c.moveTo(-9, y); c.lineTo(0, y); c.stroke();
    c.fillStyle = iv ? "#22d3ee" : "#55678a";
    c.beginPath(); c.arc(-9, y, 3.4, 0, 6.2832); c.fill();
    if (s.ins[i]){
      c.fillStyle = "rgba(170,195,230,.6)"; c.font = "600 8.5px system-ui"; c.textAlign = "left"; c.textBaseline = "middle";
      c.fillText(s.ins[i], 4, y);
    }
  }
  if (s.outs){
    const y = s.h/2, bub = (p.type === "not" || p.type === "nand" || p.type === "nor");
    c.strokeStyle = on ? "rgba(34,211,238,.9)" : "rgba(120,145,180,.5)";
    c.beginPath(); c.moveTo(s.w, y); c.lineTo(s.w + 9, y); c.stroke();
    c.fillStyle = on ? "#22d3ee" : "#55678a";
    c.beginPath(); c.arc(s.w + 9, y, 3.4, 0, 6.2832); c.fill();
    if (bub){
      c.fillStyle = "#0c1320"; c.strokeStyle = on ? "rgba(34,211,238,.8)" : "rgba(120,145,180,.55)"; c.lineWidth = 1.6;
      c.beginPath(); c.arc(s.w - 4, y, 4.2, 0, 6.2832); c.fill(); c.stroke();
    }
  }

  /* body */
  const g = c.createLinearGradient(0, 0, 0, s.h);
  if (p.type === "lamp" || p.type === "seg"){ g.addColorStop(0,"#1a2133"); g.addColorStop(1,"#0e1422"); }
  else if (p.type === "sw"){ g.addColorStop(0, on ? "#17384a" : "#1b2234"); g.addColorStop(1, on ? "#0e2c3c" : "#111726"); }
  else if (p.type === "clk"){ g.addColorStop(0,"#241f3d"); g.addColorStop(1,"#15122a"); }
  else if (p.type === "dff"){ g.addColorStop(0,"#152e2a"); g.addColorStop(1,"#0c1c1a"); }
  else { g.addColorStop(0,"#1c2436"); g.addColorStop(1,"#111826"); }
  c.fillStyle = g;
  const accent = p.type === "clk" ? "#a78bfa" : p.type === "dff" ? "#34d399" :
                 (p.type === "lamp" || p.type === "seg") ? "#fbbf24" : "#22d3ee";
  c.shadowColor = on ? accent : "rgba(0,0,0,.55)";
  c.shadowBlur = on ? 16 : 7; c.shadowOffsetY = on ? 0 : 3;
  rrect(c, 0, 0, s.w, s.h, 9); c.fill();
  c.shadowBlur = 0; c.shadowOffsetY = 0;
  c.lineWidth = hot ? 2 : 1.2;
  c.strokeStyle = hot ? "#eaf6ff" : on ? "rgba(34,211,238,.6)" : "rgba(150,175,210,.26)";
  rrect(c, 0, 0, s.w, s.h, 9); c.stroke();

  c.textAlign = "center"; c.textBaseline = "middle";
  if (p.type === "sw"){
    c.fillStyle = "rgba(160,185,220,.55)"; c.font = "600 8px system-ui";
    c.fillText("SWITCH", s.w/2, 11);
    rrect(c, 11, 19, s.w-22, 13, 6.5);
    c.fillStyle = on ? "rgba(34,211,238,.32)" : "rgba(255,255,255,.07)"; c.fill();
    c.fillStyle = on ? "#eafcff" : "#8fa3c2";
    c.beginPath(); c.arc(on ? s.w-19 : 19, 25.5, 5.6, 0, 6.2832); c.fill();
    c.fillStyle = on ? "#22d3ee" : "#64768f"; c.font = "700 9px system-ui";
    c.fillText(on ? "1" : "0", on ? 20 : s.w-20, 26);
  } else if (p.type === "clk"){
    c.fillStyle = "rgba(190,175,255,.7)"; c.font = "700 9px system-ui";
    c.fillText("CLOCK", s.w/2, 12);
    c.strokeStyle = on ? "#c4b5fd" : "#6b5fa0"; c.lineWidth = 1.8;
    const bx = 12, by = 30, bw = s.w - 24;
    c.beginPath();
    c.moveTo(bx, by); c.lineTo(bx + bw*.2, by); c.lineTo(bx + bw*.2, by-11);
    c.lineTo(bx + bw*.55, by-11); c.lineTo(bx + bw*.55, by); c.lineTo(bx + bw*.8, by);
    c.lineTo(bx + bw*.8, by-11); c.lineTo(bx + bw, by-11);
    c.stroke();
  } else if (p.type === "lamp"){
    const r = 11;
    if (on){
      const rg = c.createRadialGradient(s.w/2, s.h/2, 1, s.w/2, s.h/2, 22);
      rg.addColorStop(0,"rgba(253,224,71,.95)"); rg.addColorStop(.5,"rgba(251,191,36,.35)"); rg.addColorStop(1,"rgba(251,191,36,0)");
      c.fillStyle = rg; c.beginPath(); c.arc(s.w/2, s.h/2, 22, 0, 6.2832); c.fill();
    }
    c.fillStyle = on ? "#fde047" : "#242d42";
    c.beginPath(); c.arc(s.w/2, s.h/2, r, 0, 6.2832); c.fill();
    c.strokeStyle = on ? "rgba(255,245,180,.9)" : "rgba(150,175,210,.3)"; c.lineWidth = 1.5; c.stroke();
  } else if (p.type === "seg"){
    const bits = (cur.__get ? (cur.__get(p,0) | cur.__get(p,1)<<1 | cur.__get(p,2)<<2 | cur.__get(p,3)<<3) : 0) & 15;
    const pat = SEG7[bits];
    const ox = 20, oy = 16, w = 36, h = 56, t = 6;
    const segs = [
      [ox,oy,w,t,0],[ox+w-t,oy,t,h/2,1],[ox+w-t,oy+h/2,t,h/2,1],
      [ox,oy+h-t,w,t,0],[ox,oy+h/2,t,h/2,1],[ox,oy,t,h/2,1],[ox,oy+h/2-t/2,w,t,0]
    ];
    for (let i = 0; i < 7; i++){
      const [x,y,sw2,sh] = segs[i], lit = pat[i] === "1";
      c.fillStyle = lit ? "#fbbf24" : "rgba(255,255,255,.055)";
      if (lit){ c.shadowColor = "#fbbf24"; c.shadowBlur = 9; }
      rrect(c, x, y, sw2, sh, 2.5); c.fill(); c.shadowBlur = 0;
    }
    c.fillStyle = "rgba(170,195,230,.55)"; c.font = "600 8px system-ui";
    c.fillText("HEX " + bits.toString(16).toUpperCase(), s.w/2, s.h - 7);
  } else if (p.type === "dff"){
    c.fillStyle = "rgba(190,255,230,.85)"; c.font = "700 11px system-ui";
    c.fillText("D-FF", s.w/2, 17);
    c.fillStyle = on ? "#34d399" : "#5d7083"; c.font = "700 15px system-ui";
    c.fillText("Q=" + (p.q ? 1 : 0), s.w/2, 38);
  } else {
    c.fillStyle = on ? "#d6f7ff" : "rgba(205,222,245,.82)";
    c.font = "700 " + (s.label.length > 3 ? 11 : 13) + "px system-ui";
    c.fillText(s.label, s.w/2 + 2, s.h/2);
  }
  c.restore();
}

function drawBoard(c, vw){
  c.save();
  c.fillStyle = "#070b12";
  c.fillRect(0, 0, vw.w, vw.h);
  /* dot grid */
  const step = GRID*vw.z;
  if (step > 7){
    c.fillStyle = "rgba(120,150,195,.15)";
    const sx = ((vw.x % step) + step) % step, sy = ((vw.y % step) + step) % step;
    c.beginPath();                       /* one path, one fill — 2k rects was costing frames */
    for (let x = sx; x < vw.w; x += step)
      for (let y = sy; y < vw.h; y += step) c.rect(x, y, 1.3, 1.3);
    c.fill();
  }
  c.translate(vw.x, vw.y); c.scale(vw.z, vw.z);

  /* wires */
  for (const w of wires){
    const pp = wirePath(w); if (!pp) continue;
    const src = byId(w.si);
    const on = sigOf(src) === 1;
    c.beginPath();
    c.moveTo(pp.p1.x, pp.p1.y);
    c.bezierCurveTo(pp.c1.x, pp.c1.y, pp.c2.x, pp.c2.y, pp.p2.x, pp.p2.y);
    c.lineCap = "round"; c.setLineDash([]);
    c.strokeStyle = on ? "rgba(34,211,238,.26)" : "rgba(110,135,170,.22)";
    c.lineWidth = on ? 6 : 4; c.stroke();
    c.strokeStyle = on ? "#22d3ee" : "#46587a";
    c.lineWidth = on ? 2.2 : 1.7; c.stroke();
    if (on){
      c.setLineDash([5, 13]); c.lineDashOffset = -(T*0.085) % 18;
      c.strokeStyle = "#c8fbff"; c.lineWidth = 2.6; c.stroke(); c.setLineDash([]);
    }
  }
  /* pending wire */
  if (drag && drag.kind === "wire"){
    c.beginPath(); c.moveTo(drag.ox, drag.oy);
    const d = Math.max(28, Math.abs(drag.mx - drag.ox)*0.55);
    c.bezierCurveTo(drag.ox + d, drag.oy, drag.mx - d, drag.my, drag.mx, drag.my);
    c.setLineDash([6, 6]); c.strokeStyle = "#a78bfa"; c.lineWidth = 2; c.stroke(); c.setLineDash([]);
    c.fillStyle = "#a78bfa"; c.beginPath(); c.arc(drag.mx, drag.my, 4, 0, 6.2832); c.fill();
  }
  for (const p of parts) drawPart(c, p, selected === p.id || (hover && hover.id === p.id));
  c.restore();
}

/* ─────────────────────────── loop ─────────────────────────── */
let acc = 0, last = performance.now(), fps = 60, fpsAcc = 0, fpsN = 0;
function frame(now){
  const dt = Math.min(90, now - last); last = now; T = now;
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 500){ fps = Math.round(1000/(fpsAcc/fpsN)); fpsAcc = 0; fpsN = 0; }
  acc += dt;
  const STEP = 1000/24;
  let steps = 0;
  while (acc >= STEP && steps < 4){
    acc -= STEP; steps++;
    tick(running);
    if (running) recordScope();
  }
  if (!steps && !cur.__get) tick(false);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBoard(ctx, {x:view.x, y:view.y, z:view.z, w:W, h:H});
  if (mode === "scope" && panel.classList.contains("open")) drawScope();
  hud.innerHTML = "<b>" + parts.length + "</b> parts · <b>" + wires.length + "</b> wires · <b>" +
    parts.filter(p => sigOf(p) === 1).length + "</b> high · " + fps + " fps";
  requestAnimationFrame(frame);
}

/* ─────────────────────────── hit testing ─────────────────────────── */
function partAt(wx, wy){
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i], s = SPEC[p.type];
    if (wx >= p.x - 2 && wx <= p.x + s.w + 2 && wy >= p.y - 2 && wy <= p.y + s.h + 2) return p;
  }
  return null;
}
function portAt(wx, wy){
  const R = 13;
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i], s = SPEC[p.type];
    if (s.outs){
      const q = outPort(p);
      if (Math.hypot(wx - (q.x + 9), wy - q.y) < R) return {p, dir:"out", idx:0, x:q.x, y:q.y};
    }
    for (let k = 0; k < s.ins.length; k++){
      const q = inPort(p, k);
      if (Math.hypot(wx - (q.x - 9), wy - q.y) < R) return {p, dir:"in", idx:k, x:q.x, y:q.y};
    }
  }
  return null;
}
function wireAt(wx, wy){
  for (const w of wires){
    const pp = wirePath(w); if (!pp) continue;
    for (let i = 0; i <= 20; i++){
      const q = wirePoint(pp, i/20);
      if (Math.hypot(q.x - wx, q.y - wy) < 9) return w;
    }
  }
  return null;
}

/* ─────────────────────────── interaction ─────────────────────────── */
let drag = null, hover = null, moved = false;
const panel = document.getElementById("panel");
const hud = document.getElementById("hud");

function connect(src, dst, dp){
  if (src.id === dst.id) return false;
  const old = wireInto(dst.id, dp);
  if (old) wires.splice(wires.indexOf(old), 1);
  wires.push({id:uid(), si:src.id, sp:0, di:dst.id, dp});
  return true;
}

stage.addEventListener("pointerdown", e => {
  stage.setPointerCapture(e.pointerId);
  const r = stage.getBoundingClientRect();
  const w = toWorld(e.clientX - r.left, e.clientY - r.top);
  moved = false;
  const port = portAt(w.x, w.y);
  if (armed){
    const s = SPEC[armed];
    addPart(armed, Math.round((w.x - s.w/2)/GRID)*GRID, Math.round((w.y - s.h/2)/GRID)*GRID);
    armed = null; renderBar(); afterEdit();
    return;
  }
  if (delTool){
    const p = partAt(w.x, w.y);
    if (p){ removePart(p); afterEdit(); return; }
    const wr = wireAt(w.x, w.y);
    if (wr){ wires.splice(wires.indexOf(wr), 1); afterEdit(); return; }
    return;
  }
  if (port){
    drag = {kind:"wire", from:port, ox:port.dir === "out" ? port.x + 9 : port.x - 9, oy:port.y, mx:w.x, my:w.y};
    return;
  }
  const p = partAt(w.x, w.y);
  if (p){
    selected = p.id;
    drag = {kind:"part", p, dx:w.x - p.x, dy:w.y - p.y};
    return;
  }
  selected = null;
  drag = {kind:"pan", sx:e.clientX, sy:e.clientY, vx:view.x, vy:view.y};
});

stage.addEventListener("pointermove", e => {
  const r = stage.getBoundingClientRect();
  const w = toWorld(e.clientX - r.left, e.clientY - r.top);
  if (!drag){ hover = partAt(w.x, w.y); return; }
  if (drag.kind === "wire"){ drag.mx = w.x; drag.my = w.y; moved = true; }
  else if (drag.kind === "part"){
    const nx = Math.round((w.x - drag.dx)/GRID)*GRID, ny = Math.round((w.y - drag.dy)/GRID)*GRID;
    if (nx !== drag.p.x || ny !== drag.p.y) moved = true;
    drag.p.x = nx; drag.p.y = ny;
  } else if (drag.kind === "pan"){
    view.x = drag.vx + (e.clientX - drag.sx); view.y = drag.vy + (e.clientY - drag.sy);
    if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 4) moved = true;
  }
});

stage.addEventListener("pointerup", e => {
  const r = stage.getBoundingClientRect();
  const w = toWorld(e.clientX - r.left, e.clientY - r.top);
  if (drag && drag.kind === "wire"){
    const t = portAt(w.x, w.y);
    if (t && t.p.id !== drag.from.p.id){
      if (drag.from.dir === "out" && t.dir === "in") connect(drag.from.p, t.p, t.idx);
      else if (drag.from.dir === "in" && t.dir === "out") connect(t.p, drag.from.p, drag.from.idx);
      afterEdit();
    }
  } else if (drag && drag.kind === "part" && !moved){
    const p = drag.p;
    if (p.type === "sw"){ p.on = !p.on; afterEdit(); }
    else if (p.type === "clk"){ p.on = !p.on; p.phase = 0; }
  } else if (drag && drag.kind === "part" && moved){
    afterEdit();
  }
  drag = null;
});
stage.addEventListener("pointercancel", () => { drag = null; });
stage.addEventListener("wheel", e => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  zoomAt(mx, my, e.deltaY < 0 ? 1.12 : 1/1.12);
}, {passive:false});

function zoomAt(mx, my, k){
  const z2 = Math.max(0.42, Math.min(2.2, view.z*k));
  const w = toWorld(mx, my);
  view.z = z2;
  view.x = mx - w.x*z2; view.y = my - w.y*z2;
}
document.getElementById("zIn").onclick = () => zoomAt(W/2, H/2, 1.2);
document.getElementById("zOut").onclick = () => zoomAt(W/2, H/2, 1/1.2);
document.getElementById("zFit").onclick = fit;

function fit(){
  if (!parts.length){ view = {x:W/2 - 100, y:H/2 - 60, z:1}; return; }
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const p of parts){
    const s = SPEC[p.type];
    x0 = Math.min(x0, p.x - 16); y0 = Math.min(y0, p.y - 10);
    x1 = Math.max(x1, p.x + s.w + 16); y1 = Math.max(y1, p.y + s.h + 10);
  }
  const pad = 26;
  const z = Math.max(0.42, Math.min(1.5, Math.min((W - pad*2)/(x1 - x0), (H - pad*2)/(y1 - y0))));
  view.z = z;
  view.x = (W - (x1 - x0)*z)/2 - x0*z;
  view.y = (H - (y1 - y0)*z)/2 - y0*z;
}

window.addEventListener("keydown", e => {
  if (e.key === "Delete" || e.key === "Backspace"){
    const p = selected && byId(selected);
    if (p){ removePart(p); selected = null; afterEdit(); e.preventDefault(); }
  } else if (e.key === " "){ toggleRun(); e.preventDefault(); }
  else if (e.key === "Escape"){ armed = null; delTool = false; renderBar(); syncBtns(); }
});

function addPart(type, x, y){
  const p = {id:uid(), type, x, y};
  if (type === "sw") p.on = false;
  if (type === "clk"){ p.on = false; p.phase = 0; }
  if (type === "dff"){ p.q = 0; p.prevClk = 0; }
  parts.push(p);
  return p;
}
function removePart(p){
  parts.splice(parts.indexOf(p), 1);
  wires = wires.filter(w => w.si !== p.id && w.di !== p.id);
}

function renderBar(){
  const bar = document.getElementById("bar");
  let html = "";
  GROUPS.forEach(([g,name], gi) => {
    if (gi) html += '<div class="sepv"></div>';
    for (const k in SPEC) if (SPEC[k].group === g){
      html += '<div class="chip' + (armed === k ? " sel" : "") + '" data-add="' + k + '" title="Add ' + SPEC[k].label + ' — then tap the board">' +
        '<svg viewBox="0 0 30 20">' + ICONS[k] + '</svg><i>' + SPEC[k].label + "</i></div>";
    }

      if (armed) toast("Tap the board to place " + SPEC[armed].label);

/* ─────────────────────────── panels ─────────────────────────── */
function setMode(m){
  mode = m;
  document.querySelectorAll("#modes button").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
  if (m === "build"){ panel.classList.remove("open"); return; }
  panel.classList.add("open");
  document.getElementById("panelTitle").textContent = m === "table" ? "Truth table" : "Logic scope";
  if (m === "table") renderTable(); else renderScopePanel();
}
document.querySelectorAll("#modes button").forEach(b => b.onclick = () => setMode(b.dataset.mode));
document.getElementById("panelClose").onclick = () => setMode("build");

function renderTable(){
  const body = document.getElementById("panelBody");
  const sws = parts.filter(p => p.type === "sw");
  const outs = parts.filter(p => p.type === "lamp");
  const hasSeq = parts.some(p => p.type === "dff" || p.type === "clk");
  if (!sws.length || !outs.length){
    body.innerHTML = '<p class="note">Add at least one <b>SW</b> input and one <b>LED</b> output, and the table writes itself — every combination of switches, swept and solved.</p>';
    return;
  }
  const n = Math.min(sws.length, 10), rows = 1 << n;
  const keep = sws.map(p => p.on);
  const data = [];
  for (let r = 0; r < rows; r++){
    for (let i = 0; i < n; i++) sws[i].on = !!(r >> (n - 1 - i) & 1);
    const out = evaluate();
    data.push(outs.map(p => out.__get(p, 0)));
  }
  sws.forEach((p,i) => { if (i < n) p.on = keep[i]; });
  tick(false);
  const curRow = sws.slice(0,n).reduce((a,p,i) => a | ((p.on ? 1 : 0) << (n - 1 - i)), 0);
  let h = "<table><thead><tr>";
  for (let i = 0; i < n; i++) h += "<th>" + String.fromCharCode(65 + i) + "</th>";
  h += '<th style="color:#fbbf24">│</th>';
  for (let i = 0; i < outs.length; i++) h += '<th style="color:#fbbf24">Y' + (i+1) + "</th>";
  h += "</tr></thead><tbody>";
  for (let r = 0; r < rows; r++){
    h += '<tr data-r="' + r + '"' + (r === curRow ? ' class="cur"' : "") + ">";
    for (let i = 0; i < n; i++){ const v = (r >> (n-1-i)) & 1; h += '<td class="v' + v + '">' + v + "</td>"; }
    h += '<td style="color:#394a63">│</td>';
    for (const v of data[r]) h += '<td class="v' + v + '">' + v + "</td>";
    h += "</tr>";
  }
  h += "</tbody></table>";
  h += '<p class="note">' + rows + " rows · " + n + " inputs → " + outs.length + " outputs. Tap a row to drive the board with it." +
       (hasSeq ? " <b style=\"color:#fbbf24\">Note:</b> this circuit has memory (DFF/CLK), so the table shows the combinational response only." : "") + "</p>";
  body.innerHTML = h;
  body.querySelectorAll("tbody tr").forEach(tr => tr.onclick = () => {
    const r = +tr.dataset.r;
    for (let i = 0; i < n; i++) sws[i].on = !!(r >> (n - 1 - i) & 1);
    tick(false); renderTable(); save();
  });
}

function renderScopePanel(){
  document.getElementById("panelBody").innerHTML =
    '<canvas id="scope" height="300"></canvas>' +
    '<div class="row"><label>Clock</label><input id="clkR" type="range" min="2" max="26" value="' + clkPeriod + '"><span class="val" id="clkV"></span></div>' +
    '<p class="note">Every switch, clock, flip-flop and lamp on the board gets a trace — 260 ticks of history, newest on the right. Flip a switch and watch the edge travel.</p>';
  const r = document.getElementById("clkR"), v = document.getElementById("clkV");
  const upd = () => { clkPeriod = +r.value; v.textContent = (24/(clkPeriod*2)).toFixed(1) + " Hz"; };
  r.oninput = upd; upd();
}
function drawScope(){
  const cv = document.getElementById("scope"); if (!cv) return;
  const w = cv.clientWidth || 300;
  if (cv.width !== Math.round(w*DPR)){ cv.width = Math.round(w*DPR); cv.height = Math.round((scope.length ? scope.length*34 + 14 : 60)*DPR); cv.style.height = (cv.height/DPR) + "px"; }
  const c = cv.getContext("2d");
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.clearRect(0, 0, w, cv.height/DPR);
  if (!scope.length){
    c.fillStyle = "#8a9bb8"; c.font = "12px system-ui"; c.textAlign = "center";
    c.fillText("No signals on the board yet", w/2, 34); return;
  }
  const lx = 40, pw = w - lx - 8;
  scope.forEach((s, i) => {
    const y0 = 10 + i*34, hgt = 22;
    c.fillStyle = "rgba(255,255,255,.035)"; c.fillRect(lx, y0, pw, hgt);
    c.fillStyle = s.color; c.font = "600 9.5px system-ui"; c.textAlign = "left"; c.textBaseline = "middle";
    c.fillText(s.label, 4, y0 + hgt/2);
    c.beginPath();
    let prevY = y0 + hgt - 2.5;
    for (let k = 0; k < SCOPE_LEN; k++){
      const idx = (scopeHead + k) % SCOPE_LEN;
      const x = lx + pw*k/(SCOPE_LEN - 1);
      const y = y0 + (s.data[idx] ? 2.5 : hgt - 2.5);
      if (!k) c.moveTo(x, y);
      else { c.lineTo(x, prevY); c.lineTo(x, y); }
      prevY = y;
    }
    c.strokeStyle = s.color; c.lineWidth = 1.6; c.lineJoin = "miter"; c.stroke();
  });
}

/* ─────────────────────────── presets ─────────────────────────── */
function build(defs, conns){
  parts = []; wires = []; uidN = 1;
  const map = {};
  for (const [name, type, x, y, on] of defs){
    const p = addPart(type, x, y);
    if (on) p.on = true;
    map[name] = p;
  }
  for (const [a, b, bp] of conns) if (map[a] && map[b]) connect(map[a], map[b], bp);
  rebuildScope(); fit(); save();
}
const PRESETS = {

    [["a","sw",60,120,1],["b","sw",60,220],["x","xor",220,140],["n","and",220,240],["s","lamp",380,148],["c","lamp",380,248]],
    [["a","x",0],["b","x",1],["a","n",0],["b","n",1],["x","s",0],["n","c",0]])},
  "full-adder":{name:"Full adder", go:() => build(
    [["a","sw",40,60,1],["b","sw",40,160],["ci","sw",40,320],
     ["x1","xor",200,80],["x2","xor",360,160],["n1","and",200,240],["n2","and",360,280],["o","or",500,240],
     ["s","lamp",520,168],["c","lamp",640,248]],
    [["a","x1",0],["b","x1",1],["x1","x2",0],["ci","x2",1],["x2","s",0],
     ["a","n1",0],["b","n1",1],["x1","n2",0],["ci","n2",1],["n1","o",0],["n2","o",1],["o","c",0]])},
  "sr-latch":{name:"SR latch (cross-coupled NOR)", go:() => build(
    [["r","sw",40,100],["s","sw",40,300],["n1","nor",240,120],["n2","nor",240,280],["q","lamp",420,128],["qb","lamp",420,288]],
    [["r","n1",0],["n2","n1",1],["s","n2",0],["n1","n2",1],["n1","q",0],["n2","qb",0]])},
  "xor-from-nand":{name:"XOR from four NANDs", go:() => build(
    [["a","sw",40,100,1],["b","sw",40,260],["g1","nand",200,180],["g2","nand",360,100],["g3","nand",360,260],["g4","nand",520,180],["y","lamp",680,186]],
    [["a","g1",0],["b","g1",1],["a","g2",0],["g1","g2",1],["g1","g3",0],["b","g3",1],["g2","g4",0],["g3","g4",1],["g4","y",0]])},
  "counter-2bit":{name:"2-bit ripple counter", go:() => build(
    [["ck","clk",40,180],["n1","not",220,80],["d1","dff",360,140],["n2","not",220,300],["d2","dff",560,280],
     ["l1","lamp",520,148],["l2","lamp",720,288]],
    [["d1","n1",0],["n1","d1",0],["ck","d1",1],["d2","n2",0],["n2","d2",0],["d1","d2",1],["d1","l1",0],["d2","l2",0]])},
  "hex-counter":{name:"Hex counter → 7-segment", go:() => build(
    [["ck","clk",20,240],
     ["na","not",160,120],["fa","dff",280,180],
     ["nb","not",160,340],["fb","dff",420,300],
     ["nc","not",560,120],["fc","dff",560,180],
     ["nd","not",700,340],["fd","dff",700,300],
     ["dsp","seg",880,180]],
    [["fa","na",0],["na","fa",0],["ck","fa",1],
     ["fb","nb",0],["nb","fb",0],["fa","fb",1],
     ["fc","nc",0],["nc","fc",0],["fb","fc",1],
     ["fd","nd",0],["nd","fd",0],["fc","fd",1],
     ["fa","dsp",0],["fb","dsp",1],["fc","dsp",2],["fd","dsp",3]])},
  "decoder":{name:"2→4 decoder", go:() => build(
    [["a","sw",40,120],["b","sw",40,260],["na","not",200,120],["nb","not",200,260],
     ["g0","and",360,60],["g1","and",360,170],["g2","and",360,280],["g3","and",360,390],
     ["l0","lamp",520,66],["l1","lamp",520,176],["l2","lamp",520,286],["l3","lamp",520,396]],
    [["a","na",0],["b","nb",0],
     ["na","g0",0],["nb","g0",1],["na","g1",0],["b","g1",1],
     ["a","g2",0],["nb","g2",1],["a","g3",0],["b","g3",1],
     ["g0","l0",0],["g1","l1",0],["g2","l2",0],["g3","l3",0]])}
};
const sel = document.getElementById("presets");
for (const k in PRESETS) sel.insertAdjacentHTML("beforeend", '<option value="' + k + '">' + PRESETS[k].name + "</option>");
sel.onchange = () => {
  const k = sel.value; if (!k) return;
  PRESETS[k].go(); selected = null;
  if (mode === "table") renderTable();
  toast("Loaded " + PRESETS[k].name);
  sel.value = "";
};

/* ─────────────────────────── persistence / export ─────────────────────────── */
const LS = "switchboard_v1";
function serialize(){
  return {v:1, k:clkPeriod,
    p:parts.map(p => [p.id, p.type, p.x, p.y, p.type === "sw" ? (p.on ? 1 : 0) : 0]),
    w:wires.map(w => [w.si, w.sp, w.di, w.dp])};
}
function deserialize(o){
  if (!o || !Array.isArray(o.p)) return false;
  parts = []; wires = []; uidN = 1;
  for (const row of o.p){
    const [id, type, x, y, on] = row;
    if (!SPEC[type]) continue;
    const p = {id:+id, type, x:+x || 0, y:+y || 0};
    if (type === "sw") p.on = !!on;
    if (type === "clk"){ p.on = false; p.phase = 0; }
    if (type === "dff"){ p.q = 0; p.prevClk = 0; }
    parts.push(p); uidN = Math.max(uidN, p.id + 1);
  }
  for (const row of (o.w || [])){
    const [si, sp, di, dp] = row;
    if (byId(+si) && byId(+di)) wires.push({id:uid(), si:+si, sp:+sp || 0, di:+di, dp:+dp || 0});
  }
  if (o.k) clkPeriod = Math.max(2, Math.min(26, +o.k));
  rebuildScope();
  return parts.length > 0;
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(serialize())); }catch(e){} }
function afterEdit(){ rebuildScope(); save(); if (mode === "table") renderTable(); }

function toast(m){
  const t = document.getElementById("toast");
  t.textContent = m; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1900);
}
function download(blob, name){
  const u = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 4000);
}
document.getElementById("jsonBtn").onclick = () => {
  const s = JSON.stringify(serialize(), null, 1);
  download(new Blob([s], {type:"application/json"}), "switchboard-circuit.json");
  toast("Circuit saved as JSON (" + s.length + " bytes)");
};
document.getElementById("linkBtn").onclick = () => {
  let code = "";
  try{ code = btoa(JSON.stringify(serialize())).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
  catch(e){ toast("Could not encode circuit"); return; }
  const url = location.origin + location.pathname + "#c=" + code;
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(() => toast("Share link copied — " + url.length + " chars"),
                                            () => { location.hash = "c=" + code; toast("Link is in the address bar"); });
  } else { location.hash = "c=" + code; toast("Link is in the address bar"); }
};
document.getElementById("pngBtn").onclick = () => {
  if (!parts.length){ toast("Nothing on the board to export"); return; }
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const p of parts){
    const s = SPEC[p.type];
    x0 = Math.min(x0, p.x - 24); y0 = Math.min(y0, p.y - 20);
    x1 = Math.max(x1, p.x + s.w + 28); y1 = Math.max(y1, p.y + s.h + 20);
  }
  const pad = 34, sc = 2;
  const cw = Math.round((x1 - x0 + pad*2)*sc), ch = Math.round((y1 - y0 + pad*2 + 30)*sc);
  const cv = document.createElement("canvas"); cv.width = cw; cv.height = ch;
  const c = cv.getContext("2d");
  c.setTransform(sc, 0, 0, sc, 0, 0);
  drawBoard(c, {x:pad - x0, y:pad - y0, z:1, w:cw/sc, h:ch/sc});
  c.fillStyle = "rgba(160,185,220,.5)"; c.font = "600 11px system-ui"; c.textAlign = "left";
  c.fillText("Switchboard · " + parts.length + " parts · " + wires.length + " wires", pad, ch/sc - 14);
  cv.toBlob(b => {
    if (!b || !b.size){ toast("PNG export failed"); return; }
    download(b, "switchboard.png");
    toast("PNG exported — " + Math.round(b.size/1024) + " KB");
  }, "image/png");
};
document.getElementById("clearBtn").onclick = () => {
  parts = []; wires = []; selected = null; rebuildScope(); save();
  if (mode === "table") renderTable();
  toast("Board cleared — pick a part below");
};
function toggleRun(){ running = !running; syncBtns(); }
document.getElementById("runBtn").onclick = toggleRun;
document.getElementById("delBtn").onclick = () => { delTool = !delTool; if (delTool) armed = null; renderBar(); syncBtns(); };
function syncBtns(){
  const r = document.getElementById("runBtn");
  r.textContent = running ? "⏸ Running" : "▶ Paused";
  r.classList.toggle("on", running);
  document.getElementById("delBtn").classList.toggle("on", delTool);
}

/* ─────────────────────────── boot ─────────────────────────── */
function boot(){
  let loaded = false;
  const m = location.hash.match(/c=([A-Za-z0-9\-_]+)/);
  if (m){
    try{
      const b = m[1].replace(/-/g,"+").replace(/_/g,"/");
      loaded = deserialize(JSON.parse(atob(b + "===".slice((b.length + 3) % 4))));
      if (loaded) toast("Circuit loaded from link");
    }catch(e){ loaded = false; }
  }
  if (!loaded){
    try{ const s = localStorage.getItem(LS); if (s) loaded = deserialize(JSON.parse(s)); }catch(e){ loaded = false; }
  }
  if (!loaded) PRESETS["full-adder"].go();
  rebuildScope();
  renderBar(); syncBtns();
  resize(); fit();
  tick(false);
  requestAnimationFrame(frame);
  setTimeout(() => { resize(); fit(); }, 220);
  setTimeout(() => { const t = document.getElementById("tip"); if (t) t.style.opacity = "0"; }, 7000);
}
window.addEventListener("resize", () => { resize(); });
if (window.ResizeObserver) new ResizeObserver(() => resize()).observe(document.getElementById("stageWrap"));
window.addEventListener("beforeunload", save);
boot();
</script>
