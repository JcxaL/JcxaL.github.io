<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0a0a10">
<title>Blazon — Coat of Arms Studio</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a10; --panel:rgba(20,20,30,.9); --line:rgba(200,180,140,.18);
  --gold:#d9b45b; --txt:#efe7d6; --dim:#9b937f; --warn:#f0885a; --ok:#6fcf97;
  --ink:#141019;
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:grid;grid-template-rows:auto auto 1fr;height:100dvh;height:100vh}
header{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(40,34,26,.95),rgba(14,13,18,.95));flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-size:15px;letter-spacing:.3px;color:#f3e6c8}
.brand span{font-size:10.5px;color:var(--dim);letter-spacing:.15em;text-transform:uppercase}
button,select,input[type=text]{font:inherit;color:var(--txt);background:rgba(255,255,255,.06);
  border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:12.5px;cursor:pointer;
  transition:background .14s,border-color .14s,transform .1s}
button:active{transform:scale(.96)}
button:hover,select:hover{background:rgba(255,255,255,.12)}
button.on{background:rgba(217,180,91,.2);border-color:rgba(217,180,91,.55);color:#f6e3ae}
button.prim{background:rgba(217,180,91,.22);border-color:rgba(217,180,91,.5);color:#f8e8bd}
button.ghost{background:transparent}
input[type=text]{cursor:text}
#bar{display:flex;gap:6px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none;background:rgba(12,11,16,.7)}
#bar::-webkit-scrollbar{display:none}
.sw{flex:0 0 auto;width:40px;height:34px;border-radius:9px;border:1px solid rgba(255,255,255,.14);
  position:relative;cursor:pointer;overflow:hidden;transition:transform .12s,box-shadow .16s}
.sw:active{transform:scale(.93)}
.sw.sel{box-shadow:0 0 0 2px var(--gold);border-color:transparent}
.sw i{position:absolute;inset:auto 0 0 0;font-style:normal;font-size:8px;text-align:center;
  letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.5);color:#fff;padding:1px 0}
.slot{flex:0 0 auto;display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--dim);
  letter-spacing:.1em;text-transform:uppercase;padding-right:3px}
.sepv{flex:0 0 auto;width:1px;height:26px;background:var(--line);margin:0 4px}
#stageWrap{position:relative;overflow:hidden;background:
  radial-gradient(120% 90% at 50% 10%,#1b1a24 0%,#0a0a10 70%)}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px 14px 70px}
#stage svg{max-width:100%;max-height:100%;filter:drop-shadow(0 18px 40px rgba(0,0,0,.6))}
#blazonBox{position:absolute;left:12px;right:12px;bottom:12px;background:var(--panel);
  backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;padding:10px 13px;
  display:flex;flex-direction:column;gap:5px;max-width:720px;margin:0 auto}
#blazon{font-family:Georgia,"Times New Roman",serif;font-size:14.5px;line-height:1.45;color:#f1e4c4;
  font-style:italic}
#blazonMeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:10.5px;color:var(--dim);
  letter-spacing:.07em;text-transform:uppercase}
#tinctWarn{display:none;align-items:center;gap:6px;color:var(--warn);text-transform:none;
  letter-spacing:0;font-size:11.5px}
#tinctWarn.show{display:flex}
#tinctWarn button{padding:3px 8px;font-size:10.5px;border-radius:7px}
#toolbtns{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:7px}
#toolbtns button{width:40px;height:40px;padding:0;border-radius:12px;background:var(--panel);
  backdrop-filter:blur(10px);font-size:16px}
#panel{position:absolute;top:0;right:0;bottom:0;width:min(360px,88vw);background:var(--panel);
  backdrop-filter:blur(18px);border-left:1px solid var(--line);transform:translateX(102%);
  transition:transform .34s cubic-bezier(.3,1.25,.5,1);display:flex;flex-direction:column;z-index:6}
#panel.open{transform:none}
#panel h3{margin:0;padding:11px 13px;font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--dim);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
#panel h3 button{margin-left:auto;padding:4px 9px;font-size:11px}
#tabs{display:flex;gap:3px;padding:7px 9px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:0 0 auto;padding:6px 10px;font-size:11.5px;border-radius:8px;border:0;background:transparent;color:var(--dim)}
#tabs button.on{background:rgba(217,180,91,.2);color:#f6e3ae}
#panelBody{flex:1;overflow:auto;padding:11px 13px 26px;font-size:12.5px;line-height:1.5}
.grp{margin-bottom:14px}
.grp>label{display:block;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:5px}
.opts button{padding:7px 6px;font-size:11.5px;border-radius:9px;text-align:center;line-height:1.2}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;flex-direction:column;align-items:center;gap:3px;width:58px;padding:6px 3px;border-radius:10px;
  border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;transition:background .14s,transform .1s}
.chip:active{transform:scale(.94)}
.chip.sel{background:rgba(217,180,91,.2);border-color:rgba(217,180,91,.5)}
.chip svg{width:30px;height:30px;display:block}
.chip i{font-style:normal;font-size:8.5px;letter-spacing:.03em;color:var(--dim);text-align:center;line-height:1.15}
.chip.sel i{color:#f6e3ae}
.row{display:flex;align-items:center;gap:9px;margin:7px 0}
.row span{font-size:11.5px;color:var(--dim);min-width:74px}
.row output{font-size:11px;color:#f6e3ae;min-width:30px;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:22px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:rgba(255,255,255,.14)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--gold);margin-top:-6px;border:0}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.14)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--gold)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid rgba(255,255,255,.05)}
.tog span{font-size:12px}
.sw2{width:42px;height:24px;border-radius:999px;background:rgba(255,255,255,.12);position:relative;
  cursor:pointer;flex:0 0 auto;transition:background .2s}
.sw2::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:#fff;transition:transform .26s cubic-bezier(.3,1.4,.5,1)}
.sw2.on{background:rgba(217,180,91,.65)}
.sw2.on::after{transform:translateX(18px)}
#armory{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.arm{border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.04);padding:6px;
  cursor:pointer;position:relative;transition:transform .12s,border-color .14s}
.arm:active{transform:scale(.95)}
.arm svg{width:100%;height:auto;display:block}
.arm b{display:block;font-size:9.5px;font-weight:500;color:var(--dim);text-align:center;margin-top:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arm .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#2a2230;
  border:1px solid var(--line);color:var(--warn);font-size:12px;line-height:18px;text-align:center}
.hint{font-size:11.5px;color:var(--dim);line-height:1.5}
#toast{position:absolute;left:50%;bottom:92px;transform:translate(-50%,16px);opacity:0;pointer-events:none;
  background:rgba(32,28,22,.95);border:1px solid var(--line);border-radius:999px;padding:8px 15px;
  font-size:12px;color:#f6e3ae;transition:opacity .22s,transform .3s cubic-bezier(.3,1.3,.5,1);z-index:9;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:560px){
  .brand span{display:none}
  #blazon{font-size:13px}
  #stage{padding:8px 8px 96px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><b>Blazon</b><span>Coat of Arms Studio</span></div>
    <button id="btnRand" class="prim">⚄ Random</button>
    <button id="btnPreset" class="ghost">Presets</button>
    <button id="btnSave">Save</button>
    <button id="btnPanel" class="on">Design ▸</button>
  </header>
  <div id="bar"></div>
  <div id="stageWrap">
    <div id="stage"></div>
    <div id="toolbtns">
      <button id="btnHatch" title="Engraver's hatching">▦</button>
      <button id="btnShare" title="Copy share link">↗</button>
      <button id="btnSvg" title="Download SVG">S</button>
      <button id="btnPng" title="Download PNG">P</button>
    </div>
    <div id="blazonBox">
      <div id="blazon">—</div>
      <div id="blazonMeta">
        <span id="metaName">Unnamed arms</span>
        <span id="tinctWarn"><b>⚠</b><span id="warnTxt"></span><button id="btnFix">Fix</button></span>
      </div>
    </div>
    <div id="toast"></div>
    <aside id="panel" class="open">
      <h3>Design <button id="btnClose" class="ghost">Close</button></h3>
      <div id="tabs"></div>
      <div id="panelBody"></div>
    </aside>
  </div>
</div>
<script>
"use strict";
/* ============================ data ============================ */
const W=200,H=240;
const TINCT={
  or:{n:'or',f:'#e0b33f',d:'#a8801d',metal:1,h:'dots'},
  argent:{n:'argent',f:'#eff2f6',d:'#c3c8d0',metal:1,h:'plain'},
  gules:{n:'gules',f:'#b32b31',d:'#7d1a1f',h:'vl'},
  azure:{n:'azure',f:'#20509e',d:'#143a76',h:'hl'},
  vert:{n:'vert',f:'#1f7c49',d:'#115433',h:'bd'},
  sable:{n:'sable',f:'#1c1c24',d:'#000000',h:'xh'},
  purpure:{n:'purpure',f:'#6e3081',d:'#481e56',h:'bs'},
  tenne:{n:'tenné',f:'#9b5a22',d:'#6c3b12',h:'tn'},
  ermine:{n:'ermine',fur:1,f:'#eff2f6',d:'#1c1c24',h:'plain'},
  vair:{n:'vair',fur:1,f:'#20509e',d:'#eff2f6',h:'plain'}
};
const TKEYS=Object.keys(TINCT);
const SHAPES={
  heater:{n:'Heater',d:`M12 8H188V94C188 158 146 206 100 232C54 206 12 158 12 94Z`},
  french:{n:'French',d:`M12 8H188V186C188 214 150 232 100 232C50 232 12 214 12 186Z`},
  iberian:{n:'Iberian',d:`M12 8H188V142A88 88 0 0 1 100 232A88 88 0 0 1 12 142Z`},
  spanish:{n:'Spanish',d:`M12 8H188V200Q188 232 100 232Q12 232 12 200Z`},
  lozenge:{n:'Lozenge',d:`M100 6L192 120L100 234L8 120Z`},
  oval:{n:'Oval',d:`M100 6C150 6 172 58 172 120C172 182 150 234 100 234C50 234 28 182 28 120C28 58 50 6 100 6Z`},
  banner:{n:'Banner',d:`M14 14H186V226H14Z`}
};
const DIVS=['plain','perPale','perFess','perBend','perBendSin','quarterly','perSaltire','perChevron',
  'gyronny','barry','paly','bendy','chequy','lozengy'];
const DIVN={plain:'Plain',perPale:'Per pale',perFess:'Per fess',perBend:'Per bend',
  perBendSin:'Per bend sinister',quarterly:'Quarterly',perSaltire:'Per saltire',perChevron:'Per chevron',
  gyronny:'Gyronny',barry:'Barry',paly:'Paly',bendy:'Bendy',chequy:'Chequy',lozengy:'Lozengy'};
const ORDS=['none','chief','fess','pale','bend','bendSin','cross','saltire','chevron','pile','bordure'];
const ORDN={none:'none',chief:'a chief',fess:'a fess',pale:'a pale',bend:'a bend',
  bendSin:'a bend sinister',cross:'a cross',saltire:'a saltire',chevron:'a chevron',
  pile:'a pile',bordure:'a bordure'};
const LINES=['plain','wavy','indented','engrailed','embattled'];
const LINEN={plain:'',wavy:' wavy',indented:' indented',engrailed:' engrailed',embattled:' embattled'};

/* ---------- small geometry helpers ---------- */
const P=(a)=>a.map(p=>p[0].toFixed(2)+' '+p[1].toFixed(2)).join(' L');
function circP(cx,cy,r){return `M${cx-r} ${cy}A${r} ${r} 0 1 0 ${cx+r} ${cy}A${r} ${r} 0 1 0 ${cx-r} ${cy}Z`;}
function star(n,ro,ri,cx,cy,rot){let p='';for(let i=0;i<n;i++){
  const a=rot+i*2*Math.PI/n, b=a+Math.PI/n;
  p+=(i?'L':'M')+(cx+ro*Math.cos(a)).toFixed(2)+' '+(cy+ro*Math.sin(a)).toFixed(2)
    +'L'+(cx+ri*Math.cos(b)).toFixed(2)+' '+(cy+ri*Math.sin(b)).toFixed(2);} return p+'Z';}
function almond(cx,cy,w,h,rot){rot=(rot||0)*Math.PI/180;
  const co=Math.cos(rot),si=Math.sin(rot),m=(x,y)=>[(cx+(x*co-y*si)).toFixed(2),(cy+(x*si+y*co)).toFixed(2)];
  const t=m(0,-h),b=m(0,h),l=m(-w,0),r=m(w,0);
  return `M${t[0]} ${t[1]}Q${l[0]} ${l[1]} ${b[0]} ${b[1]}Q${r[0]} ${r[1]} ${t[0]} ${t[1]}Z`;}
/* a styled partition line between two points; side flips the bulge */
function styledLine(a,b,style,side){
  const dx=b[0]-a[0], dy=b[1]-a[1], L=Math.hypot(dx,dy);
  if(style==='plain'||L<1) return [a,b];
  const ux=dx/L, uy=dy/L, nx=-uy*side, ny=ux*side;
  const per=style==='embattled'?26:24, amp=5.5, cyc=Math.max(1,Math.round(L/per));
  const M=Math.max(16,Math.min(400,Math.round(L/2))), out=[];
  for(let i=0;i<=M;i++){
    const t=i/M, x=a[0]+dx*t, y=a[1]+dy*t, u=cyc*t; let o=0;
    if(style==='wavy') o=amp*Math.sin(2*Math.PI*u);
    else if(style==='engrailed') o=amp*Math.abs(Math.sin(Math.PI*u))-amp*0.5;
    else if(style==='indented') o=amp*(4*Math.abs((u%1)-0.5)-1);
    else if(style==='embattled') o=((u%1)<0.5?amp:-amp);
    out.push([x+nx*o,y+ny*o]);
  }
  return out;
}
/* a band (ordinary) at an angle through (cx,cy) */
function band(deg,cx,cy,hw,style){
  const a=deg*Math.PI/180, dx=Math.cos(a), dy=Math.sin(a), nx=-dy, ny=dx, L=460;
  const p1=[cx-dx*L/2,cy-dy*L/2], p2=[cx+dx*L/2,cy+dy*L/2];
  const e1=styledLine([p1[0]+nx*hw,p1[1]+ny*hw],[p2[0]+nx*hw,p2[1]+ny*hw],style,1);
  const e2=styledLine([p2[0]-nx*hw,p2[1]-ny*hw],[p1[0]-nx*hw,p1[1]-ny*hw],style,1);
  return 'M'+P(e1)+'L'+P(e2)+'Z';
}
function halfPlane(a,b,style,side){ // region on one side of a styled line, closed far away
  const e=styledLine(a,b,style,1);
  const dx=b[0]-a[0], dy=b[1]-a[1], L=Math.hypot(dx,dy), nx=-dy/L*side, ny=dx/L*side, F=420;
  const last=e[e.length-1], first=e[0];
  return 'M'+P(e)+`L${last[0]+nx*F} ${last[1]+ny*F}L${first[0]+nx*F} ${first[1]+ny*F}Z`;
}

/* ---------- charges: each returns svg markup inside a 100x100 box ---------- */
function pathEl(d,fill,extra){return `<path d="${d}" fill="${fill}"${extra||''}/>`;}
const CHARGES={
  mullet:{n:'mullet',p:'mullets',f:(c,c2,o)=>pathEl(star(o.pts||5,46,o.pts>5?20:19,50,50,-Math.PI/2),c)},
  estoile:{n:'estoile',p:'estoiles',f:(c)=>{let p='';const n=6;
    for(let i=0;i<n;i++){const a0=-Math.PI/2+i*2*Math.PI/n,a1=a0+Math.PI/n,a2=a0+2*Math.PI/n;
      const t=[50+48*Math.cos(a0),50+48*Math.sin(a0)],m=[50+11*Math.cos(a1),50+11*Math.sin(a1)],
            t2=[50+48*Math.cos(a2),50+48*Math.sin(a2)],
            c1=[50+21*Math.cos(a0+0.30),50+21*Math.sin(a0+0.30)],c2=[50+21*Math.cos(a2-0.30),50+21*Math.sin(a2-0.30)];
      if(!i)p+=`M${t[0].toFixed(1)} ${t[1].toFixed(1)}`;
      p+=`Q${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${m[0].toFixed(1)} ${m[1].toFixed(1)}`+
         `Q${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${t2[0].toFixed(1)} ${t2[1].toFixed(1)}`;}
    return pathEl(p+'Z',c);}},
  sun:{n:'sun in splendour',p:'suns in splendour',f:(c,c2)=>pathEl(star(16,48,30,50,50,-Math.PI/2),c)
    +pathEl(circP(50,50,25),c)+pathEl(circP(50,50,25),'none',` stroke="${c2}" stroke-width="1.6"`)
    +pathEl(circP(42,46,3),c2)+pathEl(circP(58,46,3),c2)
    +`<path d="M42 58Q50 64 58 58" fill="none" stroke="${c2}" stroke-width="2.4" stroke-linecap="round"/>`},
  roundel:{n:'roundel',p:'roundels',f:(c)=>pathEl(circP(50,50,40),c)},
  annulet:{n:'annulet',p:'annulets',f:(c)=>pathEl(circP(50,50,40)+circP(50,50,25),c,' fill-rule="evenodd"')},
  lozengeC:{n:'lozenge',p:'lozenges',f:(c)=>pathEl('M50 4L88 50L50 96L12 50Z',c)},
  crescent:{n:'crescent',p:'crescents',f:(c)=>{
    const R=42,r=38,dy=20,cy=54;           // outer circle, cut circle below it
    const a=(dy*dy+R*R-r*r)/(2*dy), h=Math.sqrt(Math.max(1,R*R-a*a));
    const y=cy+a, x1=50-h, x2=50+h;
    const d=`M${x1.toFixed(2)} ${y.toFixed(2)}A${R} ${R} 0 1 1 ${x2.toFixed(2)} ${y.toFixed(2)}`
      +`A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y.toFixed(2)}Z`;
    return pathEl(d,c);}},
  fleur:{n:'fleur-de-lis',p:'fleurs-de-lis',f:(c)=>pathEl(
    almond(50,26,12,28)+almond(26,32,11,26,-58)+almond(74,32,11,26,58)
    +almond(50,82,9,18)+almond(33,80,8,17,-38)+almond(67,80,8,17,38),c)
    +`<rect x="25" y="52" width="50" height="11" rx="4.5" fill="${c}"/>`},
  crossF:{n:'cross formy',p:'crosses formy',f:(c)=>{
    const arm=[[-11,-11],[-11,-29],[-30,-45],[30,-45],[11,-29],[11,-11]];
    let p='';
    for(let k=0;k<4;k++){const a=k*Math.PI/2,co=Math.cos(a),si=Math.sin(a);
      const rp=arm.map(q=>[50+q[0]*co-q[1]*si,50+q[0]*si+q[1]*co]);
      p+=(k?'L':'M')+rp[0][0].toFixed(1)+' '+rp[0][1].toFixed(1)
        +'L'+rp[1][0].toFixed(1)+' '+rp[1][1].toFixed(1)
        +`Q${((rp[1][0]+rp[2][0])/2+ (rp[2][0]-50)*0.18).toFixed(1)} ${((rp[1][1]+rp[2][1])/2+(rp[2][1]-50)*0.18).toFixed(1)} ${rp[2][0].toFixed(1)} ${rp[2][1].toFixed(1)}`
        +'L'+rp[3][0].toFixed(1)+' '+rp[3][1].toFixed(1)
        +`Q${((rp[4][0]+rp[3][0])/2+(rp[3][0]-50)*0.18).toFixed(1)} ${((rp[4][1]+rp[3][1])/2+(rp[3][1]-50)*0.18).toFixed(1)} ${rp[4][0].toFixed(1)} ${rp[4][1].toFixed(1)}`
        +'L'+rp[5][0].toFixed(1)+' '+rp[5][1].toFixed(1);}
    return pathEl(p+'Z',c);}},
  escallop:{n:'escallop',p:'escallops',f:(c,c2)=>{
    const cx=50,cy=22,rx=42,ry=64,lobes=7,a0=150,a1=30, pt=(a,k)=>[cx+rx*k*Math.cos(a*Math.PI/180),cy+ry*k*Math.sin(a*Math.PI/180)];
    let p=`M${pt(a0,0.92)[0].toFixed(1)} ${pt(a0,0.92)[1].toFixed(1)}`;
    for(let i=0;i<lobes;i++){
      const aa=a0+(a1-a0)*i/lobes, bb=a0+(a1-a0)*(i+1)/lobes, mm=(aa+bb)/2;

function fieldRegions(){
  const f=S.field, ls=f.line, out=[{d:`M-24 -24H${W+24}V${H+24}H-24Z`,t:f.t0}];
  const add=(d)=>out.push({d:d,t:f.t1});
  const n=f.n;
  switch(f.div){
    case 'plain': break;
    case 'perPale': add(halfPlane([W/2,-24],[W/2,H+24],ls,-1)); break;
    case 'perFess': add(halfPlane([-24,H*0.44],[W+24,H*0.44],ls,1)); break;
    case 'perBend': add(halfPlane([-24,-29],[W+24,H+29],ls,1)); break;
    case 'perBendSin': add(halfPlane([W+24,-29],[-24,H+29],ls,-1)); break;
    case 'quarterly': add(`M${W/2} -24H${W+24}V${H/2}H${W/2}Z`); add(`M-24 ${H/2}H${W/2}V${H+24}H-24Z`); break;
    case 'perSaltire': add(`M-24 -24L${W/2} ${H/2}L-24 ${H+24}Z`); add(`M${W+24} -24L${W/2} ${H/2}L${W+24} ${H+24}Z`); break;
    case 'perChevron': add(`M-24 ${H+24}H${W+24}V${H*0.76}L${W/2} ${H*0.33}L-24 ${H*0.76}Z`); break;
    case 'gyronny': {
      const cx=W/2, cy=H/2, R=420;
      for(let i=0;i<8;i+=2){
        const a0=(-90+i*45)*Math.PI/180, a1=(-90+(i+1)*45)*Math.PI/180;
        add(`M${cx} ${cy}L${cx+R*Math.cos(a0)} ${cy+R*Math.sin(a0)}L${cx+R*Math.cos(a1)} ${cy+R*Math.sin(a1)}Z`);
      } break; }
    case 'barry': { const h=(H+48)/n; for(let i=1;i<n;i+=2) add(`M-24 ${-24+i*h}H${W+24}V${-24+(i+1)*h}H-24Z`); break; }
    case 'paly': { const w=(W+48)/n; for(let i=1;i<n;i+=2) add(`M${-24+i*w} -24V${H+24}H${-24+(i+1)*w}V-24Z`); break; }
    case 'bendy': { const ang=50, step=(W+H)/n*0.78;
      for(let i=-n;i<=n;i+=2) add(band(ang,W/2+Math.cos((ang-90)*Math.PI/180)*i*step,
        H/2+Math.sin((ang-90)*Math.PI/180)*i*step,step/2,'plain')); break; }
    case 'chequy': { const c=Math.max(3,n), cw=(W+48)/c, ch=cw;
      const rows=Math.ceil((H+48)/ch);
      for(let j=0;j<rows;j++) for(let i=0;i<c;i++) if((i+j)%2)
        add(`M${-24+i*cw} ${-24+j*ch}h${cw}v${ch}h${-cw}Z`); break; }
    case 'lozengy': { const c=Math.max(3,n), cw=(W+48)/c, ch=cw*1.3;
      const rows=Math.ceil((H+48)/ch)+1;
      for(let j=-1;j<rows;j++) for(let i=-1;i<=c;i++){
        const x=-24+i*cw+(j%2?cw/2:0), y=-24+j*ch;
        add(`M${x+cw/2} ${y}L${x+cw} ${y+ch/2}L${x+cw/2} ${y+ch}L${x} ${y+ch/2}Z`);} break; }
  }
  return out;
}

function chargePositions(){
  const c=S.chg, o=S.ord, k=Math.min(6,Math.max(1,c.count));

function solidOf(k){const t=TINCT[k];return S.hatch?`url(#hx-${t.h})`:t.f;}
function drape(sx){
  const B=(t,p0,p1,p2)=>[(1-t)*(1-t)*p0[0]+2*(1-t)*t*p1[0]+t*t*p2[0],
                         (1-t)*(1-t)*p0[1]+2*(1-t)*t*p1[1]+t*t*p2[1]];
  const o0=[100,-18], o1=[100+sx*196,34], o2=[100+sx*78,224];
  const i0=[100,6], i1=[100+sx*104,58], i2=[100+sx*30,176];
  const N=52, pts=[];
  for(let i=0;i<=N;i++){
    const t=i/N, p=B(t,o0,o1,o2), q=B(t,i0,i1,i2);
    const dx=p[0]-q[0], dy=p[1]-q[1], L=Math.hypot(dx,dy)||1;
    const lobe=7*Math.abs(Math.sin(Math.PI*t*4.5))*Math.min(1,t*6);
    pts.push([p[0]+dx/L*lobe,p[1]+dy/L*lobe]);
  }
  for(let i=N;i>=0;i--){const t=i/N;pts.push(B(t,i0,i1,i2));}
  return 'M'+P(pts)+'Z';
}

  if(!S.hatch) inner+=`<path d="${SHAPES[S.shape].d}" fill="url(#gloss)"/>`
    +`<path d="${SHAPES[S.shape].d}" fill="url(#vign)"/>`;
  inner+=`</g>`;
  inner+=`<path d="${SHAPES[S.shape].d}" fill="none" stroke="${S.hatch?'#141019':'#2a2630'}" stroke-width="3.2"/>`;
  inner+=`<path d="${SHAPES[S.shape].d}" fill="none" stroke="${S.hatch?'none':'rgba(217,180,91,.5)'}" stroke-width="1"/>`;
  inner+=a.front;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" width="${opts.w||680}" height="${opts.h||((opts.w||680)*(ach?420/340:268/228))}">${inner}</svg>`;
}

/* ============================ blazon ============================ */
const NUMW=['','a','two','three','four','five','six','seven','eight','nine','ten'];
function tn(k){return TINCT[k].n;}
const LINEDIVS=['perPale','perFess','perBend','perBendSin'];
function fieldBlazon(){
  const f=S.field, l=LINEDIVS.includes(f.div)?LINEN[f.line]:'';
  const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
  if(f.div==='plain') return cap(tn(f.t0));
  if(['barry','paly','bendy'].includes(f.div)) return cap(DIVN[f.div])+' of '
    +(NUMW[Math.min(10,f.n)]||'six').replace(/^a$/,'two')+' '+tn(f.t0)+' and '+tn(f.t1);
  if(['chequy','lozengy','gyronny'].includes(f.div)) return cap(DIVN[f.div])+' '+tn(f.t0)+' and '+tn(f.t1);
  return cap(DIVN[f.div])+l+' '+tn(f.t0)+' and '+tn(f.t1);
}
function chargeBlazon(){
  const c=S.chg; if(c.type==='none') return '';
  const d=CHARGES[c.type], k=Math.max(1,Math.min(6,chargePositions().length));
  let nm=k===1?d.n:d.p;
  if(c.type==='mullet'&&c.pts!==5) nm=(k===1?'mullet':'mullets')+' of '+(NUMW[Math.min(10,c.pts)]||'six')+' points';
  const art=k===1?(/^[aeiou]/i.test(nm)?'an':'a'):NUMW[k];
  return art+' '+nm+' '+tn(c.t);
}
function blazonText(){
  const parts=[fieldBlazon()];
  const o=S.ord, c=S.chg, cb=chargeBlazon();
  if(o.type!=='none'){
    const lineOk=['chief','fess','pale','bend','bendSin','cross','saltire'].includes(o.type);
    const ob=ORDN[o.type]+(lineOk?LINEN[o.line]:'')+' '+tn(o.t);
    if(cb&&c.onOrd&&['fess','pale','bend','bendSin','chief','cross'].includes(o.type))
      parts.push('on '+ob+' '+cb);
    else { parts.push(ob); if(cb) parts.push(cb); }
  } else if(cb) parts.push(cb);
  return parts.join(', ')+'.';
}
function tinctureCheck(){
  const f=S.field, o=S.ord, c=S.chg, isM=k=>!!TINCT[k].metal, isFur=k=>!!TINCT[k].fur;
  const plainField=f.div==='plain';
  const clash=(a,b)=>!isFur(a)&&!isFur(b)&&isM(a)===isM(b);
  if(o.type!=='none'&&plainField&&clash(o.t,f.t0))
    return {msg:(isM(o.t)?'Metal on metal':'Colour on colour')+': '+tn(o.t)+' on '+tn(f.t0),slot:'ord'};
  if(c.type!=='none'){
    const under=(c.onOrd&&o.type!=='none')?o.t:(plainField?f.t0:null);
    if(under&&clash(c.t,under))
      return {msg:(isM(c.t)?'Metal on metal':'Colour on colour')+': '+tn(c.t)+' on '+tn(under),slot:'chg'};
  }
  return null;
}

/* ============================ armory / share / export ============================ */
function loadArmory(){try{return JSON.parse(localStorage.getItem(LSK)||'[]');}catch(e){return [];}}
function saveArmory(l){try{localStorage.setItem(LSK,JSON.stringify(l.slice(0,60)));}catch(e){}}
function b64e(s){const b=new TextEncoder().encode(s);let x='';b.forEach(c=>x+=String.fromCharCode(c));
  return btoa(x).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function b64d(s){const t=s.replace(/-/g,'+').replace(/_/g,'/');const r=atob(t);
  const b=new Uint8Array(r.length);for(let i=0;i<r.length;i++)b[i]=r.charCodeAt(i);
  return new TextDecoder().decode(b);}
function dl(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);}
function slugName(){return (S.name||'arms').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'arms';}
const ACTS={
  svg(){const s=buildSVG({w:900});dl(new Blob([s],{type:'image/svg+xml'}),slugName()+'.svg');toast('SVG saved');},
  png(){
    const s=buildSVG({w:900});
    const img=new Image();
    const url=URL.createObjectURL(new Blob([s],{type:'image/svg+xml;charset=utf-8'}));
    img.onload=()=>{
      const c=document.createElement('canvas');
      c.width=img.width*2;c.height=img.height*2;
      const x=c.getContext('2d');
      x.fillStyle='#f6f1e4';x.fillRect(0,0,c.width,c.height);
      x.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b=>{if(b&&b.size>0){dl(b,slugName()+'.png');toast('PNG saved ('+Math.round(b.size/1024)+' KB)');}
        else toast('PNG export failed');},'image/png');
    };
    img.onerror=()=>{URL.revokeObjectURL(url);toast('PNG export failed');};
    img.src=url;
  },
  share(){
    const u=location.origin+location.pathname+'#a='+b64e(JSON.stringify(S));
    const done=()=>toast('Share link copied');
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(u).then(done,()=>{location.hash='a='+b64e(JSON.stringify(S));toast('Link in address bar');});
    else {location.hash='a='+b64e(JSON.stringify(S));toast('Link in address bar');}
  },
  clear(){saveArmory([]);renderPanel();toast('Armory cleared');}
};

const WORD2=['mere','wold','haven','ford','croft','burn','gate','march','fell','stead','rook','spire','vale','watch'];

  'Fide sed cui vide','Vincit qui patitur','Dum spiro spero','Virtute non verbis','Suo Marte tutus'];

function contrastTo(k){
  const metals=['or','argent','or','argent','ermine'], colours=['gules','azure','vert','sable','purpure','tenne','vair'];
  return TINCT[k].metal||k==='ermine'?pick(colours):pick(metals);

function randomize(seed){
  srand(seed||((Math.random()*1e9)|0));
  S.shape=pick(Object.keys(SHAPES));
  S.field.div=pick(DIVS);
  S.field.t0=pick(['gules','azure','vert','sable','purpure','tenne','or','argent','ermine','vair']);
  S.field.t1=contrastTo(S.field.t0);
  S.field.line=rnd()<0.78?'plain':pick(LINES);
  S.field.n=[4,6,6,8][Math.floor(rnd()*4)];
  S.ord.type=rnd()<0.3?'none':pick(ORDS.filter(o=>o!=='none'));
  S.ord.t=contrastTo(S.field.div==='plain'?S.field.t0:pick([S.field.t0,S.field.t1]));
  S.ord.line=rnd()<0.75?'plain':pick(LINES);
  S.chg.type=rnd()<0.12?'none':pick(CKEYS);
  S.chg.count=[1,1,2,3,3,3,5,6][Math.floor(rnd()*8)];
  S.chg.onOrd=S.ord.type!=='none'&&rnd()<0.42;
  S.chg.t=contrastTo(S.chg.onOrd?S.ord.t:(S.field.div==='plain'?S.field.t0:S.field.t0));
  S.chg.scale=0.85+rnd()*0.4;
  S.chg.pts=rnd()<0.75?5:6+Math.floor(rnd()*3);
  S.ach.crest=pick(['none','helm','helm','crown','wreath']);
  S.ach.mantling=rnd()<0.7;
  S.ach.motto=rnd()<0.85?pick(MOTTOS):'';
  S.name=randomName();
  render();
}

  if(!tinctureCheck())return;
  for(let i=0;i<5;i++){
    const w=tinctureCheck(); if(!w)break;
    if(w.slot==='ord') S.ord.t=contrastTo(S.field.t0);
    else S.chg.t=contrastTo(S.chg.onOrd&&S.ord.type!=='none'?S.ord.t:S.field.t0);
  }
  render();toast(tinctureCheck()?'Still clashing — try another tincture':'Tinctures corrected');
});
window.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  const k=e.key.toLowerCase();
  if(k==='r'){randomize();}
  else if(k==='h'){S.hatch=!S.hatch;render();}
  else if(k==='s'){$('#btnSave').click();}
  else if(k==='p'){ACTS.png();}
  else if(k==='d'){panel.classList.toggle('open');}
  else if(k==='arrowright'){S.chg.count=Math.min(6,S.chg.count+1);render();}
  else if(k==='arrowleft'){S.chg.count=Math.max(1,S.chg.count-1);render();}
});
let rt=0;
window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(drawOnly,120);});
stage.addEventListener('click',()=>{if(window.innerWidth<700&&panel.classList.contains('open')){
  panel.classList.remove('open');$('#btnPanel').classList.remove('on');}});

/* ============================ boot ============================ */
(function init(){
  let loaded=false;
  const m=location.hash.match(/a=([A-Za-z0-9\-_]+)/);
  if(m){try{const st=JSON.parse(b64d(m[1]));if(st&&st.field&&st.chg){S=Object.assign(JSON.parse(JSON.stringify(DEF)),st);loaded=true;}}catch(e){}}
  if(!loaded){try{const last=localStorage.getItem('blazon_last_v1');
    if(last){const st=JSON.parse(last);if(st&&st.field&&st.chg){S=Object.assign(JSON.parse(JSON.stringify(DEF)),st);loaded=true;}}}catch(e){}}
  if(!loaded){S=JSON.parse(JSON.stringify(PRESETS[1].s));}
  $('#btnHatch').classList.toggle('on',S.hatch);
  if(window.innerWidth<700){panel.classList.remove('open');$('#btnPanel').classList.remove('on');}
  renderTabs();render();
  if(loaded&&m)toast('Loaded shared arms');
})();
</script>
</body>
</html>
