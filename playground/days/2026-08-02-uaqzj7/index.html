<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>InkScript — Handwriting Studio</title>
<style>
  :root{
    --bg:#0d0b12;
    --panel:#15121c;
    --panel2:#1c1826;
    --line:#2a2436;
    --text:#eee6ff;
    --dim:#8b83a3;
    --accent:#f0a830;
    --accent2:#5cc8e8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    overflow-x:hidden;
  }
  header{
    padding:14px 18px 10px;
    display:flex;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
    border-bottom:1px solid var(--line);
  }
  header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;}
  header h1 span{color:var(--accent);}
  header p{margin:0;font-size:12px;color:var(--dim);}
  .app{
    flex:1;
    display:flex;
    flex-direction:row;
    min-height:0;
    width:100%;
  }
  .stage-wrap{
    flex:1;
    position:relative;
    display:flex;
    align-items:stretch;
    justify-content:stretch;
    padding:14px;
    min-width:0;
  }
  #stage{
    width:100%;
    height:100%;
    border-radius:14px;
    display:block;
    touch-action:manipulation;
    box-shadow:0 10px 40px rgba(0,0,0,.45);
  }
  .pen-status{
    position:absolute;
    top:26px; left:26px;
    font-size:11px;
    padding:5px 10px;
    border-radius:999px;
    background:rgba(20,16,28,.6);
    border:1px solid var(--line);
    backdrop-filter:blur(8px);
    color:var(--dim);
    pointer-events:none;
  }
  .panel{
    width:308px;
    flex-shrink:0;
    background:var(--panel);
    border-left:1px solid var(--line);
    padding:14px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:11px;color:var(--dim);display:flex;justify-content:space-between;}
  textarea{
    width:100%;
    min-height:70px;
    resize:vertical;
    background:var(--panel2);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--text);
    font-family:inherit;
    font-size:13px;
    padding:10px;
    line-height:1.4;
  }
  textarea:focus,select:focus,input:focus{outline:2px solid var(--accent2);outline-offset:1px;}
  .pens{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .pen-btn{
    background:var(--panel2);
    border:1px solid var(--line);
    color:var(--dim);
    border-radius:10px;
    padding:8px 4px;
    font-size:10.5px;
    cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    transition:transform .12s ease, border-color .12s ease, color .12s ease;
  }
  .pen-btn .dot{width:14px;height:14px;border-radius:50%;}
  .pen-btn.active{border-color:var(--accent);color:var(--text);transform:translateY(-2px);}
  .pen-btn:active{transform:scale(.95);}
  input[type=range]{width:100%;accent-color:var(--accent);}
  input[type=color]{
    width:100%;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:2px;cursor:pointer;
  }
  select{
    width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:8px;font-size:12px;font-family:inherit;
  }
  .row{display:flex;gap:8px;}
  .row > *{flex:1;}
  button.btn{
    background:var(--panel2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:10px;
    padding:9px 8px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    transition:transform .1s ease, background .15s ease;
  }
  button.btn:hover{background:#231e30;}
  button.btn:active{transform:scale(.96);}
  button.btn.primary{background:linear-gradient(135deg,var(--accent),#d97a1f);color:#1a1206;border:none;}
  button.btn.ghost{background:transparent;}
  hr.sep{border:none;border-top:1px solid var(--line);margin:2px 0;}
  .notes-list{display:flex;flex-direction:column;gap:5px;max-height:110px;overflow-y:auto;}
  .note-row{
    display:flex;align-items:center;gap:6px;
    background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:11.5px;
  }
  .note-row button{
    background:none;border:none;color:var(--dim);cursor:pointer;font-size:13px;padding:2px 4px;
  }
  .note-row .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;}
  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#1c1826;border:1px solid var(--line);color:var(--text);
    padding:10px 16px;border-radius:10px;font-size:12.5px;
    opacity:0;transition:opacity .25s ease, transform .25s ease;
    pointer-events:none;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.4);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  small.hint{color:var(--dim);font-size:10.5px;line-height:1.4;}
  @media (max-width:760px){
    .app{flex-direction:column;}
    .panel{width:100%;border-left:none;border-top:1px solid var(--line);max-height:46vh;}
    .stage-wrap{padding:10px 10px 0;min-height:34vh;}
    .pen-status{top:18px;left:18px;font-size:10px;}
  }
</style>
</head>
<body>
<header>
  <h1>Ink<span>Script</span></h1>
  <p>a handwriting synthesizer — write, tune the pen, replay the stroke, export it</p>
</header>

<div class="app">
  <div class="stage-wrap">
    <canvas id="stage"></canvas>
    <div class="pen-status" id="penStatus">ballpoint · idle</div>
  </div>

  <div class="panel">
    <div class="field">
      <label>Text</label>
      <textarea id="textInput" maxlength="400" spellcheck="false">Some things you write
you mean forever.</textarea>
    </div>

    <div class="field">
      <label>Pen style</label>
      <div class="pens" id="penPicker">
        <button class="pen-btn" data-pen="ballpoint"><span class="dot" style="background:#3454d1"></span>Ballpoint</button>
        <button class="pen-btn" data-pen="fountain"><span class="dot" style="background:#1c2b45"></span>Fountain</button>
        <button class="pen-btn" data-pen="marker"><span class="dot" style="background:#f2c94c"></span>Marker</button>
        <button class="pen-btn" data-pen="chalk"><span class="dot" style="background:#e8e2d8"></span>Chalk</button>
      </div>
    </div>

    <div class="field">
      <label>Ink color <span id="colorVal"></span></label>
      <input type="color" id="inkColor" value="#2f3fae">
    </div>

    <div class="field">
      <label>Paper <span></span></label>
      <select id="paperSelect">
        <option value="cream">Cream page</option>
        <option value="lined">Lined notebook</option>
        <option value="grid">Graph paper</option>
        <option value="chalkboard">Chalkboard</option>
      </select>
    </div>

    <div class="field">
      <label>Size <span id="sizeVal">34px</span></label>
      <input type="range" id="sizeSlider" min="18" max="64" value="34">
    </div>
    <div class="field">
      <label>Slant <span id="slantVal">6°</span></label>
      <input type="range" id="slantSlider" min="-15" max="25" value="6">
    </div>
    <div class="field">
      <label>Jitter (hand shake) <span id="jitterVal">2.2</span></label>
      <input type="range" id="jitterSlider" min="0" max="10" value="22">
    </div>
    <div class="field">
      <label>Baseline wobble <span id="wobbleVal">3.0</span></label>
      <input type="range" id="wobbleSlider" min="0" max="12" value="30">
    </div>
    <div class="field">
      <label>Spacing <span id="spaceVal">1.0×</span></label>
      <input type="range" id="spaceSlider" min="70" max="160" value="100">
    </div>
    <div class="field">
      <label>Write speed <span id="speedVal">18 ch/s</span></label>
      <input type="range" id="speedSlider" min="4" max="45" value="18">
    </div>

    <hr class="sep">

    <div class="row">
      <button class="btn primary" id="playBtn">▶ Replay write-on</button>
    </div>
    <div class="row">
      <button class="btn" id="pngBtn">Export PNG</button>
      <button class="btn" id="webmBtn">Export WebM</button>
    </div>

    <hr class="sep">

    <div class="row">
      <button class="btn" id="shareBtn">Copy share link</button>
      <button class="btn" id="saveBtn">Save note</button>
    </div>
    <div class="field" id="notesField" style="display:none;">
      <label>Saved notes</label>
      <div class="notes-list" id="notesList"></div>
    </div>
    <small class="hint">Type to render instantly. Press Replay to watch it get written stroke by stroke. Everything — text, pen, sliders — persists locally and can be shared via URL.</small>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d', {alpha:false});
  var textInput = document.getElementById('textInput');
  var penPicker = document.getElementById('penPicker');
  var inkColor = document.getElementById('inkColor');
  var paperSelect = document.getElementById('paperSelect');
  var sizeSlider = document.getElementById('sizeSlider');
  var slantSlider = document.getElementById('slantSlider');
  var jitterSlider = document.getElementById('jitterSlider');
  var wobbleSlider = document.getElementById('wobbleSlider');
  var spaceSlider = document.getElementById('spaceSlider');
  var speedSlider = document.getElementById('speedSlider');
  var playBtn = document.getElementById('playBtn');
  var pngBtn = document.getElementById('pngBtn');
  var webmBtn = document.getElementById('webmBtn');
  var shareBtn = document.getElementById('shareBtn');
  var saveBtn = document.getElementById('saveBtn');
  var notesField = document.getElementById('notesField');
  var notesList = document.getElementById('notesList');
  var penStatus = document.getElementById('penStatus');
  var toastEl = document.getElementById('toast');
  var sizeVal = document.getElementById('sizeVal');
  var slantVal = document.getElementById('slantVal');
  var jitterVal = document.getElementById('jitterVal');
  var wobbleVal = document.getElementById('wobbleVal');
  var spaceVal = document.getElementById('spaceVal');
  var speedVal = document.getElementById('speedVal');
  var colorVal = document.getElementById('colorVal');

  var LS_LAST = 'inkscript_last_v1';
  var LS_NOTES = 'inkscript_notes_v1';

  var state = {
    pen: 'ballpoint',
    color: '#2f3fae',
    paper: 'cream',
    size: 34,
    slant: 6,
    jitter: 2.2,
    wobble: 3.0,
    spacing: 1.0,
    speed: 18
  };

  var PEN_DEFAULT_COLOR = {
    ballpoint: '#2f3fae',
    fountain: '#122040',
    marker: '#f0b429',
    chalk: '#eee6da'
  };

  // ---------- seeded RNG so jitter is stable across re-renders ----------
  function mulberry32(seed){
    return function(){
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- canvas sizing ----------
  var DPR = Math.max(1, window.devicePixelRatio || 1);
  var W = 0, H = 0;
  function resize(){
    var wrap = canvas.parentElement;
    var rect = wrap.getBoundingClientRect();
    W = Math.max(280, rect.width - 28);
    H = Math.max(220, rect.height - 28);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    layout();
    render();
  }
  window.addEventListener('resize', resize);

  // ---------- text layout ----------
  var lines = []; // array of {chars:[{ch,x,y,jRot,jDx,jDy,wordStart}], y}
  var totalChars = 0;
  var lineHeight = 0;

  function layout(){
    lines = [];
    totalChars = 0;
    var text = textInput.value || '';
    var fontSize = state.size;
    lineHeight = fontSize * 1.55;
    ctx.font = fontSize + 'px "Segoe Script","Bradley Hand",system-ui,-apple-system,cursive,sans-serif';
    var maxWidth = W - 60;
    var rawLines = text.split('\n');
    var rng = mulberry32(hashStr(text + '|' + state.jitter + '|' + state.spacing));
    var y = fontSize + 18;
    var globalIndex = 0;

    rawLines.forEach(function(raw){
      var words = raw.length ? raw.split(' ') : [''];
      var cur = { chars: [], y: y };
      var x = 30;
      words.forEach(function(word, wi){
        var wordWithSpace = (wi < words.length - 1) ? word + ' ' : word;
        var wordWidth = 0;
        for (var k=0;k<wordWithSpace.length;k++){
          wordWidth += ctx.measureText(wordWithSpace[k]).width * state.spacing + 1;
        }
        if (x + wordWidth > maxWidth && cur.chars.length > 0){
          lines.push(cur);
          y += lineHeight;
          cur = { chars: [], y: y };
          x = 30;
        }
        for (var ci=0; ci<wordWithSpace.length; ci++){
          var ch = wordWithSpace[ci];
          var cw = ctx.measureText(ch).width * state.spacing + 1;
          var jRot = (rng() - 0.5) * (state.jitter * 0.035);
          var jDx = (rng() - 0.5) * state.jitter * 0.6;
          var jDy = (rng() - 0.5) * state.jitter * 0.6;
          cur.chars.push({
            ch: ch, x: x, jRot: jRot, jDx: jDx, jDy: jDy,
            wordStart: ci === 0, idx: globalIndex
          });
          x += cw;
          globalIndex++;
        }
      });
      if (cur.chars.length) lines.push(cur);
      else lines.push({chars:[], y:y});
      y += lineHeight;
    });
    totalChars = globalIndex;
  }

  function hashStr(s){
    var h = 0;
    for (var i=0;i<s.length;i++){ h = (h<<5) - h + s.charCodeAt(i); h |= 0; }
    return h;
  }

  // ---------- paper backgrounds ----------
  function drawPaper(){
    var p = state.paper;
    if (p === 'chalkboard'){
      ctx.fillStyle = '#1f3a2e';
      ctx.fillRect(0,0,W,H);
      ctx.save();
      ctx.globalAlpha = 0.05;
      for (var i=0;i<200;i++){
        ctx.fillStyle = '#fff';
        ctx.fillRect(Math.random()*W, Math.random()*H, 1.4, 1.4);
      }
      ctx.restore();
      return;
    }
    if (p === 'lined'){
      ctx.fillStyle = '#fbf6ea';
      ctx.fillRect(0,0,W,H);
      ctx.strokeStyle = 'rgba(80,110,190,0.25)';
      ctx.lineWidth = 1;
      var lh = lineHeight || 50;
      for (var y0 = lh + 8; y0 < H; y0 += lh){
        ctx.beginPath(); ctx.moveTo(0,y0+0.5); ctx.lineTo(W,y0+0.5); ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(210,90,90,0.35)';
      ctx.beginPath(); ctx.moveTo(26,0); ctx.lineTo(26,H); ctx.stroke();
      return;
    }
    if (p === 'grid'){
      ctx.fillStyle = '#f5f7f2';
      ctx.fillRect(0,0,W,H);
      ctx.strokeStyle = 'rgba(90,140,110,0.22)';
      ctx.lineWidth = 1;
      for (var gx=0; gx<W; gx+=24){ ctx.beginPath(); ctx.moveTo(gx+0.5,0); ctx.lineTo(gx+0.5,H); ctx.stroke(); }
      for (var gy=0; gy<H; gy+=24){ ctx.beginPath(); ctx.moveTo(0,gy+0.5); ctx.lineTo(W,gy+0.5); ctx.stroke(); }
      return;
    }
    // cream default
    var grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#faf3e2');
    grad.addColorStop(1,'#f3ead2');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);
  }

  // ---------- glyph rendering per pen ----------
  function renderGlyph(x, y, rec, pen, color, alpha){
    var fontSize = state.size;
    var slantRad = state.slant * Math.PI / 180;
    var wob = state.wobble * Math.sin((x + rec.idx*7) / 46) ;

    ctx.save();
    ctx.translate(x + rec.jDx, y + wob + rec.jDy);
    ctx.transform(1, 0, Math.tan(slantRad), 1, 0, 0);
    ctx.rotate(rec.jRot);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.globalAlpha = alpha == null ? 1 : alpha;

    if (pen === 'ballpoint'){
      ctx.font = fontSize + 'px "Segoe Script","Bradley Hand",system-ui,-apple-system,cursive,sans-serif';
      ctx.fillStyle = color;
      ctx.globalAlpha *= 0.92;
      ctx.fillText(rec.ch, 0, 0);
    } else if (pen === 'fountain'){
      ctx.font = fontSize + 'px "Segoe Script","Bradley Hand",system-ui,-apple-system,cursive,sans-serif';
      ctx.fillStyle = color;
      ctx.globalAlpha *= 0.30;
      ctx.save(); ctx.scale(1.05,1.08); ctx.fillText(rec.ch,0,0); ctx.restore();
      ctx.globalAlpha = (alpha==null?1:alpha) * 0.95;
      ctx.fillText(rec.ch, 0, 0);
      if (rec.wordStart){
        ctx.globalAlpha = (alpha==null?1:alpha) * 0.5;
        ctx.beginPath();
        ctx.arc(2, 2, fontSize*0.045, 0, Math.PI*2);
        ctx.fillStyle = color;
        ctx.fill();
      }
    } else if (pen === 'marker'){
      ctx.font = '600 ' + fontSize + 'px system-ui,-apple-system,sans-serif';
      ctx.globalAlpha *= 0.5;
      ctx.fillStyle = color;
      ctx.fillText(rec.ch, 0, 0);
      ctx.fillText(rec.ch, 1.4, 0.6);
      ctx.globalAlpha *= 0.6;
      ctx.fillText(rec.ch, -1, -0.4);
    } else if (pen === 'chalk'){
      ctx.font = fontSize + 'px "Comic Sans MS",system-ui,-apple-system,sans-serif';
      ctx.fillStyle = color;
      ctx.globalAlpha *= 0.8;
      ctx.fillText(rec.ch, 0, 0);
      ctx.globalAlpha *= 0.35;
      for (var s=0;s<4;s++){
        ctx.fillText(rec.ch, (Math.random()-0.5)*2.2, (Math.random()-0.5)*2.2);
      }
    }
    ctx.restore();
  }

  function penTipMarker(x, y, color){
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y - state.size*0.3, 3.2, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  // ---------- render ----------
  var revealCount = Infinity; // Infinity = fully shown (instant, no animation)
  function render(){
    drawPaper();
    var shown = 0;
    var tipX = null, tipY = null;
    for (var li=0; li<lines.length; li++){
      var line = lines[li];
      for (var ci=0; ci<line.chars.length; ci++){
        var rec = line.chars[ci];
        if (shown >= revealCount) { break; }
        if (rec.ch !== ' '){
          renderGlyph(rec.x, line.y, rec, state.pen, state.color, 1);
        }
        tipX = rec.x; tipY = line.y;
        shown++;
      }
      if (shown >= revealCount) break;
    }
    if (revealCount < totalChars && tipX !== null){
      penTipMarker(tipX, tipY, state.color);
    }
  }

  // ---------- write-on animation ----------
  var animRAF = null;
  function playAnimation(onDone){
    if (animRAF) cancelAnimationFrame(animRAF);
    var start = performance.now();
    var duration = Math.max(300, (totalChars / state.speed) * 1000);
    penStatus.textContent = state.pen + ' · writing…';
    function step(now){
      var t = Math.min(1, (now - start) / duration);
      revealCount = Math.floor(t * totalChars);
      render();
      if (t < 1){
        animRAF = requestAnimationFrame(step);
      } else {
        revealCount = totalChars;
        render();
        penStatus.textContent = state.pen + ' · idle';
        animRAF = null;
        if (onDone) onDone();
      }
    }
    revealCount = 0;
    animRAF = requestAnimationFrame(step);
  }

  // ---------- toast ----------
  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
  }

  // ---------- controls wiring ----------
  function setPen(pen){
    state.pen = pen;
    Array.prototype.forEach.call(penPicker.querySelectorAll('.pen-btn'), function(b){
      b.classList.toggle('active', b.getAttribute('data-pen') === pen);
    });
    penStatus.textContent = pen + ' · idle';
  }

  penPicker.addEventListener('click', function(e){
    var btn = e.target.closest('.pen-btn');
    if (!btn) return;
    var pen = btn.getAttribute('data-pen');
    setPen(pen);
    if (!userPickedColor) {
      inkColor.value = PEN_DEFAULT_COLOR[pen];
      state.color = PEN_DEFAULT_COLOR[pen];
      colorVal.textContent = '';
    }
    revealCount = totalChars;
    layout(); render(); persist();
  });

  var userPickedColor = false;
  inkColor.addEventListener('input', function(){
    userPickedColor = true;
    state.color = inkColor.value;
    revealCount = totalChars;
    render(); persist();
  });

  paperSelect.addEventListener('change', function(){
    state.paper = paperSelect.value;
    revealCount = totalChars;
    layout(); render(); persist();
  });

  textInput.addEventListener('input', function(){
    revealCount = totalChars;
    layout(); render(); persist();
  });

  function bindSlider(slider, key, out, fmt, scale){
    slider.addEventListener('input', function(){
      var raw = parseFloat(slider.value);
      state[key] = scale ? raw / scale : raw;
      out.textContent = fmt(state[key]);
      revealCount = totalChars;
      layout(); render(); persist();
    });
  }
  bindSlider(sizeSlider, 'size', sizeVal, function(v){ return Math.round(v)+'px'; });
  bindSlider(slantSlider, 'slant', slantVal, function(v){ return Math.round(v)+'°'; });
  bindSlider(jitterSlider, 'jitter', jitterVal, function(v){ return v.toFixed(1); }, 10);
  bindSlider(wobbleSlider, 'wobble', wobbleVal, function(v){ return v.toFixed(1); }, 10);
  bindSlider(spaceSlider, 'spacing', spaceVal, function(v){ return v.toFixed(2)+'×'; }, 100);
  bindSlider(speedSlider, 'speed', speedVal, function(v){ return Math.round(v)+' ch/s'; });

  playBtn.addEventListener('click', function(){
    layout();
    playAnimation();
  });

  pngBtn.addEventListener('click', function(){
    revealCount = totalChars;
    layout(); render();
    canvas.toBlob(function(blob){
      if (!blob){ toast('Export failed'); return; }
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'inkscript-' + Date.now() + '.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      toast('PNG saved (' + Math.round(blob.size/1024) + ' KB)');
    }, 'image/png');
  });

  webmBtn.addEventListener('click', function(){
    if (typeof MediaRecorder === 'undefined' || !canvas.captureStream){
      toast('WebM export not supported in this browser');
      return;
    }
    layout();
    var stream = canvas.captureStream(30);
    var options = { mimeType: 'video/webm;codecs=vp9' };
    if (!MediaRecorder.isTypeSupported(options.mimeType)) options = { mimeType: 'video/webm' };
    var chunks = [];
    var rec;
    try {
      rec = new MediaRecorder(stream, options);
    } catch(e) {
      toast('Recorder failed to start');
      return;
    }
    rec.ondataavailable = function(e){ if (e.data && e.data.size > 0) chunks.push(e.data); };
    rec.onstop = function(){
      var blob = new Blob(chunks, { type: 'video/webm' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'inkscript-' + Date.now() + '.webm';
      document.body.appendChild(a);
      a.click();
      a.remove();
      toast('WebM saved (' + Math.round(blob.size/1024) + ' KB)');
      webmBtn.disabled = false; playBtn.disabled = false;
    };
    webmBtn.disabled = true; playBtn.disabled = true;
    rec.start();
    playAnimation(function(){
      setTimeout(function(){ rec.stop(); }, 200);
    });
  });

  shareBtn.addEventListener('click', function(){
    var payload = { t: textInput.value, s: state };
    var encoded;
    try {
      encoded = btoa(encodeURIComponent(JSON.stringify(payload)));
    } catch(e){ toast('Could not encode link'); return; }
    var url = location.origin + location.pathname + '#' + encoded;
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){
        toast('Share link copied to clipboard');
      }).catch(function(){
        history.replaceState(null, '', '#' + encoded);
        toast('Link updated in address bar');
      });
    } else {
      history.replaceState(null, '', '#' + encoded);
      toast('Link updated in address bar');
    }
  });

  saveBtn.addEventListener('click', function(){
    var name = prompt('Name this note:', 'Untitled ' + new Date().toLocaleTimeString());
    if (!name) return;
    var notes = loadNotes();
    notes.push({ id: Date.now(), name: name, text: textInput.value, state: JSON.parse(JSON.stringify(state)) });
    localStorage.setItem(LS_NOTES, JSON.stringify(notes));
    renderNotes();
    toast('Saved "' + name + '"');
  });

  function loadNotes(){
    try { return JSON.parse(localStorage.getItem(LS_NOTES)) || []; }
    catch(e){ return []; }
  }

  function renderNotes(){
    var notes = loadNotes();
    notesList.innerHTML = '';
    if (!notes.length){ notesField.style.display = 'none'; return; }
    notesField.style.display = 'flex';
    notes.slice().reverse().forEach(function(note){
      var row = document.createElement('div');
      row.className = 'note-row';
      var nameEl = document.createElement('div');
      nameEl.className = 'name';
      nameEl.textContent = note.name;
      nameEl.addEventListener('click', function(){
        textInput.value = note.text;
        Object.assign(state, note.state);
        applyStateToControls();
        revealCount = totalChars;
        layout(); render(); persist();
        toast('Loaded "' + note.name + '"');
      });
      var delBtn = document.createElement('button');
      delBtn.textContent = '✕';
      delBtn.title = 'Delete';
      delBtn.addEventListener('click', function(){
        var all = loadNotes().filter(function(n){ return n.id !== note.id; });
        localStorage.setItem(LS_NOTES, JSON.stringify(all));
        renderNotes();
      });
      row.appendChild(nameEl);
      row.appendChild(delBtn);
      notesList.appendChild(row);
    });
  }

  function applyStateToControls(){
    setPen(state.pen);
    userPickedColor = true;
    inkColor.value = state.color;
    paperSelect.value = state.paper;
    sizeSlider.value = state.size; sizeVal.textContent = Math.round(state.size)+'px';
    slantSlider.value = state.slant; slantVal.textContent = Math.round(state.slant)+'°';
    jitterSlider.value = Math.round(state.jitter*10); jitterVal.textContent = state.jitter.toFixed(1);
    wobbleSlider.value = Math.round(state.wobble*10); wobbleVal.textContent = state.wobble.toFixed(1);
    spaceSlider.value = Math.round(state.spacing*100); spaceVal.textContent = state.spacing.toFixed(2)+'×';
    speedSlider.value = state.speed; speedVal.textContent = Math.round(state.speed)+' ch/s';
  }

  function persist(){
    try {
      localStorage.setItem(LS_LAST, JSON.stringify({ t: textInput.value, s: state }));
    } catch(e){ /* storage full or blocked — non-fatal */ }
  }

  function restore(){
    // URL hash takes priority (shared link), then last-used, then defaults
    if (location.hash && location.hash.length > 1){
      try {
        var decoded = JSON.parse(decodeURIComponent(atob(location.hash.slice(1))));
        if (decoded && typeof decoded.t === 'string'){
          textInput.value = decoded.t;
          Object.assign(state, decoded.s || {});
          applyStateToControls();
          return;
        }
      } catch(e){ /* ignore malformed hash */ }
    }
    try {
      var saved = JSON.parse(localStorage.getItem(LS_LAST));
      if (saved && typeof saved.t === 'string'){
        textInput.value = saved.t;
        Object.assign(state, saved.s || {});
      }
    } catch(e){ /* ignore */ }
    applyStateToControls();
  }

  // ---------- boot ----------
  restore();
  renderNotes();
  resize();
})();
</script>
</body>
</html>
