<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Chladni — Cymatics Studio</title>
<style>
  :root{
    --bg:#05070a; --panel:rgba(14,18,24,.72); --border:rgba(255,255,255,.09);
    --cyan:#7dd3fc; --violet:#a78bfa; --amber:#fbbf24; --sand:#ece6d8; --text:#dfe6ee; --dim:#8892a0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; color:var(--text);}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;}

  #title{position:fixed;top:14px;left:14px;z-index:5;pointer-events:none;}
  #title h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.02em;
    text-shadow:0 2px 12px rgba(0,0,0,.6);}
  #title p{margin:2px 0 0;font-size:11px;color:var(--dim);text-shadow:0 2px 8px rgba(0,0,0,.6);}

  #hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:5;
    font-size:12px;color:var(--dim);background:var(--panel);backdrop-filter:blur(14px);
    border:1px solid var(--border);padding:7px 14px;border-radius:100px;pointer-events:none;
    opacity:1;transition:opacity .6s ease;white-space:nowrap;}
  #hint.hide{opacity:0;}

  #panelToggle{position:fixed;top:12px;right:12px;z-index:11;width:38px;height:38px;border-radius:12px;
    border:1px solid var(--border);background:var(--panel);backdrop-filter:blur(14px);color:var(--text);
    font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;}

  #panel{position:fixed;top:60px;right:12px;z-index:10;width:238px;max-height:calc(100vh - 80px);
    overflow-y:auto;background:var(--panel);backdrop-filter:blur(18px);border:1px solid var(--border);
    border-radius:16px;padding:14px;font-size:12px;transition:transform .25s ease, opacity .25s ease;}
  #panel.closed{transform:translateX(260px);opacity:0;pointer-events:none;}

  .row{margin-bottom:12px;}
  .row label{display:flex;justify-content:space-between;color:var(--dim);font-size:11px;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;}
  .row label span.val{color:var(--cyan);font-variant-numeric:tabular-nums;}
  input[type=range]{width:100%;accent-color:var(--cyan);height:18px;}

  .segwrap{display:flex;background:rgba(255,255,255,.06);border-radius:10px;padding:3px;margin-bottom:12px;}
  .segwrap button{flex:1;border:none;background:transparent;color:var(--dim);font-size:11.5px;
    padding:7px 4px;border-radius:8px;cursor:pointer;font-weight:600;}
  .segwrap button.active{background:var(--cyan);color:#04141f;}

  .btnrow{display:flex;gap:6px;margin-bottom:10px;}
  .btn{flex:1;padding:9px 6px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.05);
    color:var(--text);font-size:11.5px;font-weight:600;cursor:pointer;text-align:center;}
  .btn:active{background:rgba(255,255,255,.14);}
  .btn.primary{background:var(--violet);color:#150b2a;border-color:transparent;}

  .presetgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:12px;}
  .presetgrid button{aspect-ratio:1;border-radius:8px;border:1px solid var(--border);
    background:rgba(255,255,255,.05);color:var(--dim);font-size:10.5px;cursor:pointer;font-weight:700;}
  .presetgrid button.active{background:var(--amber);color:#241800;border-color:transparent;}

  .swatches{display:flex;gap:6px;margin-bottom:12px;}
  .swatches div{flex:1;height:22px;border-radius:6px;cursor:pointer;border:2px solid transparent;}
  .swatches div.active{border-color:#fff;}

  #savedWrap{max-height:110px;overflow-y:auto;}
  .saveditem{display:flex;align-items:center;gap:6px;padding:6px 7px;border-radius:8px;
    background:rgba(255,255,255,.04);margin-bottom:5px;cursor:pointer;font-size:11px;}
  .saveditem:active{background:rgba(255,255,255,.1);}
  .saveditem .x{margin-left:auto;color:var(--dim);font-size:14px;padding:0 3px;}
  .empty{color:var(--dim);font-size:11px;text-align:center;padding:6px 0;}

  hr{border:none;border-top:1px solid var(--border);margin:12px 0;}
  .sectlabel{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;font-weight:700;}

  #toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%) translateY(20px);z-index:20;
    background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--border);color:var(--text);
    padding:9px 16px;border-radius:100px;font-size:12px;opacity:0;transition:.3s ease;pointer-events:none;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (pointer:coarse){
    #panel{width:210px;font-size:12.5px;}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="title">
  <h1>🌀 Chladni</h1>
  <p>Cymatics plate studio</p>
</div>

<div id="hint">tap the plate to poke it</div>

<button id="panelToggle">⚙</button>

<div id="panel">
  <div class="segwrap" id="modeSeg">
    <button data-mode="sand" class="active">Sand Plate</button>
    <button data-mode="ripple">Ripple Tank</button>
  </div>

  <div id="sandControls">
    <div class="row">
      <label>Mode m <span class="val" id="mVal">3</span></label>
      <input type="range" id="mSlider" min="1" max="9" step="0.05" value="3">
    </div>
    <div class="row">
      <label>Mode n <span class="val" id="nVal">5</span></label>
      <input type="range" id="nSlider" min="1" max="9" step="0.05" value="5">
    </div>
    <div class="row">
      <label>Grains <span class="val" id="pcVal">3500</span></label>
      <input type="range" id="pcSlider" min="500" max="6000" step="100" value="3500">
    </div>
    <div class="row">
      <label>Restlessness <span class="val" id="jVal">0.35</span></label>
      <input type="range" id="jSlider" min="0.05" max="1" step="0.01" value="0.35">
    </div>
    <div class="btnrow">
      <button class="btn" id="morphBtn">▶ Auto-morph</button>
      <button class="btn" id="randomBtn">🎲 Random</button>
    </div>
    <div class="sectlabel">Classic modes</div>
    <div class="presetgrid" id="presetGrid"></div>
  </div>

  <div id="rippleControls" style="display:none">
    <div class="row">
      <label>Wavelength <span class="val" id="wlVal">0.14</span></label>
      <input type="range" id="wlSlider" min="0.05" max="0.35" step="0.01" value="0.14">
    </div>
    <div class="row">
      <label>Speed <span class="val" id="spVal">1.2</span></label>
      <input type="range" id="spSlider" min="0.2" max="3" step="0.1" value="1.2">
    </div>
    <div class="btnrow">
      <button class="btn" id="clearRippleBtn">✕ Clear sources</button>
    </div>
    <p style="color:var(--dim);font-size:11px;line-height:1.5;margin:0 0 10px">Tap to drop a wave source. Drag to paint a trail of them.</p>
  </div>

  <hr>
  <div class="sectlabel">Palette</div>
  <div class="swatches" id="swatches"></div>

  <div class="btnrow">
    <button class="btn" id="exportBtn">⬇ PNG</button>
    <button class="btn" id="shareBtn">🔗 Share</button>
  </div>
  <button class="btn primary" id="saveBtn" style="width:100%;margin-bottom:10px">💾 Save preset</button>

  <div class="sectlabel">Saved presets</div>
  <div id="savedWrap"><div class="empty">No presets saved yet</div></div>
</div>

<div id="toast"></div>

<script>
(function(){
  "use strict";

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0, plateSize = 0, plateX = 0, plateY = 0;
  var isCoarse = matchMedia('(pointer:coarse)').matches;

  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    plateSize = Math.min(W, H) * (isCoarse ? 0.92 : 0.82);
    plateX = (W - plateSize) / 2;
    plateY = (H - plateSize) / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- palettes ----------
  var PALETTES = [
    { name:'Slate',  bg:'#05070a', plate:'#11151c', grain:'#ece6d8', wave:['#0a1622','#0f4c68','#38bdf8','#a78bfa','#fef9ec'] },
    { name:'Amber',  bg:'#0a0704', plate:'#1c150c', grain:'#ffe6b3', wave:['#180d02','#7a3b12','#fb923c','#fbbf24','#fff6e0'] },
    { name:'Violet', bg:'#07050c', plate:'#17111f', grain:'#e9def9', wave:['#0c0518','#3a1466','#a78bfa','#f472b6','#fdf4ff'] },
    { name:'Coral',  bg:'#0a0506', plate:'#1c1013', grain:'#ffd9d9', wave:['#170608','#6b1a2b','#f87171','#fbbf24','#fff0ea'] },
    { name:'Mint',   bg:'#040a08', plate:'#0e1c18', grain:'#d9fff0', wave:['#031510','#0d4d3a','#34d399','#7dd3fc','#effffa'] }
  ];
  var paletteIdx = 0;

  var CLASSIC_MODES = [
    [1,2],[2,3],[3,4],[4,5],[2,5],[3,7],[1,4],[5,6]
  ];

  // ---------- state ----------
  var state = {
    mode: 'sand',
    m: 3, n: 5,
    particleCount: 3500,
    jitter: 0.35,
    autoMorph: false,
    wavelength: 0.14,
    speed: 1.2
  };

  function loadState(){
    try{
      var raw = localStorage.getItem('chladni_state_v1');
      if(raw){ Object.assign(state, JSON.parse(raw)); }
      var savedPalette = localStorage.getItem('chladni_palette_v1');
      if(savedPalette !== null) paletteIdx = Math.max(0, Math.min(PALETTES.length-1, parseInt(savedPalette,10)||0));
    }catch(e){}
    // shared preset via URL hash takes priority
    if(location.hash && location.hash.indexOf('p=') === 1){
      try{
        var decoded = JSON.parse(atob(decodeURIComponent(location.hash.slice(3))));
        if(decoded && typeof decoded === 'object'){
          Object.assign(state, decoded);
          if(typeof decoded.palette === 'number') paletteIdx = decoded.palette;
        }
      }catch(e){}
    }
  }
  function persistState(){
    try{
      localStorage.setItem('chladni_state_v1', JSON.stringify({
        mode: state.mode, m: state.m, n: state.n, particleCount: state.particleCount,
        jitter: state.jitter, wavelength: state.wavelength, speed: state.speed
      }));
      localStorage.setItem('chladni_palette_v1', String(paletteIdx));
    }catch(e){}
  }

  // ---------- particles (sand mode) ----------
  var px, py;
  function initParticles(n){
    px = new Float32Array(n);
    py = new Float32Array(n);
    for(var i=0;i<n;i++){ px[i]=Math.random(); py[i]=Math.random(); }
  }

  function amp(m, n, x, y){
    var mx = m*Math.PI*x, ny = n*Math.PI*y, nx = n*Math.PI*x, my = m*Math.PI*y;
    var cMX=Math.cos(mx), sMX=Math.sin(mx), cNY=Math.cos(ny), sNY=Math.sin(ny);
    var cNX=Math.cos(nx), sNX=Math.sin(nx), cMY=Math.cos(my), sMY=Math.sin(my);
    var A = cMX*cNY - cNX*cMY;
    var dAdx = -m*Math.PI*sMX*cNY + n*Math.PI*sNX*cMY;
    var dAdy = -n*Math.PI*cMX*sNY + m*Math.PI*cNX*sMY;
    return { A: A, dx: dAdx, dy: dAdy };
  }

  var pokes = []; // {x,y,born}

  function stepSand(dt, t){
    var m = state.m, n = state.n;
    var moveSpeed = 0.9 * dt, jitterAmt = state.jitter;
    var count = px.length;
    for(var i=0;i<count;i++){
      var x = px[i], y = py[i];
      var r = amp(m, n, x, y);
      var s = r.A >= 0 ? 1 : -1;
      var fx = -s * r.dx, fy = -s * r.dy;
      var absA = Math.abs(r.A);
      var nx = x + fx*moveSpeed*0.04 + (Math.random()-0.5)*jitterAmt*absA*0.05;
      var ny = y + fy*moveSpeed*0.04 + (Math.random()-0.5)*jitterAmt*absA*0.05;
      // pokes scatter nearby grains
      for(var p=0;p<pokes.length;p++){
        var age = t - pokes[p].born;
        if(age > 1.4) continue;
        var ddx = x - pokes[p].x, ddy = y - pokes[p].y;
        var d2 = ddx*ddx + ddy*ddy;
        if(d2 < 0.02){
          var d = Math.sqrt(d2) + 0.001;
          var force = (1 - age/1.4) * 0.01 / d;
          nx += (ddx/d) * force;
          ny += (ddy/d) * force;
        }
      }
      px[i] = Math.min(1, Math.max(0, nx));
      py[i] = Math.min(1, Math.max(0, ny));
    }
    pokes = pokes.filter(function(p){ return t - p.born < 1.4; });
  }

  function drawSand(){
    var pal = PALETTES[paletteIdx];
    ctx.fillStyle = pal.bg;
    ctx.fillRect(0,0,W,H);

    // plate
    var pad = plateSize * 0.06;
    var g = ctx.createRadialGradient(
      plateX+plateSize/2, plateY+plateSize/2, plateSize*0.05,
      plateX+plateSize/2, plateY+plateSize/2, plateSize*0.75
    );
    g.addColorStop(0, pal.plate);
    g.addColorStop(1, pal.bg);
    ctx.fillStyle = g;
    roundRect(plateX-pad, plateY-pad, plateSize+pad*2, plateSize+pad*2, 22);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.08)';
    ctx.lineWidth = 1.5;
    roundRect(plateX-pad, plateY-pad, plateSize+pad*2, plateSize+pad*2, 22);
    ctx.stroke();

    // clamp
    ctx.save();
    ctx.beginPath();
    ctx.rect(plateX, plateY, plateSize, plateSize);
    ctx.clip();

    ctx.fillStyle = pal.grain;
    ctx.globalAlpha = 0.85;
    var size = isCoarse ? 1.6 : 1.3;
    for(var i=0;i<px.length;i++){
      ctx.fillRect(plateX + px[i]*plateSize, plateY + py[i]*plateSize, size, size);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  // ---------- ripple tank ----------
  var rippleSources = []; // {x,y,born}
  var RGW = 96, RGH = 64; // ripple grid resolution
  var rippleCanvas = document.createElement('canvas');
  rippleCanvas.width = RGW; rippleCanvas.height = RGH;
  var rippleCtx = rippleCanvas.getContext('2d');
  var rippleImg = rippleCtx.createImageData(RGW, RGH);

  function colorForT(t, wave){
    // t in [0,1], map across the 5-stop wave palette
    var n = wave.length;
    var f = Math.min(0.9999, Math.max(0,t)) * (n-1);
    var i0 = Math.floor(f), i1 = Math.min(n-1, i0+1);
    var frac = f - i0;
    var c0 = hexToRgb(wave[i0]), c1 = hexToRgb(wave[i1]);
    return [
      c0[0] + (c1[0]-c0[0])*frac,
      c0[1] + (c1[1]-c0[1])*frac,
      c0[2] + (c1[2]-c0[2])*frac
    ];
  }
  function hexToRgb(hex){
    var v = parseInt(hex.slice(1),16);
    return [(v>>16)&255, (v>>8)&255, v&255];
  }

  function drawRipple(t){
    var pal = PALETTES[paletteIdx];
    ctx.fillStyle = pal.bg;
    ctx.fillRect(0,0,W,H);

    var pad = plateSize * 0.06;
    ctx.fillStyle = pal.plate;
    roundRect(plateX-pad, plateY-pad, plateSize+pad*2, plateSize+pad*2, 22);
    ctx.fill();

    var freq = (2*Math.PI) / state.wavelength;
    var data = rippleImg.data;
    var srcs = rippleSources;
    for(var gy=0; gy<RGH; gy++){
      var ny = gy/(RGH-1);
      for(var gx=0; gx<RGW; gx++){
        var nx2 = gx/(RGW-1);
        var h = 0, wsum = 0;
        for(var s=0;s<srcs.length;s++){
          var dx = nx2 - srcs[s].x, dy = ny - srcs[s].y;
          var r = Math.sqrt(dx*dx+dy*dy);
          var age = t - srcs[s].born;
          var env = Math.max(0, 1 - r*1.6) * Math.min(1, age*3);
          h += Math.sin(r*freq - t*state.speed*freq) * env / (1+r*3);
          wsum += env;
        }
        var norm = Math.max(-1, Math.min(1, h));
        var tcol = (norm+1)/2;
        var rgb = colorForT(tcol, pal.wave);
        var idx = (gy*RGW+gx)*4;
        data[idx] = rgb[0]; data[idx+1] = rgb[1]; data[idx+2] = rgb[2]; data[idx+3] = 255;
      }
    }
    rippleCtx.putImageData(rippleImg, 0, 0);

    ctx.save();
    ctx.beginPath();
    ctx.rect(plateX, plateY, plateSize, plateSize);
    ctx.clip();
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(rippleCanvas, plateX, plateY, plateSize, plateSize);
    ctx.restore();

    ctx.strokeStyle = 'rgba(255,255,255,.1)';
    ctx.lineWidth = 1.5;
    roundRect(plateX-pad, plateY-pad, plateSize+pad*2, plateSize+pad*2, 22);
    ctx.stroke();
  }

  // ---------- main loop ----------
  var lastTime = 0, morphT = 0;
  function frame(ts){
    var t = ts/1000;
    var dt = lastTime ? Math.min(0.05, t-lastTime) : 0.016;
    lastTime = t;

    if(state.autoMorph && state.mode === 'sand'){
      morphT += dt;
      state.m = 2 + 3.2*Math.abs(Math.sin(morphT*0.11));
      state.n = 3.5 + 2.4*Math.abs(Math.cos(morphT*0.087));
      mSlider.value = state.m.toFixed(2);
      nSlider.value = state.n.toFixed(2);
      mVal.textContent = state.m.toFixed(1);
      nVal.textContent = state.n.toFixed(1);
    }

    if(state.mode === 'sand'){
      stepSand(dt, t);
      drawSand();
    } else {
      drawRipple(t);
    }
    if(!document.hidden) requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden) requestAnimationFrame(frame);
  });

  // ---------- UI wiring ----------
  var mSlider = document.getElementById('mSlider');
  var nSlider = document.getElementById('nSlider');
  var pcSlider = document.getElementById('pcSlider');
  var jSlider = document.getElementById('jSlider');
  var wlSlider = document.getElementById('wlSlider');
  var spSlider = document.getElementById('spSlider');
  var mVal = document.getElementById('mVal');
  var nVal = document.getElementById('nVal');
  var pcVal = document.getElementById('pcVal');
  var jVal = document.getElementById('jVal');
  var wlVal = document.getElementById('wlVal');
  var spVal = document.getElementById('spVal');

  mSlider.addEventListener('input', function(){ state.m = parseFloat(this.value); mVal.textContent = state.m.toFixed(1); markActivePreset(); persistState(); });
  nSlider.addEventListener('input', function(){ state.n = parseFloat(this.value); nVal.textContent = state.n.toFixed(1); markActivePreset(); persistState(); });
  pcSlider.addEventListener('input', function(){ state.particleCount = parseInt(this.value,10); pcVal.textContent = state.particleCount; initParticles(state.particleCount); persistState(); });
  jSlider.addEventListener('input', function(){ state.jitter = parseFloat(this.value); jVal.textContent = state.jitter.toFixed(2); persistState(); });
  wlSlider.addEventListener('input', function(){ state.wavelength = parseFloat(this.value); wlVal.textContent = state.wavelength.toFixed(2); persistState(); });
  spSlider.addEventListener('input', function(){ state.speed = parseFloat(this.value); spVal.textContent = state.speed.toFixed(1); persistState(); });

  var modeSeg = document.getElementById('modeSeg');
  var sandControls = document.getElementById('sandControls');
  var rippleControls = document.getElementById('rippleControls');
  modeSeg.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-mode]');
    if(!btn) return;
    state.mode = btn.dataset.mode;
    Array.prototype.forEach.call(modeSeg.children, function(b){ b.classList.toggle('active', b===btn); });
    sandControls.style.display = state.mode==='sand' ? '' : 'none';
    rippleControls.style.display = state.mode==='ripple' ? '' : 'none';
    hint.textContent = state.mode==='sand' ? 'tap the plate to poke it' : 'tap to drop a wave source';
    hint.classList.remove('hide');
    persistState();
  });

  var morphBtn = document.getElementById('morphBtn');
  morphBtn.addEventListener('click', function(){
    state.autoMorph = !state.autoMorph;
    morphBtn.textContent = state.autoMorph ? '⏸ Stop morph' : '▶ Auto-morph';
    morphBtn.classList.toggle('primary', state.autoMorph);
    if(state.autoMorph) morphT = 0;
  });

  document.getElementById('randomBtn').addEventListener('click', function(){
    state.m = 1 + Math.random()*8;
    state.n = 1 + Math.random()*8;
    mSlider.value = state.m; nSlider.value = state.n;
    mVal.textContent = state.m.toFixed(1); nVal.textContent = state.n.toFixed(1);
    markActivePreset(); persistState();
  });

  var presetGrid = document.getElementById('presetGrid');
  CLASSIC_MODES.forEach(function(pair){
    var b = document.createElement('button');
    b.textContent = pair[0]+','+pair[1];
    b.dataset.m = pair[0]; b.dataset.n = pair[1];
    b.addEventListener('click', function(){
      state.m = pair[0]; state.n = pair[1];
      mSlider.value = state.m; nSlider.value = state.n;
      mVal.textContent = state.m.toFixed(1); nVal.textContent = state.n.toFixed(1);
      markActivePreset(); persistState();
    });
    presetGrid.appendChild(b);
  });
  function markActivePreset(){
    Array.prototype.forEach.call(presetGrid.children, function(b){
      b.classList.toggle('active', parseFloat(b.dataset.m)===Math.round(state.m*100)/100 && parseFloat(b.dataset.n)===Math.round(state.n*100)/100);
    });
  }

  var swatches = document.getElementById('swatches');
  PALETTES.forEach(function(pal, idx){
    var d = document.createElement('div');
    d.style.background = 'linear-gradient(135deg,' + pal.wave[2] + ',' + pal.wave[3] + ')';
    d.title = pal.name;
    d.addEventListener('click', function(){
      paletteIdx = idx;
      Array.prototype.forEach.call(swatches.children, function(el,i){ el.classList.toggle('active', i===idx); });
      persistState();
    });
    swatches.appendChild(d);
  });

  document.getElementById('clearRippleBtn').addEventListener('click', function(){ rippleSources = []; });

  document.getElementById('panelToggle').addEventListener('click', function(){
    document.getElementById('panel').classList.toggle('closed');
  });

  var hint = document.getElementById('hint');
  setTimeout(function(){ hint.classList.add('hide'); }, 3800);

  function showToast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ el.classList.remove('show'); }, 1800);
  }

  document.getElementById('exportBtn').addEventListener('click', function(){
    canvas.toBlob(function(blob){
      if(!blob){ showToast('Export failed'); return; }
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'chladni-' + Date.now() + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      showToast('PNG downloaded');
    }, 'image/png');
  });

  document.getElementById('shareBtn').addEventListener('click', function(){
    var payload = { mode: state.mode, m: state.m, n: state.n, wavelength: state.wavelength, speed: state.speed, palette: paletteIdx };
    var encoded = btoa(JSON.stringify(payload));
    var url = location.origin + location.pathname + '#p=' + encoded;
    history.replaceState(null, '', '#p=' + encoded);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){ showToast('Link copied to clipboard'); }).catch(function(){ showToast('Link ready in address bar'); });
    } else {
      showToast('Link ready in address bar');
    }
  });

  document.getElementById('saveBtn').addEventListener('click', function(){
    var name = prompt('Name this preset:', state.mode==='sand' ? ('m'+state.m.toFixed(1)+' n'+state.n.toFixed(1)) : 'Ripple ' + Date.now());
    if(name === null) return;
    var presets = loadPresets();
    presets.unshift({
      name: name.slice(0,24) || 'Preset',
      mode: state.mode, m: state.m, n: state.n, wavelength: state.wavelength, speed: state.speed, palette: paletteIdx,
      id: Date.now()
    });
    presets = presets.slice(0, 16);
    try{ localStorage.setItem('chladni_presets_v1', JSON.stringify(presets)); }catch(e){}
    renderPresets();
    showToast('Preset saved');
  });

  function loadPresets(){
    try{
      var raw = localStorage.getItem('chladni_presets_v1');
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function renderPresets(){
    var wrap = document.getElementById('savedWrap');
    var presets = loadPresets();
    wrap.innerHTML = '';
    if(!presets.length){ wrap.innerHTML = '<div class="empty">No presets saved yet</div>'; return; }
    presets.forEach(function(p){
      var el = document.createElement('div');
      el.className = 'saveditem';
      el.innerHTML = '<span>' + escapeHtml(p.name) + '</span><span class="x" data-id="'+p.id+'">✕</span>';
      el.addEventListener('click', function(e){
        if(e.target.classList.contains('x')){
          var remaining = loadPresets().filter(function(x){ return x.id !== p.id; });
          try{ localStorage.setItem('chladni_presets_v1', JSON.stringify(remaining)); }catch(err){}
          renderPresets();
          return;
        }
        applyPreset(p);
      });
      wrap.appendChild(el);
    });
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function applyPreset(p){
    state.mode = p.mode; state.m = p.m; state.n = p.n;
    state.wavelength = p.wavelength || state.wavelength;
    state.speed = p.speed || state.speed;
    paletteIdx = typeof p.palette === 'number' ? p.palette : paletteIdx;
    syncUIFromState();
    persistState();
  }

  function syncUIFromState(){
    mSlider.value = state.m; nSlider.value = state.n;
    mVal.textContent = state.m.toFixed(1); nVal.textContent = state.n.toFixed(1);
    pcSlider.value = state.particleCount; pcVal.textContent = state.particleCount;
    jSlider.value = state.jitter; jVal.textContent = state.jitter.toFixed(2);
    wlSlider.value = state.wavelength; wlVal.textContent = state.wavelength.toFixed(2);
    spSlider.value = state.speed; spVal.textContent = state.speed.toFixed(1);
    Array.prototype.forEach.call(modeSeg.children, function(b){ b.classList.toggle('active', b.dataset.mode===state.mode); });
    sandControls.style.display = state.mode==='sand' ? '' : 'none';
    rippleControls.style.display = state.mode==='ripple' ? '' : 'none';
    Array.prototype.forEach.call(swatches.children, function(el,i){ el.classList.toggle('active', i===paletteIdx); });
    markActivePreset();
  }

  // ---------- pointer interaction ----------
  function toPlateCoords(clientX, clientY){
    return {
      x: (clientX - plateX) / plateSize,
      y: (clientY - plateY) / plateSize
    };
  }
  var dragging = false;
  canvas.addEventListener('pointerdown', function(e){
    dragging = true;
    handlePointer(e.clientX, e.clientY);
  });
  canvas.addEventListener('pointermove', function(e){
    if(!dragging) return;
    handlePointer(e.clientX, e.clientY);
  });
  window.addEventListener('pointerup', function(){ dragging = false; });
  function handlePointer(cx, cy){
    var p = toPlateCoords(cx, cy);
    if(p.x < 0 || p.x > 1 || p.y < 0 || p.y > 1) return;
    var t = lastTime;
    if(state.mode === 'sand'){
      pokes.push({ x:p.x, y:p.y, born:t });
    } else {
      var last = rippleSources[rippleSources.length-1];
      if(!last || Math.hypot(last.x-p.x, last.y-p.y) > 0.03){
        rippleSources.push({ x:p.x, y:p.y, born:t });
        if(rippleSources.length > 10) rippleSources.shift();
      }
    }
  }

  // ---------- init ----------
  loadState();
  initParticles(state.particleCount);
  renderPresets();
  syncUIFromState();
  if(state.autoMorph){ morphBtn.textContent = '⏸ Stop morph'; morphBtn.classList.add('primary'); }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
